1","type":"cloze","no":41,"score":15,"scorePerBlank":1,"instruction":"阅读下面短文，从每题所给的A、B、C、D四个选项中选出最佳选项。","passage":"I've finally faced the fear that has troubled me for 30 years. Like millions, I fear flying. When my daughter moved to Beijing, I knew I had to {{1}} it.\nFlying terrifies me-heart racing and legs shaking. I’m not {{2}}. Research shows many share this fear. And for me, frequent short work flights only made it {{3}}, especially those lonely late-night ones.\nWith a visit to China coming, I {{4}} for an airline-offered course called\"Flying with Confidence\". At the airport, I was {{5}} by how many others had paid £399 to face the same fear. Among them was Mia, who stopped flying after a sudden panic attack. Now pregnant（怀孕）, she wanted to {{6}} passing her fear down to her child.\nPilots led the morning session. Learning {{7}}, like a plane gliding（滑行）100 miles if engine stop, was comforting. They emphasized the {{8}} safety rules and over 100,000 safe flights daily.\nThe afternoon focused on {{9}}. The doctor patiently explained that\"fear of fear\"is common. He taught\"breathe and squeeze\"- slow breaths to control stress chemicals, and muscle squeezes to focus the mind. We practiced and it {{10}}.\nThen came the {{11}} flight. As we boarded, earlier excitement turned to obvious {{12}}. Captain Miller provided a calming broadcast. When turbulence（气流） hit, I used the {{13}} technique. For the first time, panic didn’t {{14}}.\nThe moment I exited the plane was emotional. My hands were still shaking, but my heart was already racing {{15}}, to my daughter in Beijing.","questions":[{"n":1,"options":["accept","ignore","test","overcome"],"answer":"D","answerText":"overcome","explanation":"作者害怕坐飞机，但女儿搬去北京，不得不克服这份恐惧；accept（接受）、ignore（忽视）、test（测 试） 均 不符语境","tag":"词义辨析"},{"n":2,"options":["different","alone","unique","brave"],"answer":"B","answerText":"alone","explanation":"下一句提到“很多人都有这种恐惧”,说明作者并非独自有此感受；different （不同的）、unique （独特的）、brave （勇敢的）均不符","tag":"词义辨析"},{"n":3,"options":["worse","less","easier","clearer"],"answer":"A","answerText":"worse","explanation":"频繁的短途工作航班让作者的飞行恐惧变得更严重；less （更少的）、easier （更容易的）、clearer （更清晰的） 均不符","tag":"词义辨析"},{"n":4,"options":["longed","planned","searched","registered"],"answer":"D","answerText":"registered","explanation":"作者报名参加了航空公司的课程，register for（报名参加）是固定搭配；long for（渴望）、plan for（为. ….计 划）、search for（寻找）均不符。Z","tag":"固定搭配"},{"n":5,"options":["touched","struck","puzzled","annoyed"],"answer":"B","answerText":"struck","explanation":"作者对有很多人花钱参加课程感到惊讶，be struck by （被. …震惊）符合语境；touched （感动的）、puzzled （困惑的）、annoyed （恼怒的）均不符","tag":"词义辨析"},{"n":6,"options":["avoid","deny","forget","delay"],"answer":"A","answerText":"avoid","explanation":"Mia 怀孕了，想要避免把自己的飞行恐惧传给孩子；deny （否认）、forget （忘记）、delay （推迟）均不符","tag":"词义辨析"},{"n":7,"options":["skills","facts","theories","news"],"answer":"B","answerText":"facts","explanation":"飞行员讲解了“飞机发动机停转仍能滑翔100英里”这类事实，让作者感到安心；skills （技能）、theories （理 论）、news （新闻）均不符","tag":"词义辨析"},{"n":8,"options":["latest","various","secret","strict"],"answer":"D","answerText":"strict","explanation":"飞行员强调严格的安全规则和每日超10万次的安全飞行；latest （最新的）、various （各种各样的）、secret （秘 密的）均不符","tag":"词义辨析"},{"n":9,"options":["assessment","behavior","psychology","communication"],"answer":"C","answerText":"psychology","explanation":"下午由医生授课，核心讲解飞行恐惧的心理学知识及应对方法；assessment （评估）、behavior （行为）、communication（交流）均不符","tag":"词义辨析"},{"n":10,"options":["worked","happened","varied","mattered"],"answer":"A","answerText":"worked","explanation":"作者练习了医生教的方法，且该方法起作用了；happened （发生）、varied （变化）、mattered （重要）均不符","tag":"词义辨析"},{"n":11,"options":["personal","normal","final","actual"],"answer":"D","answerText":"actual","explanation":"课程最后进行了实际的飞行体验，是检验学习效果的关键；personal （个人的）、normal （正常的）、final （最 后的）均不如actual 贴合语境","tag":"词义辨析"},{"n":12,"options":["boredom","disappointment","tension","confusion"],"answer":"C","answerText":"tension","explanation":"登机时，作者此前的兴奋变成了明显的紧张，符合其恐惧飞行的状态；boredom （无聊）、disappointment （失 望）、confusion （困惑）均不符","tag":"词义辨析"},{"n":13,"options":["traditional","learned","inspiring","usual"],"answer":"B","answerText":"learned","explanation":"遇到气流时，作者使用了在课程中学到的“呼吸和收缩”方法；traditional （传统的）、inspiring （鼓舞人心的）、usual （通常的）均不符","tag":"词义辨析"},{"n":14,"options":["show off","break down","take over","fade away"],"answer":"C","answerText":"take over","explanation":"这是作者第一次没有被恐慌掌控，take over （接管、掌控）符合语境；show off （炫耀）、break down（崩溃）、fade away （逐渐消失）均不符","tag":"词义辨析"},{"n":15,"options":["ahead","again","around","along"],"answer":"A","answerText":"ahead","explanation":"作者下飞机后，心跳仍在加速，心里已经迫不及待奔向在北京的女儿，ahead （向前、朝着）符合语境；again （再次）、around （周围）、along （沿着）均不符。第二节语法填空","tag":"词义辨析"}]}]},{"id":"2026-湖北省武汉市高三下学期3月调研考试","year":2026,"paperName":"湖北省武汉市高三下学期3月调研考试","kind":"mock","items":[{"id":"cloze-2026-湖北省武汉市高三下学期3月调研考试-01","type":"cloze","no":41,"score":15,"scorePerBlank":1,"instruction":"阅读下面短文，从每题所给的A、B、C、D四个选项中选出最佳选项。","passage":"Two Kiwis, one Singaporean, and one Indian walked into a bar. This wasn’t the start of a joke, but the beginning of a deep {{1}}. We met at the False Creek shore for dragon boat practice. {{2}}, our interaction was purely functional, centered on paddles (桨) and race schedules. However, as we paddled along, the shared experience began to break our {{3}}.\nDespite its breathtaking natural beauty, Vancouver is a place where making friends often feels no less {{4}} than finding an affordable apartment. As immigrants from sun -heavy places, we were all {{5}} to adapt to the city’s grey weather and even “greyer” {{6}} climate. In this environment, dragon boating served as a breakthrough, for it is a sport that brings people back to their {{7}}. In a boat, no one cares about your background; you simply move as one. This spirit soon {{8}} our lives off the water, and our weekly gatherings after practice naturally became our {{9}}.\n试题卷 第 7 页 / 共 8 页 (www.jxenglish.com) We bonded over shared {{10}} — the impossible rental market and the “polite” social scene where plans for hiking always {{11}}. Yet, when we were together, these {{12}} mattered less. We weren’t just surviving the city’s coldness; we were {{13}} a micro-community of our own.\nOne summer night, after a major festival, we danced by the waterfront. In that golden moment, we realized we had {{14}} what we came for. We were four strangers from different continents, but dragon boating gave us a place to {{15}}, a reason to stay and a rhythm to move forward by — together.","questions":[{"n":1,"no":41,"options":["respect","affection","significance","connection"],"answer":"D","answerText":"connection","explanation":"考查名词辨析。A 尊敬；B 喜爱；C 意义；D 联系。全文讲四人因划龙舟结下情谊，deep connection 指深厚联系，故选D。","tag":"名词辨析"},{"n":2,"no":42,"options":["Initially","Strangely","Personally","Accidentally"],"answer":"A","answerText":"Initially","explanation":"考查副词辨析。A 起初；B 奇怪地；C 就个人而言；D 偶然地。与下句 However 形成对比，Initially 指起初交往只围绕船桨和赛程，故选A。","tag":"副词辨析"},{"n":3,"no":43,"options":["schedule","silence","reserve","promise"],"answer":"C","answerText":"reserve","explanation":"考查名词辨析。A 日程；B 沉默；C 拘谨；D 承诺。break one's reserve 指打破 reserve 拘谨，与共同划桨的经历呼应，故选C。","tag":"名词辨析"},{"n":4,"no":44,"options":["challenging","comforting","relieving","annoying"],"answer":"A","answerText":"challenging","explanation":"考查形容词辨析。A 有挑战的；B 令人安慰的；C 令人宽慰的；D 恼人的。no less... than 意为和……一样难，指在温哥华交友和租便宜房一样 challenging，故选A。","tag":"形容词辨析"},{"n":5,"no":45,"options":["managing","refusing","struggling","hesitating"],"answer":"C","answerText":"struggling","explanation":"考查动词辨析。A 设法做到；B 拒绝；C 艰难地做；D 犹豫。were struggling to adapt 指难以适应，与阴雨天气和灰暗社交氛围呼应，故选C。","tag":"动词辨析"},{"n":6,"no":46,"options":["political","economic","natural","social"],"answer":"D","answerText":"social","explanation":"考查形容词辨析。A 政治的；B 经济的；C 自然的；D 社交的。与 grey weather 并列且加引号，指同样灰暗的 social 社交氛围，故选D。","tag":"形容词辨析"},{"n":7,"no":47,"options":["possessions","essentials","habits","desires"],"answer":"B","answerText":"essentials","explanation":"考查名词辨析。A 财产；B 最基本的东西；C 习惯；D 欲望。bring people back to their essentials 指回归本真，船上无人计较背景，故选B。","tag":"名词辨析"},{"n":8,"no":48,"options":["bled into","messed up","tore apart","escaped from"],"answer":"A","answerText":"bled into","explanation":"考查动词短语辨析。A 渗入；B 弄糟；C 撕裂；D 逃离。bled into 指这种精神从水上渗入日常生活，与下句每周聚会呼应，故选A。","tag":"动词短语"},{"n":9,"no":49,"options":["burden","assignment","shelter","standard"],"answer":"C","answerText":"shelter","explanation":"考查名词辨析。A 负担；B 任务；C 庇护所；D 标准。在冷漠的城市里，训练后的聚会自然成为他们的 shelter，故选C。","tag":"名词辨析"},{"n":10,"no":50,"options":["barriers","hobbies","targets","benefits"],"answer":"A","answerText":"barriers","explanation":"考查名词辨析。A 障碍；B 爱好；C 目标；D 好处。破折号后列举的租房难与客套社交都是共同的 barriers 障碍，故选A。","tag":"名词辨析"},{"n":11,"no":51,"options":["worked","appeared","mattered","slipped"],"answer":"D","answerText":"slipped","explanation":"考查动词辨析。A 奏效；B 出现；C 重要；D 落空。在客气的社交场合，约好去远足的计划总是 slipped 落空，故选D。","tag":"动词辨析"},{"n":12,"no":52,"options":["fantasies","issues","conflicts","failures"],"answer":"B","answerText":"issues","explanation":"考查名词辨析。A 幻想；B 问题；C 冲突；D 失败。these issues 指代上文的租房市场和社交场问题，聚在一起时就不那么重要，故选B。","tag":"名词辨析"},{"n":13,"no":53,"options":["transforming","serving","establishing","influencing"],"answer":"C","answerText":"establishing","explanation":"考查动词辨析。A 改变；B 服务；C 建立；D 影响。与 not just surviving 对比，establishing 指建立起属于自己的小社群，故选C。","tag":"动词辨析"},{"n":14,"no":54,"options":["shaped","found","forgotten","lost"],"answer":"B","answerText":"found","explanation":"考查动词辨析。A 塑造；B 找到；C 忘记；D 失去。had found what we came for 指找到了我们来此追寻的东西，故选B。","tag":"动词辨析"},{"n":15,"no":55,"options":["explore","belong","compete","relax"],"answer":"B","answerText":"belong","explanation":"考查动词辨析。A 探索；B 归属；C 竞争；D 放松。与 a reason to stay 并列，a place to belong 指可以归属的地方，故选B。","tag":"动词辨析"}],"_source":"raw\\jx\\402.pdf"},{"id":"grammar-2026-武汉市 2026 届高中毕业生三月调研考试-01","type":"grammar-fill","no":56,"score":15,"scorePerBlank":1.5,"instruction":"阅读下面短文，在空白处填入1个适当的单词或括号内单词的正确形式。","passage":"For decades, Chancay was a quiet town north of Lima, Peru, better known for its fishing community and slow pace. That changed after the Chancay Port was {{1}} (official) initiated in November 2024.\nSince then, goods ships have been docking (停靠) {{2}} record numbers. Following the launch of a direct corridor (走廊) with Shanghai, ships now run twice a week, carrying goods such as fish meal, fruits and metal eastward {{3}} bringing back various industrial goods from the large production {{4}} (base) in Asia. For exporters and importers, this regular service has ensured speed and {{5}} (certain).\nFigures reflect how the enormous port is reshaping trade. So far, shipments along the Chancay - Shanghai corridor {{6}} (total) 78, 000 tons with a value of 1. 72 billion yuan, {{7}} (push) trade between the two ports up by nearly 35 percent. Products {{8}} (ship) directly to China in greater volumes everyday include fruits like avocado, mango and blueberry.\nTo help small businesses participate in the boom (繁荣), the Chancay Business Association launched its “Importing is Easy” program, {{9}} aim is to guide companies through customs, formalization and access to global supply chains.\n“These initiatives are important because they provide local users with the tools and advice they are in need of {{10}} (conduct) their foreign trade operations efficiently,” said an expert in Peru.","questions":[{"n":1,"no":56,"answer":"officially","answerText":"officially","explanation":"考查副词。此处修饰过去分词 initiated，需用副词，故填 officially，意为正式地。","tag":"副词辨析"},{"n":2,"no":57,"answer":"in","answerText":"in","explanation":"考查介词。in record numbers 是固定搭配，意为以创纪录的数量。","tag":"介词"},{"n":3,"no":58,"answer":"and","answerText":"and","explanation":"考查连词。carrying 与 bringing back 是两个并列的现在分词短语，用 and 连接。","tag":"连词"},{"n":4,"no":59,"answer":"bases","answerText":"bases","explanation":"考查名词复数。base 意为基地，亚洲的生产基地不止一个，故用复数 bases。","tag":"名词辨析"},{"n":5,"no":60,"answer":"certainty","answerText":"certainty","explanation":"考查词性转换。ensure 后接名词，与 speed 并列，certain 的名词形式是 certainty，意为确定性。","tag":"词性转换"},{"n":6,"no":61,"answer":"have totaled","answerText":"have totaled","explanation":"考查时态。So far 是现在完成时标志，主语 shipments 为复数，故填 have totaled。","tag":"时态"},{"n":7,"no":62,"answer":"pushing","answerText":"pushing","explanation":"考查非谓语动词。前面已是完整句子，此处用现在分词 pushing 作结果状语，表自然而然的结果。","tag":"非谓语动词"},{"n":8,"no":63,"answer":"shipped","answerText":"shipped","explanation":"考查非谓语动词。Products 与 ship 是被动关系，故用过去分词 shipped 作后置定语。","tag":"非谓语动词"},{"n":9,"no":64,"answer":"whose","answerText":"whose","explanation":"考查定语从句。先行词 the program 与 aim 是所属关系，用关系代词 whose 作定语。","tag":"定语从句"},{"n":10,"no":65,"answer":"to conduct","answerText":"to conduct","explanation":"考查非谓语动词。此处用不定式 to conduct 作目的状语，说明需要这些工具和建议的目的。","tag":"非谓语动词"}],"_source":"raw\\jx\\402.pdf"}]},{"id":"2026-江苏省南京市盐城市高三下学期第一次模考","year":2026,"paperName":"江苏省南京市盐城市高三下学期第一次模考","kind":"mock","items":[{"id":"cloze-2026-江苏省南京市盐城市高三下学期第一次模考-01","type":"cloze","no":41,"score":15,"scorePerBlank":1,"instruction":"阅读下面短文，从每题所给的A、B、C、D四个选项中选出最佳选项。","passage":"I used to work in a center for people with alcohol use disorder in Aberdeen. I took some of them hillwalking occasionally, and the sense of {{1}} in getting to a peak for them was really beneficial.\n{{2}} the scenery, birds and wildlife really helped to build up confidence.\nI recall an occasion when I was planning a {{3}}, and one center resident asked how using a map and compass {{4}} people to find the way in the hills — so I showed him how to {{5}} them. Next day, when we set off, he {{6}} the map, checked the compass and1 led us towards the peak. I had done this hill several times before and conditions were {{7}} 试题卷 第 7 页 / 共 8 页 (www.jxenglish.com) We started on the path, then headed up onto the open hillside and stepped onto the wide and flat plateau (高原). I watched him adjust the {{8}} with the compass, no need to {{9}}, for he did it exactly right. He used the map and compass {{10}}, and led us right to the top. He was so {{11}} that he had been able to do this.\nPeople with alcohol use disorder often {{12}} low self-worth. I believe the chance to successfully take responsibility for {{13}} a group up this hill really helped this individual on his way to {{14}}, and even perhaps gave him the {{15}} to be able to take on tasks and jobs in everyday life.","questions":[{"n":1,"no":41,"options":["security","achievement","belonging","responsibility"],"answer":"B","answerText":"achievement","explanation":"考查名词辨析。句意：对他们来说，登上山顶带来的成就感很有益处。A. security 安全感；B. achievement 成就感；C. belonging 归属感；D. responsibility 责任。getting to a peak 是完成一件难事，由此产生的是成就感，故选B。","tag":"名词辨析"},{"n":2,"no":42,"options":["Identifying","Describing","Assessing","Protecting"],"answer":"A","answerText":"Identifying","explanation":"考查动词辨析。句意：辨认风景、鸟和野生动物确实有助于增强信心。A. Identifying 辨认；B. Describing 描述；C. Assessing 评估；D. Protecting 保护。在徒步中认出所见之物能带来自信，与 confidence 呼应，故选A。","tag":"动词辨析"},{"n":3,"no":43,"options":["lecture","party","walk","meeting"],"answer":"C","answerText":"walk","explanation":"考查名词辨析。句意：我记得有一次我正在筹划一次徒步。A. lecture 讲座；B. party 聚会；C. walk 步行、徒步；D. meeting 会议。全文讲带病人去 hillwalking，此处自然是筹划徒步，故选C。","tag":"名词辨析"},{"n":4,"no":44,"options":["reminded","enabled","forced","prepared"],"answer":"B","answerText":"enabled","explanation":"考查动词辨析。句意：他问使用地图和指南针如何让人在山里找到路。A. reminded 提醒；B. enabled 使能够；C. forced 迫使；D. prepared 准备。enable sb to do sth 意为使某人能够做某事，故选B。","tag":"动词辨析"},{"n":5,"no":45,"options":["fix","choose","store","use"],"answer":"D","answerText":"use","explanation":"考查动词辨析。句意：于是我教他怎样使用它们。A. fix 修理；B. choose 选择；C. store 存放；D. use 使用。them 指地图和指南针，前文问的是 how using...，回答自然是教他如何使用，故选D。","tag":"动词辨析"},{"n":6,"no":46,"options":["folded","sought","set","fetched"],"answer":"C","answerText":"set","explanation":"考查动词辨析。句意：出发时他摊开地图、查看指南针，带我们朝山顶走去。A. folded 折叠；B. sought 寻找；C. set 摆放、摊开；D. fetched 去取。与 checked the compass 并列的是摊开地图，故选C。","tag":"动词辨析"},{"n":7,"no":47,"options":["tough","special","clear","changeable"],"answer":"C","answerText":"clear","explanation":"考查形容词辨析。句意：这条路我走过好几次，当时天气晴好。A. tough 艰难的；B. special 特别的；C. clear 晴朗的；D. changeable 多变的。conditions were clear 指天气与视野良好，为顺利登山作铺垫，故选C。","tag":"形容词辨析"},{"n":8,"no":48,"options":["direction","plan","speed","destination"],"answer":"A","answerText":"direction","explanation":"考查名词辨析。句意：我看着他借助指南针校正方向。A. direction 方向；B. plan 计划；C. speed 速度；D. destination 目的地。用指南针校正的只能是行进方向，故选A。","tag":"名词辨析"},{"n":9,"no":49,"options":["hurry","apologize","criticize","disturb"],"answer":"D","answerText":"disturb","explanation":"考查动词辨析。句意：无需我插手打扰，因为他做得完全正确。A. hurry 匆忙；B. apologize 道歉；C. criticize 批评；D. disturb 打扰。for he did it exactly right 说明不必去打扰他，故选D。","tag":"动词辨析"},{"n":10,"no":50,"options":["desperately","accurately","hesitantly","directly"],"answer":"B","answerText":"accurately","explanation":"考查副词辨析。句意：他准确地使用地图和指南针，把我们径直带到山顶。A. desperately 拼命地；B. accurately 准确地；C. hesitantly 犹豫地；D. directly 直接地。与 right to the top 呼应，强调用图准确，故选B。","tag":"副词辨析"},{"n":11,"no":51,"options":["happy","shocked","relaxed","lucky"],"answer":"A","answerText":"happy","explanation":"考查形容词辨析。句意：能做成这件事，他非常高兴。A. happy 高兴的；B. shocked 震惊的；C. relaxed 放松的；D. lucky 幸运的。so...that 结构表达他为自己能胜任而欣喜，与主题一致，故选A。","tag":"形容词辨析"},{"n":12,"no":52,"options":["escape from","reflect on","focus on","suffer from"],"answer":"D","answerText":"suffer from","explanation":"考查动词短语辨析。句意：酒精使用障碍者往往自我价值感很低。A. escape from 逃离；B. reflect on 反思；C. focus on 专注；D. suffer from 受……之苦。low self-worth 是他们身上的问题，用 suffer from 表示受其困扰，故选D。","tag":"动词短语"},{"n":13,"no":53,"options":["attending","filming","leading","following"],"answer":"C","answerText":"leading","explanation":"考查动词辨析。句意：负责带领一队人登上这座山。A. attending 参加；B. filming 拍摄；C. leading 带领；D. following 跟随。与后文 led us right to the top 照应，此处指带队上山，故选C。","tag":"动词辨析"},{"n":14,"no":54,"options":["recovery","cooperation","independence","exploration"],"answer":"A","answerText":"recovery","explanation":"考查名词辨析。句意：确实帮助了他在康复之路上前行。A. recovery 康复；B. cooperation 合作；C. independence 独立；D. exploration 探索。对象是酒精使用障碍患者，on his way to recovery 指走向康复，故选A。","tag":"名词辨析"},{"n":15,"no":55,"options":["inspiration","confidence","passion","patience"],"answer":"B","answerText":"confidence","explanation":"考查名词辨析。句意：甚至给了他承担日常任务与工作的信心。A. inspiration 灵感；B. confidence 信心；C. passion 热情；D. patience 耐心。上文多次提到 build up confidence，此处回扣主题，故选B。","tag":"名词辨析"}],"_source":"raw\\jx\\405.pdf"},{"id":"grammar-2026-南京市、盐城市 2026 届年级第一次模拟考试-01","type":"grammar-fill","no":56,"score":15,"scorePerBlank":1.5,"instruction":"阅读下面短文，在空白处填入1个适当的单词或括号内单词的正确形式。","passage":"Sitting atop the Yuanyang Rice Terraces, a UNESCO World Heritage Site in Yunnan Province, Azheke is a remote village populated by over 400 residents from the Hani ethnic group. The name of the village, Azheke, translates to “a place {{1}} bamboo grows” in the Hani language.\nAzheke is surrounded by its own {{2}} (mystery) atmosphere. Wooden signs hang from trees alongside stone paths {{3}} (lead) to the village, warning visitors to be cautious of unknown dangers in its forest. Further up, a row of stone fountains labeled “The Sacred Mountain Water” {{4}} (peaceful) feed into the stone basins below before flowing into the network of canals.\nTwenty years ago, Azheke was just a far -off village struggling with poverty, underdeveloped transportation and outdated farming practices. Today, that same isolation tells {{5}} different story.\nAzheke {{6}} (ride) the 21st-century wave of eco-tourism and become a popular destination. But {{7}} other tourism hot spots where the hunger for money flattens out the local culture and leaves residents behind, the village’s path to prosperity has been built through the “Azheke Plan”, which makes the villagers both the owners and beneficiaries of the local tourism resources and provides {{8}} (reward) to those who preserve the heritage.\nThe “Azheke Plan” has become a model of {{9}} rural tourism and heritage protection can work together to create meaningful experiences for the world to enjoy. With plans {{10}} (introduce) the Azheke model in more remote regions in the near future, a new path is being paved for sustainable rural revitalization nationwide.","questions":[{"n":1,"no":56,"answer":"where","answerText":"where","explanation":"考查定语从句。先行词是 a place，从句 bamboo grows 成分完整，缺地点状语，用关系副词 where，故填 where。","tag":"定语从句"},{"n":2,"no":57,"answer":"mysterious","answerText":"mysterious","explanation":"考查词性转换。修饰名词 atmosphere 需要形容词，mystery 的形容词形式是 mysterious，故填 mysterious。","tag":"词性转换"},{"n":3,"no":58,"answer":"leading","answerText":"leading","explanation":"考查非谓语动词。paths 与 lead 是主动关系，用现在分词作后置定语，故填 leading。","tag":"非谓语动词"},{"n":4,"no":59,"answer":"peacefully","answerText":"peacefully","explanation":"考查词性转换。修饰谓语 feed into 需要副词，peaceful 的副词形式是 peacefully，故填 peacefully。","tag":"词性转换"},{"n":5,"no":60,"answer":"a","answerText":"a","explanation":"考查冠词。story 是可数名词单数，此处泛指一个不一样的故事，用不定冠词 a，故填 a。","tag":"冠词"},{"n":6,"no":61,"answer":"has ridden","answerText":"has ridden","explanation":"考查时态。主语 Azheke 是单数，与并列的 become 一样表示已发生并持续至今的结果，用现在完成时，故填 has ridden。","tag":"时态"},{"n":7,"no":62,"answer":"unlike","answerText":"unlike","explanation":"考查介词。此处把该村与别处的旅游热点对比，表示与……不同，用介词 unlike，故填 unlike。","tag":"介词"},{"n":8,"no":63,"answer":"rewards","answerText":"rewards","explanation":"考查名词单复数。reward 是可数名词，此处指给保护遗产者的多份报酬，用复数形式，故填 rewards。","tag":"名词辨析"},{"n":9,"no":64,"answer":"how","answerText":"how","explanation":"考查名词性从句。介词 of 后接宾语从句，表示乡村旅游与遗产保护如何共同发挥作用，用 how，故填 how。","tag":"名词性从句"},{"n":10,"no":65,"answer":"to introduce","answerText":"to introduce","explanation":"考查非谓语动词。plans 后接不定式表示即将进行的动作，故填 to introduce。","tag":"非谓语动词"}],"_source":"raw\\jx\\405.pdf"}]},{"id":"2026-江苏省苏州市高三第一学期学业质量调研","year":2026,"paperName":"江苏省苏州市高三第一学期学业质量调研","kind":"mock","items":[{"id":"cloze-2026-江苏省苏州市高三第一学期学业质量调研-01","type":"cloze","no":41,"score":15,"scorePerBlank":1,"instruction":"阅读下面短文，从每题所给的A、B、C、D四个选项中选出最佳选项。","passage":"The first time I picked up the trumpet (小号) years ago. Before that, was I had {{1}} the drums.\nThey didn’t quite stick. But when I blew my first note on the trumpet, I knew it was my {{2}}.\nSince then, I’ve {{3}} myself to music. I now teach in Nigeria and share my love for the trumpet with others. I’ve seen how little {{4}} musicians receive. Music demands so much time, money, and discipline — yet it is so undervalued. I’d like to {{5}} that.\n试题卷 第 7 页 / 共 8 页 (www.jxenglish.com) Two years ago, when I discovered there wasn’t a Guinness World Record for the longest time spent playing a trumpet, something {{6}}. If I could break a record, it might draw attention to the value of music. At first, I was {{7}}. The rules were strict: I couldn’t repeat a song, no jamming and only take a five-minute break each hour. When I began training, I managed just two hours before my body started to {{8}} with aches and exhaustion. But over time, I {{9}} my tolerance.\nMy official {{10}} started on 9 May this year. The first hours were {{11}}. Around hour five, I felt the burn in my lips. Later, I had to keep {{12}} between sitting and standing to avoid my body {{13}}. Ultimately, I played for 25 hours and 30 minutes {{14}}. I was so excited, not only for the record, but for the broader {{15}} of music: determination, discipline, and to dream bigger than your circumstances.","questions":[{"n":1,"no":41,"options":["tried","ignored","found","accepted"],"answer":"A","answerText":"tried","explanation":"考查动词辨析。句意：在那之前，我试过打鼓，但没能坚持下来。A. tried 尝试；B. ignored 忽视；C. found 发现；D. accepted 接受。They didn't quite stick 说明只是试过而没坚持，故选A。","tag":"动词辨析"},{"n":2,"no":42,"options":["gift","recreation","instrument","craft"],"answer":"C","answerText":"instrument","explanation":"考查名词辨析。句意：吹出第一个音时，我知道这就是我的乐器。A. gift 天赋；B. recreation 娱乐；C. instrument 乐器；D. craft 手艺。it 指前句提到的小号，小号正是一件乐器，故选C。","tag":"名词辨析"},{"n":3,"no":43,"options":["resigned","adjusted","submitted","dedicated"],"answer":"D","answerText":"dedicated","explanation":"考查动词辨析。句意：从那以后，我把全部身心投入到音乐中。A. resigned 辞职；B. adjusted 调整；C. submitted 提交；D. dedicated 献身、致力。dedicate oneself to sth 意为致力于某事，故选D。","tag":"动词辨析"},{"n":4,"no":44,"optio s a key foundation for development in recent years, adopting a strategy {{6}} combines ecological planting, intensive processing, and cultural tourism focused on health preservation. Under the {{7}} (guide) of the Three- Year Action Plan for TCM Industry Development, the county has rolled out a series of policies to support the industry, {{8}} special funding to a full supply chain system.\nIt is expanding into wellness tourism by creatively combining local {{9}} (agriculture) products with traditional medicinal herbs. The county has developed over 200 medicinal dishes and seven wellness teas, with {{10}} output value of over 10 million yuan. This approach has seen the county welcome approximately 867,100 visitors, generating 940.8 million yuan from tourism in the first quarter of 2025.\n试题卷 第 8 页 / 共 8 页 (www.jxenglish.com)","questions":[{"n":1,"no":56,"answer":"fueled","answerText":"fueled","explanation":"考查非谓语动词。county 与 fuel 是被动关系，用过去分词 fueled（英式拼作 fuelled）作状语，故填 fueled。","accept":["fuelled"],"tag":"非谓语动词"},{"n":2,"no":57,"answer":"exceeding","answerText":"exceeding","explanation":"考查非谓语动词。rate 与 exceed 是主动关系，用现在分词作后置定语，故填 exceeding。","tag":"非谓语动词"},{"n":3,"no":58,"answer":"varieties","answerText":"varieties","explanation":"考查名词单复数。定语从句谓语 can boost 是复数，故 variety 用复数形式 varieties。","tag":"名词辨析"},{"n":4,"no":59,"answer":"remarkably","answerText":"remarkably","explanation":"考查词性转换。修饰形容词 similar 需要副词，remarkable 的副词形式是 remarkably，故填 remarkably。","tag":"词性转换"},{"n":5,"no":60,"answer":"has positioned","answerText":"has positioned","explanation":"考查时态。in recent years 是现在完成时标志，主语 Donglan 是单数，position 用作动词，故填 has positioned。","tag":"时态"},{"n":6,"no":61,"answer":"that","answerText":"that","explanation":"考查定语从句。先行词是 a strategy，从句缺主语，用关系代词 that（或 which），故填 that。","accept":["which"],"tag":"定语从句"},{"n":7,"no":62,"answer":"guidance","answerText":"guidance","explanation":"考查词性转换。介词 under...of 后接名词，guide 的名词形式是 guidance，故填 guidance。","tag":"词性转换"},{"n":8,"no":63,"answer":"from","answerText":"from","explanation":"考查介词。from...to... 表示从……到……，此处指从专项拨款到完整供应链体系，故填 from。","tag":"介词"},{"n":9,"no":64,"answer":"agricultural","answerText":"agricultural","explanation":"考查词性转换。修饰名词 products 需要形容词，agriculture 的形容词形式是 agricultural，故填 agricultural。","tag":"词性转换"},{"n":10,"no":65,"answer":"an","answerText":"an","explanation":"考查冠词。output 以元音音素开头，此处泛指一笔产值，用不定冠词 an，故填 an。","tag":"冠词"}],"_source":"raw\\jx\\387.pdf"}]},{"id":"2026-山东省滨州市高三下学期一模测试","year":2026,"paperName":"山东省滨州市高三下学期一模测试","kind":"mock","items":[{"id":"cloze-2026-山东省滨州市高三下学期一模测试-01","type":"cloze","no":41,"score":15,"scorePerBlank":1,"instruction":"阅读下面短文，从每题所给的A、B、C、D四个选项中选出最佳选项。","passage":"When I was a teenager, I was in a constant hurry. I wanted every goal to be achieved {{1}}, every task to be finished quickly, and every moment to be {{2}}. Waiting felt like a waste of time, and patience was a virtue I simply did not {{3}}.\nOne day, I grew {{4}} with a watercolor painting I was working on. I had been rushing through the brushstrokes, eager to finish and move on to the next project. The result was a messy, unbalanced piece that looked {{5}} what I had envisioned. I was about to crumple the paper and throw it away when Mrs. Carter, my art teacher, approached my desk.\nShe didn’t scold me or tell me to try harder. Instead, she sat beside me and said, “Art isn ’t about finishing quickly; it ’s about seeing, feeling, and taking the time to make each stroke {{6}}.” She picked up a clean brush and {{7}} how to layer colors gently, how to let the paint dry between applications, and how to let the artwork evolve naturally.\n“Success in art, and in life, isn’t {{8}} by how fast you reach the end,” she said quietly, “but by the care you put into the journey.” {{9}} only blurs the beauty of what you’re creating.”\nHer words {{10}} within me. I began to realize that my {{11}} with speed was making me miss the joy of learning. I started to approach my studies and daily life with a {{12}} sense of patience. I learned to savor the process and {{13}} the time it takes to grow and create. Mrs. Carter ’s {{14}} taught me that slowing down is not weakness, but strength. Whenever I feel the {{15}} to rush, I recall her advice.","questions":[{"n":1,"no":41,"options":["instantly","gradually","perfectly","completely"],"answer":"A","answerText":"instantly","explanation":"考查副词辨析。句意：我希望每个目标都立刻实现。A. instantly 立刻、马上；B. gradually 逐渐地；C. perfectly 完美地；D. completely 完全地。下文 Waiting felt like a waste of time 表明作者不愿等待，故选A。","tag":"副词辨析"},{"n":2,"no":42,"options":["memorable","productive","appealing","peaceful"],"answer":"B","answerText":"productive","explanation":"考查形容词辨析。句意：希望每个任务都被迅速完成，每一刻都富有成效。A. memorable 难忘的；B. productive 富有成效的；C. appealing 吸引人的；D. peaceful 平静的。与 finished quickly 并列，强调不浪费时间，故选B。","tag":"形容词辨析"},{"n":3,"no":43,"options":["ignore","maintain","possess","request"],"answer":"C","answerText":"possess","explanation":"考查动词辨析。句意：耐心是我根本不具备的一种美德。A. ignore 忽视；B. maintain 维持；C. possess 拥有；D. request 请求。由 simply did not 可知作者当时不具有耐心，故选C。","tag":"动词辨析"},{"n":4,"no":44,"options":["fascinated","confused","satisfied","frustrated"],"answer":"D","answerText":"frustrated","explanation":"考查形容词辨析。句意：一天，我对自己正在画的水彩画感到沮丧。A. fascinated 着迷的；B. confused 困惑的；C. satisfied 满意的；D. frustrated 沮丧的。下文结果 messy, unbalanced 说明画得不理想，故选D。","tag":"形容词辨析"},{"n":5,"no":45,"options":["nothing but","in line with","nothing like","in harmony with"],"answer":"C","answerText":"nothing like","explanation":"考查短语辨析。句意：这幅画杂乱失衡，完全不像我原本设想的样子。A. nothing but 只不过；B. in line with 与……一致；C. nothing like 完全不像；D. in harmony with 与……和谐。由 messy, unbalanced 可知与设想不符，故选C。","tag":"动词辨析"},{"n":6,"no":46,"options":["matter","exist","vary","connect"],"answer":"A","answerText":"matter","explanation":"考查动词辨析。句意：艺术在于花时间去让每一笔都有意义。A. matter 要紧、有意义；B. exist 存在；C. vary 变化；D. connect 连接。老师强调每笔都重要，matter 作不及物动词表示「要紧」，故选A。","tag":"动词辨析"},{"n":7,"no":47,"options":["reminded","declared","demonstrated","displayed"],"answer":"C","answerText":"demonstrated","explanation":"考查动词辨析。句意：她拿起一支干净的画笔，示范如何轻轻叠色。A. reminded 提醒；B. declared 宣布；C. demonstrated 示范、演示；D. displayed 展示、陈列。由如何叠色、如何等颜料干等具体做法可知是亲自示范，故选C。","tag":"动词辨析"},{"n":8,"no":48,"options":["accompanied","described","affected","measured"],"answer":"D","answerText":"measured","explanation":"考查动词辨析。句意：艺术与人生的成功不是用你多快到达终点来衡量的。A. accompanied 伴随；B. described 描述；C. affected 影响；D. measured 衡量。by how fast you reach the end 是衡量标准，故选D。","tag":"动词辨析"},{"n":9,"no":49,"options":["Brushing","Rushing","Complaining","Escaping"],"answer":"B","answerText":"Rushing","explanation":"考查名词辨析。句意：匆忙只会模糊你所创造之物的美。A. Brushing 刷、涂抹；B. Rushing 匆忙；C. Complaining 抱怨；D. Escaping 逃避。全文主线是作者一味求快，与开篇 hurried 呼应，故选B。","tag":"名词辨析"},{"n":10,"no":50,"options":["struck a chord","cast a shadow","rang a bell","planted a fear"],"answer":"A","answerText":"struck a chord","explanation":"考查动词短语辨析。句意：她的话在我心中引起了共鸣。A. struck a chord 引起共鸣；B. cast a shadow 投下阴影；C. rang a bell 听起来耳熟；D. planted a fear 种下恐惧。下文我开始反思正说明话打动了我，故选A。","tag":"动词短语"},{"n":11,"no":51,"options":["familiarity","annoyance","disappointment","obsession"],"answer":"D","answerText":"obsession","explanation":"考查名词辨析。句意：我意识到自己对速度的痴迷让我错过了学习的乐趣。A. familiarity 熟悉；B. annoyance 恼怒；C. disappointment 失望；D. obsession 痴迷、执念。with speed 与之搭配表示对快的执念，故选D。","tag":"名词辨析"},{"n":12,"no":52,"options":["hard-earned","new-found","self-taught","deep-rooted"],"answer":"B","answerText":"new-found","explanation":"考查形容词辨析。句意：我开始用一种新获得的耐心对待学习和生活。A. hard-earned 辛苦得来的；B. new-found 新获得的；C. self-taught 自学的；D. deep-rooted 根深蒂固的。耐心是听老师话后才有的，故选B。","tag":"形容词辨析"},{"n":13,"no":53,"options":["kill","save","appreciate","document"],"answer":"C","answerText":"appreciate","explanation":"考查动词辨析。句意：我学会品味过程，珍惜成长和创作所需的时间。A. kill 消磨；B. save 节省；C. appreciate 珍惜、欣赏；D. document 记录。与 savor the process 并列，故选C。","tag":"动词辨析"},{"n":14,"no":54,"options":["passion","wisdom","perseverance","ambition"],"answer":"B","answerText":"wisdom","explanation":"考查名词辨析。句意：卡特老师的智慧让我懂得放慢不是软弱而是力量。A. passion 热情；B. wisdom 智慧；C. perseverance 毅力；D. ambition 雄心。老师这番话是人生洞见，故选B。","tag":"名词辨析"},{"n":15,"no":55,"options":["urge","need","obligation","temptation"],"answer":"A","answerText":"urge","explanation":"考查名词辨析。句意：每当我感到想赶快行事的冲动时，就想起她的建议。A. urge 冲动、强烈的欲望；B. need 需要；C. obligation 义务；D. temptation 诱惑。the urge to do sth 表示做某事的冲动，贴合急于求快的心态，故选A。","tag":"名词辨析"}],"_source":"raw\\jx\\388.pdf"},{"id":"grammar-2026-滨州市 2026 届下学期一模测试-01","type":"grammar-fill","no":56,"score":15,"scorePerBlank":1.5,"instruction":"阅读下面短文，在空白处填入1个适当的单词或括号内单词的正确形式。","passage":"An international sculpture exhibition marking the Year of the Horse is underway at Inzone Harmony in Beijing. Curated by renowned Chinese sculptor Sun Longben, it {{1}} (feature) horse-themed works by Chinese and Russian artists.\nFor Sun, the horse is a loyal companion {{2}} (embody) speed, freedom and ambition. He also views it as a symbol closely connected with ancient military glories and national unity in Chinese culture.\nSun highlights three ancient Chinese masterpieces {{3}} have deeply influenced modern art. The bronze “Galloping Horse Treading on a Flying Swallow” from the Eastern Han Dynasty {{4}} (celebrate) for its romantic charm. Another significant work is “The Six Steeds of Zhaoling,” Tang stone reliefs (浮雕) which Sun sees {{5}} the beginning of thematic creation in Chinese art. Additionally, the stone statue of a galloping horse at General Huo Qubing’s tomb pioneered the “xieyi tradition”, {{6}} artistic style focusing on “sketching the spirit”.\nDrawing on his education at Russian academies, Sun notes Russian art also values the horse as a symbol of heroism and victory. In many Russian sculptures, ancient heroes are portrayed on horseback, {{7}} the Anichkov Bridge in St. Petersburg is famous for its four grand horse statues.\nThe exhibition beautifully bridges Chinese and Russian cultures through its featured works. Pavel Shevchenko’s sculpture of a water-drinking horse, for instance, {{8}} (subtle) refers to a Chinese idiom about gratitude, while Sergey Kubasov’s striking winged horse conveys wishes for {{9}} (prosper) and good fortune in the Year of the Horse. This unique event offers a wonderful opportunity {{10}} (appreciate) the shared artistic spirit across two nations.","questions":[{"n":1,"no":56,"answer":"features","answerText":"features","explanation":"考查时态与主谓一致。全文用现在时介绍正在举办的展览，主语 it 指 exhibition，故用第三人称单数 features。","tag":"时态/主谓一致"},{"n":2,"no":57,"answer":"embodying","answerText":"embodying","explanation":"考查非谓语动词。horse 与 embody 是主动关系，用现在分词 embodying 作后置定语修饰 companion。","tag":"非谓语动词"},{"n":3,"no":58,"answer":"that","answerText":"that","explanation":"考查定语从句。先行词 masterpieces 指物，从句中缺主语，故用关系代词 that 或 which。","accept":["which"],"tag":"定语从句"},{"n":4,"no":59,"answer":"is celebrated","answerText":"is celebrated","explanation":"考查被动语态。青铜马是「因……而闻名」的受动者，且介绍其固有特点，用一般现在时被动 is celebrated。","tag":"语态"},{"n":5,"no":60,"answer":"as","answerText":"as","explanation":"考查介词。see...as... 是固定搭配，意为「把……看作……」，故填 as。","tag":"介词"},{"n":6,"no":61,"answer":"an","answerText":"an","explanation":"考查冠词。style 是可数名词单数，此处泛指「一种艺术风格」，artistic 以元音音素开头，故用 an。","tag":"冠词"},{"n":7,"no":62,"answer":"and","answerText":"and","explanation":"考查并列连词。前后是两个并列分句，表示并列递进关系，故填 and。","tag":"连词"},{"n":8,"no":63,"answer":"subtly","answerText":"subtly","explanation":"考查词性转换。修饰动词 refers 需要副词，subtle 的副词形式为 subtly。","tag":"词性转换"},{"n":9,"no":64,"answer":"prosperity","answerText":"prosperity","explanation":"考查词性转换。介词 for 后接名词作宾语，与 good fortune 并列，prosper 的名词形式为 prosperity。","tag":"词性转换"},{"n":10,"no":65,"answer":"to appreciate","answerText":"to appreciate","explanation":"考查非谓语动词。opportunity 后常接不定式作定语，表示「做某事的机会」，故填 to appreciate。","tag":"非谓语动词"}],"_source":"raw\\jx\\388.pdf"}]},{"id":"2026-山东省德州市高三下学期一模测试","year":2026,"paperName":"山东省德州市高三下学期一模测试","kind":"mock","items":[{"id":"cloze-2026-山东省德州市高三下学期一模测试-01","type":"cloze","no":41,"score":15,"scorePerBlank":1,"instruction":"阅读下面短文，从每题所给的A、B、C、D四个选项中选出最佳选项。","passage":"After weeks wrapped up in my youngest daughter’s wedding, it feels like a quiet {{1}} to save a small, warm moment. To be honest, the house had been {{2}} with guests for days — bed sheets to iron, meals to arrange, last-minute details at the venue (宴会) to {{3}} out — and scarcely did I draw a breath until the final farewell was exchanged.\nGiven that life has returned to its accustomed routine, I gladly {{4}} back into my everyday rhythm, starting with an online grocery {{5}}. The delivery came right as {{6}}: a young man stood at the doorway, a heavy bag hung on his arm, his voice calm as he handed over my purchase. I expressed my gratitude, and he set the bag down on the entry table {{7}}. Just as he turned to depart, he paused.\n试题卷 第 7 页 / 共 8 页 (www.jxenglish.com) “Would you mind a quick {{8}}? When lifting the bag, grasp it from the bottom — there are cartons (盒) of milk inside, and they might {{9}} if you only hold it by the top handles,” he remarked. I nodded, smiling to myself at his {{10}}.\nAs I was putting away the groceries, I {{11}} the milk cartons at the very bottom of the bag.\nWithout his words, I would have grabbed the bag {{12}} and watched it spill (洒) all over the floor. In modern times, when everyone seems {{13}} from one task to the next, here was someone who {{14}} to think of others and speak politely. It’s these little, yet considerate {{15}} that light up an ordinary day, don’t you think?","questions":[{"n":1,"no":41,"options":["regret","responsibility","excitement","relief"],"answer":"D","answerText":"relief","explanation":"考查名词辨析。句意：忙完小女儿的婚礼数周之后，留住一个小小的温暖时刻，感觉像是一份安静的宽慰。A. regret 后悔；B. responsibility 责任；C. excitement 兴奋；D. relief 宽慰。婚礼筹备忙碌之后终于放松，故选D。","tag":"名词辨析"},{"n":2,"no":42,"options":["blessed","equipped","packed","connected"],"answer":"C","answerText":"packed","explanation":"考查形容词辨析。句意：说实话，这些天家里一直挤满了客人。A. blessed 有福的；B. equipped 装备的；C. packed 挤满的；D. connected 连接的。be packed with 意为「挤满」，与 guests 搭配，故选C。","tag":"形容词辨析"},{"n":3,"no":43,"options":["pick","sort","leave","hand"],"answer":"B","answerText":"sort","explanation":"考查动词短语辨析。句意：还有宴会场地临到最后的细节要理清。A. pick out 挑出；B. sort out 整理、解决；C. leave out 省略；D. hand out 分发。sort out details 表示把细节理顺，故选B。","tag":"动词短语"},{"n":4,"no":44,"options":["settled","fell","looked","called"],"answer":"A","answerText":"settled","explanation":"考查动词辨析。句意：我很乐意重新安顿回日常的节奏。A. settled 安顿；B. fell 落下；C. looked 看；D. called 呼叫。settle back into 表示重新适应、回到某种状态，故选A。","tag":"动词辨析"},{"n":5,"no":45,"options":["review","order","promotion","exchange"],"answer":"B","answerText":"order","explanation":"考查名词辨析。句意：先从在网上下一笔食品杂货订单开始。A. review 评论；B. order 订单；C. promotion 促销；D. exchange 交换。下文 delivery、purchase 说明是网购订单，故选B。","tag":"名词辨析"},{"n":6,"no":46,"options":["expected","imagined","indicated","described"],"answer":"A","answerText":"expected","explanation":"考查动词辨析。句意：送货来得正是时候。A. expected 预料；B. imagined 想象；C. indicated 表明；D. described 描述。as expected 是固定表达，意为「正如预料」，故选A。","tag":"动词辨析"},{"n":7,"no":47,"options":["decisively","carelessly","cautiously","randomly"],"answer":"C","answerText":"cautiously","explanation":"考查副词辨析。句意：他把袋子小心翼翼地放在门口桌上。A. decisively 果断地；B. carelessly 粗心地；C. cautiously 小心地；D. randomly 随意地。下文提示袋里的牛奶易洒，故选C。","tag":"副词辨析"},{"n":8,"no":48,"options":["question","discussion","service","reminder"],"answer":"D","answerText":"reminder","explanation":"考查名词辨析。句意：介意我快速提醒一句吗？A. question 问题；B. discussion 讨论；C. service 服务；D. reminder 提醒。他接着说的正是拿袋子的注意事项，故选D。","tag":"名词辨析"},{"n":9,"no":49,"options":["run out","slip out","fade away","steal away"],"answer":"B","answerText":"slip out","explanation":"考查动词短语辨析。句意：如果只拎上面的提手，牛奶可能会滑出来。A. run out 用完；B. slip out 滑出；C. fade away 消退；D. steal away 溜走。盒装牛奶从袋中滑落，故选B。","tag":"动词短语"},{"n":10,"no":50,"options":["reliability","diligence","sympathy","thoughtfulness"],"answer":"D","answerText":"thoughtfulness","explanation":"考查名词辨析。句意：我点点头，心里为他的体贴而微笑。A. reliability 可靠；B. diligence 勤奋；C. sympathy 同情；D. thoughtfulness 体贴。他主动提醒是为顾客着想，故选D。","tag":"名词辨析"},{"n":11,"no":51,"options":["spotted","pressed","smelled","laid"],"answer":"A","answerText":"spotted","explanation":"考查动词辨析。句意：我这才看见牛奶盒就在袋子的最底下。A. spotted 看见、发现；B. pressed 按压；C. smelled 闻；D. laid 放置。整理食品时看到牛奶盒，故选A。","tag":"动词辨析"},{"n":12,"no":52,"options":["curiously","slowly","unthinkingly","carefully"],"answer":"C","answerText":"unthinkingly","explanation":"考查副词辨析。句意：没有他的话，我会不假思索地抓起袋子，眼看它洒一地。A. curiously 好奇地；B. slowly 慢慢地；C. unthinkingly 不加思索地；D. carefully 小心地。与 Without his words 对应的是不经思索，故选C。","tag":"副词辨析"},{"n":13,"no":53,"options":["nervous","hurried","eased","patient"],"answer":"B","answerText":"hurried","explanation":"考查形容词辨析。句意：如今人人似乎都在匆忙地从一个任务赶向另一个任务。A. nervous 紧张的；B. hurried 匆忙的；C. eased 放松的；D. patient 有耐心的。与后文为他人着想、客气说话形成对比，故选B。","tag":"形容词辨析"},{"n":14,"no":54,"options":["paused","hesitated","promised","pretended"],"answer":"A","answerText":"paused","explanation":"考查动词辨析。句意：而这里却有个人停下来为他人着想、客气说话。A. paused 停下；B. hesitated 犹豫；C. promised 承诺；D. pretended 假装。与上文 he paused 呼应，故选A。","tag":"动词辨析"},{"n":15,"no":55,"options":["reflections","moods","desires","gestures"],"answer":"D","answerText":"gestures","explanation":"考查名词辨析。句意：正是这些细小却体贴的举动照亮了平凡的一天。A. reflections 反思；B. moods 心情；C. desires 欲望；D. gestures 举动。指送货员那番善意提醒，故选D。","tag":"名词辨析"}],"_source":"raw\\jx\\407.pdf"},{"id":"grammar-2025-德州市 2025-2026 年下学期一模测试-01","type":"grammar-fill","no":56,"score":15,"scorePerBlank":1.5,"instruction":"阅读下面短文，在空白处填入1个适当的单词或括号内单词的正确形式。","passage":"Drones spray (喷洒) pesticides over fields, livestreaming sales are made on smartphones, and high- speed trains run on rail bridges {{1}} (stretch) across landscapes. These rural yet modern scenes appear in the paintings of Zhang Qingyi, {{2}} 81-year-old farmer and painter from Shaanxi province.\nFarmer painting dates back to the 1950s, when it {{3}} (use) to serve production by promoting agricultural knowledge and practices. {{4}} (ground) in authentic descriptions of life in the countryside, Zhang’s paintings document {{5}} dramatically rural communities have transformed alongside the country’s broader development.\nZhang is one of many farmer painters who are tracking China’s rural {{6}} (prosper) through their art. “Stories of farmers and their life are captured into paintings, {{7}} serve as a living record of the daily life,” Zhang says, adding that his inspiration often springs {{8}} ordinary scenes.\nSupported by the local government’s push to combine agriculture with culture, a range of related initiatives have emerged. These projects {{9}} (accurate) target the core goal of integration, leading to the renewal of public art spaces. “Farmer painting is a local treasure. My goal is {{10}} (sow) creativity in the young so future generations continue to portray the story of rural life,” Zhang says.","questions":[{"n":1,"no":56,"answer":"stretching","answerText":"stretching","explanation":"考查非谓语动词。rail bridges 与 stretch 是主动关系，用现在分词 stretching 作后置定语，意为「横跨大地的铁路桥」。","tag":"非谓语动词"},{"n":2,"no":57,"answer":"an","answerText":"an","explanation":"考查冠词。farmer 是可数名词单数，此处作同位语表示泛指「一位」，且 81 以元音音素开头，故填 an。","tag":"冠词"},{"n":3,"no":58,"answer":"was used","answerText":"was used","explanation":"考查时态与语态。when 从句指 20 世纪 50 年代，it 指 farmer painting，与 use 是被动关系，故填 was used。","tag":"语态/时态"},{"n":4,"no":59,"answer":"Grounded","answerText":"Grounded","explanation":"考查非谓语动词。be grounded in 意为「以……为基础」，Zhang's paintings 与 ground 是被动关系，用过去分词 Grounded 作状语。","tag":"非谓语动词"},{"n":5,"no":60,"answer":"how","answerText":"how","explanation":"考查名词性从句。document 后为宾语从句，强调农村社区变化的程度，用 how 引导，意为「变化得多么巨大」。","tag":"名词性从句"},{"n":6,"no":61,"answer":"prosperity","answerText":"prosperity","explanation":"考查词性转换。空前有形容词 rural 修饰，需要名词，故填 prosper 的名词形式 prosperity，意为「繁荣」。","tag":"词性转换"},{"n":7,"no":62,"answer":"which","answerText":"which","explanation":"考查定语从句。先行词是前面整句所述内容，非限制性定语从句中缺主语，故填关系代词 which。","tag":"定语从句"},{"n":8,"no":63,"answer":"from","answerText":"from","explanation":"考查介词。spring from 是固定搭配，意为「源自」，故填介词 from。","tag":"介词"},{"n":9,"no":64,"answer":"accurately","answerText":"accurately","explanation":"考查词性转换。修饰动词 target 需用副词，故填 accurate 的副词形式 accurately。","tag":"词性转换"},{"n":10,"no":65,"answer":"to sow","answerText":"to sow","explanation":"考查非谓语动词。主语是 My goal，作表语说明目标内容用动词不定式，故填 to sow。","tag":"非谓语动词"}],"_source":"raw\\jx\\407.pdf"}]},{"id":"2026-山东省菏泽市高三下学期一模考试","year":2026,"paperName":"山东省菏泽市高三下学期一模考试","kind":"mock","items":[{"id":"cloze-2026-山东省菏泽市高三下学期一模考试-01","type":"cloze","no":41,"score":15,"scorePerBlank":1,"instruction":"阅读下面短文，从每题所给的A、B、C、D四个选项中选出最佳选项。","passage":"I moved to Portland last spring, knowing no one. To relieve the {{1}} that filled my quiet apartment, I did what many newcomers do: I searched online for a local {{2}} group. “Forest & Friends” promised weekly activities in the Columbia River Gorge. It sounded like a perfect {{3}}.\nOn our first group {{4}} — a moderate trail (小径) to a waterfall viewpoint — my enthusiasm outweighed my caution. Halfway up, I {{5}} on a loose rock and hurt my ankle. A sharp pain shot through me, and I {{6}} to the ground, embarrassed and frustrated.\nWhat happened next was far from what I had expected. The group’s leader, a woman named Sam, {{7}} the hike immediately. But more {{8}}, not a single person turned back toward the trailhead.\nInstead, the dozen {{9}} I had met only an hour earlier gathered around. Someone {{10}} a medical bandage. Another offered water and snacks. As we waited for help, we sat on the forest floor. We shared {{11}} — not just about hiking, but about our reasons for moving here, our jobs, our hopes. Laughter {{12}} under the tree, my aching ankle momentarily forgotten.\nI had joined the group {{13}} beautiful scenery and perhaps a polite acquaintance or two. I left that day with something far more {{14}}. The physical trail was steep, but the human impulse (冲动) to connect, to stay beside someone in difficulty, was a powerful, leveling force. It was a vivid 试题卷 第 7 页 / 共 8 页 (www.jxenglish.com) {{15}} that we are never truly alone, even on the most difficult paths life sets before us.","questions":[{"n":1,"no":41,"options":["panic","sadness","loneliness","anxiety"],"answer":"C","answerText":"loneliness","explanation":"考查名词辨析。句意：为了排解充满我安静公寓的那种孤独感。A. panic 恐慌；B. sadness 悲伤；C. loneliness 孤独；D. anxiety 焦虑。由 knowing no one 和 quiet apartment 可知是只身一人的孤独，故选C。","tag":"名词辨析"},{"n":2,"no":42,"options":["running","climbing","jumping","hiking"],"answer":"D","answerText":"hiking","explanation":"考查动词辨析。句意：我上网搜索当地的徒步团体。A. running 跑步；B. climbing 攀爬；C. jumping 跳跃；D. hiking 徒步。下文 the hike 与 trail 都对应徒步，故选D。","tag":"动词辨析"},{"n":3,"no":43,"options":["solution","situation","invitation","explanation"],"answer":"A","answerText":"solution","explanation":"考查名词辨析。句意：它听起来像是一个完美的解决办法。A. solution 解决办法；B. situation 情况；C. invitation 邀请；D. explanation 解释。由前句排解孤独的需求可知这是解决之道，故选A。","tag":"名词辨析"},{"n":4,"no":44,"options":["picnic","outing","camp","journey"],"answer":"B","answerText":"outing","explanation":"考查名词辨析。句意：我们第一次集体出游，走的是一条通往瀑布观景点的中等难度小径。A. picnic 野餐；B. outing 外出、出游；C. camp 露营；D. journey 旅程。指团体的一次户外活动，故选B。","tag":"名词辨析"},{"n":5,"no":45,"options":["stepped","slept","swung","handed"],"answer":"A","answerText":"stepped","explanation":"考查动词辨析。句意：走到半路，我踩到一块松动的石头，伤了脚踝。A. stepped 踩、踏；B. slept 睡觉；C. swung 摇摆；D. handed 递。与 on a loose rock 搭配表示踩上去，故选A。","tag":"动词辨析"},{"n":6,"no":46,"options":["bent","jumped","lay","sank"],"answer":"D","answerText":"sank","explanation":"考查动词辨析。句意：一阵剧痛袭来，我又尴尬又沮丧地瘫坐到地上。A. bent 弯腰；B. jumped 跳；C. lay 躺；D. sank 下沉、瘫坐。sink to the ground 表示瘫坐到地上，故选D。","tag":"动词辨析"},{"n":7,"no":47,"options":["put off","called off","ran into","looked into"],"answer":"B","answerText":"called off","explanation":"考查动词短语辨析。句意：队长山姆立刻取消了这次徒步。A. put off 推迟；B. called off 取消；C. ran into 偶遇；D. looked into 调查。有人受伤需要中止活动，故选B。","tag":"动词短语"},{"n":8,"no":48,"options":["naturally","quietly","strikingly","horribly"],"answer":"C","answerText":"strikingly","explanation":"考查副词辨析。句意：但更引人注目的是，没有一个人转身往回走。A. naturally 自然地；B. quietly 安静地；C. strikingly 引人注目地；D. horribly 可怕地。与上句取消行程形成对比，突出出人意料的反应，故选C。","tag":"副词辨析"},{"n":9,"no":49,"options":["visitors","assistants","organizers","strangers"],"answer":"D","answerText":"strangers","explanation":"考查名词辨析。句意：相反，一小时前才认识的十几个陌生人围了过来。A. visitors 参观者；B. assistants 助手；C. organizers 组织者；D. strangers 陌生人。呼应 only an hour earlier 才刚认识，故选D。","tag":"名词辨析"},{"n":10,"no":50,"options":["bought","produced","borrowed","carried"],"answer":"B","answerText":"produced","explanation":"考查动词辨析。句意：有人拿出了医用绷带。A. bought 买；B. produced 拿出、取出；C. borrowed 借；D. carried 携带。produce 在此表示从身上取出，故选B。","tag":"动词辨析"},{"n":11,"no":51,"options":["stories","goals","secrets","joys"],"answer":"A","answerText":"stories","explanation":"考查名词辨析。句意：我们分享各自的故事，不只是关于徒步，还有搬来此地的原因。A. stories 故事；B. goals 目标；C. secrets 秘密；D. joys 快乐。后文谈原因、工作和希望，正是彼此的经历，故选A。","tag":"名词辨析"},{"n":12,"no":52,"options":["paused","faded","resounded","dropped"],"answer":"C","answerText":"resounded","explanation":"考查动词辨析。句意：笑声在树下回荡，我疼痛的脚踝一时被遗忘。A. paused 暂停；B. faded 消退；C. resounded 回荡；D. dropped 掉落。与 under the tree 搭配描写笑声传开，故选C。","tag":"动词辨析"},{"n":13,"no":53,"options":["seeking","developing","chasing","making"],"answer":"A","answerText":"seeking","explanation":"考查动词辨析。句意：我加入这个团体是为了寻找美丽的风景。A. seeking 寻求；B. developing 发展；C. chasing 追逐；D. making 制造。与 beautiful scenery 搭配表示寻求，故选A。","tag":"动词辨析"},{"n":14,"no":54,"options":["promising","necessary","valuable","popular"],"answer":"C","answerText":"valuable","explanation":"考查形容词辨析。句意：我那天离开时带走了珍贵得多的东西。A. promising 有前途的；B. necessary 必要的；C. valuable 珍贵的；D. popular 受欢迎的。与上文只为看风景形成对比，指人与人之间的情谊，故选C。","tag":"形容词辨析"},{"n":15,"no":55,"options":["memory","symbol","sign","reminder"],"answer":"D","answerText":"reminder","explanation":"考查名词辨析。句意：它生动地提醒我：即使在最艰难的路上，我们也从不孤单。A. memory 记忆；B. symbol 象征；C. sign 迹象；D. reminder 提醒。a vivid reminder that 表示生动的提醒，故选D。","tag":"名词辨析"}],"_source":"raw\\jx\\385.pdf"},{"id":"grammar-2026-菏泽市 2026 年一模考试-01","type":"grammar-fill","no":56,"score":15,"scorePerBlank":1.5,"instruction":"阅读下面短文，在空白处填入1个适当的单词或括号内单词的正确形式。","passage":"Forty-nine young professionals from different countries recently completed a 10-day training program in China, {{1}} (explore) rural revitalization practices in Yunnan. The program, co -launched by China Agricultural University and Tencent, aimed to share China’s experience in rural development with global {{2}} (young).\nDuring their visit to Mengla County, Yunnan, the {{3}} (participant) were impressed by the “agri- tourism integration” model in Hebian Village. They learned how Yao ethnic group’s wooden houses {{4}} (transform) into cozy guesthouses, and how villagers now earn income from rubber tapping, beekeeping, and home-stay management. “We used to think rural areas could only rely on farming,” said Mirembe from Uganda. “But here, culture and nature become treasures — this gives us new ideas {{5}} our villages.”\nThey also visited a smart coffee estate in Jinghong, {{6}} AI and drones are used for pest control and yield prediction. Hakim from Indonesia, who runs a coffee workshop, noted: “China’s way of connecting small farmers to big markets via live-streaming is eye-opening. We can adapt this to sell our Indonesian coffee {{7}} (global).”\nA key takeaway was China’s focus on “farmer -centered development”. In Manluanzhan Village, the group saw how {{8}} (abandon) water towers were turned into cafes, and how local villagers lead decision-making for tourism projects. “China doesn’t just build pretty villages — it empowers people to own the development,” said Mumbi from Kenya.\nThe program ended with a {{9}} (commit) to apply these lessons at home. As Tanzanian participant Aboli put it: “China’s rural revitalization isn’t a copy -paste model, {{10}} a mindset of using local strengths. That’s what we need to take back.”","questions":[{"n":1,"no":56,"answer":"exploring","answerText":"exploring","explanation":"考查非谓语动词。49 位青年完成了培训项目，explore 的逻辑主语就是 they，二者是主动关系，作伴随状语，故用现在分词 exploring。","tag":"非谓语动词"},{"n":2,"no":57,"answer":"youth","answerText":"youth","explanation":"考查名词。the young 指全球青年，此处作介词 with 的宾语，用集合名词 young 对应的名词形式 youth。","tag":"名词辨析"},{"n":3,"no":58,"answer":"participants","answerText":"participants","explanation":"考查名词单复数。the 后接名词作主语，指前面提到的参加者群体，应用复数 participants。","tag":"名词辨析"},{"n":4,"no":59,"answer":"were transformed","answerText":"were transformed","explanation":"考查被动语态。木屋是「被改造」成客栈的，与 transform 是被动关系，主语 houses 为复数，且叙述过去的事，故填 were transformed。","tag":"语态"},{"n":5,"no":60,"answer":"for","answerText":"for","explanation":"考查介词。new ideas for our villages 表示「为我们的村庄带来的新想法」，for 引出对象，故填 for。","tag":"介词"},{"n":6,"no":61,"answer":"where","answerText":"where","explanation":"考查定语从句。先行词 Jinghong 是地点，从句 AI and drones are used 结构完整，缺地点状语，故用关系副词 where。","tag":"定语从句"},{"n":7,"no":62,"answer":"globally","answerText":"globally","explanation":"考查词性转换。修饰动词 sell 需要副词，global 的副词形式是 globally，表示「在全球范围」。","tag":"词性转换"},{"n":8,"no":63,"answer":"abandoned","answerText":"abandoned","explanation":"考查非谓语动词。水塔是被废弃的，与 abandon 是被动关系，故用过去分词 abandoned 作定语。","tag":"非谓语动词"},{"n":9,"no":64,"answer":"commitment","answerText":"commitment","explanation":"考查词性转换。不定冠词 a 后接名词，由 with 短语作伴随，故用 commit 的名词形式 commitment。","tag":"词性转换"},{"n":10,"no":65,"answer":"but","answerText":"but","explanation":"考查并列连词。此处是 isn't...but... 的对比结构，表示「不是……而是……」，故填 but。","tag":"连词"}],"_source":"raw\\jx\\385.pdf"}]},{"id":"2026-山东省济宁市高三下学期一模测试","year":2026,"paperName":"山东省济宁市高三下学期一模测试","kind":"mock","items":[{"id":"cloze-2026-山东省济宁市高三下学期一模测试-01","type":"cloze","no":41,"score":15,"scorePerBlank":1,"instruction":"阅读下面短文，从每题所给的A、B、C、D四个选项中选出最佳选项。","passage":"Sixty-five hours in one week? How was that {{1}}? My cellphone’s “screen-time report” felt like a slap (打) in the face. Well, I quickly {{2}} I had worked online full -time that week. Still, that got me thinking hard: Was it time for a {{3}}?\nActually... yes. That’s it exactly. I know my story is {{4}}, but it varies slightly from the norm, which {{5}} getting more exercise or spending more time with friends and family.\nAs I slowly {{6}} myself away from the screen, my cat Athena was the first to notice. She began trying cute little tricks to grab my {{7}}. She picked up her mouse toy and dropped it at my feet. I knew she wanted me to throw it like I always did when she was a kitty. She {{8}} and prepared to launch herself into the air for a high catch. {{9}}! She got it and brought it back. I had assumed that Athena had {{10}} her love of catch, but apparently I was mistaken. I suddenly felt {{11}} that I had let my scrolling (刷屏) habit replace our morning playtime.\n试题卷 第 7 页 / 共 8 页 (www.jxenglish.com) I stopped scrolling through four different newsfeeds as part of my morning routine. {{12}}, I had more free time. Inspired by Athena, I volunteered at the animal shelter, pairing abandoned cats and dogs with potential {{13}}.\nI {{14}} Athena for convincing me to continue on this lower -tech path. In a world where we’re connected 24/7, it’s crucial to remember the {{15}} of disconnecting.","questions":[{"n":1,"no":41,"options":["possible","tolerable","terrible","familiar"],"answer":"A","answerText":"possible","explanation":"考查形容词辨析。句意：一周六十五小时？那怎么可能？A. possible 可能的；B. tolerable 可忍受的；C. terrible 糟糕的；D. familiar 熟悉的。面对屏幕使用时间之高的惊讶反问，故选A。","tag":"形容词辨析"},{"n":2,"no":42,"options":["bet","regretted","reasoned","denied"],"answer":"C","answerText":"reasoned","explanation":"考查动词辨析。句意：我很快推断出，那一周我一直在全职上网工作。A. bet 打赌；B. regretted 后悔；C. reasoned 推断；D. denied 否认。他由报告推出原因，故选C。","tag":"动词辨析"},{"n":3,"no":43,"options":["rest","click","chat","change"],"answer":"D","answerText":"change","explanation":"考查名词辨析。句意：但这仍让我认真思考：是不是该做出改变了？A. rest 休息；B. click 点击；C. chat 聊天；D. change 改变。下文他减少刷屏、改变习惯，故选D。","tag":"名词辨析"},{"n":4,"no":44,"options":["original","common","touching","vivid"],"answer":"B","answerText":"common","explanation":"考查形容词辨析。句意：我知道自己的故事很常见，只是与普遍做法略有不同。A. original 原创的；B. common 常见的；C. touching 感人的；D. vivid 生动的。but 后说与常规略有差异，前句应是普遍，故选B。","tag":"形容词辨析"},{"n":5,"no":45,"options":["involves","misses","allows","risks"],"answer":"A","answerText":"involves","explanation":"考查动词辨析。句意：常见的做法包括多锻炼或多陪家人朋友。A. involves 包含；B. misses 错过；C. allows 允许；D. risks 冒险。which 指代 the norm，说明其包含的内容，故选A。","tag":"动词辨析"},{"n":6,"no":46,"options":["fooled","enjoyed","dreamed","tore"],"answer":"D","answerText":"tore","explanation":"考查动词辨析。句意：当我慢慢把自己从屏幕前拉开时，我的猫雅典娜最先察觉。A. fooled 愚弄；B. enjoyed 享受；C. dreamed 做梦；D. tore 撕、扯。tear oneself away from 意为「把自己从……拽开」，故选D。","tag":"动词辨析"},{"n":7,"no":47,"options":["imagination","attention","arm","snack"],"answer":"B","answerText":"attention","explanation":"考查名词辨析。句意：她开始耍各种可爱的小把戏来吸引我的注意。A. imagination 想象；B. attention 注意；C. arm 手臂；D. snack 零食。grab one's attention 是固定搭配，故选B。","tag":"名词辨析"},{"n":8,"no":48,"options":["backed up","hid away","jumped up","rolled over"],"answer":"A","answerText":"backed up","explanation":"考查动词短语辨析。句意：她后退几步，准备纵身跃起去接球。A. backed up 后退；B. hid away 躲起来；C. jumped up 跳起；D. rolled over 翻身。起跳接球前要先后退蓄力，故选A。","tag":"动词短语"},{"n":9,"no":49,"options":["Pity","Caution","Success","Deal"],"answer":"C","answerText":"Success","explanation":"考查名词辨析。句意：成功了！她接到了球并叼了回来。A. Pity 遗憾；B. Caution 小心；C. Success 成功；D. Deal 交易。下文 She got it 说明这是接到球后的欢呼，故选C。","tag":"名词辨析"},{"n":10,"no":50,"options":["overestimated","underlined","outweighed","outgrown"],"answer":"D","answerText":"outgrown","explanation":"考查动词辨析。句意：我原以为雅典娜已经不再喜欢接球游戏，但显然我错了。A. overestimated 高估；B. underlined 强调；C. outweighed 超过；D. outgrown 因长大而不再要。长大后舍弃旧爱好即 outgrow，故选D。","tag":"动词辨析"},{"n":11,"no":51,"options":["guilty","nervous","relieved","embarrassed"],"answer":"A","answerText":"guilty","explanation":"考查形容词辨析。句意：我突然感到内疚，因为刷屏的习惯取代了我们早上的玩耍时间。A. guilty 内疚的；B. nervous 紧张的；C. relieved 宽慰的；D. embarrassed 尴尬的。为自己耽误陪伴宠物而自责，故选A。","tag":"形容词辨析"},{"n":12,"no":52,"options":["Acceptably","Predictably","Unexpectedly","Supposedly"],"answer":"B","answerText":"Predictably","explanation":"考查副词辨析。句意：我不再在早晨刷各种信息流。可以预料，我有了更多空闲时间。A. Acceptably 可接受地；B. Predictably 可以预料地；C. Unexpectedly 出人意料地；D. Supposedly 据称。少刷屏自然多出时间，故选B。","tag":"副词辨析"},{"n":13,"no":53,"options":["trainers","sponsors","families","teams"],"answer":"C","answerText":"families","explanation":"考查名词辨析。句意：我在动物收容所做志愿者，为被遗弃的猫狗配对潜在的家庭。A. trainers 训练员；B. sponsors 赞助者；C. families 家庭；D. teams 队伍。领养语境中与 abandoned animals 相对的是领养家庭，故选C。","tag":"名词辨析"},{"n":14,"no":54,"options":["reward","admire","honor","credit"],"answer":"D","answerText":"credit","explanation":"考查动词辨析。句意：我感谢雅典娜说服我继续走这条更少科技产品的路。A. reward 奖励；B. admire 钦佩；C. honor 尊敬；D. credit 把……归功于。credit sb for sth 意为「因某事而称赞某人」，故选D。","tag":"动词辨析"},{"n":15,"no":55,"options":["cost","importance","outcome","art"],"answer":"B","answerText":"importance","explanation":"考查名词辨析。句意：记住断网的重要性至关重要。A. cost 代价；B. importance 重要性；C. outcome 结果；D. art 艺术。与 crucial 呼应，强调断网的意义，故选B。","tag":"名词辨析"}],"_source":"raw\\jx\\391.pdf"},{"id":"grammar-2026-济宁市 2026 届下学期第一次模拟测试-01","type":"grammar-fill","no":56,"score":15,"scorePerBlank":1.5,"instruction":"阅读下面短文，在空白处填入1个适当的单词或括号内单词的正确形式。","passage":"Before I was hired, I was told part of my job in the pickle (腌菜) shop was to keep the conversation going with customers. I’d never been talkative, so I lied on my application, {{1}} (claim) I was entirely at ease talking to strangers.\nFake (假装) it till you make it and that’s {{2}} I did. A year later, I had no problem easing into conversations with customers. I smiled, asked about their day and made {{3}} (comment) on the great sale. Then I convinced them to buy our pickled garlic.\n{{4}} was here that I truly learned what self-esteem is. Previously, I had always pictured it to be {{5}} quality only possessed by the skinny blonde cheerleaders. I’ve since come to understand a far {{6}} (broad) definition of it.\nSelf-esteem is knowing yourself and not being afraid to let it shine. My big smile and loud laugh, which {{7}} (be) once a source of embarrassment, has become my trademark. Customers like my sincerity — I’m no {{8}} (robot) salesperson. Self-esteem is also not being completely shut down by a mistake. The other day, a customer told me I was annoying. Prior to working here, I would have broken down, {{9}} with new confidence, I smiled and apologized, knowing she was the exception, not the rule.\nThe pickle -shop self -esteem keeps motivating me {{10}} (excel) in college — two major club involvements and a perfect 4.0 GPA.","questions":[{"n":1,"no":56,"answer":"claiming","answerText":"claiming","explanation":"考查非谓语动词。主语 I 与 claim 是主动关系，用现在分词 claiming 作伴随状语，说明撒谎的内容。","tag":"非谓语动词"},{"n":2,"no":57,"answer":"what","answerText":"what","explanation":"考查名词性从句。空处引导表语从句，并在从句中作 did 的宾语，故填 what，构成 that's what I did。","tag":"名词性从句"},{"n":3,"no":58,"answer":"comments","answerText":"comments","explanation":"考查名词复数。make comments on 意为「对……发表评论」，此处泛指需用复数形式，故填 comments。","tag":"名词辨析"},{"n":4,"no":59,"answer":"It","answerText":"It","explanation":"考查强调句。此处是 It was ... that ... 强调句型，强调地点状语 here，故填 It，注意首字母大写。","tag":"强调句"},{"n":5,"no":60,"answer":"a","answerText":"a","explanation":"考查冠词。quality 为可数名词单数，此处泛指「一种品质」，故填不定冠词 a。","tag":"冠词"},{"n":6,"no":61,"answer":"broader","answerText":"broader","explanation":"考查形容词比较级。空前的 far 常用来修饰比较级表示程度，故填 broad 的比较级 broader。","tag":"比较等级"},{"n":7,"no":62,"answer":"was","answerText":"was","explanation":"考查时态与主谓一致。关系代词 which 指代前面的整体情况，视作单数，且 once 表示过去，故填 was。","tag":"时态/主谓一致"},{"n":8,"no":63,"answer":"robotic","answerText":"robotic","explanation":"考查词性转换。修饰名词 salesperson 需用形容词，故填 robot 的形容词形式 robotic，意为「机械呆板的」。","tag":"词性转换"},{"n":9,"no":64,"answer":"but","answerText":"but","explanation":"考查连词。前后是「过去会崩溃」与「如今微笑着道歉」的对比，故填表示转折的连词 but 或 yet。","accept":["yet"],"tag":"连词"},{"n":10,"no":65,"answer":"to excel","answerText":"to excel","explanation":"考查非谓语动词。motivate sb to do sth 是固定搭配，故填不定式 to excel，意为「激励我在大学里出类拔萃」。","tag":"非谓语动词"}],"_source":"raw\\jx\\391.pdf"}]},{"id":"2026-山东省临沂市高三下学期一模测试","year":2026,"paperName":"山东省临沂市高三下学期一模测试","kind":"mock","items":[{"id":"cloze-2026-山东省临沂市高三下学期一模测试-01","type":"cloze","no":41,"score":15,"scorePerBlank":1,"instruction":"阅读下面短文，从每题所给的A、B、C、D四个选项中选出最佳选项。","passage":"Laughter filled the air as Raúl cut the cake’s thick frosting. It was a small graduation party with only Ed, Max, Raúl and me — no caps, gowns, music, or diplomas. But a(an) {{1}} was in order, because their accomplishment mattered most.\nAll three, over fifty, {{2}} a first in life: they could read. Having overcome {{3}} and a lifetime of hiding their illiteracy, they signed up for my free three-month course to {{4}} their shame at a Dallas church in a very dangerous neighbourhood where drug deals were visible nearby.\nWhile I possessed years of volunteer experience, on my first night, as headlights illuminated (照亮) the parking lot, {{5}} outweighed excitement. Nervous, I {{6}} all supplies with a crash onto the ground, which made my seven male students hurry to help, {{7}} my tension.\nMy seven male students were 30-63; at 24, I was the youngest and palest. Despite my {{8}} entrance, the class went smoothly. To calm me, Ed helped with {{9}}, Max walked me to my car, and 试题卷 第 7 页 / 共 8 页 (www.jxenglish.com) Raúl’s worn truck {{10}} mine through risky streets until I reached the freeway safely. I honked thanks, and he replied with “La Cucaracha,” gently {{11}} the air.\nFour quit, but Ed, Max and Raúl {{12}}. Ed finally understood “Emergency Exit” on the bus he’d taken for 30 years; Max read a sports article and taught his granddaughter about Washington — their determination {{13}}. At the graduation party, Raúl held my hand, palms {{14}} with calluses (老茧): “You gave me a new life.”\nYears later, gray-haired and robbed of work by an economic downturn, I realized their lesson — courage to restart beats age or fear. I resolved to learn new skills, as they had. Their spirit {{15}} me forward.","questions":[{"n":1,"no":41,"options":["ceremony","celebration","meeting","occasion"],"answer":"B","answerText":"celebration","explanation":"考查名词辨析。句意：但那场庆祝是应该办的，因为他们的成就是最重要的。A. ceremony 典礼；B. celebration 庆祝；C. meeting 会议；D. occasion 场合。上文 graduation party、蛋糕说明是庆祝活动，故选B。","tag":"名词辨析"},{"n":2,"no":42,"options":["accepted","afforded","completed","achieved"],"answer":"D","answerText":"achieved","explanation":"考查动词辨析。句意：三人都在五十岁以上，都实现了人生中的第一次：他们能读书了。A. accepted 接受；B. afforded 负担得起；C. completed 完成；D. achieved 实现。a first in life 与 achieved 搭配表示实现，故选D。","tag":"动词辨析"},{"n":3,"no":43,"options":["embarrassment","sadness","gratitude","confusion"],"answer":"A","answerText":"embarrassment","explanation":"考查名词辨析。句意：他们克服了难堪和一辈子隐瞒自己不识字这件事，报名参加我免费的三月课程。A. embarrassment 难堪；B. sadness 悲伤；C. gratitude 感激；D. confusion 困惑。与 hiding their illiteracy 呼应的是羞耻感，故选A。","tag":"名词辨析"},{"n":4,"no":44,"options":["hide","express","escape","share"],"answer":"C","answerText":"escape","explanation":"考查动词辨析。句意：报名参加我免费的三月课程，以求摆脱羞耻。A. hide 隐藏；B. express 表达；C. escape 逃离、摆脱；D. share 分享。escape one's shame 表示摆脱羞耻，与 overcome 呼应，故选C。","tag":"动词辨析"},{"n":5,"no":45,"options":["anxiety","fear","doubt","surprise"],"answer":"A","answerText":"anxiety","explanation":"考查名词辨析。句意：虽然我有多年志愿服务经验，但第一晚车灯照亮停车场时，焦虑压过了兴奋。A. anxiety 焦虑；B. fear 恐惧；C. doubt 怀疑；D. surprise 惊讶。与 excitement 相对且下句 Nervous 印证，故选A。","tag":"名词辨析"},{"n":6,"no":46,"options":["dropped","threw","placed","moved"],"answer":"A","answerText":"dropped","explanation":"考查动词辨析。句意：我紧张得把教具砰的一声全掉在地上。A. dropped 掉落；B. threw 扔；C. placed 放置；D. moved 移动。with a crash 说明是失手掉落，故选A。","tag":"动词辨析"},{"n":7,"no":47,"options":["causing","increasing","hiding","easing"],"answer":"D","answerText":"easing","explanation":"考查动词辨析。句意：我七个男学生赶紧来帮忙，缓解了我的紧张。A. causing 引起；B. increasing 增加；C. hiding 隐藏；D. easing 缓解。学生主动帮忙自然缓解紧张，故选D。","tag":"动词辨析"},{"n":8,"no":48,"options":["graceful","sudden","awkward","rough"],"answer":"C","answerText":"awkward","explanation":"考查形容词辨析。句意：尽管我入场很狼狈，课还是上得很顺利。A. graceful 优雅的；B. sudden 突然的；C. awkward 尴尬的、笨拙的；D. rough 粗糙的。上文掉教具的 crash 场面即尴尬，故选C。","tag":"形容词辨析"},{"n":9,"no":49,"options":["lessons","supplies","books","tools"],"answer":"B","answerText":"supplies","explanation":"考查名词辨析。句意：为了让我镇定，埃德帮忙收拾教具，马克斯送我到车边。A. lessons 课；B. supplies 用品、教具；C. books 书；D. tools 工具。上文 all supplies 掉在地上，此处呼应，故选B。","tag":"名词辨析"},{"n":10,"no":50,"options":["chased","passed","repaired","followed"],"answer":"D","answerText":"followed","explanation":"考查动词辨析。句意：劳尔的旧卡车在危险的街道上一路跟着我的车，直到我安全上了高速。A. chased 追赶；B. passed 超过；C. repaired 修理；D. followed 跟随。护送语境用 followed 表示一路跟在后面，故选D。","tag":"动词辨析"},{"n":11,"no":51,"options":["worsening","clearing","breaking","warming"],"answer":"D","answerText":"warming","explanation":"考查动词辨析。句意：他用《蟑螂曲》回应，轻轻温暖了空气。A. worsening 使恶化；B. clearing 清理；C. breaking 打破；D. warming 使温暖。鸣笛致谢得到的回应令人暖心，故选D。","tag":"动词辨析"},{"n":12,"no":52,"options":["withdrew","registered","remained","abandoned"],"answer":"C","answerText":"remained","explanation":"考查动词辨析。句意：四个人退出了，但埃德、马克斯和劳尔留了下来。A. withdrew 退出；B. registered 注册；C. remained 留下、继续留下；D. abandoned 放弃。but 与 Four quit 形成对比，故选C。","tag":"动词辨析"},{"n":13,"no":53,"options":["broke down","paid off","faded away","came true"],"answer":"B","answerText":"paid off","explanation":"考查动词短语辨析。句意：他们的决心得到了回报。A. broke down 崩溃；B. paid off 得到回报；C. faded away 逐渐消失；D. came true 实现。上文三人学会读书、给孙女讲课都是回报，故选B。","tag":"动词短语"},{"n":14,"no":54,"options":["covered","filled","marked","crowded"],"answer":"A","answerText":"covered","explanation":"考查动词辨析。句意：劳尔握住我的手，掌心布满老茧。A. covered 覆盖；B. filled 填满；C. marked 标记；D. crowded 挤满。be covered with 是固定搭配，表示布满，故选A。","tag":"动词辨析"},{"n":15,"no":55,"options":["forced","allowed","inspired","advised"],"answer":"C","answerText":"inspired","explanation":"考查动词辨析。句意：他们的精神激励我前行。A. forced 强迫；B. allowed 允许；C. inspired 激励；D. advised 建议。inspired sb forward 表示鼓舞某人前进，与 courage to restart 呼应，故选C。","tag":"动词辨析"}],"_source":"raw\\jx\\389.pdf"},{"id":"grammar-2026-临沂市 2026 届下学期一模测试-01","type":"grammar-fill","no":56,"score":15,"scorePerBlank":1.5,"instruction":"阅读下面短文，在空白处填入1个适当的单词或括号内单词的正确形式。","passage":"The first Lighting Xi’an Festival was launched at Xi’an city square. It was titled Geometry of Light, {{1}} combined traditional culture with modern design, as a joint effort between the management of Xi’an city square and the art platform WA VELENGTH.\nThe festival, {{2}} (feature) works of international light artists, demonstrated their representative works with site-specific creations tailored to Xi’an’s rich cultural context. {{3}} (root) in the belief that light is the source of life and inspiration, it explored light’s nature: a spiritual geometry born from the meeting of human and reality.\nDuring its opening, two core topics {{4}} (address) in the discussions: the shared success of commerce and cities and the integrated innovation of art and business. Event {{5}} (organizer) shared their insights into several key areas: the designing philosophy dating back to the {{6}} (evolve) of public perception, the customization of digital art, solidly based {{7}} Xi’an’s local culture, and the potential interaction between technology and art.\nThe festival is not merely an endpoint but rather a starting point for sustained development, the target of which is {{8}} (continue) building and strengthening the cultural brand, thereby further integrating artistic beauty with public spaces to {{9}} (significant) boost urban cultural vitality, enhance commercial experiences, {{10}} ultimately foster the mutual growth of culture and commerce.","questions":[{"n":1,"no":56,"answer":"which","answerText":"which","explanation":"考查定语从句。先行词 Geometry of Light 指物，从句 combined 前缺主语，非限制性定语从句用关系代词 which。","tag":"定语从句"},{"n":2,"no":57,"answer":"featuring","answerText":"featuring","explanation":"考查非谓语动词。主语 The festival 与 feature 是主动关系，用现在分词 featuring 作后置定语，意为「展出国际灯光艺术家的作品」。","tag":"非谓语动词"},{"n":3,"no":58,"answer":"Rooted","answerText":"Rooted","explanation":"考查非谓语动词。be rooted in 意为「植根于」，主语 it 与 root 是被动关系，用过去分词 Rooted 作状语，注意首字母大写。","tag":"非谓语动词"},{"n":4,"no":59,"answer":"were addressed","answerText":"were addressed","explanation":"考查时态与语态。主语 two core topics 与 address 是被动关系，且叙述已发生的开幕式用一般过去时，故填 were addressed。","tag":"语态/时态"},{"n":5,"no":60,"answer":"organizers","answerText":"organizers","explanation":"考查词性转换与名词复数。此处作主语指活动组织者，their 表明为复数，故填 organizers。","tag":"词性转换"},{"n":6,"no":61,"answer":"evolution","answerText":"evolution","explanation":"考查词性转换。定冠词 the 与 of 短语之间需要名词，故填 evolve 的名词形式 evolution。","tag":"词性转换"},{"n":7,"no":62,"answer":"on","answerText":"on","explanation":"考查介词。be based on 是固定搭配，意为「以……为基础」，故填介词 on。","tag":"介词"},{"n":8,"no":63,"answer":"to continue","answerText":"to continue","explanation":"考查非谓语动词。主语是 the target，表语说明目标内容，用不定式 to continue，表示继续打造和强化文化品牌。","tag":"非谓语动词"},{"n":9,"no":64,"answer":"significantly","answerText":"significantly","explanation":"考查词性转换。修饰动词 boost 需用副词，故填 significant 的副词形式 significantly。","tag":"词性转换"},{"n":10,"no":65,"answer":"and","answerText":"and","explanation":"考查连词。enhance 与 foster 及前面的 integrating 是并列关系，最后一项前用连词 and 连接，故填 and。","tag":"连词"}],"_source":"raw\\jx\\389.pdf"}]},{"id":"2026-山东省青岛市高三第一次适应性检测","year":2026,"paperName":"山东省青岛市高三第一次适应性检测","kind":"mock","items":[{"id":"cloze-2026-山东省青岛市高三第一次适应性检测-01","type":"cloze","no":41,"score":15,"scorePerBlank":1,"instruction":"阅读下面短文，从每题所给的A、B、C、D四个选项中选出最佳选项。","passage":"In my family, Saturday mornings were for dim sum (点心).\n“If you want to eat it, you learn to {{1}} the menu,” my mom would say, handing me a yellow order sheet. I scanned the {{2}} characters, trying to pick out the ones I knew.\n“You need to keep up your language,” she added, “Dim sum is the {{3}} to family.” Sure enough, every time we ate dim sum at local cha lous, my immigrant (移民的) mother came alive. Usually shy with her broken English, here she told jokes, {{4}} and natural.\nAfter my parents moved back to Hong Kong, dim sum always {{5}} me to contact my mom.\nMost days in Canada, I {{6}} the dim sum in an inviting way on my plate and shared pictures of it with her. In response, she sent back hers. This held onto our {{7}}. Despite our differences in our realities-mine as I sought my {{8}} between my life here and my roots there-and hers as she tried to regain her sense of {{9}} to a home left decades ago, {{10}} dim sum photos, gradually became our {{11}} language.\nWe {{12}}, still. Our feelings are often lost in translation. There may never be the right {{13}} but always the right food. Whenever we meet, we always {{14}} each other’s plates with dim sum, which look like mountains of affection.\nIn Chinese, dim sum literally means “touch the heart”. For me, it always {{15}} its name.","questions":[{"n":1,"no":41,"options":["keep","read","update","find"],"answer":"B","answerText":"read","explanation":"考查动词辨析。句意：想吃就得学会看菜单。A. keep 保持；B. read 读、看懂；C. update 更新；D. find 找到。妈妈递给我黄色点菜单，让我认字，故选B。","tag":"动词辨析"},{"n":2,"no":42,"options":["unclear","small","unfamiliar","formal"],"answer":"C","answerText":"unfamiliar","explanation":"考查形容词辨析。句意：我盯着那些不熟悉的字，努力挑出认识的那些。A. unclear 不清楚的；B. small 小的；C. unfamiliar 不熟悉的；D. formal 正式的。与 trying to pick out the ones I knew 呼应，故选C。","tag":"形容词辨析"},{"n":3,"no":43,"options":["access","duty","gift","connection"],"answer":"D","answerText":"connection","explanation":"考查名词辨析。句意：点心是通往家人的纽带。A. access 通道；B. duty 责任；C. gift 礼物；D. connection 联系、纽带。下文写点心维系母女感情，故选D。","tag":"名词辨析"},{"n":4,"no":44,"options":["easy","friendly","calm","polite"],"answer":"A","answerText":"easy","explanation":"考查形容词辨析。句意：平日因蹩脚英语而害羞的她，在这里讲笑话，轻松自然。A. easy 放松自在的；B. friendly 友好的；C. calm 冷静的；D. polite 礼貌的。与 Usually shy 形成对比，故选A。","tag":"形容词辨析"},{"n":5,"no":45,"options":["encouraged","reminded","attracted","taught"],"answer":"B","answerText":"reminded","explanation":"考查动词辨析。句意：父母搬回香港后，点心总让我想起联系妈妈。A. encouraged 鼓励；B. reminded 使想起；C. attracted 吸引；D. taught 教。remind sb to do sth 表示提醒某人做某事，故选B。","tag":"动词辨析"},{"n":6,"no":46,"options":["dropped","made","arranged","packed"],"answer":"C","answerText":"arranged","explanation":"考查动词辨析。句意：在加拿大的大多数日子里，我把点心诱人地摆放在盘子里。A. dropped 掉落；B. made 制作；C. arranged 摆放、布置；D. packed 打包。与 on my plate 和拍照分享相呼应，故选C。","tag":"动词辨析"},{"n":7,"no":47,"options":["choice","hope","habit","relationship"],"answer":"D","answerText":"relationship","explanation":"考查名词辨析。句意：这维系着我们之间的关系。A. choice 选择；B. hope 希望；C. habit 习惯；D. relationship 关系。由母女互发照片可知是感情纽带，故选D。","tag":"名词辨析"},{"n":8,"no":48,"options":["direction","identity","dream","recognition"],"answer":"B","answerText":"identity","explanation":"考查名词辨析。句意：我在此处的生活与那边的根之间寻找自己的身份认同。A. direction 方向；B. identity 身份认同；C. dream 梦想；D. recognition 认可。与 my roots 对应，指移民子女的身份归属，故选B。","tag":"名词辨析"},{"n":9,"no":49,"options":["belonging","service","gratitude","devotion"],"answer":"A","answerText":"belonging","explanation":"考查名词辨析。句意：她则试图重新找回对几十年前离开的家的归属感。A. belonging 归属感；B. service 服务；C. gratitude 感激；D. devotion 奉献。a sense of belonging 是固定搭配，故选A。","tag":"名词辨析"},{"n":10,"no":50,"options":["taking","appreciating","collecting","exchanging"],"answer":"D","answerText":"exchanging","explanation":"考查动词辨析。句意：交换点心照片，渐渐成了我们共同的语言。A. taking 拍摄；B. appreciating 欣赏；C. collecting 收集；D. exchanging 交换。上文写她发她的、我发我的，正是互换，故选D。","tag":"动词辨析"},{"n":11,"no":51,"options":["valuable","common","real","private"],"answer":"B","answerText":"common","explanation":"考查形容词辨析。句意：交换点心照片渐渐成了我们共同的语言。A. valuable 宝贵的；B. common 共同的；C. real 真实的；D. private 私人的。母女双方共用的沟通方式，故选B。","tag":"形容词辨析"},{"n":12,"no":52,"options":["struggle","complain","hesitate","regret"],"answer":"A","answerText":"struggle","explanation":"考查动词辨析。句意：我们仍在努力挣扎。A. struggle 挣扎、努力；B. complain 抱怨；C. hesitate 犹豫；D. regret 后悔。后句说感情常在翻译中流失，故选A。","tag":"动词辨析"},{"n":13,"no":53,"options":["methods","time","words","opportunities"],"answer":"C","answerText":"words","explanation":"考查名词辨析。句意：也许永远找不到恰当的词，但总有恰好的食物。A. methods 方法；B. time 时间；C. words 词、话语；D. opportunities 机会。与 lost in translation 对应，故选C。","tag":"名词辨析"},{"n":14,"no":54,"options":["equip","pile","top","decorate"],"answer":"B","answerText":"pile","explanation":"考查动词辨析。句意：每次见面，我们总是往对方盘子里堆满点心。A. equip 装备；B. pile 堆放；C. top 置于顶端；D. decorate 装饰。与像小山一样的爱意呼应，故选B。","tag":"动词辨析"},{"n":15,"no":55,"options":["accounts for","refers to","stands for","lives up to"],"answer":"D","answerText":"lives up to","explanation":"考查动词短语辨析。句意：对我来说，点心始终名副其实。A. accounts for 解释；B. refers to 指的是；C. stands for 代表；D. lives up to 符合、不辜负。live up to its name 表示名副其实，故选D。","tag":"动词短语"}],"_source":"raw\\jx\\399.pdf"},{"id":"grammar-2026-青岛市 2026 年年级第一次适应性检测-01","type":"grammar-fill","no":56,"score":15,"scorePerBlank":1.5,"instruction":"阅读下面短文，在空白处填入1个适当的单词或括号内单词的正确形式。","passage":"Being an exchange student, I use my camera to bridge cultures and capture moments from the country I call my second home.\nTraditional Minnan-style houses, with roofs {{1}} (distinct) curved and walls time-honored, stood shoulder to shoulder. The {{2}} (rhythm) calls of free-range chickens provided background music for our shoot, occasionally interrupted by the distant laughter of villagers passing along the paths.\nWhat {{3}} (strike) me most was such plain warmth. A woman rode past with a basketful of leafy greens, her feet barely touching the ground as she slowed {{4}} (exchange) greetings with neighbors.\nAt the store, the owner, {{5}} (wear) a gentle smile, wiped his hands carefully before weighing out dried mushrooms {{6}} regular customers.\nIn that instant, I felt I was carried 3,000 kilometers south to my grandmother’s village. Though the landscape differed, the essence remained unchanged: that familiar village ecosystem {{7}} shopkeepers remember your favorite childhood treats and {{8}} (local) catch up on the latest news.\nThis is the China I have come to know. It is not just through its high-rises and express trains, {{9}} in these pockets of everyday life that ring across cultures. The world stretches wide yet draws near, connected together by the shared {{10}} (kind).","questions":[{"n":1,"no":56,"answer":"distinctly","answerText":"distinctly","explanation":"考查词性转换。修饰形容词 curved 需要副词，表示屋顶弯曲得很鲜明，distinct 的副词形式是 distinctly。","tag":"词性转换"},{"n":2,"no":57,"answer":"rhythmic","answerText":"rhythmic","explanation":"考查词性转换。修饰名词 calls 需要形容词，rhythm 的形容词形式为 rhythmic，也可写 rhythmical。","accept":["rhythmical"],"tag":"词性转换"},{"n":3,"no":58,"answer":"struck","answerText":"struck","explanation":"考查时态。全文是回忆过去的拍摄经历，用一般过去时，strike 的过去式是 struck。","tag":"时态"},{"n":4,"no":59,"answer":"to exchange","answerText":"to exchange","explanation":"考查非谓语动词。放慢车速是为了与邻居打招呼，用不定式作目的状语，故填 to exchange。","tag":"非谓语动词"},{"n":5,"no":60,"answer":"wearing","answerText":"wearing","explanation":"考查非谓语动词。店主与 wear 是主动关系，用现在分词 wearing 作伴随状语。","tag":"非谓语动词"},{"n":6,"no":61,"answer":"for","answerText":"for","explanation":"考查介词。weigh out dried mushrooms for regular customers 表示「为老顾客称干蘑菇」，for 引出对象，故填 for。","tag":"介词"},{"n":7,"no":62,"answer":"where","answerText":"where","explanation":"考查定语从句。先行词 village ecosystem 表示地点，从句 shopkeepers remember 结构完整，缺地点状语，故用关系副词 where。","tag":"定语从句"},{"n":8,"no":63,"answer":"locals","answerText":"locals","explanation":"考查名词单复数。与 shopkeepers 并列作主语，指当地的人们，故用复数 locals。","tag":"名词辨析"},{"n":9,"no":64,"answer":"but","answerText":"but","explanation":"考查并列连词。此处是 not just...but... 结构，表示「不只是……而是……」，故填 but。","tag":"连词"},{"n":10,"no":65,"answer":"kindness","answerText":"kindness","explanation":"考查词性转换。介词 by 后接名词作宾语，kind 的名词形式是 kindness，表示「善意」。","tag":"词性转换"}],"_source":"raw\\jx\\399.pdf"}]},{"id":"2026-山东省烟台市高三3月高考诊断性测试","year":2026,"paperName":"山东省烟台市高三3月高考诊断性测试","kind":"mock","items":[{"id":"cloze-2026-山东省烟台市高三3月高考诊断性测试-01","type":"cloze","no":41,"score":15,"scorePerBlank":1,"instruction":"阅读下面短文，从每题所给的A、B、C、D四个选项中选出最佳选项。","passage":"Ms Green was a junior high school teacher for decades. She had a trick for {{1}} challenging students. It began not with judgment but with a(n) {{2}} search for a single {{3}}.\nLast term, Marc was assigned to Ms Green’s class. He had a reputation around the school for his {{4}}: disturbing class, skipping homework and fighting with classmates. Constantly {{5}} by teachers, he grew cold and defensive.\n“Marc’s real trouble — He’ll ruin your class order,” other teachers {{6}} Ms Green. She listened and inquired, “But what’s something

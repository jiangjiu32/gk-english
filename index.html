 good about him?” She learned Marc was a dedicated football player.\nThe first time Marc entered class, she {{7}} him with “I’ve heard about you”. At this point, the kid was preparing for the {{8}} speech: “You’d better not cause trouble in my class...” Unexpectedly, he heard, “You’re that great football player? Can I get your game {{9}}?” Initially, he didn’t get her {{10}}, and then it sank in: Ms Green wanted to watch him play. Warmth flooded into his heart — no adult had done him such a(n) {{11}}, and he nodded excitedly.\nMs Green kept her word. From the sidelines, she shouted Marc’s name and cheered him on. Her warm and sincere {{12}} stimulated his whole -hearted engagement in the game. He played with remarkable focus. Back in class, Ms Green {{13}} Marc, “You showed great teamwork out there.”\nThen she encouraged him, “Why not bring that focus here? I’m convinced you’ll do well.” Greatly motivated, Marc began to participate, trying to {{14}} her trust. Ms Green’s {{15}} — seeing the 试题卷 第 7 页 / 共 8 页 (www.jxenglish.com) good first — brought out the best in him.","questions":[{"n":1,"no":41,"options":["joining","reaching","accompanying","pardoning"],"answer":"B","answerText":"reaching","explanation":"考查动词辨析。句意：她有一套接近难教学生的诀窍。A. joining 加入；B. reaching 接近、打动；C. accompanying 陪同；D. pardoning 原谅。由 not with judgment 可知是主动去接近沟通，故选B。","tag":"动词辨析"},{"n":2,"no":42,"options":["secretive","casual","intentional","bitter"],"answer":"C","answerText":"intentional","explanation":"考查形容词辨析。句意：它始于不带评判地刻意寻找一个优点。A. secretive 秘而不宣的；B. casual 随意的；C. intentional 刻意的、有意的；D. bitter 痛苦的。与后半句 not with judgment 对比，强调有意为之，故选C。","tag":"形容词辨析"},{"n":3,"no":43,"options":["target","excuse","comfort","strength"],"answer":"D","answerText":"strength","explanation":"考查名词辨析。句意：刻意寻找一个优点。A. target 目标；B. excuse 借口；C. comfort 安慰；D. strength 长处、优点。下文她问 what's something good about him 正对应优点，故选D。","tag":"名词辨析"},{"n":4,"no":44,"options":["behavior","prejudice","hobbies","remarks"],"answer":"A","answerText":"behavior","explanation":"考查名词辨析。句意：他在全校以行为问题出名。A. behavior 行为；B. prejudice 偏见；C. hobbies 爱好；D. remarks 言论。冒号后列举扰乱课堂、不做作业、打架，都是行为表现，故选A。","tag":"名词辨析"},{"n":5,"no":45,"options":["attacked","lectured","tasked","persuaded"],"answer":"B","answerText":"lectured","explanation":"考查动词辨析。句意：由于不断被老师训斥，他变得冷漠而戒备。A. attacked 攻击；B. lectured 训斥、说教；C. tasked 派任务；D. persuaded 劝说。与 grew cold and defensive 构成因果，故选B。","tag":"动词辨析"},{"n":6,"no":46,"options":["offended","assisted","warned","trained"],"answer":"C","answerText":"warned","explanation":"考查动词辨析。句意：其他老师提醒格林老师：他会毁掉你的课堂秩序。A. offended 冒犯；B. assisted 协助；C. warned 提醒、警告；D. trained 训练。此处是同事的告诫，故选C。","tag":"动词辨析"},{"n":7,"no":47,"options":["greeted","associated","satisfied","rewarded"],"answer":"A","answerText":"greeted","explanation":"考查动词辨析。句意：马克第一次进教室时，她用「我听说过你」来迎接他。A. greeted 迎接、打招呼；B. associated 联系；C. satisfied 使满意；D. rewarded 奖赏。由后面引号里的招呼语可知，故选A。","tag":"动词辨析"},{"n":8,"no":48,"options":["complex","usual","fun","outdated"],"answer":"B","answerText":"usual","explanation":"考查形容词辨析。句意：此刻，这孩子正准备听那番通常的告诫。A. complex 复杂的；B. usual 通常的、惯常的；C. fun 有趣的；D. outdated 过时的。冒号后是老师惯常的警告语，故选B。","tag":"形容词辨析"},{"n":9,"no":49,"options":["opponents","experiences","score","schedule"],"answer":"D","answerText":"schedule","explanation":"考查名词辨析。句意：你就是那个很棒的足球运动员？能给我你的比赛日程吗？A. opponents 对手；B. experiences 经历；C. score 比分；D. schedule 日程安排。下文她要去看他比赛，故需知道赛程，故选D。","tag":"名词辨析"},{"n":10,"no":50,"options":["need","doubt","message","joke"],"answer":"C","answerText":"message","explanation":"考查名词辨析。句意：起初他没领会她的意思。A. need 需要；B. doubt 怀疑；C. message 意思、信息；D. joke 玩笑。后文 it sank in 表示他明白了她的用意，故选C。","tag":"名词辨析"},{"n":11,"no":51,"options":["honor","favor","injustice","service"],"answer":"A","answerText":"honor","explanation":"考查名词辨析。句意：从没有大人给过他这样的尊重与认可。A. honor 尊重、荣誉；B. favor 恩惠；C. injustice 不公；D. service 服务。老师要看他的比赛并为他加油，是把他当作值得重视的人，故选A。","tag":"名词辨析"},{"n":12,"no":52,"options":["apology","gesture","wish","offer"],"answer":"B","answerText":"gesture","explanation":"考查名词辨析。句意：她温暖而真诚的姿态激发了他全力投入比赛。A. apology 道歉；B. gesture 姿态、表示；C. wish 祝愿；D. offer 提议。指她到场加油这一善意举动，故选B。","tag":"名词辨析"},{"n":13,"no":53,"options":["thanked","corrected","praised","questioned"],"answer":"C","answerText":"praised","explanation":"考查动词辨析。句意：回到课堂上，格林老师表扬马克：你在场上表现得很有团队精神。A. thanked 感谢；B. corrected 纠正；C. praised 表扬、称赞；D. questioned 质疑。引号内正是表扬的话，故选C。","tag":"动词辨析"},{"n":14,"no":54,"options":["take advantage of","give way to","put up with","live up to"],"answer":"D","answerText":"live up to","explanation":"考查动词短语辨析。句意：马克大受鼓舞，开始参与，努力不辜负她的信任。A. take advantage of 利用；B. give way to 让位于；C. put up with 忍受；D. live up to 不辜负。live up to one trust 表示不辜负信任，故选D。","tag":"动词短语"},{"n":15,"no":55,"options":["approach","advice","evaluation","promise"],"answer":"A","answerText":"approach","explanation":"考查名词辨析。句意：格林老师先看到优点的方法，激发出了他最好的一面。A. approach 方法、做法；B. advice 建议；C. evaluation 评价；D. promise 承诺。破折号后 seeing the good first 是对她做法的解释，故选A。","tag":"名词辨析"}],"_source":"raw\\jx\\406.pdf"},{"id":"grammar-2026-烟台市 2026 届 3 月高考诊断性测试（一模）-01","type":"grammar-fill","no":56,"score":15,"scorePerBlank":1.5,"instruction":"阅读下面短文，在空白处填入1个适当的单词或括号内单词的正确形式。","passage":"In the Mid-Autumn Festival season of 2025, specialty coffee brand M Stand {{1}} (partner) with Zhang Dingjuan, a 30-year-old inheritor (继承人) of Daoming bamboo weaving (编织). Recognized {{2}} our national intangible cultural heritage, the craft, the roots of {{3}} date back to the Qin Dynasty, comes from Daoming Town in Sichuan Province.\n“During our {{4}} (collaborate) with a brand, we always look for shared elements between their identity and bamboo weaving,” Zhang explained. “With M Stand, we focused on patterns and simplicity.\nThe Z-shaped weave echoes the ‘M’ in their logo, and the neutral colors match their clean, minimalist style.”\nZhang grew up watching her grandfather weave baskets. After studying product design at university, she chose {{5}} (explore) the craft even further. She traveled to Daoming in person to receive training from Zhao Sijin, the master inheritor of Daoming bamboo weaving.\nOne of the most {{6}} (wide) used materials in Daoming weaving is Yinshan cizhu bamboo {{7}} (harvest) at two or three years old. With long joints, thin walls and strong flexibility, it produces durable products. {{8}} makes the process painstaking is that it involves dozens of complicated steps — scraping (刮), splitting, slicing, thinning and stretching the fibers.\nSo far, Zhang, together with other designers, {{9}} (diversify) the craft beyond traditional baskets into earrings, phone cases and even car seat backs. A gourd -shaped bookmark she designed brought in over 100, 000 yuan in a single month. Last year, she launched her own brand.\n“I spent a decade {{10}} (learning) in Daoming. From making small pieces to taking on complex, customized projects, it’s been a long and tough journey,” Zhang said.","questions":[{"n":1,"no":56,"answer":"partnered","answerText":"partnered","explanation":"考查时态。时间状语是 2025 年中秋，动作发生在过去，故用一般过去时 partnered。","tag":"时态"},{"n":2,"no":57,"answer":"as","answerText":"as","explanation":"考查介词。recognize...as... 是固定搭配，意为「承认……为……」，此处为过去分词短语作状语，故填 as。","tag":"介词"},{"n":3,"no":58,"answer":"which","answerText":"which","explanation":"考查定语从句。先行词 the craft 指物，从句谓语是 date back to，缺主语，故用关系代词 which。","tag":"定语从句"},{"n":4,"no":59,"answer":"collaboration","answerText":"collaboration","explanation":"考查词性转换。介词 during 后接名词，与 with a brand 构成短语，故用 collaborate 的名词形式 collaboration。","tag":"词性转换"},{"n":5,"no":60,"answer":"to explore","answerText":"to explore","explanation":"考查非谓语动词。choose to do sth 是固定搭配，表示「选择做某事」，故填 to explore。","tag":"非谓语动词"},{"n":6,"no":61,"answer":"widely","answerText":"widely","explanation":"考查词性转换。修饰过去分词 used 需要副词，wide 的副词形式是 widely，表示「广泛地」。","tag":"词性转换"},{"n":7,"no":62,"answer":"harvested","answerText":"harvested","explanation":"考查非谓语动词。bamboo 与 harvest 是被动关系，且表示被采伐时的状态，故用过去分词 harvested 作定语。","tag":"非谓语动词"},{"n":8,"no":63,"answer":"What","answerText":"What","explanation":"考查主语从句。从句 makes the process painstaking 缺主语且指物，故用连接代词 What 引导主语从句。","tag":"名词性从句"},{"n":9,"no":64,"answer":"has diversified","answerText":"has diversified","explanation":"考查时态与主谓一致。时间状语 So far 常与现在完成时连用，主语 Zhang 为第三人称单数，故填 has diversified。","tag":"时态/主谓一致"},{"n":10,"no":65,"answer":"learning","answerText":"learning","explanation":"考查非谓语动词。spend time (in) doing sth 是固定搭配，表示「花费时间做某事」，故填 learning。","tag":"非谓语动词"}],"_source":"raw\\jx\\406.pdf"}]},{"id":"2026-湛江一模","year":2026,"paperName":"湛江一模","kind":"mock","items":[{"id":"cloze-2026-湛江一模-01","type":"cloze","no":21,"score":15,"scorePerBlank":1,"instruction":"阅读下面短文，从每题所给的A、B、C、D四个选项中选出最佳选项。","passage":"In my family, a unique holiday tradition has taken root. It is a tradition that goes beyond {{1}} gift-giving. Each year, I secretly take away a small tree-themed journal from my daughters' rooms before their birthdays or holidays, only to {{2}} it with a new page filled with my awkwardly drawn trees. These drawings symbolize {{3}} trees planted in their {{4}} through donations to One Tree Planted — an organization that helps with forests worldwide at about $1 per tree.\nWe call these journals their“forever forest”. My mission is to {{5}} this until the pages overflow with trees or my time on Earth ends. This tradition carries three {{6}}: to help secure a livable climate for their future, to show how small, {{7}} actions add up to a meaningful impact, and to inspire them to create their own paths toward positive {{8}} Unlike one-off charitable gifts, this {{9}} is designed to grow and resonate （回 响）across years. Though tree-planting alone cannot stop systemic deforestation, it offers something equally vital: better {{10}}. My daughters already {{11}} watching their forest expand on {{12}} —and in reality. More importantly, they’re beginning to connect individual choices with broader consequences: that each of us can either {{13}} the world or carelessly degrade it.\nThis“forever forest” is not a（n） {{14}} to global crisis, but a humble, personal testament （证明）to {{15}} and hope — one tree, one page, and one child at a time.","questions":[{"n":1,"options":["serious","careful","conventional","public"],"answer":"C","answerText":"conventional","explanation":"conventional 意为“惯例的、传统的”。句意：这个传统超越了**惯例的**送礼方式。下文说作者每年偷偷拿走女儿房里的树形笔记本、再画满树送回去，而不是直接买礼物，所以是“超越惯例”。serious（严肃的）、careful（仔细的）、public（公开的）都无法与 gift-giving 构成这种对比。","tag":"词义辨析"},{"n":2,"options":["return","present","compare","connect"],"answer":"A","answerText":"return","explanation":"return 意为“归还、送回”。took away ... only to ___ it with a new page 构成“拿走—补一页—送回去”的完整动作链，only to 表示出乎意料的结果。present（呈献）缺少“原来拿走、现在送回”的往复含义；compare（比较）、connect（连接）与笔记本无关。","tag":"词义辨析"},{"n":3,"options":["big","real","thick","weak"],"answer":"B","answerText":"real","explanation":"下文提到通过捐款给 One Tree Planted 这 一 组织来种树，说明这些树是真实种 下的","tag":"词义辨析"},{"n":4,"options":["favor","turn","memory","name"],"answer":"D","answerText":"name","explanation":"“in one's name”在这里的意思是“以某人的名义”,家长以女儿们的名义种树，作为 送给她们的生日或节日礼物","tag":"词义辨析"},{"n":5,"options":["improve","advocate","continue","recognize"],"answer":"C","answerText":"continue","explanation":"“continue” 与 “until the pages overflow with trees or my time on Earth ends”相 呼 应，强调作者将这件事做下去的决心","tag":"词义辨析"},{"n":6,"options":["suggestions","intentions","achievements","enrichments"],"answer":"B","answerText":"intentions","explanation":"答题空后面的三个不定式表达的是家长送种树日志作为礼物的目的，所以 “intentions” 符合语境","tag":"词义辨析"},{"n":7,"options":["consistent","contemporary","convincing","controlled"],"answer":"A","answerText":"consistent","explanation":"consistent 意为“持续的、一贯的”。后文 how small, ___ actions add up to a meaningful impact 强调“小的行动不断累积才有效果”，consistent 正对应“持续”。contemporary（当代的）、convincing（令人信服的）、controlled（受控的）都与“累积”这一逻辑无关。","tag":"词义辨析"},{"n":8,"options":["feedback","change","answers","efforts"],"answer":"B","answerText":"change","explanation":"change 意为“改变”。positive change 是英语固定搭配，且与全文“种树环保、给未来带来积极改变”的主旨一致。feedback（反馈）需要有他人给出，answers（答案）与 paths toward 不搭，efforts（努力）与 positive 连用不自然。","tag":"固定搭配"},{"n":9,"options":["topic","agreement","practice","principle"],"answer":"C","answerText":"practice","explanation":"答题空前的“this” 指代上文描述的种树日志传统。“practice” 能准确描述这持续多 年的行为","tag":"代词"},{"n":10,"options":["productiveness","fairness","business","awareness"],"answer":"D","answerText":"awareness","explanation":"下文提到女儿们“connect individual choices with broader consequences”,即“将个 人选择与更广泛的结果联系起来” ,“awareness” 在这里指“意识”,即“意识提高”","tag":"词义辨析"},{"n":11,"options":["enjoy","avoid","miss","mind"],"answer":"A","answerText":"enjoy","explanation":"这里的意思是“女儿们已经乐于看到她们的森林扩大”。“enjoy” 表示她们喜欢这样 的礼物，明白其中的意义","tag":"词义辨析"},{"n":12,"options":["paper","screen","holiday","command"],"answer":"A","answerText":"paper","explanation":"“on paper”意为“在纸上”,与下文的“in reality”形成对照，指纸上画的树，实际都种 下 了","tag":"词义辨析"},{"n":13,"options":["depend on","engage with","care for","struggle against"],"answer":"C","answerText":"care for","explanation":"“or” 前 后 为 对 立 关 系，“care for”与 “degrade” 形成鲜明对比，表示两种截然不同的 选择","tag":"词义辨析"},{"n":14,"options":["response","access","devotion","solution"],"answer":"D","answerText":"solution","explanation":"“solution” 与 下 文“humble, personal testament”形成对比，适用于“not…but …” 结 构，阐述种树日志这样的小事情的独特意义。英语参考答案及评分标准 第 3 页 （共 6 页）","tag":"词义辨析"},{"n":15,"options":["stability","responsibility","ability","flexibility"],"answer":"B","answerText":"responsibility","explanation":"与“hope” 并列的应是一个积极名词。“responsibility” 与全文“个人行动”“积累影 响”的主题一致。第二节 （共10小题；每小题1.5分，满分15分） 36.convenience 37.but 38.has reached 39.spots 40.basic 41.equipped 42.drinking 43.a 44.currently 45.in 第三部分 写作（共两节，满分40分） 第一节 （满分15分） One possible version","tag":"连词"}]}]},{"id":"2026-浙江省名校协作体高三下学期开学考","year":2026,"paperName":"浙江省名校协作体高三下学期开学考","kind":"mock","items":[{"id":"cloze-2026-浙江省名校协作体高三下学期开学考-01","type":"cloze","no":41,"score":15,"scorePerBlank":1,"instruction":"阅读下面短文，从每题所给的A、B、C、D四个选项中选出最佳选项。","passage":"It was 1 a.m. on her daughter’s birthday when Marisa Shumaker decided to create some birthday magic. She pulled out a parcel, ready to {{1}} the perfect gift — a real 61-key music keyboard for her 4-year-old, Aubree. To her shock, when she opened it, she found the parcel contained only a stand and a bench; the keyboard was sold {{2}}.\nPanic set in as she imagined the {{3}} a broken promise could bring. She searched online and called stores all day long, but nothing was {{4}}. In a final attempt, she {{5}} a plea (请求) in a local Facebook group.\nFive miles away, Andy Spencer saw her post. “I wouldn’t want a child’s birthday wish to go {{6}},” he later said. He then remembered the 61 full -size keyboard his own daughter {{7}} used. Spencer quickly messaged Shumaker and arranged to meet at a nearby store.\n“When I saw a stranger willing to {{8}} a keyboard just in time to help,” Shumaker recalled, “it felt like experiencing one of those {{9}} scenes of a movie.” When she offered to pay, Spencer politely {{10}}, asking only for a photo of a happy Aubree. He {{11}}, “If she becomes the next Taylor Swift, give us a shoutout.”\n第 7 页 / 共 10 页 (www.jxenglish.com) At her birthday party, Aubree {{12}} into the living room like a joyful rabbit. Her face lit up at the sight of the keyboard. That night, Shumaker texted Spencer her thanks, adding that Aubree was so fascinated by the {{13}} that she hadn’t even opened her other gifts.\nNow Aubree practices nearly every day. “Nothing can {{14}} this gift,” Shumaker says. That night {{15}} her faith in everyday magic — it felt like meeting a guardian angel.","questions":[{"n":1,"no":41,"options":["make","purchase","unwrap","deliver"],"answer":"C","answerText":"unwrap","explanation":"考查动词辨析。句意：她拿出一个包裹，准备拆开这份完美的礼物。A. make 制作；B. purchase 购买；C. unwrap 拆开；D. deliver 递送。包裹已在手中，与后文 she opened it 呼应，故选C。","tag":"动词辨析"},{"n":2,"no":42,"options":["separately","quickly","secretly","poorly"],"answer":"A","answerText":"separately","explanation":"考查副词辨析。句意：包裹里只有支架和琴凳，键盘是单独出售的。A. separately 分开地；B. quickly 迅速地；C. secretly 秘密地；D. poorly 差劲地。支架琴凳与键盘被分成两件商品，故选A。","tag":"副词辨析"},{"n":3,"no":43,"options":["anger","excitement","disappointment","confusion"],"answer":"C","answerText":"disappointment","explanation":"考查名词辨析。句意：一想到食言会给孩子带来失望，她就慌了。A. anger 愤怒；B. excitement 兴奋；C. disappointment 失望；D. confusion 困惑。四岁女儿期待礼物却落空，母亲担心的是她失望，故选C。","tag":"名词辨析"},{"n":4,"no":44,"options":["usable","available","enjoyable","affordable"],"answer":"B","answerText":"available","explanation":"考查形容词辨析。句意：她上网搜索、整天打电话给商店，却什么都买不到。A. usable 可用的；B. available 可买到的；C. enjoyable 愉快的；D. affordable 价格合理的。nothing was available 表示没有货，故选B。","tag":"形容词辨析"},{"n":5,"no":45,"options":["updated","answered","posted","rejected"],"answer":"C","answerText":"posted","explanation":"考查动词辨析。句意：最后她试着在当地 Facebook 群组里发了一条求助帖。A. updated 更新；B. answered 回答；C. posted 发布；D. rejected 拒绝。与下文 Andy Spencer saw her post 直接对应，故选C。","tag":"动词辨析"},{"n":6,"no":46,"options":["unnoticed","unfulfilled","unchanged","unexpressed"],"answer":"B","answerText":"unfulfilled","explanation":"考查形容词辨析。句意：他说，我不想让一个孩子的生日愿望落空。A. unnoticed 未被注意；B. unfulfilled 未实现的；C. unchanged 未改变的；D. unexpressed 未表达的。go unfulfilled 与上文的食言呼应，故选B。","tag":"形容词辨析"},{"n":7,"no":47,"options":["barely","widely","heavily","frequently"],"answer":"A","answerText":"barely","explanation":"考查副词辨析。句意：他想起自己女儿几乎没用过的那台 61 键全尺寸键盘。A. barely 几乎不；B. widely 广泛地；C. heavily 大量地；D. frequently 频繁地。女儿很少使用，键盘接近全新，才有转送的价值，故选A。","tag":"副词辨析"},{"n":8,"no":48,"options":["tap on","throw away","pick up","part with"],"answer":"D","answerText":"part with","explanation":"考查动词短语辨析。句意：看到一个陌生人愿意割舍自己的键盘来及时帮忙。A. tap on 轻敲；B. throw away 扔掉；C. pick up 捡起；D. part with 舍弃。part with sth 指放手自己的东西，符合把女儿键盘送人的情境，故选D。","tag":"动词短语"},{"n":9,"no":49,"options":["eye-opening","heart-warming","nerve-cracking","mind-numbing"],"answer":"B","answerText":"heart-warming","explanation":"考查形容词辨析。句意：那感觉就像经历了电影里那种暖心的桥段。A. eye-opening 大开眼界的；B. heart-warming 暖人心房的；C. nerve-cracking 紧张的；D. mind-numbing 极乏味的。陌生人无私相助让母亲感到温暖，故选B。","tag":"形容词辨析"},{"n":10,"no":50,"options":["refused","accepted","nodded","apologized"],"answer":"A","answerText":"refused","explanation":"考查动词辨析。句意：她要付钱时，斯宾塞礼貌地拒绝了，只想要一张奥布里开心的照片。A. refused 拒绝；B. accepted 接受；C. nodded 点头；D. apologized 道歉。asking only for a photo 说明他没要钱，故选A。","tag":"动词辨析"},{"n":11,"no":51,"options":["stated","demanded","whispered","joked"],"answer":"D","answerText":"joked","explanation":"考查动词辨析。句意：他开玩笑说，要是她成了下一个泰勒·斯威夫特，记得帮我们宣传一下。A. stated 陈述；B. demanded 要求；C. whispered 低声说；D. joked 开玩笑。把对方比作未来的明星显然是句玩笑话，故选D。","tag":"动词辨析"},{"n":12,"no":52,"options":["skipped","wandered","slipped","tiptoed"],"answer":"A","answerText":"skipped","explanation":"考查动词辨析。句意：生日派对上，奥布里像只快乐的小兔子一样蹦跳着进了客厅。A. skipped 蹦跳；B. wandered 闲逛；C. slipped 溜走；D. tiptoed 踮脚走。like a joyful rabbit 提示动作是欢快蹦跳，故选A。","tag":"动词辨析"},{"n":13,"no":53,"options":["stand","parcel","bench","keyboard"],"answer":"D","answerText":"keyboard","explanation":"考查名词辨析。句意：奥布里对这台键盘着迷得连其他礼物都没拆。A. stand 支架；B. parcel 包裹；C. bench 琴凳；D. keyboard 键盘乐器。她着迷摆弄的是斯宾塞送来的键盘，故选D。","tag":"名词辨析"},{"n":14,"no":54,"options":["decorate","change","top","ruin"],"answer":"C","answerText":"top","explanation":"考查动词辨析。句意：舒梅克说，没有什么礼物能比得上这份心意。A. decorate 装饰；B. change 改变；C. top 胜过、超过；D. ruin 毁掉。top 作动词表示胜过，强调这份礼物无可比拟，故选C。","tag":"动词辨析"},{"n":15,"no":55,"options":["challenged","renewed","showed","shook"],"answer":"B","answerText":"renewed","explanation":"考查动词辨析。句意：那一夜让她重新相信了平凡生活中的奇迹。A. challenged 挑战；B. renewed 使重新恢复；C. showed 展示；D. shook 动摇。renew one's faith 意为重拾信念，与 guardian angel 的比喻一致，故选B。","tag":"动词辨析"}],"_source":"raw\\jx\\404.pdf"},{"id":"grammar-2026-第一部分 听力（共两节，满分 30 分）-01","type":"grammar-fill","no":56,"score":15,"scorePerBlank":1.5,"instruction":"阅读下面短文，在空白处填入1个适当的单词或括号内单词的正确形式。","passage":"Before Benjamin Rene and Loic Michel left their hometown of Annecy in southeastern France {{1}} the morning of September 13, 2024, China was, to them, a distant yet fascinating place, a name more often encountered in headlines than in everyday conversation.\n“In France, China {{2}} (feel) extremely far away,” says Rene, 27. “It almost represents the end of the world — as far as you can go by walking.”\nThe idea {{3}} would eventually turn this abstract distance into lived experience was born two years earlier. The two friends found themselves talking about repetitive work routines and the sense of {{4}} (stick) in daily life. Surprising even themselves, they made a bold decision: to walk all the way to China, choosing a low-carbon and {{5}} (environmental) friendly way to travel.\nThey spent more than half a year preparing. Maps {{6}} (study), visas researched, physical training intensified. Eventually, they quit their jobs in Paris, packed only the {{7}} (essential) into lightweight backpacks, and accepted that the road ahead would last well over a year. Their {{8}} (plan) route would stretch roughly 13, 000 kilometers, pass through 16 countries, and end in Shanghai.\nChina, which they entered on Sept 13 after a yearlong journey across Central Asia, marked {{9}} milestone, not just in geographical terms, but emotionally. By the time they arrived in Lanzhou, the capital city of Northwest China’s Gansu province, they had been on the road {{10}} (explore) China for about 450 days.","questions":[{"n":1,"no":56,"answer":"on","answerText":"on","explanation":"考查介词。具体到某一天的早上用介词 on，故填 on。","tag":"介词"},{"n":2,"no":57,"answer":"feels","answerText":"feels","explanation":"考查时态与主谓一致。主语 China 是单数，此处陈述一般事实，用一般现在时，故填 feels。","tag":"时态/主谓一致"},{"n":3,"no":58,"answer":"that","answerText":"that","explanation":"考查定语从句。先行词是 The idea，从句缺主语，用关系代词 that（或 which），故填 that。","accept":["which"],"tag":"定语从句"},{"n":4,"no":59,"answer":"being stuck","answerText":"being stuck","explanation":"考查非谓语动词。介词 of 后接动名词，stick 与逻辑主语是被动关系，故填 being stuck。","tag":"非谓语动词"},{"n":5,"no":60,"answer":"environmentally","answerText":"environmentally","explanation":"考查词性转换。修饰形容词 friendly 需要副词，environmental 的副词形式是 environmentally，故填 environmentally。","tag":"词性转换"},{"n":6,"no":61,"answer":"were studied","answerText":"were studied","explanation":"考查时态与语态。与 researched、intensified 并列构成省略结构，Maps 与 study 是被动关系且表示已完成的准备，故填 were studied。","tag":"语态/时态"},{"n":7,"no":62,"answer":"essentials","answerText":"essentials","explanation":"考查名词单复数。the 后接复数名词表示必需品，essential 可作名词，故填 essentials。","tag":"名词辨析"},{"n":8,"no":63,"answer":"planned","answerText":"planned","explanation":"考查非谓语动词。修饰名词 route 需要形容词，plan 的过去分词 planned 表示计划好的，故填 planned。","tag":"非谓语动词"},{"n":9,"no":64,"answer":"a","answerText":"a","explanation":"考查冠词。milestone 是可数名词单数，此处泛指一个里程碑，用不定冠词 a，故填 a。","tag":"冠词"},{"n":10,"no":65,"answer":"to explore","answerText":"to explore","explanation":"考查非谓语动词。此处用不定式作目的状语，表示在路上行走是为了探索中国，故填 to explore。","tag":"非谓语动词"}],"_source":"raw\\jx\\404.pdf"}]},{"id":"2026-浙江省强基联盟高三下学期3月联考","year":2026,"paperName":"浙江省强基联盟高三下学期3月联考","kind":"mock","items":[{"id":"cloze-2026-浙江省强基联盟高三下学期3月联考-01","type":"cloze","no":41,"score":15,"scorePerBlank":1,"instruction":"阅读下面短文，从每题所给的A、B、C、D四个选项中选出最佳选项。","passage":"I had many adventures as a child, but one stands out on the local football pitch at Pacaembu, Brazil, the legendary cradle of football geniuses.\nI was {{1}} my team when our goalkeeper got injured. No one else volunteered, so I {{2}} reluctantly, never having tried the position before. I felt {{3}} in the unfamiliar spot. Soon, a striker broke through and I dived to {{4}} his shot. His boot caught me right in the face in the {{5}}. The cut was deep and blood was everywhere.\nI had no money for a taxi and was too embarrassed to get on a bus with a {{6}} face. I asked a friend for a {{7}} on his bicycle, but the bridge on our way was too steep for him to pedal with my {{8}}. I had to walk the rest of the way, {{9}} my heavy kitbag. People gaped at my face in shock, but I kept moving. The long walk home felt like a lonely march of {{10}}.\nWhen I finally arrived, my grandmother treated the wound with warm turmeric. Seeing my downcast eyes, she whispered, “The mark on your face isn ’t a sign of failure, but a proof of your {{11}}. You stood where others wouldn’t.” Her words {{12}} me faster than the medicine.\nThat wasn’t the only time I got hurt on those overused pitches. Injuries were frequent, but they {{13}} me for the struggles ahead. Over time, I realized the scar became a medal of {{14}}, a symbol of pride 试题卷 第 7 页 / 共 8 页 (www.jxenglish.com) and courage. It taught me being a sportsman meant {{15}} every ball life throws without fear.","questions":[{"n":1,"no":41,"options":["following","captaining","inviting","observing"],"answer":"B","answerText":"captaining","explanation":"考查动词辨析。句意：我们队守门员受伤时，我正在担任队长。A. following 跟随；B. captaining 担任队长；C. inviting 邀请；D. observing 观察。守门员受伤后由我补位，说明我在队中担着领导角色，故选B。","tag":"动词辨析"},{"n":2,"no":42,"options":["cheered up","called out","stepped up","dropped out"],"answer":"C","answerText":"stepped up","explanation":"考查动词短语辨析。句意：没人自愿，于是我勉强站了出来。A. cheered up 振作；B. called out 呼喊；C. stepped up 挺身而出；D. dropped out 退出。前句说无人自愿，故我主动顶上，故选C。","tag":"动词短语"},{"n":3,"no":43,"options":["uneasy","impatient","ashamed","distracted"],"answer":"A","answerText":"uneasy","explanation":"考查形容词辨析。句意：待在这个陌生的位置上，我感到不安。A. uneasy 不安的；B. impatient 不耐烦的；C. ashamed 羞愧的；D. distracted 分心的。unfamiliar spot 与从未试过该位置都提示心里没底，故选A。","tag":"形容词辨析"},{"n":4,"no":44,"options":["record","watch","stop","avoid"],"answer":"C","answerText":"stop","explanation":"考查动词辨析。句意：很快一名前锋突破防线，我扑过去挡他的射门。A. record 记录；B. watch 观看；C. stop 挡住；D. avoid 避免。守门员鱼跃扑救的目的是把球挡出，故选C。","tag":"动词辨析"},{"n":5,"no":45,"options":["distance","fight","team","crash"],"answer":"D","answerText":"crash","explanation":"考查名词辨析。句意：在相撞的一瞬间，他的球鞋正好踢在我脸上。A. distance 距离；B. fight 打斗；C. team 队伍；D. crash 碰撞。in the crash 指扑救时两人猛烈相撞的那一刻，故选D。","tag":"名词辨析"},{"n":6,"no":46,"options":["muddy","sweaty","sunburnt","bloodied"],"answer":"D","answerText":"bloodied","explanation":"考查形容词辨析。句意：满脸是血，我不好意思去坐公交。A. muddy 沾泥的；B. sweaty 出汗的；C. sunburnt 晒伤的；D. bloodied 沾血的。上文说伤口很深、血到处都是，故脸上是血，故选D。","tag":"形容词辨析"},{"n":7,"no":47,"options":["favor","lift","seat","chance"],"answer":"B","answerText":"lift","explanation":"考查名词辨析。句意：我请朋友用他的自行车捎我一段。A. favor 恩惠；B. lift 捎带、搭车；C. seat 座位；D. chance 机会。ask sb for a lift 意为请人捎一程，与 on his bicycle 搭配，故选B。","tag":"名词辨析"},{"n":8,"no":48,"options":["weight","quality","height","strength"],"answer":"A","answerText":"weight","explanation":"考查名词辨析。句意：路上那座桥太陡，带着我的重量他蹬不上去。A. weight 重量；B. quality 品质；C. height 身高；D. strength 力气。自行车载人时增加的是重量，故选A。","tag":"名词辨析"},{"n":9,"no":49,"options":["packing","displaying","dragging","raising"],"answer":"C","answerText":"dragging","explanation":"考查动词辨析。句意：剩下的路我只能自己走，还拖着沉重的运动包。A. packing 打包；B. displaying 展示；C. dragging 拖、拽；D. raising 举起。heavy kitbag 与独自步行的疲惫说明是费力地拖着，故选C。","tag":"动词辨析"},{"n":10,"no":50,"options":["defeat","silence","pressure","regret"],"answer":"A","answerText":"defeat","explanation":"考查名词辨析。句意：漫长的回家路像一场孤独的败退。A. defeat 失败、败退；B. silence 沉默；C. pressure 压力；D. regret 后悔。受伤、没钱坐车、被迫步行，作者当时充满挫败感，故选A。","tag":"名词辨析"},{"n":11,"no":51,"options":["honesty","cooperation","responsibility","discipline"],"answer":"C","answerText":"responsibility","explanation":"考查名词辨析。句意：你脸上的印记不是失败的标志，而是你担起责任的证明。A. honesty 诚实；B. cooperation 合作；C. responsibility 责任；D. discipline 纪律。别人不愿顶的位置我顶了，体现的是责任感，故选C。","tag":"名词辨析"},{"n":12,"no":52,"options":["changed","moved","inspired","healed"],"answer":"D","answerText":"healed","explanation":"考查动词辨析。句意：她的话比药还更快地治愈了我。A. changed 改变；B. moved 感动；C. inspired 激励；D. healed 治愈。than the medicine 提示与之比较的是疗效，故选D。","tag":"动词辨析"},{"n":13,"no":53,"options":["reminded","forced","protected","hardened"],"answer":"D","answerText":"hardened","explanation":"考查动词辨析。句意：受伤是常事，但它们让我为未来的困难做好准备。A. reminded 提醒；B. forced 强迫；C. protected 保护；D. hardened 使坚强。but 表转折，说明伤病反而磨炼了我，故选D。","tag":"动词辨析"},{"n":14,"no":54,"options":["honor","hope","peace","trust"],"answer":"A","answerText":"honor","explanation":"考查名词辨析。句意：那道疤成了一枚荣誉奖章，是骄傲与勇气的象征。A. honor 荣誉；B. hope 希望；C. peace 和平；D. trust 信任。与 medal 及 pride and courage 并列，强调的是荣誉，故选A。","tag":"名词辨析"},{"n":15,"no":55,"options":["attacking","braving","gathering","predicting"],"answer":"B","answerText":"braving","explanation":"考查动词辨析。句意：运动员意味着无畏地迎接生活抛来的每一个球。A. attacking 攻击；B. braving 勇敢面对；C. gathering 聚集；D. predicting 预测。without fear 与 brave 对应，指勇敢迎接人生考验，故选B。","tag":"动词辨析"}],"_source":"raw\\jx\\400.pdf"},{"id":"grammar-2026-浙江强基联盟 2026 年 3 月联考-01","type":"grammar-fill","no":56,"score":15,"scorePerBlank":1.5,"instruction":"阅读下面短文，在空白处填入1个适当的单词或括号内单词的正确形式。","passage":"A Latin translation of The Tao Te Ching, {{1}} (forget) in the British Library for more than 300 years, has recently been rediscovered and published through the efforts of Misha Tadd, a scholar at Nankai University.\nTadd says, “Compared with The Analects of Confucius, which {{2}} (root) in the traditions and rules of the Spring and Autumn Period (770-476 BC), The Tao Te Ching does not involve specific names, places, {{3}} social systems.” This quality allows it to go beyond cultural boundaries and speak directly to universal human concerns.\nTadd’s connection with The Tao Te Ching began at the age of 14, when he came {{4}} an English edition in a small -town library in the United States. That chance encounter sparked {{5}} one-of-a- kind interest in Chinese culture.\nYears later, while {{6}} (study) a Latin translation of The Republic by Plato, Tadd wondered if The Tao Te Ching could also be translated into Latin. His search eventually led him to the British Library, {{7}} he discovered a Latin manuscript of the text, translated by early missionaries. He discovered parts of the manuscript were faded and {{8}} (complete), and it was not until 2022 that he obtained a full digital scan of the work. He spent a long time transcribing, comparing, and annotating the text word by word. “It requires enduring {{9}} (patient),” Tadd says.\nThe thought system of The Tao Te Ching is grounded in China, but its interpretation and influence are now {{10}} (true) global.","questions":[{"n":1,"no":56,"answer":"forgotten","answerText":"forgotten","explanation":"考查非谓语动词。translation 与 forget 是被动关系且动作已完成，用过去分词作定语，故填 forgotten。","tag":"非谓语动词"},{"n":2,"no":57,"answer":"is rooted","answerText":"is rooted","explanation":"考查固定搭配与时态。be rooted in 意为根植于，从句主语 which 指 The Analects，是单数，用一般现在时，故填 is rooted。","tag":"时态/固定搭配"},{"n":3,"no":58,"answer":"or","answerText":"or","explanation":"考查连词。否定句中并列成分用 or 连接，故填 or。","tag":"连词"},{"n":4,"no":59,"answer":"across","answerText":"across","explanation":"考查介词短语。come across 意为偶然发现，故填 across。","tag":"介词"},{"n":5,"no":60,"answer":"a","answerText":"a","explanation":"考查冠词。interest 是可数名词单数，one-of-a-kind 以辅音音素开头，用不定冠词 a，故填 a。","tag":"冠词"},{"n":6,"no":61,"answer":"studying","answerText":"studying","explanation":"考查非谓语动词。while 引导时间状语，主语 he 与 study 是主动关系，用现在分词，故填 studying。","tag":"非谓语动词"},{"n":7,"no":62,"answer":"where","answerText":"where","explanation":"考查定语从句。先行词是地点 the British Library，从句成分完整，用关系副词 where，故填 where。","tag":"定语从句"},{"n":8,"no":63,"answer":"incomplete","answerText":"incomplete","explanation":"考查构词法。与 faded 并列且表示残缺，complete 加否定前缀 in- 构成 incomplete，故填 incomplete。","tag":"词性转换"},{"n":9,"no":64,"answer":"patience","answerText":"patience","explanation":"考查词性转换。形容词 enduring 后接名词，patient 的名词形式是 patience，故填 patience。","tag":"词性转换"},{"n":10,"no":65,"answer":"truly","answerText":"truly","explanation":"考查词性转换。修饰形容词 global 需要副词，true 的副词形式是 truly，故填 truly。","tag":"词性转换"}],"_source":"raw\\jx\\400.pdf"}]},{"id":"2026-浙江省绍兴市诸暨市高三5月适应性考试","year":2026,"paperName":"浙江省绍兴市诸暨市高三5月适应性考试","kind":"mock","items":[{"id":"cloze-2026-浙江省绍兴市诸暨市高三5月适应性考试-01","type":"cloze","no":41,"score":15,"scorePerBlank":1,"instruction":"阅读下面短文，从每题所给的A、B、C、D四个选项中选出最佳选项。","passage":"When you’ re at high school, the littlest things can feel like a pretty big deal: {{1}} a deadline, failing an exam, or even getting a big pimple(粉刺) on the face.\nEnter my mum, with her words of wisdom:“You don’t want to {{2}} at high school.”\nI recall thinking the woman wasn ’t well. Of course you want to be the {{3}} kid in your class.\nEvery time I had a {{4}}, Mum would repeat her advice. Sometimes it was {{5}} by “none of this is going to mean anything to you in ten years’ time” or “you will {{6}} this one day.”\nI am uncertain of the exact moment when her words {{7}} for me, but they did. I think what Mum was trying to say was that there ’s no fun in having everything sorted out at high school. It ’s a {{8}}, but it’s meant to be. Your skin will {{9}}, and your grades don’t mean all that much once you start working. Once you ’ re out of high school, you will see the world, and you will realize just how {{10}} you are in it.\nBut that’s a good thing. Those little-but-huge things become {{11}} things. They really do mean nothing ten years later, and you really do laugh about them.\nIn all, those years of high school are just a {{12}} to the rest of your life. If you peak at that point, how can you go forward?\nMum’s advice still guides the 28-year-old me, although in a {{13}} way. I no longer look at life as an {{14}} hike up to a certain point. There’s no {{15}}. Rather, there are a series of peaks. Things go great and then they don’t, but there are always better days ahead.","questions":[{"n":1,"no":41,"options":["losing","breaking","missing","meeting"],"answer":"C","answerText":"missing","explanation":"考查动词辨析。A 失去；B 打破；C 错过；D 赶上。missing a deadline 指错过截止日期，与考试不及格同属烦心事，故选C。","tag":"动词辨析"},{"n":2,"no":42,"options":["peak","shine","fail","struggle"],"answer":"A","answerText":"peak","explanation":"考查动词辨析。A 达到顶峰；B 闪耀；C 失败；D 挣扎。peak 与后文 If you peak at that point、There's no summit 呼应，指别在高中就到顶峰，故选A。","tag":"动词辨析"},{"n":3,"no":43,"options":["easy-going","hard-working","good-looking","best-performing"],"answer":"D","answerText":"best-performing","explanation":"考查形容词辨析。A 随和的；B 勤奋的；C 好看的；D 表现最好的。当时作者认为当然想做班里 best-performing 最出色的孩子，故选D。","tag":"形容词辨析"},{"n":4,"no":44,"options":["dilemma","victory","collapse","panic"],"answer":"C","answerText":"collapse","explanation":"考查名词辨析。A 两难；B 胜利；C 崩溃；D 恐慌。由前文错过截止日期、考试不及格等挫折可知，每 ons":["absorbed in","skilled at","used to","concerned about"],"answer":"A","answerText":"absorbed in","explanation":"考查动词短语辨析。A 专注于；B 擅长；C 习惯于；D 担心。be absorbed in doing 指专注于做某事，写出他沉浸于美景的状态，故选A。","tag":"动词短语"},{"n":6,"no":46,"options":["greet","answer","approach","notice"],"answer":"D","answerText":"notice","explanation":"考查动词辨析。A 问候；B 回答；C 接近；D 注意到。写得太投入，直到老师清嗓子才发现他，not notice 指没注意到，故选D。","tag":"动词辨析"},{"n":7,"no":47,"options":["approval","criticism","sympathy","encouragement"],"answer":"B","answerText":"criticism","explanation":"考查名词辨析。A 赞许；B 批评；C 同情；D 鼓励。被叫到讲台前本以为要挨 criticism，instead 却得到诗集，故选B。","tag":"名词辨析"},{"n":8,"no":48,"options":["finished","analyzed","published","graded"],"answer":"C","answerText":"published","explanation":"考查动词辨析。A 完成；B 分析；C 发表；D 评分。Keep going 鼓励他坚持，作品未来会 published（发表），与后文冰岛尊重作家呼应，故选C。","tag":"动词辨析"},{"n":9,"no":49,"options":["suffered","ended","continued","shifted"],"answer":"D","answerText":"shifted","explanation":"考查动词辨析。A 受损害；B 结束；C 继续；D 转变。从那天起他与冰岛的关系 shifted，发生了变化，下文投入读冰岛小说可证，故选D。","tag":"动词辨析"},{"n":10,"no":50,"options":["belonging","wisdom","patience","kindness"],"answer":"A","answerText":"belonging","explanation":"考查名词辨析。A 归属感；B 智慧；C 耐心；D 善意。与 friendship 并列，指在异乡找到友谊和 belonging 归属感，故选A。","tag":"名词辨析"},{"n":11,"no":51,"options":["trust","envy","ignore","respect"],"answer":"D","answerText":"respect","explanation":"考查动词辨析。A 信任；B 羡慕；C 忽视；D 尊重。后文称每十人就有一人出书，可见冰岛人 respect 尊重作家，故选D。","tag":"动词辨析"},{"n":12,"no":52,"options":["secretly","coldly","proudly","hopefully"],"answer":"C","answerText":"proudly","explanation":"考查副词辨析。A 私下地；B 冷淡地；C 自豪地；D 满怀希望地。朋友以祖国是作家之国为荣，故用 proudly 修饰 told，故选C。","tag":"副词辨析"},{"n":13,"no":53,"options":["teacher","writer","editor","traveler"],"answer":"B","answerText":"writer","explanation":"考查名词辨析。A 教师；B 作家；C 编辑；D 旅行者。虚拟语气：要不是冰岛，作者不会成为 writer，与全文写作主线一致，故选B。","tag":"名词辨析"},{"n":14,"no":54,"options":["renewed","shook","showed","maintained"],"answer":"A","answerText":"renewed","explanation":"考查动词辨析。A 重建；B 动摇；C 展示；D 保持。renewed my confidence 指重拾对写作价值的信心，故选A。","tag":"动词辨析"},{"n":15,"no":55,"options":["dream","choice","inspiration","destination"],"answer":"C","answerText":"inspiration","explanation":"考查名词辨析。A 梦想；B 选择；C 灵感；D 目的地。她的群山始终是作者的 inspiration 灵感来源，故选C。","tag":"名词辨析"}],"_source":"raw\\jx\\409.pdf"},{"id":"grammar-2026-温州市普通高中 2026 届第二次适应性考试-01","type":"grammar-fill","no":56,"score":15,"scorePerBlank":1.5,"instruction":"阅读下面短文，在空白处填入1个适当的单词或括号内单词的正确形式。","passage":"Picture yourself as the hero in a Chinese martial-arts (武术) novel. There are two paths to improve your powers. Do you choose zhengxiu, the orthodox (正统的) one that {{1}} (typical) demands decades of practice in a cave? {{2}} do you risk xiexiu, the unorthodox way? Traditional values warn against those who cheat {{3}} (establish) systems. But xiexiu has acquired a life among certain youngsters. It now represents a {{4}} (depart) from the proper way: more efficient, more creative or simply less bound by convention. In recent months, videos with the term {{5}} (draw) billions of views on social media. Some are just rebranded life tricks, such as learning English through fan fiction. Others turn into the absurd (荒谬的): reading advanced mathematics {{6}} a sleep aid.\nMany young adults see xiexiu as a middle path between “996” office culture and “lying flat”. An unstable economy, rising housing costs and shaky job {{7}} (prospect) have already made the path through adulthood more uncertain. So why not turn to xiexiu?\nLast month, Guangming Daily declared the trend {{8}} cheerful way for the young to deal with uncertainty and gain initiative. It stopped short of calling it a fight against authority, instead {{9}} (describe) it as “a way to seek improvement”. “Xiexiu isn’t really about teaching you cooking methods — it’s teaching you {{10}} to rethink,” reads one clear-eyed comment.","questions":[{"n":1,"no":56,"answer":"typically","answerText":"typically","explanation":"考查副词。此处修饰动词 demands，需用副词，故填 typically。","tag":"副词辨析"},{"n":2,"no":57,"answer":"Or","answerText":"Or","explanation":"考查连词。前句问是否走正修之路，本句提出另一种选择，用 Or 引导并列疑问句。","tag":"连词"},{"n":3,"no":58,"answer":"established","answerText":"established","explanation":"考查非谓语动词。systems 与 establish 是被动关系，指已确立的体系，用过去分词 established 作定语。","tag":"非谓语动词"},{"n":4,"no":59,"answer":"departure","answerText":"departure","explanation":"考查词性转换。不定冠词 a 后接名词，depart 的名词形式是 departure，意为背离。","tag":"词性转换"},{"n":5,"no":60,"answer":"have drawn","answerText":"have drawn","explanation":"考查时态。In recent months 是现在完成时标志，主语 videos 为复数，故填 have drawn。","tag":"时态"},{"n":6,"no":61,"answer":"as","answerText":"as","explanation":"考查介词。read sth. as sth. 把某物当作某物，此处用 as 表作为。","tag":"介词"},{"n":7,"no":62,"answer":"prospects","answerText":"prospects","explanation":"考查名词复数。job prospects 意为就业前景，prospect 作此义常用复数 prospects。","tag":"名词辨析"},{"n":8,"no":63,"answer":"a","answerText":"a","explanation":"考查冠词。way 是可数名词单数，此处泛指一种方式，用不定冠词 a。","tag":"冠词"},{"n":9,"no":64,"answer":"describing","answerText":"describing","explanation":"考查非谓语动词。主语 Guangming Daily 与 describe 是主动关系，用现在分词 describing 作伴随状语。","tag":"非谓语动词"},{"n":10,"no":65,"answer":"how","answerText":"how","explanation":"考查疑问副词。此处为疑问词加不定式，how to rethink 意为如何重新思考。","tag":"副词辨析"}],"_source":"raw\\jx\\409.pdf"}]},{"id":"2025-河北省名校联考高三下学期第二次模拟考试","year":2025,"paperName":"河北省名校联考高三下学期第二次模拟考试","kind":"mock","items":[{"id":"cloze-2025-河北省名校联考高三下学期第二次模拟考试-01","type":"cloze","no":41,"score":15,"scorePerBlank":1,"instruction":"阅读下面短文，从每题所给的A、B、C、D四个选项中选出最佳选项。","passage":"Toby is an old dog. He has {{1}} quite a bit and typically sticks close to home.\nOne morning, Toby’s owner Joe found Toby was {{2}}. Joe was worried sick and feared he’d {{3}} his way home. {{4}}, Toby returned home before the end of the day. He limped (跛行) down the driveway and {{5}} near the door. Joe thought the dog probably had a fight with other dogs, but felt {{6}} to see him back. In fact, the old dog {{7}} his little friend Cube, a dog living on a neighboring farm.\nThe next morning, Rob, Cube’s owner, came to tell the whole story to Joe.\nWhen Rob returned home after work, he couldn’t {{8}} Cube. Toby was there and insisted Rob {{9}} him. Toby led Rob right to Cube, who had gotten stuck. {{10}} had fallen into a hole full of tree branches and couldn’t {{11}}. As Rob worked on getting Cube free, clever Toby {{12}} by digging at the ground and pulling away the branches. Cube was finally {{13}}, but old Toby was too tired.\nLearning about the {{14}}, Joe gave courageous Toby a big hug and decided to buy him some delicious food as a special {{15}}.","questions":[{"n":1,"no":41,"options":["gone away","slowed down","hung out","turned around"],"answer":"B","answerText":"slowed down","explanation":"考查动词短语辨析。句意：托比是条老狗，它已经迟缓了不少。A. gone away 走开；B. slowed down 慢下来；C. hung out 闲逛；D. turned around 转身。由 an old dog 可知是行动变慢，故选B。","tag":"动词短语"},{"n":2,"no":42,"options":["missing","sick","hungry","afraid"],"answer":"A","answerText":"missing","explanation":"考查形容词辨析。句意：一天早上，托比的主人乔发现托比不见了。A. missing 失踪的；B. sick 生病的；C. hungry 饥饿的；D. afraid 害怕的。下句 worried sick、feared 说明狗找不到了，故选A。","tag":"形容词辨析"},{"n":3,"no":43,"options":["recalled","forgotten","shared","broken"],"answer":"B","answerText":"forgotten","explanation":"考查动词辨析。句意：乔急坏了，担心它忘了回家的路。A. recalled 回想起；B. forgotten 忘记；C. shared 分享；D. broken 打破。与 his way home 搭配表示迷路的是 forgotten，故选B。","tag":"动词辨析"},{"n":4,"no":44,"options":["Initially","Similarly","Suddenly","Thankfully"],"answer":"D","answerText":"Thankfully","explanation":"考查副词辨析。句意：庆幸的是，托比在当天结束前回到了家。A. Initially 起初；B. Similarly 同样地；C. Suddenly 突然；D. Thankfully 庆幸的是。前文担心狗走失，此处失而复归，故选D。","tag":"副词辨析"},{"n":5,"no":45,"options":["raced","collapsed","danced","jumped"],"answer":"B","answerText":"collapsed","explanation":"考查动词辨析。句意：它一瘸一拐地沿车道走来，瘫倒在门边。A. raced 飞奔；B. collapsed 瘫倒；C. danced 跳舞；D. jumped 跳起。limped 表明它十分虚弱，故选B。","tag":"动词辨析"},{"n":6,"no":46,"options":["bored","annoyed","relieved","confused"],"answer":"C","answerText":"relieved","explanation":"考查形容词辨析。句意：乔以为狗跟别的狗打了架，但看到它回来还是感到宽慰。A. bored 无聊的；B. annoyed 恼火的；C. relieved 宽慰的；D. confused 困惑的。前文 worried sick，如今狗回家，故选C。","tag":"形容词辨析"},{"n":7,"no":47,"options":["defeated","approached","rescued","examined"],"answer":"C","answerText":"rescued","explanation":"考查动词辨析。句意：事实上，这条老狗救了它的小朋友库布——邻场的一条狗。A. defeated 击败；B. approached 靠近；C. rescued 营救；D. examined 检查。下文托比带罗布去救库布，故选C。","tag":"动词辨析"},{"n":8,"no":48,"options":["control","adopt","feed","find"],"answer":"D","answerText":"find","explanation":"考查动词辨析。句意：罗布下班回家后找不到库布。A. control 控制；B. adopt 收养；C. feed 喂养；D. find 找到。下文罗布跟着托比去救狗，说明库布不见了，故选D。","tag":"动词辨析"},{"n":9,"no":49,"options":["accept","follow","raise","catch"],"answer":"B","answerText":"follow","explanation":"考查动词辨析。句意：托比就在那儿，非要罗布跟着它走。A. accept 接受；B. follow 跟随；C. raise 抚养；D. catch 抓住。下文 led Rob right to Cube 说明是跟随，故选B。","tag":"动词辨析"},{"n":10,"no":50,"options":["Cube","Toby","Joe","Rob"],"answer":"A","answerText":"Cube","explanation":"考查名词辨析（代词指代）。句意：库布掉进一个满是树枝的洞里，出不来。A. Cube 库布；B. Toby 托比；C. Joe 乔；D. Rob 罗布。掉进洞中被困的是库布，故选A。","tag":"名词辨析"},{"n":11,"no":51,"options":["speed up","lie down","give in","get out"],"answer":"D","answerText":"get out","explanation":"考查动词短语辨析。句意：库布掉进满是树枝的洞里，无法脱身。A. speed up 加速；B. lie down 躺下；C. give in 屈服；D. get out 出来。被困洞中自然是想出来，故选D。","tag":"动词短语"},{"n":12,"no":52,"options":["helped","escaped","protested","survived"],"answer":"A","answerText":"helped","explanation":"考查动词辨析。句意：罗布忙着解救库布时，聪明的托比也来帮忙，刨土、拖开树枝。A. helped 帮忙；B. escaped 逃跑；C. protested 抗议；D. survived 幸存。digging 与 pulling away 都是协助动作，故选A。","tag":"动词辨析"},{"n":13,"no":53,"options":["full","young","safe","strong"],"answer":"C","answerText":"safe","explanation":"考查形容词辨析。句意：库布终于安全了，但老托比累坏了。A. full 满的；B. young 年轻的；C. safe 安全的；D. strong 强壮的。被从洞里救出的结果是安全，故选C。","tag":"形容词辨析"},{"n":14,"no":54,"options":["truth","plan","solution","choice"],"answer":"A","answerText":"truth","explanation":"考查名词辨析。句意：得知事情真相后，乔给了勇敢的托比一个大大的拥抱。A. truth 真相；B. plan 计划；C. solution 解决办法；D. choice 选择。上文罗布来讲述 whole story，故选A。","tag":"名词辨析"},{"n":15,"no":55,"options":["source","treat","test","reminder"],"answer":"B","answerText":"treat","explanation":"考查名词辨析。句意：决定给他买些好吃的，作为特别的款待。A. source 来源；B. treat 款待；C. test 测试；D. reminder 提醒物。delicious food 与 treat 呼应，故选B。","tag":"名词辨析"}],"_source":"raw\\jx\\372.pdf"},{"id":"grammar-2025-名校联考 2025 年年级下学期第二次模拟考试-01","type":"grammar-fill","no":56,"score":15,"scorePerBlank":1.5,"instruction":"阅读下面短文，在空白处填入1个适当的单词或括号内单词的正确形式。","passage":"Copper cash (铜钱) is the general term of Chinese ancient currency made of copper which turned up in the Qin Dynasty (221 BC — 206 BC), a dynasty leaving {{1}} (vary) treasures to Chinese people, such as the Great Wall and the Terracotta Army.\nThe copper coin originated from “huan cash”, a kind of ancient copper coin with ring shape used in the Warring States Period {{2}} lasted from 475 BC to 221 BC. {{3}} (general) speaking, most of the copper coins {{4}} (be) round and there is a square hole in the center of the coin-hence there is another Chinese name called “fangkong cash” (fangkong mean square hole).\nPeople can distinguish different kinds of copper coins by the letters {{5}} (mark) on the coins.\nThese letters always refer to the royal title in different {{6}} (dynasty), such as “Qianlong Tongbao” and “Yongzheng Tongbao” in the Qing Dynasty (1616 — 1911).\nThe earliest copper coin is called “ban liang qian”, or Ban Liang coins, which emerged and began to circulate (流通) in {{7}} whole country following the foundation of the Qin Dynasty.\nBan Liang coins were more material-economical {{8}} any other coin circulating at that time and the square hole was easier {{9}} (make). This revealed that people at that time valued efficiency, which could {{10}} (see) in the wonder of the Terracotta Army as well.","questions":[{"n":1,"no":56,"answer":"various","answerText":"various","explanation":"考查词性转换。空后是名词 treasures，需用形容词作定语修饰，vary 的形容词形式为 various，意为「各种各样的」。","tag":"词性转换"},{"n":2,"no":57,"answer":"which","answerText":"which","explanation":"考查定语从句。先行词 the Warring States Period 指物，从句 lasted from 475 BC to 221 BC 缺主语，故填关系代词 which 或 that。","accept":["that"],"tag":"定语从句"},{"n":3,"no":58,"answer":"Generally","answerText":"Generally","explanation":"考查词性转换。generally speaking 为固定搭配，意为「一般来说」，此处用副词 Generally 修饰 speaking，注意句首首字母大写。","tag":"词性转换"},{"n":4,"no":59,"answer":"are","answerText":"are","explanation":"考查时态与主谓一致。主语 most of the copper coins 为复数，且陈述钱币的客观特征用一般现在时，故填 are。","tag":"时态/主谓一致"},{"n":5,"no":60,"answer":"marked","answerText":"marked","explanation":"考查非谓语动词。空前的 the letters 与 mark 是被动关系，故用过去分词 marked 作后置定语，意为「钱币上标记的字母」。","tag":"非谓语动词"},{"n":6,"no":61,"answer":"dynasties","answerText":"dynasties","explanation":"考查名词复数。different 后接可数名词复数形式，故填 dynasties，指不同朝代。","tag":"名词辨析"},{"n":7,"no":62,"answer":"the","answerText":"the","explanation":"考查冠词。此处特指「全国」，whole country 前需加定冠词，构成 the whole country 这一固定表达，故填 the。","tag":"冠词"},{"n":8,"no":63,"answer":"than","answerText":"than","explanation":"考查比较结构。空前是比较级 more material-economical，空后是 any other coin，故填 than 构成比较级结构。","tag":"比较等级"},{"n":9,"no":64,"answer":"to make","answerText":"to make","explanation":"考查非谓语动词。形容词 easier 后接不定式，构成 sth is easy to do 结构，故填 to make。","tag":"非谓语动词"},{"n":10,"no":65,"answer":"be seen","answerText":"be seen","explanation":"考查被动语态。关系代词 which 指代 efficiency，与 see 是被动关系，情态动词 could 后接动词原形，故填 be seen。","tag":"语态"}],"_source":"raw\\jx\\372.pdf"}]},{"id":"2025-national-1","year":2025,"paperName":"全国一卷（新课标Ⅰ）","kind":"real","items":[{"id":"cloze-2025-national-1-01","type":"cloze","no":38,"score":15,"scorePerBlank":1,"instruction":"阅读下面短文，从每题所给的A、B、C、D四个选项中选出最佳选项。","passage":"One August afternoon, I sat in my kitchen staring at a glass vase that hadn’t seen daylight since my wedding.\nMy husband and I had just sold our house and we were busy {{1}} the beloved home our family had spent 23 years filling up. We had decided on key items for the {{2}} we were moving to in town, donated what we could, and rented a place to {{3}} our supposedly important objects. That left a house still {{4}} with things that, while not particularly {{5}}, didn’t belong in a landfill （垃圾填埋场）.\nI took a picture of the vase and posted it online, for $10. A couple of messages came in, one wanting additional {{6}}, another asking for a price cut. As our {{7}} day drew near, I settled on a new price （$0） and reposted it. The {{8}}: “I hate this vase. Maybe you won’t.” In an instant, a woman raced into my house and left happily with the vase.\n{{9}}, I posted more. My daily posts and the {{10}} I received became a precious ray of light in the chaos of my house. Each exchange provided a chance to {{11}} the landfill and to please another person I might not otherwise have {{12}}.\nI sit in my apartment today, loving each of the {{13}} that share our small space. I take {{14}} in knowing that, somewhere nearby, someone is {{15}} something that couldn’t come with us.","questions":[{"n":1,"options":["painting over","looking around","emptying out","pulling down"],"answer":"C","answerText":"emptying out","explanation":"考查动词短语辨析。句意：我和丈夫刚刚卖掉了我们的房子，我们正忙着清空我们一家人花了 23 年时间建造的心爱的房子。A. painting over 粉刷覆盖；B. looking around 环顾四周；C. emptying out 清空；D. pulling down 拆除。根据上文 “ My husband and I had just sold our house” 和下文 “the beloved home our family had spent 23 years filling up” 可推知，此处指作者卖掉了房子，忙着清空房子里的多年来堆积的东西。故选 C。","tag":"动词短语"},{"n":2,"options":["hotel","office","cottage","apartment"],"answer":"D","answerText":"apartment","explanation":"考查名词词义辨析。句意：我们已经为即将搬到城里的公寓选定了关键物品，尽可能捐赠了能捐的东西，并租了一个地方来存放我们自认为重要的物品。A. hotel 酒店；B. office 办公室；C. cottage 小屋；D. apartment 公寓。根据文章最后一段 “I sit in my apartment today” 可推知，此处指作者一家人搬到了公寓。故选 D。","tag":"名词辨析"},{"n":3,"options":["store","display","sell","repair"],"answer":"A","answerText":"store","explanation":"考查动词词义辨析。句意：我们已经为即将搬到城里的公寓选定了关键物品，尽可能捐赠了能捐的东西，并租了一个地方来存放我们自认为重要的物品。A. store 储存；B. display 展示；C. sell 出售；D. repair 修理。根据上文 “rented a place” 以及下文 “our supposedly important objects” 可推知，此处指租地方是为了存放重要物品。故选 A。","tag":"动词辨析"},{"n":4,"options":["covered","decorated","stuffed","equipped"],"answer":"C","answerText":"stuffed","explanation":"考查形容词词义辨析。句意：这使得房子里仍然堆满了那些虽然不是特别值钱，但不应该放在垃圾填埋场的东西。A. covered 覆盖的；B. decorated 装饰的；C. stuffed 塞满的；D. equipped 配备的。根据上文 “rented a place to 3 our supposedly important objects” 以及下文 “with things” 可推知，此处指房子里仍塞满物品。故选 C。","tag":"形容词辨析"},{"n":5,"options":["conventional","valuable","complicated","tolerable"],"answer":"B","answerText":"valuable","explanation":"考查形容词词义辨析。句意：这使得房子里仍然堆满了那些虽然不是特别值钱，但不应该放在垃圾填埋场的东西。A. conventional 传统的；B. valuable 有价值的；C. complicated 复杂的；D. tolerable 可容忍的。根据上文 “while not particularly” 以及下文 “didn’t belong in a landfill” 可推知，此处指虽不贵重但不应丢弃的物品。故选 B。","tag":"形容词辨析"},{"n":6,"options":["fees","photos","receipts","models"],"answer":"B","answerText":"photos","explanation":"考查名词词义辨析。句意：有几条信息进来了，一条想要更多的照片，另一条请求降价。A. fees 费用；B. photos 照片；C. receipts 收据；D. models 模型。根据上文 “I took a picture of the vase” 及 “additional” 可推知，此处指有人索要更多照片。故选 B。","tag":"名词辨析"},{"n":7,"options":["move","pay","market","work"],"answer":"A","answerText":"move","explanation":"考查名词词义辨析。句意：随着搬家日的临近，我确定了一个新的价格（0 美元）并重新发布了它。A. move 搬家；B. pay 支付；C. market 市场；D. work 工作。根据前文搬家背景及下文 “day drew near” 可推知，此处指搬家日临近。故选 A。","tag":"名词辨析"},{"n":8,"options":["warning","request","desc_ription","reply"],"answer":"C","answerText":"desc_ription","explanation":"考查名词词义辨析。句意：描述：“ 我讨厌这个花瓶。也许你不会。” A. warning 警告；B. request 请求；C. description 描述；D. reply 回复。根据上文 “I took a picture of the vase and posted it online” 以及下文 “I hate this vase. Maybe you won’t.” 可推知，此处指是重新发布的对花瓶的描述。故选 C。","tag":"名词辨析"},{"n":9,"options":["Confused","Interested","Disappointed","Encouraged"],"answer":"D","answerText":"Encouraged","explanation":"考查形容词词义辨析。句意：受到鼓励，我发布了更多。A. Confused 困惑的；B. Interested 感兴趣的；C. Disappointed 失望的；D. Encouraged 受鼓励的。根据上文 “In an instant, a woman raced into my house and left happily with the vase.” 以及作者后文持续发帖的行为，可推知，此处指作者受到鼓舞。故选 D。","tag":"形容词辨析"},{"n":10,"options":["visits","reports","advice","money"],"answer":"A","answerText":"visits","explanation":"考查名词词义辨析。句意：我每天收到的帖子和来我家里的拜访，在我混乱的房子里变成了一束珍贵的光芒。A. visits 拜访；B. reports 报告；C. advice 建议；D. money 钱。根据上文 “In an instant, a woman raced into my house” 以及 “My daily posts” 和后文的互动，可推知，此处指去作者家里拜访。故选 A。","tag":"名词辨析"},{"n":11,"options":["remove","spare","find","check"],"answer":"B","answerText":"spare","explanation":"考查动词词义辨析。句意：每一次交换都提供了一个避免垃圾填埋的机会，也让我得以取悦另一个原本可能不会遇到的人。A. remove 移除；B. spare 省得；免去；C. find 发现；D. check 检查。根据上文语境以及下文 “the landfill” 可推知，此处指作者用免费赠送旧物来代替丢掉旧物垃圾填埋，此处 spare 引申为 “ 免去 ” 表示免得去垃圾填埋场丢东西。故选 B。","tag":"动词辨析"},{"n":12,"options":["investigated","recognized","encountered","recommended"],"answer":"C","answerText":"encountered","explanation":"考查动词词义辨析。句意：每一次交换都提供了一个避免垃圾填埋的机会，也让我得以取悦另一个原本可能不会遇到的人。A. investigated 调查；B. recognized 认出；C. encountered 遇见；D. recommended 推荐。根据上文 “another person I might not otherwise” 可推知，此处指免费赠送旧物让原本不会遇见的人感到高兴。故选 C。","tag":"动词辨析"},{"n":13,"options":["giveaways","posts","contributions","belongings"],"answer":"D","answerText":"belongings","explanation":"考查名词词义辨析。句意：今天我坐在我的公寓里，爱着我们小空间里的每一件所有物。A. giveaways 赠品；B. posts 帖子；C. contributions 贡献；D. belongings 所有物。结合语境，再根据上文 “I sit in my apartment today” 以及下文 “share our small space” 可推知，此处指现在拥有的物品。故选 D。","tag":"名词辨析"},{"n":14,"options":["joy","part","care","time"],"answer":"A","answerText":"joy","explanation":"考查名词词义辨析。句意：知道就在附近的某个地方，有人正在欣赏着这件无法随我们一起走的东西，我感到很快乐。A. joy 快乐；B. part 部分；C. care 关心；D. time 时间。结合语境，再根据上文 “loving each of the 13 that share our small space.” 以及下文 “in knowing that, somewhere nearby” 可推知，此处指作者免费赠送旧物，也从中获得了快乐。故选 A。","tag":"名词辨析"},{"n":15,"options":["anticipating","appreciating","delivering","withdrawing"],"answer":"B","answerText":"appreciating","explanation":"考查动词词义辨析。句意：知道就在附近的某个地方，有人正在欣赏着这件无法随我们一起走的东西，我感到很快乐。A. anticipating 期待；B. appreciating 欣赏；C. delivering 递送；D. withdrawing 撤回。根据上文 “I take 13 in knowing that, somewhere nearby” 以及下文 “something that couldn’t come with us” 可推知，此处指他人在欣赏这些作者带不走的，赠予的物品。故选 B。","tag":"动词辨析"}]},{"type":"grammar-fill","no":56,"scorePerBlank":1.5,"instruction":"阅读下面短文，在空白处填入1个适当的单词或括号内单词的正确形式。","passage":"An exhibition at the Jiushi Art Museum in Shanghai is featuring artwork inspired by Go, or weiqi in Chinese, {{1}} originated in China more than 4,000 years ago.\nGo is one of {{2}} earliest binary-based (基于二元的) games. The movements of the black and white pieces reflect the basic ideas of Eastern philosophy, according to Tu Ningning, who is in charge of the exhibition.\n“The exhibition brings together Go culture, cutting-edge technology and contemporary art,” says Tu. “We hope {{3}}(present) the rather abstract Go game and AI in a visual context, and initiate dialogues with minimalist art, conceptual art and expressionism.”\n“In a Go game, each move should serve a long-term goal. You try to lead the opponent into your trap and force them to follow your ‘{{4}}(guide)’ till they lose,” explains Wang Wei, a Go player among the visitors to the exhibition.\n“The players’ personalities {{5}}(reveal) during the game, and one’s weaknesses are exposed to the opponent,” she adds. “A decent winner always {{6}}(try) to beat the opponent {{7}} no more than one or two points as a gesture (姿态) of respect for the other side.”\nTu says that the balance between the black and white pieces, the beauty in the {{8}}(strategy) placement of the pieces, {{9}} the energy flow following each move inspired artists to create oil paintings, sculptures, {{10}}(digital) generated pictures and silk-screen prints for the exhibition.","questions":[{"n":1,"no":56,"hint":null,"answer":"which","answerText":"which","explanation":"考查定语从句。空处引导非限制性定语从句，先行词Go指物且在从句中作主语，用关系代词which。故填which。","tag":"定语从句"},{"n":2,"no":57,"hint":null,"answer":"the","answerText":"the","explanation":"考查冠词。earliest是形容词最高级，最高级前需用定冠词表特指。故填the。","tag":"冠词"},{"n":3,"no":58,"hint":"present","answer":"to present","answerText":"to present","explanation":"考查非谓语动词。hope后接不定式作宾语，即hope to do sth。故填to present。","tag":"非谓语动词"},{"n":4,"no":59,"hint":"guide","answer":"guidance","answerText":"guidance","explanation":"考查名词。your后需接名词，guide转换为不可数名词guidance，作follow的宾语。故填guidance。","tag":"名词辨析"},{"n":5,"no":60,"hint":"reveal","answer":"are revealed","answerText":"are revealed","explanation":"考查动词语态。主语personalities为复数，与reveal是被动关系，述一般事实用一般现在时。故填are revealed。","tag":"语态"},{"n":6,"no":61,"hint":"try","answer":"tries","answerText":"tries","explanation":"考查主谓一致。主语a decent winner为第三人称单数，描述一般事实用一般现在时。故填tries。","tag":"主谓一致"},{"n":7,"no":62,"hint":null,"answer":"by","answerText":"by","explanation":"考查介词。表示“以……之差”用by接具体数值，此处指以一两分的优势取胜。故填by。","tag":"介词"},{"n":8,"no":63,"hint":"strategy","answer":"strategic","answerText":"strategic","explanation":"考查形容词。空处修饰名词placement，需用形容词strategic作定语，strategy变形容词。故填strategic。","tag":"形容词辨析"},{"n":9,"no":64,"hint":null,"answer":"and","answerText":"and","explanation":"考查并列连词。三个并列名词短语共同作主语，最后两项之间用and连接。故填and。","tag":"连词"},{"n":10,"no":65,"hint":"digital","answer":"digitally","answerText":"digitally","explanation":"考查副词。空处修饰过去分词generated，需用副词digitally作状语，digital变副词。故填digitally。","tag":"副词辨析"}],"score":15,"id":"grammar-2025-national-1-01"}]},{"id":"2025-national-2","year":2025,"paperName":"全国二卷","kind":"real","items":[{"type":"cloze","no":26,"scorePerBlank":1,"instruction":"阅读下面短文，从每题所给的A、B、C、D四个选项中选出最佳选项。","passage":"Evelyn Donohue is a 65-year-old grandma. She only started to {{1}} seven years ago after having a {{2}} call. She’d been struggling with eating disorders and health issues, which {{3}} led her to getting surgery. After that experience, she knew that she needed to make a {{4}}. Determined to turn her life around, Ms Donohue began to work out and follow a {{5}} lifestyle, before discovering a {{6}} for weightlifting.\nSince setting out on the journey, the {{7}} lover has not only managed to {{8}} an impressive set of muscles — but also a huge following on social media.\nThe well-liked grandma regularly posts workout content, explaining there’s no {{9}} others can’t look this good. She said it was all down to some key aspects.\n“Hold on: Consider failure as a {{10}} to success and never give up. Stick to your plan, ” she said. “ {{11}} others: Lift others up on your journey. Success is sweeter when {{12}}. ” She previously explained that “you do not need to have an amazing body to exercise... the {{13}} is to feel good, not look good. ” Ms Donohue used to be laughed at for being too old to work out, but she has proved the {{14}} wrong in the best possible way and has indeed become an {{15}} for many social media users.","questions":[{"n":1,"options":["write","travel","exercise","recover"],"answer":"C","answerText":"exercise","explanation":"后文明确提到“began to work out”(开始锻炼)和“passion for weightlifting”(对举重的热情)，因此7年前开始的是exercise(锻炼)。其他选项A.write(写作)、B.travel(旅行)、D.recover(恢复)均不符合上下文。故选C。","tag":"词义辨析"},{"n":2,"options":["goodwill","timeout","long-distance","wake-up"],"answer":"D","answerText":"wake-up","explanation":"“wake-up call”是固定搭配，指“警醒事件”，与后文“经历手术后才意识到需要改变”的语境完全契合。其他选项A.goodwill(善意)、B.timeout(暂停)、C.long-distance(长途)都不符合这个语境。故选D。","tag":"固定搭配"},{"n":3,"options":["normally","ultimately","suddenly","automatically"],"answer":"B","answerText":"ultimately","explanation":"饮食失调和健康问题最终(ultimately)导致她接受手术，体现因果关系的递进。其他选项A.normally(通常)、C.suddenly(突然)、D.automatically(自动)都不如ultimately准确。故选B。","tag":"词义辨析"},{"n":4,"options":["change","fortune","wish","deal"],"answer":"A","answerText":"change","explanation":"后文“决心改变人生(turn her life around)”明确提示需要填入change(改变)。其他选项B.fortune(财富)、C.wish(愿望)、D.deal(交易)都不符合语境。故选A。","tag":"词义辨析"},{"n":5,"options":["risky","traditional","comfortable","healthy"],"answer":"D","answerText":"healthy","explanation":"与前文健康问题呼应，她开始遵循healthy lifestyle(健康生活方式)。其他选项A.risky(冒险的)、B.traditional(传统的)、C.comfortable(舒适的)都不如healthy贴切。故选D。","tag":"词义辨析"},{"n":6,"options":["demand","secret","passion","cure"],"answer":"C","answerText":"passion","explanation":"discovering a passion for...表示“发现对……的热情”，符合她爱上举重的语境。其他选项A.demand(需求)、B.secret(秘密)、D.cure(治愈)都不合适。故选C。","tag":"词义辨析"},{"n":7,"options":["peace","fitness","fun","nature"],"answer":"B","answerText":"fitness","explanation":"fitness lover表示“健身爱好者”，与全文主题一致。其他选项A.peace(和平)、C.fun(乐趣)、D.nature(自然)都不如fitness准确。故选B。","tag":"词义辨析"},{"n":8,"options":["grow","control","activate","relax"],"answer":"A","answerText":"grow","explanation":"grow muscles表示“增长肌肉”，是常见搭配。其他选项B.control(控制)、C.activate(激活)、D.relax(放松)都不如grow准确。故选A。","tag":"词义辨析"},{"n":9,"options":["need","choice","reason","difference"],"answer":"C","answerText":"reason","explanation":"there's no reason表示“没有理由”，完整句意为“没有理由别人不能看起来这么好”。其他选项A.need(需要)、B.choice(选择)、D.difference(区别)都不符合。故选C。","tag":"词义辨析"},{"n":10,"options":["green light","road block","passing mark","stepping stone"],"answer":"D","answerText":"stepping stone","explanation":"stepping stone to success表示“通往成功的垫脚石”，符合“把失败视为成功之母”的语境。其他选项A.green light(绿灯)、B.road block(路障)、C.passing mark(及格线)都不合适。故选D。","tag":"词义辨析"},{"n":11,"options":["Help","Consult","Follow","Forgive"],"answer":"A","answerText":"Help","explanation":"后文“Lift others up”(帮助他人提升)明确提示应选Help(帮助)。其他选项B.Consult(咨询)、C.Follow(跟随)、D.Forgive(原谅)都不符合。故选A。","tag":"词义辨析"},{"n":12,"options":["accepted","shared","expected","celebrated"],"answer":"B","answerText":"shared","explanation":"success is sweeter when shared表示“成功在被分享时更甜蜜”，是常见表达。其他选项A.accepted(接受)、C.expected(期待)、D.celebrated(庆祝)都不如shared贴切。故选B。","tag":"词义辨析"},{"n":13,"options":["goal","case","duty","cost"],"answer":"A","answerText":"goal","explanation":"the goal is to...表示“目标是……”，符合“感觉良好而非看起来好”的表述。其他选项B.case(情况)、C.duty(责任)、D.cost(代价)都不合适。故选A。","tag":"词义辨析"},{"n":14,"options":["instructors","admirers","beginners","doubters"],"answer":"D","answerText":"doubters","explanation":"prove the doubters wrong表示“证明怀疑者是错的”，与前文“被嘲笑太老”呼应。其他选项A.instructors(教练)、B.admirers(崇拜者)、C.beginners(初学者)都不符合。故选D。","tag":"词义辨析"},{"n":15,"options":["authority","excuse","inspiration","option"],"answer":"C","answerText":"inspiration","explanation":"become an inspiration表示“成为激励他人的榜样”，符合她激励社交媒体用户的语境。其他选项A.authority(权威)、B.excuse(借口)、D.option(选择)都不合适。故选C。","tag":"词义辨析"}],"score":15,"id":"cloze-2025-national-2-01"},{"type":"grammar-fill","no":27,"scorePerBlank":1.5,"instruction":"阅读下面短文，在空白处填入1个适当的单词或括号内单词的正确形式。","passage":"I was born and raised in Cleveland, Ohio in the United States. Yet now, I live in the countryside of Zhejiang, China with my Chinese husband and his family. {{1}} Bamboo and tea bushes（灌木）grow wild in the mountains, chickens are always free-range, and {{2}} (center) heating doesn’t exist.\nNothing in my life before prepared me {{3}} this-one to be sure, the first time I came here I never imagined I would ever feel comfortable in this area. But it’s amazing how you can adapt {{4}} learn in a new environment. Over time, I’ve found {{5}} (I) feeling extremely at home here. And in the process, I’ve experienced things that really surprise me at times. The\"sunshine scent（香味）\"of freshly sunned clothes {{6}} (be) one of them.\nGrowing up, my family and our neighbors never used clotheslines to dry clothing, denying me the chance {{7}} (discover) one of the great wonders of sunshine — the sweet\"sunshine scent\"after sunning clothes for an entire day.\nThe sun-dried clothes smell especially pleasant where I live, thanks to the {{8}} (absence) of smog and plenty of blue sky {{9}} (afternoon) with lots of fresh air.\nIf you’ve never experienced the\"sunshine scent\"from a sheet or shirt {{10}} (leave) to sun for a day, well, you’re missing out on one of life’s wonders.","questions":[{"n":1,"hint":null,"answer":"where","answerText":"where","explanation":"此处需要关系副词引导定语从句，修饰“the countryside of Zhejiang”。从句“bamboo and tea bushes grow wild...”描述乡村的自然环境，因此用“where”表示地点。故填where。","tag":"定语从句"},{"n":2,"hint":"center","answer":"central","answerText":"central","explanation":"此处修饰名词“heating”，需用形容词形式。“central heating”（集中供暖）是固定搭配，与后文“doesn't exist”（不存在）构成完整语义。故填central。","tag":"形容词辨析"},{"n":3,"hint":null,"answer":"for","answerText":"for","explanation":"“prepare sb. for sth.”是固定搭配，意为“使某人准备好应对某事”。句意为“我过去的生活从未让我为现在的生活做好准备”。故填for。","tag":"固定搭配"},{"n":4,"hint":null,"answer":"and","answerText":"and","explanation":"此处连接两个并列动词“adapt”（适应）和“learn”（学习），需用并列连词“and”。句意强调“在新环境中适应并学习”的能力。故填and。","tag":"连词"},{"n":5,"hint":"I","answer":"myself","answerText":"myself","explanation":"动词“found”后接反身代词作宾语，表示“发现自己处于某种状态”。“find oneself doing/adj.”是常见结构，此处指“我发现自己在这里感到非常自在”。故填myself。","tag":"代词"},{"n":6,"hint":"be","answer":"is","answerText":"is","explanation":"主语为单数名词短语“The sunshine scent...”，且全文使用现在时态，因此用“is”。句意为“阳光晒过的衣服的'阳光香味'就是其中之一”。故填is。","tag":"时态"},{"n":7,"hint":"discover","answer":"to discover","answerText":"to discover","explanation":"“the chance to do sth.”是固定搭配，表示“做某事的机会”。此处指“（过去）没有机会发现阳光的神奇之处”。故填to discover。","tag":"固定搭配"},{"n":8,"hint":"absence","answer":"absence","answerText":"absence","explanation":"介词“thanks to”后需接名词，且“the absence of smog”（没有雾霾）与后文“plenty of blue sky”（蓝天）构成因果关系。故填absence。","tag":"介词"},{"n":9,"hint":"afternoon","answer":"afternoons","answerText":"afternoons","explanation":"此处需复数名词表示“许多个下午”，与“lots of fresh air”（大量新鲜空气）并列，共同描述当地环境特点。故填afternoons。","tag":"连词"},{"n":10,"hint":"leave","answer":"left","answerText":"left","explanation":"过去分词“left”作后置定语，表被动，相当于“which is left”。句意为“被晾晒一天的床单或衬衫散发的'阳光香味'”。故填left。","tag":"非谓语动词/语态"}],"score":15,"id":"grammar-2025-national-2-01"}]},{"id":"2025-zhejiang-jan","year":2025,"paperName":"浙江首考","kind":"real","items":[{"id":"cloze-2025-zhejiang-jan-01","type":"cloze","no":41,"score":15,"scorePerBlank":1,"instruction":"阅读下面短文，从每题所给的A、B、C、D四个选项中选出最佳选项。","passage":"Manuela Ribeiro has a healthy addiction. It’s {{1}}. A few months ago, the 30-year-old teacher decided it was time to put her {{2}} to good use. She signed up on the website Bookalokal, and now welcomes {{3}} into her Brussels flat twice a week for dinner parties.\nRibeiro {{4}} €35 per person for what is usually a three-course meal that can last up to three hours. For Ribeiro, it has become a perfect platform for {{5}} her hobby of buying food, {{6}} new recipes and holding dinner parties.\n“It’s a great opportunity to share my passion for food and to {{7}} new people,” said Ribeiro. Sometimes she prepares traditional Brazilian dishes {{8}} her native home; other times she {{9}} dinner courses with her favorite beers.\nThe platform has enabled Ribeiro to realise her dream with a great deal of freedom, as {{10}} to a restaurant where the service is {{11}}, the menu is known in advance, and the meal is expected to be no {{12}}.\n“But it’s also a great {{13}}, for it can sometimes take days to {{14}} a single event,” Ribeiro said. “This platform is not only {{15}} for professional cooks, but also for those willing to discover new experiences.”","questions":[{"n":1,"options":["reading","traveling","cooking","teaching"],"answer":"C","answerText":"cooking","explanation":"考查名词词义辨析：句意：Manuela Ribeiro 有一种健康的癖好。那就是烹饪。A. reading 阅读；B. traveling 旅行；C. cooking 烹饪；D. teaching 教学。根据下文 “She signed up on the website Bookalokal, and now welcomes 3 into her Brussels flat twice a week for dinner parties” 可知，她现在在 Bookalokal 网站上提供晚餐聚会服务，由此推知她的嗜好是烹饪。故选 C。","tag":"名词辨析"},{"n":2,"options":["hobby","energy","education","money"],"answer":"A","answerText":"hobby","explanation":"考查名词词义辨析：句意：几个月前，这位 30 岁的老师决定是时候好好利用她的爱好了。A. hobby 爱好；B. energy 精力；C. education 教育；D. money 钱。根据上文 “Manuela Ribeiro has a healthy addiction. It’s 1.” 可知，她的爱好是烹饪，此处指好好利用她的烹饪爱好。故选 A。","tag":"名词辨析"},{"n":3,"options":["coworkers","students","relatives","strangers"],"answer":"D","answerText":"strangers","explanation":"考查名词词义辨析：句意：她在 Bookalokal 网站上注册了，现在每周两次欢迎陌生人到她布鲁塞尔的公寓来参加晚宴。A. coworkers 同事；B. students 学生；C. relatives 亲戚；D. strangers 陌生人。根据下文 “It’s a great opportunity to share my passion for food and to 7 new people” 可知，这是一个分享她对食物的热爱和结识新朋友的好机会，由此推知她欢迎陌生人到她的公寓参加晚宴。故选 D。","tag":"名词辨析"},{"n":4,"options":["pays","charges","owes","raises"],"answer":"B","answerText":"charges","explanation":"考查动词词义辨析：句意：对于通常一顿可能持续长达三个小时的三道菜的晚餐，Ribeiro 向每人收取 35 欧元。A. pays 支付；B. charges 收费；C. owes 欠；D. raises 提高，筹集。根据下文 “€35 per person for what is usually a three-course meal” 可知，这是 Manuela Ribeiro 为客人提供的晚餐的收费标准，即每人收费 35 欧元。故选 B。","tag":"动词辨析"},{"n":5,"options":["pursuing","choosing","discussing","changing"],"answer":"A","answerText":"pursuing","explanation":"考查动词词义辨析：句意：对 Ribeiro 来说，这已经成为她追求购买食材、尝试新食谱以及举办晚宴这些爱好的一个完美平台。A. pursuing 追求；B. choosing 选择；C. discussing 讨论；D. changing 改变。根据上文 “Manuela Ribeiro has a healthy addiction. It’s 1.” 可知，Manuela Ribeiro 热爱烹饪，所以此处想表达的是 “ 追求她购买食材的爱好 ”。故选 A。","tag":"动词辨析"},{"n":6,"options":["passing on","trying out","going over","taking down"],"answer":"B","answerText":"trying out","explanation":"考查动词短语辨析：句意：对 Ribeiro 来说，这已经成为她追求购买食材、尝试新食谱以及举办晚宴这些爱好的一个完美平台。A. passing on 传递；B. trying out 尝试；C. going over 复习；D. taking down 记下。根据下文 “new recipes” 可知，此处表示尝试新食谱。故选 B。","tag":"动词短语"},{"n":7,"options":["hire","help","meet","train"],"answer":"C","answerText":"meet","explanation":"考查动词词义辨析：句意：“ 这是一个分享我对食物的热情以及结识新朋友的好机会。” Ribeiro 说。A. hire 雇佣；B. help 帮助；C. meet 遇见，结识；D. train 训练。根据下文 “This platform is not only 15 for professional cooks, but also for those willing to discover new experiences.” 可知，这个平台不仅适合专业厨师，也适合那些愿意探索新体验的人，由此可推测出 Manuela Ribeiro 通过这个平台可以认识新朋友。故选 C。","tag":"动词辨析"},{"n":8,"options":["in addition to","in return for","in honor of","in line with"],"answer":"C","answerText":"in honor of","explanation":"考查介词短语辨析。句意：有时她准备传统的巴西菜肴，以纪念她的祖国；有时她会用她最喜欢的啤酒搭配晚餐。A. in addition to 除 …… 外（还）；B. in return for 作为 …… 的回报；C. in honor of 为了纪念；D. in line with 符合。根据下文 “her native home” 以及语境可知，为了纪念她的祖国，Ribeiro 会准备传统的巴西菜肴。故选 C。","tag":"介词"},{"n":9,"options":["replaces","tastes","orders","pairs"],"answer":"D","answerText":"pairs","explanation":"考查动词词义辨析：句意：有时她会按照她的家乡巴西的传统准备传统的巴西菜肴；有时她会把晚餐菜肴和她最喜欢的啤酒搭配起来。A. replaces 代替；B. tastes 品尝；C. orders 订购；D. pairs 配对，搭配。根据下文 “dinner courses with her favorite beers” 可知，此处表示用 Ribeiro 最喜欢的啤酒搭配晚餐。故选 D。","tag":"动词辨析"},{"n":10,"options":["opposed","related","subject","vital"],"answer":"A","answerText":"opposed","explanation":"考查形容词词义辨析：句意：这个平台让 Ribeiro 能够非常自由地实现她的梦想，与餐馆形成对比，在餐馆里服务是没有人情味的，菜单是提前知道的，而且人们期望用餐过程中没有惊喜。A. opposed 相反的，对立的；B. related 相关的；C. subject 受 …… 支配的；D. vital 至关重要的。根据下文 “to a restaurant where the service is” 可知，此处是将在平台上做饭和开餐厅进行对比，表示两者是相反的。故选 A。","tag":"形容词辨析"},{"n":11,"options":["invaluable","impersonal","unsuitable","unprofessional"],"answer":"B","answerText":"impersonal","explanation":"考查形容词词义辨析：句意：这个平台让 Ribeiro 能够非常自由地实现她的梦想，与餐馆形成对比，在餐馆里服务是没有人情味的，菜单是提前知道的，而且人们期望用餐过程中没有惊喜。A. invaluable 无价的；B. impersonal 没有人情味的；C. unsuitable 不合适的；D. unprofessional 不专业的。根据下文 “the menu is known in advance, and the meal is expected to be no 12 ” 可知，菜单是提前知道的，而且饭菜没有什么惊喜，说明餐厅的服务是没有人情味的。故选 B。","tag":"形容词辨析"},{"n":12,"options":["surprise","end","need","problem"],"answer":"A","answerText":"surprise","explanation":"考查名词词义辨析：句意：这个平台让 Ribeiro 能够非常自由地实现她的梦想，与餐馆形成对比，在餐馆里服务是没有人情味的，菜单是提前知道的，而且人们期望用餐过程中没有惊喜。A. surprise 惊喜；B. end 结束；C. need 需要；D. problem 问题。根据上文 “the menu is known in advance” 可知，菜单是提前知道的，由此推知饭菜没有什么惊喜。故选 A。","tag":"名词辨析"},{"n":13,"options":["lesson","pleasure","success","challenge"],"answer":"D","answerText":"challenge","explanation":"考查名词词义辨析：句意：“ 但这也是一个很大的挑战，因为有时组织一场活动可能需要好几天的时间。” Ribeiro 说。A. lesson 教训；B. pleasure 快乐；C. success 成功；D. challenge 挑战。根据下文 “it can sometimes take days to 14 a single event” 可知，有时组织一个活动可能需要几天的时间，这是一件具有挑战性的事情。故选 D。","tag":"名词辨析"},{"n":14,"options":["celebrate","record","attend","organise"],"answer":"D","answerText":"organise","explanation":"考查动词词义辨析：句意：“ 但这也是一个很大的挑战，因为有时组织一场活动可能需要好几天的时间。” Ribeiro 说。A. celebrate 庆祝；B. record 记录；C. attend 参加；D. organise 组织。根据下文 “a single event” 可知，此处指组织一个活动。故选 D。","tag":"动词辨析"},{"n":15,"options":["selected","reserved","evaluated","requested"],"answer":"B","answerText":"reserved","explanation":"考查动词词义辨析：句意：“ 这个平台不仅是为专业厨师保留的，也是为那些愿意发现新体验的人准备的。” A. selected 选择；B. reserved 保留；C. evaluated 评估；D. requested 请求。根据下文 “for professional cooks, but also for those willing to discover new experiences” 可知，这个平台不仅为专业厨师保留，而且也为那些愿意发现新体验的人保留，应用 be reserved for。故选 B。","tag":"动词辨析"}]},{"type":"grammar-fill","no":56,"scorePerBlank":1.5,"instruction":"阅读下面短文，在空白处填入1个适当的单词或括号内单词的正确形式。","passage":"The price of fashion — economically and environmentally — has led to the rise of {{1}} new way of dressing, and it’s beginning to take off in Australia, too. As people now choose to wear more clothes fewer {{2}}(time), clothing rental services have become increasingly popular.\n\n“I think it’s an amazing idea,” says Tanya Perilli, who owns a clothing rental shop. “Customers today look past the fact that something is secondhand and focus instead {{3}} the fact that they have something unique to wear {{4}} are not overstuffing their own wardrobes (衣柜) or contributing to landfill.”\n\nTanya’s shop offers fashion clothes for women {{5}}(rent) rather than purchase them outright, providing a less expensive {{6}}(solve) to one-time event dressing. The concept {{7}}(be) certainly not new — men have been renting good suits for decades — but for female shoppers, it is just taking off. This clothing-as-service model follows the broader societal movement towards shared economies.\n\nTanya is also looking beyond special-occasion dresses to less formal clothing, {{8}} she plans to package as capsule wardrobes and offer to travellers, such as those headed to weddings abroad, with a longer-term rental period. “I really want to make this work for {{9}}(people) lives today, and I know that doesn’t always mean {{10}}(return) a dress on the Monday after a special weekend,” she says.","questions":[{"n":1,"no":56,"hint":null,"answer":"a","answerText":"a","explanation":"考查冠词。way为可数名词，此处泛指一种新的穿衣方式，new以辅音音素开头。故填a。","tag":"冠词"},{"n":2,"no":57,"hint":"time","answer":"times","answerText":"times","explanation":"考查名词的数。time表示次数时为可数名词，前有fewer修饰，需用复数。故填times。","tag":"名词辨析"},{"n":3,"no":58,"hint":null,"answer":"on","answerText":"on","explanation":"考查介词。focus on意为关注、聚焦于，是固定搭配。故填on。","tag":"介词"},{"n":4,"no":59,"hint":null,"a ngers 危险；B. events 事件；C. opponents 对手；D. challenges 挑战。根据前文 “The 10: The roads there went through large valleys where I’d be riding uphill for miles at a time.” 可知，作者要骑上坡好几英里，这对他来说是一个挑战。故选 D 项。","tag":"名词辨析"},{"n":12,"options":["passed","convinced","admired","stopped"],"answer":"A","answerText":"passed","explanation":"考查动词词义辨析。句意：。那天，我被大约 100 个习惯了这种道路的 “ 当地 ” 骑自行车的人超过了。A. passed 超过；B. convinced 说服；C. admired 欣赏；D. stopped 阻止。根据前文 “I’d never faced such 11.” 可知，作者骑上坡好几英里是个挑战，所以是被很多人超过。故选 A 项。","tag":"动词辨析"},{"n":13,"options":["reliable","convenient","familiar","appealing"],"answer":"D","answerText":"appealing","explanation":"考查形容词词义辨析。句意：当我回到家，突然骑自行车似乎不那么吸引人了。A. reliable 可信赖的；B. convenient 方便的；C. familiar 熟悉的；D. appealing 吸引人的。根据前文 “That day, I got 12 by about 100 “local” bikers who were used to such roads.” 可知，作者那天骑行被 100 多人超过，所以此时是觉得骑自行车似乎不那么吸引人了。故选 D 项。","tag":"形容词辨析"},{"n":14,"options":["traveled","matured","missed","worried"],"answer":"B","answerText":"matured","explanation":"考查动词词义辨析。句意：从那以后我成熟了很多。A. traveled 旅行；B. matured （情感和认识） 成熟；C. missed 思念；D. worried 担心。根据后文 “I’ve come to accept that whatever 15 I set for myself, they just have to be my own.” 可知，作者不再轻易放弃，所以是成熟了很多。故选 B 项。","tag":"动词辨析"},{"n":15,"options":["limits","dates","goals","tests"],"answer":"C","answerText":"goals","explanation":"考查名词词义辨析。句意：我已经开始接受这样一个事实：无论我为自己设定什么目标，它们都必须是我自己的。A. limits 限制；B. dates 日期；C. goals 目标；D. tests 测试。根据后文 “I set for myself, they just have to be my own.” 可知，此处应是 “ 无论我为自己设定什么目标，它们都必须是我自己的 ”，符合语境。故选 C 项。","tag":"名词辨析"}]},{"type":"grammar-fill","no":56,"scorePerBlank":1.5,"instruction":"阅读下面短文，在空白处填入1个适当的单词或括号内单词的正确形式。","passage":"Heatherwick Studio recently built a greenhouse at the edge of the National Trust’s Woolbeding Gardens. This beautiful structure, named Glasshouse, is at the centre of a new garden that shows how the Silk Road influences English gardens even in modern times.\n\nThe latest {{1}}(engineer) techniques are applied to create this protective {{2}}(function)

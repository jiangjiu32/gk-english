t":"bent down","explanation":"考查动词短语辨析。句意：然后 Bailey 弯下腰，让 Lenoue 爬到她的背上，一路背着她走到终点线，然后又走了 300 英尺，到 Lenoue 接受治疗的地方。A. went away 离开；B. stood up 站起来；C. stepped aside 让路；D. bent down 弯腰。根据下文 “let Lenoue climb onto her back” 可知，Bailey 弯下腰，让勒诺爬到她的背上。故选 D。","tag":"动词短语"},{"n":8,"options":["medical","public","constant","equal"],"answer":"A","answerText":"medical","explanation":"考查形容词词义辨析。句意：然后 Bailey 弯下腰，让 Lenoue 爬到她的背上，一路背着她走到终点线，然后又走了 300 英尺，到 Lenoue 接受治疗的地方。A. medical 医疗的；B. public 公众的；C. constant 持续不断的；D. equal 平等的。根据上文 “began crying in pain” 可知，Danielle Lenoue 很疼，所以是要接受治疗，medical attention 意为 “ 医疗救助 ”。故选 A。","tag":"形容词辨析"},{"n":9,"options":["interrupted","assessed","identified","appreciated"],"answer":"B","answerText":"assessed","explanation":"考查动词词义辨析。句意：Lenoue 在那里接受了检查，后来被送往医院，在那里她得知自己的一个膝盖受了重伤。A. interrupted 打断；B. assessed 评估；C. identified 识别；D. appreciated 感激。根据下文 “later taken to a hospital” 可知，她是先接受了检查，再被送往医院，也就是先接受评估。故选 B。","tag":"动词辨析"},{"n":10,"options":["hunger","pain","cold","tiredness"],"answer":"B","answerText":"pain","explanation":"考查名词词义辨析。句意：如果没有 Bailey 的帮助，她可能会在极度的痛苦中挣扎着到达那个援助检查站。A. hunger 饥饿；B. pain 疼痛；C. cold 感冒；D. tiredness 疲劳。根据第 5 空前的 “began crying in pain” 可知，此处表示 “ 如果没有 Bailey 的帮助，她可能会在极度的痛苦中挣扎着到达那个援助检查站 ”。故选 B。","tag":"名词辨析"},{"n":11,"options":["worried","ashamed","confused","discouraged"],"answer":"C","answerText":"confused","explanation":"考查形容词词义辨析。句意：至于 Bailey，她更困惑的是为什么她的行为被认为是一件大事。A. worried 担心的；B. ashamed 惭愧的；C. confused 困惑的；D. discouraged 泄气的。根据下文 “I feel like I was just doing the right thing” 可知，Bailey 觉得自己只是做了正确的事情，所以她对她的行为被认为是一件大事感到困惑。故选 C。","tag":"形容词辨析"},{"n":12,"options":["game","problem","lesson","deal"],"answer":"D","answerText":"deal","explanation":"考查名词词义辨析。句意：至于 Bailey，她更困惑的是为什么她的行为被认为是一件大事。A. game 游戏；B. problem 问题；C. lesson 课；D. deal 交易，局面。根据下文 “I feel like I was just doing the right thing” 可知，Bailey 觉得自己只是做了正确的事情，所以她对她的行为被认为是一件大事感到困惑，a big deal 意为 “ 非常重要的事 ”。故选 D。","tag":"名词辨析"},{"n":13,"options":["leave","cure","bother","understand"],"answer":"A","answerText":"leave","explanation":"考查动词词义辨析。句意：我不能离开她。A. leave 离开；B. cure 治愈；C. bother 打扰；D. understand 理解。根据上文 “She was just crying” 以及 Lenoue 爬到她的背上，一路背着她走到终点线，然后又走了 300 英尺。可知，Bailey 看见 Lenoue 哭喊，所以觉得不能离开她。故选 A。","tag":"动词辨析"},{"n":14,"options":["ride","test","meet","show"],"answer":"C","answerText":"meet","explanation":"考查名词词义辨析。句意：虽然这两个年轻女子在那场体育比赛之前是陌生人，但后来她们成了朋友。A. ride 短途旅程；B. test 测试；C. meet 体育比赛；D. show 展示。根据第一段 “hundreds of runners competed in a cross-country race” 及空前的 “the two young women were strangers before” 可知，当时是一场比赛，句子表示 “ 这两个年轻女子在那场体育比赛之前是陌生人 ”。故选 C。","tag":"名词辨析"},{"n":15,"options":["secret","display","benefit","exchange"],"answer":"B","answerText":"display","explanation":"考查名词词义辨析。句意：两人都没有赢得比赛，但展示出的人类善良赢得了胜利。A. secret 秘密；B. display 展示；C. benefit 利益；D. exchange 交换。根据第二段的 “let Lenoue climb onto her back and carried her all the way to the finish line, then another 300 feet to where Lenoue could get ____8____ attention” 可知，Bailey 背着一个参赛者过终点，并背她去接受检查，这展示了人类的善良，故选 B。","tag":"名词辨析"}]},{"type":"grammar-fill","no":56,"scorePerBlank":1.5,"instruction":"阅读下面短文，在空白处填入1个适当的单词或括号内单词的正确形式。","passage":"Xiao long bao (soup dumplings), those amazing constructions of delicate dumpling wrappers, encasing hot, {{1}}(taste) soup and sweet, fresh meat, are far and away my favorite Chinese street food. The dumplings arrive steaming and dangerously hot. To eat one, you have to decide whether {{2}}(bite) a small hole in it first, releasing the stream and risking a spill (溢出), {{3}} to put the whole dumpling in your mouth, letting the hot soup explode on your tongue. Shanghai may be the {{4}}(recognize) home of the soup dumplings but food historians will actually point you to the neighboring canal town of Nanxiang as Xiao long bao’s birthplace. There you will find them prepared differently — more dumpling and less soup, and the wrappers are pressed {{5}} hand rather than rolled. Nanxiang aside, the best Xiao long bao have a fine skin, allowing them {{6}}(lift) out of the steamer basket without allowing them tearing or spilling any of {{7}}(they) contents. The meat should be fresh with {{8}} touch of sweetness and the soup hot, clear and delicious.\n\nNo matter where I buy them, one steamer is {{9}}(rare) enough, yet two seems greedy, so I am always left {{10}}(want) more next time.","questions":[{"n":1,"no":56,"hint":"taste","answer":"tasty","answerText":"tasty","explanation":"考查形容词。空处修饰名词soup，需用形容词作定语，taste的形容词形式为tasty。故填tasty。","tag":"形容词辨析"},{"n":2,"no":57,"hint":"bite","answer":"to bite","answerText":"to bite","explanation":"考查非谓语动词。decide to do sth.表示决定做某事，空处与后面to put并列作宾语。故填to bite。","tag":"非谓语动词"},{"n":3,"no":58,"hint":null,"answer":"or","answerText":"or","explanation":"考查连词。whether...or...为固定搭配，表示是……还是……。故填or。","tag":"连词"},{"n":4,"no":59,"hint":"recognize","answer":"recognized","answerText":"recognized","explanation":"考查非谓语动词。空处在名词home前作定语，recognize与home为逻辑动宾关系，用过去分词。故填recognized。","tag":"非谓语动词"},{"n":5,"no":60,"hint":null,"answer":"by","answerText":"by","explanation":"考查介词。by hand意为用手，是固定搭配，与后面rolled相对应。故填by。","tag":"介词"},{"n":6,"no":61,"hint":"lift","answer":"to be lifted","answerText":"to be lifted","explanation":"考查非谓语动词。allow sb./sth. to do结构中，them与lift out为逻辑动宾关系，用不定式被动式。故填to be lifted。","tag":"非谓语动词"},{"n":7,"no":62,"hint":"they","answer":"their","answerText":"their","explanation":"考查代词。修饰名词contents需用形容词性物主代词，they变为their。故填their。","tag":"代词"},{"n":8,"no":63,"hint":null,"answer":"a","answerText":"a","explanation":"考查冠词。a touch of意为一点点，是固定搭配，touch此处用作单数。故填a。","tag":"冠词"},{"n":9,"no":64,"hint":"rare","answer":"rarely","answerText":"rarely","explanation":"考查副词。修饰形容词enough需用副词，rare变为rarely，表示少有地。故填rarely。","tag":"副词辨析"},{"n":10,"no":65,"hint":"want","answer":"wanting","answerText":"wanting","explanation":"考查非谓语动词。leave sb. doing使某人处于某种状态，此处为被动语态，I与want为主动关系，用现在分词。故填wanting。","tag":"非谓语动词"}],"score":15,"id":"grammar-2023-national-1-01"}]},{"id":"2023-national-2","year":2023,"paperName":"新课标Ⅱ卷","kind":"real","items":[{"id":"cloze-2023-national-2-01","type":"cloze","no":21,"score":15,"scorePerBlank":1,"instruction":"阅读下面短文，从每题所给的A、B、C、D四个选项中选出最佳选项。","passage":"In April last year, I saw a post on the PNP （Pilots N Paws） website from a family in Topeka. They had to move to Virginia but they were on a very tight {{1}}. They could not afford to pay for {{2}} for their dog, Tiffy, and {{3}} wanted to take her with them.\nIt just {{4}} that I was planning another PNP flight with another pilot, Karen, who {{5}} to take Tiffy from Kansas City to Virginia. What I was to do was fly to Topeka to {{6}} Tiffy.\nWhen I met Tiffy’s owners, they seemed very {{7}}. George, the husband, was trying to be calm, but I could tell this was {{8}} for him, having to leave his dog to a {{9}} and trust that everything would {{10}}.\nAfter some goodbyes, I asked George and his wife to help me {{11}} Tiffy into the plane. I promised to take care of Tiffy and {{12}} them as soon as we got to Kansas City.\nThe flight was {{13}}, and Tiffy was a great passenger. The next day, she {{14}} with Karen and made it back to George in Virginia within a few days. He was so {{15}} and sent me a nice e-mail with pictures. It felt great to know that I had helped bring this family together again.","questions":[{"n":1,"options":["turn","budget","schedule","connection"],"answer":"B","answerText":"budget","explanation":"考查名词词义辨析。句意：他们不得不搬到弗吉尼亚，但他们的预算非常紧张。A. turn 转折点；B. budget 预算；C. schedule 时间表；D. connection 联系。根据 “They could not afford to pay for ___2___ for their dog, Tiffy,” 可知，这个家庭的预算非常紧张。故选 B。","tag":"名词辨析"},{"n":2,"options":["food","shelter","medicine","transportation"],"answer":"D","answerText":"transportation","explanation":"考查名词词义辨析。句意：他们付不起他们的狗 Tiffy 的交通费，又非常想带她一起走。A. food 食物；B. shelter 庇护；C. medicine 药；D. transportation 交通。根据 “They had to move to Virginia but they were on a very tight ___1___.” 及下文可知，这个家庭的预算非常紧张，所以付不起他们的狗 Tiffy 的交通费。故选 D。","tag":"名词辨析"},{"n":3,"options":["desperately","temporarily","secretly","originally"],"answer":"A","answerText":"desperately","explanation":"考查副词词义辨析。句意：他们付不起他们的狗 Tiffy 的交通费，又非常想带她一起走。A. desperately 非常、拼命地；B. temporarily 暂时地；C. secretly 秘密地；D. originally 起初。根据 “wanted to take her with them.” 可知，这家人非常想把狗一起带走。故选 A。","tag":"副词辨析"},{"n":4,"options":["appeared","proved","happened","showed"],"answer":"C","answerText":"happened","explanation":"考查动词词义辨析。句意：碰巧我和另一名飞行员 Karen 正在计划另一次 PNP 飞行，他主动提出要把 Tiffy 从堪萨斯城带到弗吉尼亚。A. appeared 出现；B. proved 证明；C. happened 碰巧；D. showed 展示。根据 “I was planning another PNP flight with another pilot, Karen,” 可知，碰巧的是作者和另一名飞行员正在计划另一次 PNP 飞行。故选 C。","tag":"动词辨析"},{"n":5,"options":["waited","offered","hurried","failed"],"answer":"B","answerText":"offered","explanation":"考查动词词义辨析。句意：碰巧我和另一名飞行员 Karen 正在计划另一次 PNP 飞行，他主动提出要把 Tiffy 从堪萨斯城带到弗吉尼亚。A. waited 等待；B. offered 提供、主动提出；C. hurried 匆忙；D. failed 失败。根据 “to take Tiffy from Kansas City to Virginia.” 可知，Karen 主动提出帮忙把狗 Tiffy 从堪萨斯城带到弗吉尼亚。故选 B。","tag":"动词辨析"},{"n":6,"options":["see off","look for","hand over","pick up"],"answer":"D","answerText":"pick up","explanation":"考查动词短语辨析。句意：我要做的就是飞到托皮卡去接 Tiffy。A. see off 为 …… 送行；B. look for 寻找；C. hand over 移交；D. pick up 接载。根据 “What I was to do was fly to Topeka” 和常识可知，作者需要飞到托皮卡去接 Tiffy。故选 D。","tag":"动词短语"},{"n":7,"options":["confused","nervous","annoyed","curious"],"answer":"B","answerText":"nervous","explanation":"考查形容词词义辨析。句意：当我见到 Tiffy 的主人时，他们看起来很紧张。A. confused 困惑的；B. nervous 紧张的；C. annoyed 恼怒的；D. curious 好奇的。根据 “George, the husband, was trying to be calm, but I could tell this was ___8___ for him, having to leave his dog to a ___9___ and trust that everything would ___10___.” 可知，这家人看起来有点紧张和不安。故选 B。","tag":"形容词辨析"},{"n":8,"options":["hard","fine","common","lucky"],"answer":"A","answerText":"hard","explanation":"考查形容词词义辨析。句意：丈夫 George 试着冷静下来，但我看得出来，这对他来说很难，他不得不把狗留给一个陌生人，并相信一切都会解决的。A. hard 困难的；B. fine 好的；C. common 常见的；D. lucky 幸运的。根据上文 “was trying to be calm” 以及下文 “having to leave his dog to a ___9___ and trust that everything would ___10___.” 可推知，此处指把狗留给一个陌生人对主人来说很难。故选 A。","tag":"形容词辨析"},{"n":9,"options":["coworker","passenger","stranger","neighbor"],"answer":"C","answerText":"stranger","explanation":"考查名词词义辨析。句意：丈夫 George 试着冷静下来，但我看得出来，这对他来说很难，他不得不把狗留给一个陌生人，并相信一切都会解决的。A. coworker 合作者；B. passenger 乘客；C. stranger 陌生人；D. neighbor 邻居。根据 “George, the husband, was trying to be calm, but I could tell this was ___8___ for him,” 可知，要把狗留给一个陌生人。故选 C。","tag":"名词辨析"},{"n":10,"options":["speed up","work out","come back","take off"],"answer":"B","answerText":"work out","explanation":"考查动词短语辨析。句意：丈夫 George 试着冷静下来，但我看得出来，这对他来说很难，他不得不把狗留给一个陌生人，并相信一切都会解决的。A. speed up 加速；B. work out 解决；C. come back 回来；D. take off 起飞。根据 “George, the husband, was trying to be calm, but I could tell this was ___8___ for him,” 可知，让狗的主人 George 相信一个陌生人一切都会解决好，对他来说很难。故选 B。","tag":"动词短语"},{"n":11,"options":["feed","follow","change","load"],"answer":"D","answerText":"load","explanation":"考查动词词义辨析。句意：道别之后，我让 George 和他的妻子帮我把 Tiffy 送上飞机。A. feed 喂养；B. follow 跟随；C. change 改变；D. load 装载。load into 装入。根据 “Tiffy into the plane.” 可知，作者让 George 和他的妻子帮忙把 Tiffy 装入飞机。故选 D。","tag":"动词辨析"},{"n":12,"options":["call","join","leave","serve"],"answer":"A","answerText":"call","explanation":"考查动词词义辨析。句意：我答应过会照顾好 Tiffy，一到堪萨斯城就给他们打电话。A. call 打电话；B. join 加入；C. leave 离开；D. serve 服务。根据 “as soon as we got to Kansas City.” 可知，作者承诺一到堪萨斯城就给他们打电话。故选 A。","tag":"动词辨析"},{"n":13,"options":["unnecessary","unexpected","unavoidable","uneventful"],"answer":"D","answerText":"uneventful","explanation":"考查形容词词义辨析。句意：这次飞行平安无事，Tiffy 是个很棒的乘客。A. unnecessary 没有必要的；B. unexpected 意想不到的；C. unavoidable 不可避免的；D. uneventful 太平无事的。根据 “and Tiffy was a great passenger.” 可知，这次飞行一切都平安无事。故选 D。","tag":"形容词辨析"},{"n":14,"options":["returned","fought","flew","agreed"],"answer":"C","answerText":"flew","explanation":"考查动词词义辨析。句意：第二天，她和 Karen 一起坐飞机，几天后就回到了弗吉尼亚州的 George 那里。A. returned 返回；B. fought 打仗；C. flew 飞；D. agreed 同意。根据 “It just ___4___ that I was planning another PNP flight with another pilot, Karen, who ___5___ to take Tiffy from Kansas City to Virginia.” 可知，Karen 带狗 Tiffy 飞往弗吉尼亚州。故选 C。","tag":"动词辨析"},{"n":15,"options":["thankful","generous","proud","sympathetic"],"answer":"A","answerText":"thankful","explanation":"考查形容词词义辨析。句意：他非常感激，给我发了一封很漂亮的电子邮件，并附上了照片。A. thankful 感激的；B. generous 慷慨的；C. proud 骄傲的；D. sympathetic 同情的。通读全文，再根据 “and sent me a nice e-mail with pictures.” 可推知，此处指对于作者的帮忙，George 非常感激。故选 A。","tag":"形容词辨析"}]},{"type":"grammar-fill","no":56,"scorePerBlank":1.5,"instruction":"阅读下面短文，在空白处填入1个适当的单词或括号内单词的正确形式。","passage":"Whenever I tell people that I teach English at the Berlin Zoo, I almost always get a questioning look. Behind it, the person is trying to figure out who exactly I teach…the animals?\n\nSince June 2017, right before the {{1}}(arrive) of the two new pandas, Meng Meng and Jiao Qing, I have been helping the panda keepers at the zoo to feel more comfortable and {{2}}(confidence) speaking English. And who do they speak English {{3}}?\n\nNot the pandas, even though {{4}} language used for the medical training instructions is actually English. They talk to the flood of international tourists and to {{5}}(visit) Chinese zookeepers who often come to check on the pandas, which are on loan from China. They also need to be ready to give {{6}}(interview) in English with international journalists. This is {{7}} they need an English trainer.\n\nSo, what are they learning? {{8}}(basic), how to describe a panda’s life. It’s been an honor to watch the panda programme develop {{9}} to see the pandas settle into their new home. As a little girl, I {{10}}(wish) to be a zookeeper when I grew up. Now, I’m living out that dream indirectly by helping the panda keepers do their job in English.","questions":[{"n":1,"no":56,"hint":"arrive","answer":"arrival","answerText":"arrival","explanation":"考查名词。空前有冠词the、空后是介词of，空处作before的宾语，arrive的名词形式是arrival，故填arrival。","tag":"名词辨析"},{"n":2,"no":57,"hint":"confidence","answer":"confident","answerText":"confident","explanation":"考查形容词。空处与前文comfortable并列作并列表语，需形容词，confidence的形容词形式是confident，故填confident。","tag":"形容词辨析"},{"n":3,"no":58,"hint":null,"answer":"with","answerText":"with","explanation":"考查介词。speak with sb.意为与某人交谈，此处强调双向交流，用固定搭配speak with，故填with。","tag":"介词"},{"n":4,"no":59,"hint":null,"answer":"the","answerText":"the","explanation":"考查冠词。此处特指医学训练指导所使用的语言，表示特指需用定冠词，故填the。","tag":"冠词"},{"n":5,"no":60,"hint":"visit","answer":"visiting","answerText":"visiting","explanation":"考查非谓语动词作定语。空后是名词zookeepers，需形容词性修饰语，visit的现在分词visiting意为来访的，故填visiting。","tag":"非谓语动词"},{"n":6,"no":61,"hint":"interview","answer":"interviews","answerText":"interviews","explanation":"考查名词的数。interview作give的宾语，指不止一次采访，用可数名词复数形式，故填interviews。","tag":"名词辨析"},{"n":7,"no":62,"hint":null,"answer":"why","answerText":"why","explanation":"考查表语从句。从句结构完整，且前文说明需要培训师的原因，用连接副词why引导，故填why。","tag":"名词性从句"},{"n":8,"no":63,"hint":"basic","answer":"Basically","answerText":"Basically","explanation":"考查副词。空处修饰整个句子需用副词，basic的副词形式basically位于句首首字母大写，故填Basically。","tag":"副词辨析"},{"n":9,"no":64,"hint":null,"answer":"and","answerText":"and","explanation":"考查连词。to watch the panda programme develop与to see the pandas settle为并列不定式，用and连接，故填and。","tag":"连词"},{"n":10,"no":65,"hint":"wish","answer":"wished","answerText":"wished","explanation":"考查动词时态。wish作谓语，与主语I是主动关系，由后文grew可知用一般过去时，故填wished。","tag":"时态"}],"score":15,"id":"grammar-2023-national-2-01"}]},{"id":"2022-福建泉州四校联考","year":2022,"paperName":"福建泉州四校联考","kind":"mock","items":[{"id":"cloze-2022-福建泉州四校联考-01","type":"cloze","no":41,"score":15,"scorePerBlank":1,"instruction":"阅读下面短文，从每题所给的A、B、C、D四个选项中选出最佳选项。","passage":"A former student of mine is now a teacher at my high school. She walked by me in the {{1}} this afternoon and said with a smile, “Ms. Harris, I know you love our word of the week — integrity. I heard it on the announcements this morning and I {{2}} thought of you.” I replied, “Thank you Pharen; that {{3}} me.” She went on to say, “I always {{4}} you talking to me about integrity and {{5}} and how important they were.” I {{6}} her again and she continued on down the hallway.\nAs I reflect on this {{7}}, it brings a smile to my face. Of the many {{8}} that she could associate with me, the fact that she associated the word “integrity” is important {{9}} of my influence as an educator. I believe that she connected the idea of honesty and moral character with me {{10}} the example I have set with my life.\nIt calls to mind a popular quote — “Let us not grow tired in doing {{11}}, for at the right time we will reap （得到） a harvest, if we do not give up.” I am {{12}} for a reminder today — when it seems that no one is {{13}} it — that the important values are being caught and {{14}} if I just keep “doing the right thing”. As a teacher, I know in {{15}} you cannot see the fruit of a day’s work. It is invisible and remains so, maybe for twenty years.","questions":[{"n":1,"no":41,"options":["hall","office","gallery","classroom"],"answer":"A","answerText":"hall","explanation":"根据第一段最后一句“I her again and she continued on down the hallway.”可知，在交谈过后，她继续沿着走廊走去。由此可以推断，两人是在走廊（hall）相遇的，这也是“两人在同一所学校任职”很可能会出现的场景。walk by sb.指的是“从某人身旁走过”。hall走廊；过道。注意：虽然下文出现了classroom，但这个词用在此处不符合逻辑。故选A。 42. C","tag":"词义辨析"},{"n":2,"no":42,"options":["rarely","casually","immediately","potentially"],"answer":"C","answerText":"immediately","explanation":"根据下文“She went on to say, ‘I always you talking to me about integrity and and how important they were.’”可知，作者以前向她讲过“诚实正直”的重要性，所以听到这个词，她立马（immediately）想到了作者。rarely很少，难得；casually漫不经心地；immediately立刻，马上；potentially可能地，潜在地。故选C。 43. B","tag":"词义辨析"},{"n":3,"no":43,"options":["upsets","pleases","puzzles","warns"],"answer":"B","answerText":"pleases","explanation":"作者的学生听到“诚实正直”就马上想起她，这件事自然让作者很满足（pleases）。please使满足；使高兴，与下文it brings a smile to my face意义是一致的。故选B。 44. D","tag":"词义辨析"},{"n":4,"no":44,"options":["catch","forget","keep","remember"],"answer":"D","answerText":"remember","explanation":"作者的学生听到“诚实正直”就马上想起她，说明她对作者以前谈论的一些价值观记忆深刻。所以此处表达的是“我永远记得您对我讲诚实正直与____以及它们的重要性。”remember sb. doing sth.记得某人做过某事。故选D。 45. C","tag":"词义辨析"},{"n":5,"no":45,"options":["participation","fortune","character","prejudice"],"answer":"C","answerText":"character","explanation":"根据第一段倒数第二句“...you talking to me about integrity and ”与第二段最后一句“I believe that she connected the idea of honesty and moral character with me...”可知，此空填character，是原词复现。character品质；性格。故选C。 46. B","tag":"词义辨析"},{"n":6,"no":46,"options":["comforted","thanked","believed","encountered"],"answer":"B","answerText":"thanked","explanation":"根据上文“I replied, ‘Thank you Pharen; that me.’”可知，作者已经表示过感谢，结合again一词可知，作者再次感谢了（thanked）对方。故选B。 47. A","tag":"词义辨析"},{"n":7,"no":47,"options":["interaction","negotiation","decision","cooperation"],"answer":"A","answerText":"interaction","explanation":"根据空后的“it brings a smile to my face”以及空前的“this”与“reflect on”可以推断作者思考上文描述的这件事，也就是作者与她的学生之间的这次交流（interaction）。interaction交流，互动。故选A。 48. C","tag":"词义辨析"},{"n":8,"no":48,"options":["colors","interests","words","tastes"],"answer":"C","answerText":"words","explanation":"根据上文以及本句中的“the fact that she associated the word ‘integrity’”都提到了作者的学生把“诚实正直”这个词和作者联想到一起，所以此处填words。故选C。 49. B","tag":"词义辨析"},{"n":9,"no":49,"options":["confusion","proof","exercise","wisdom"],"answer":"B","answerText":"proof","explanation":"作者的学生通过“诚实正直”这个词语联想起作者，这可以证明（proof）作者作为一个教育工作者的影响力。proof证明，证据。故选B。 50. B","tag":"词义辨析"},{"n":10,"no":50,"options":["instead of","because of","except for","regardless of"],"answer":"B","answerText":"because of","explanation":"分析上下文内容可知其构成因果关系，即“我”相信她之所以建立起这种联想是由于（because of）“我”在生活中就秉承着这样的价值观念，树立起了榜样。instead of而不是；because of由于；except for除了；regardless of不管。故选B。 51. D","tag":"词义辨析"},{"n":11,"no":51,"options":["little","nothing","wrong","good"],"answer":"D","answerText":"good","explanation":"根据“for at the right time we will reap （得到） a harvest, if we do not give up.”可知，此处指的应是做“有益的事”，good用作名词，表示“有益的事”，此处的doing good与该段倒数第二句中的“doing the right thing”是意义相近的表达。故选D。 52. C","tag":"名词辨析"},{"n":12,"no":52,"options":["helpful","faithful","grateful","delightful"],"answer":"C","answerText":"grateful","explanation":"今天发生的事引起了作者的思考，作者感激（grateful）今天发生的这样一件给作者以提醒的事。helpful有帮助的；faithful忠诚的；grateful感激的；delightful高兴的。故选C。 53. C","tag":"词义辨析"},{"n":13,"no":53,"options":["facing","questioning","getting","stealing"],"answer":"C","answerText":"getting","explanation":"该处意为：当看似没有人理解（getting）的时候。get it表示“理解；明白”，与句中的caught是近义词复现，catch在句中的意思是“领会”。故选C。 54. D","tag":"词义辨析"},{"n":14,"no":54,"options":["thrown away","called off","figured out","passed on"],"answer":"D","answerText":"passed on","explanation":"该处为并列或者递进关系，结合备选项可知，此处要表达的应该是在作者的坚持下，这些重要的价值观正在被理解并传递下去（passed on）。caught与passed on在语义上构成递进关系，并且通过文章内容“这些价值观从作者传到她的学生”来看，用passed on一词也是很准确的。throw away扔掉；call off取消；figure out弄明白；pass on传递下去。本题C选项干扰性比较大，由于figured out与caught的语义重复，相比较，D项才是最符合语境的。故选D。 55. A","tag":"连词"},{"n":15,"no":55,"options":["teaching","science","economy","communication"],"answer":"A","answerText":"teaching","explanation":"该处句意：身为一名老师，我知道在教学工作（teaching）中，你无法看到一天的工作成果。teaching一词与作者老师的职业一致。故选A。 语法填空：“无穷小亮”科普太有趣了！网友：重燃了我当科学家的梦想 Keys: 56. presents 谓语动词，客观描述常态，用一般现在时 57. The 冠词，特指 58. followers变名词复数，“粉丝，追随者” 59. him 代词宾格 60","tag":"词义辨析"}],"_source":"raw/inbox\\2022-福建省泉州四校2022-2023-47889.txt"},{"id":"grammar-2022-福建泉州四校联考-01","type":"grammar-fill","no":56,"score":15,"scorePerBlank":1.5,"instruction":"阅读下面短文，在空白处填入1个适当的单词或括号内单词的正确形式。","passage":"Deep in a rainforest in Hainan province, Zhang Chenliang picks up a daddy longlegs（长腿蜘蛛） and {{1}} （present） it to the camera, explaining its features and living habits for the benefit of viewers on a short video platform.\n{{2}} 34-year-old is an influential vlogger with expertise in animals, insects and plants, and boasts some 22 million {{3}}（follower）. His humorous expression and distinctive accent have helped {{4}}（he） carve out a career as one of the most influential Chinese creators of popular science content.\nBorn and {{5}}（raise） in Beijing, Zhang has had a deep love of nature since he was a child. He loved going to his grandmother’s home in the countryside, where the fields {{6}} （be） bursting with vegetables and reeds（芦苇）. They were also a {{7}}（nature） habitat for insects, which have always interested him.\nAfter watching one of his videos, one young woman was inspired to conduct a field trip {{8}} her own, and afterwards, applied {{9}}（study） at the Chinese Academy of Sciences hoping to become a biologist.\n\"That makes me feel that my work is worthwhile, and that {{10}} I’ve been doing is having a positive impact on young people,\"Zhang said.","questions":[{"n":1,"no":56,"answer":"presents","answerText":"presents","explanation":"主语 Zhang 是第三人称单数，且客观描述习惯性动作，用一般现在时，present → presents。","tag":"时态"},{"n":2,"no":57,"answer":"The","answerText":"The","explanation":"特指后文提到的「这位 34 岁的博主」，用定冠词 The。","tag":"冠词"},{"n":3,"no":58,"answer":"followers","answerText":"followers","explanation":"some 22 million 后接可数名词复数，follower → followers（粉丝）。","tag":"名词辨析"},{"n":4,"no":59,"answer":"him","answerText":"him","explanation":"help sb do sth 中 sb 位置用宾格，故用 him。","tag":"代词"},{"n":5,"no":60,"answer":"raised","answerText":"raised","explanation":"Born and raised 并列，raise 与逻辑主语是被动关系，用过去分词 raised（「被抚养长大」）。","tag":"非谓语动词/语态"},{"n":6,"no":61,"answer":"were","answerText":"were","explanation":"此处 be 动词要与后面的主语保持数的一致，且叙述过去的情况，故用 were。","tag":"动词辨析"},{"n":7,"no":62,"answer":"natural","answerText":"natural","explanation":"修饰名词 habitat 需用形容词，nature → natural。","tag":"形容词辨析"},{"n":8,"no":63,"answer":"of","answerText":"of","explanation":"of her own 表示「属于她自己的」，为固定搭配，故填 of。","accept":["on"],"tag":"固定搭配"},{"n":9,"no":64,"answer":"to study","answerText":"to study","explanation":"apply to do sth（申请做某事）为固定搭配，故用不定式 to study。","tag":"非谓语动词/固定搭配"},{"n":10,"no":65,"answer":"what","answerText":"what","explanation":"引导主语从句且在从句中作 doing 的宾语，用 what。","tag":"名词性从句"}],"_source":"raw/inbox\\2022-福建省泉州四校2022-2023-47889.txt"}]},{"id":"2022-湖北部分重点中学联考","year":2022,"paperName":"湖北部分重点中学联考","kind":"mock","items":[{"id":"cloze-2022-湖北部分重点中学联考-01","type":"cloze","no":41,"score":15,"scorePerBlank":1,"instruction":"阅读下面短文，从每题所给的A、B、C、D四个选项中选出最佳选项。","passage":"Passing through the Atlanta airport one morning, I caught one of those trains that take travelers to their boarding gates. The free trains run {{1}} all day long. Not many people consider them {{2}}, but I heard laughter that day. At the front of the first carriage were a man and his son who was about five years old． “Here we go! Hold on to me tightly!” the father said. “Look out there! See that pilot?\nI bet he is walking to his plane.” Hearing that, the son {{3}} his neck to look with curiosity.\nAs I {{4}}, I remembered something I’d wanted to buy. I was {{5}} for my flight, so I decided to go back. I did and just as I was about to go back to the train for my gate, I saw that the man and his son had {{6}}, too.\n“I want to ride some more!”\n“More?” the father asked, “You’re not {{7}}?”\n“Not at all. It is fun! Fun!” his son pleaded, looking into his father’s eyes {{8}}. “All right,” the father agreed, and when the door opened we all got on. I realized that the father and his son were just riding this train together, making it exciting, sharing each other’s {{9}}.\nAt this warm {{10}}, I was lost in thought. Some parents afford to send their children to study abroad alone, {{11}} they end up going on the wrong track. Some parents live in million-dollar houses and {{12}} to meet their children’s every need, even unreasonable ones. As a consequence, their children become {{13}}.\nWhat’s wrong? The answer is so simple: parents should care enough to {{14}} some time with their children, to pay attention and to try their best. It doesn’t cost a cent, but it is the most {{15}} thing in the world.","questions":[{"n":1,"no":41,"options":["here and there","now and then","back and forth","in and out"],"answer":"C","answerText":"back and forth","explanation":"考查短语辨析。机场捷运是免费的，整天「往返」运行。back and forth 来回、往返；here and there 到处；now and then 偶尔；in and out 进进出出。故选C。","tag":"动词辨析"},{"n":2,"no":42,"options":["safe","comfortable","fun","boring"],"answer":"C","answerText":"fun","explanation":"由后文 but I heard laughter 可知此处形成对比：大多数人并不觉得这列车「好玩」，可那天我却听到了笑声。fun 有趣的；safe 安全的；comfortable 舒适的；boring 无聊的。故选C。","tag":"词义辨析"},{"n":3,"no":43,"options":["stretched","broke","bowed","tapped"],"answer":"A","answerText":"stretched","explanation":"孩子好奇地伸长脖子张望。stretch one's neck 伸长脖子，是固定搭配；broke 折断、bowed 低头、tapped 轻拍都不合「好奇张望」的动作。故选A。","tag":"固定搭配"},{"n":4,"no":44,"options":["got off","got up","got away","got back"],"answer":"A","answerText":"got off","explanation":"后文 so I decided to go back 说明作者已经「下了车」，发现忘了买东西才想折回。get off 下车；get up 起身；get away 离开；get back 返回。故选A。","tag":"词义辨析"},{"n":5,"no":45,"options":["late","early","ready","thirsty"],"answer":"B","answerText":"early","explanation":"作者还能折回去买东西，是因为距自己的航班还「早」。early 早的；late 迟的；ready 准备好的；thirsty 口渴的。故选B。","tag":"词义辨析"},{"n":6,"no":46,"options":["flown","parted","returned","agreed"],"answer":"C","answerText":"returned","explanation":"作者下车又回来时，发现那对父子也已经「回来了」。return 返回；fly 飞、part 分开、agree 同意都与「再次出现」不符。故选C。","tag":"词义辨析"},{"n":7,"no":47,"options":["afraid","angry","stressed","tired"],"answer":"D","answerText":"tired","explanation":"父亲问「你还不『累』吗」，儿子回答 Not at all（一点也不）。tired 累的；afraid 害怕的；stressed 有压力的；angry 生气的。故选D。","tag":"词义辨析"},{"n":8,"no":48,"options":["eagerly","anxiously","blankly","angrily"],"answer":"A","answerText":"eagerly","explanation":"儿子恳求再坐一次，眼睛「渴望地」望着父亲。eagerly 渴望地；anxiously 焦虑地；blankly 茫然地；angrily 生气地。故选A。","tag":"词义辨析"},{"n":9,"no":49,"options":["guidance","encouragement","praise","company"],"answer":"D","answerText":"company","explanation":"父子俩只是一起坐车、把过程变得有趣，享受彼此的「陪伴」。company 陪伴；guidance 指导；encouragement 鼓励；praise 表扬。故选D。","tag":"词义辨析"},{"n":10,"no":50,"options":["word","message","scene","action"],"answer":"C","answerText":"scene","explanation":"看到这温暖的「一幕」，作者陷入沉思。scene 场景、情景；word 话语；message 信息；action 行动。故选C。","tag":"词义辨析"},{"n":11,"no":51,"options":["for","but","so","otherwise"],"answer":"B","answerText":"but","explanation":"前后为转折：「有钱送孩子出国留学」却「最终走上歪路」。but 表转折；for 表原因；so 表结果；otherwise 否则。故选B。","tag":"词义辨析"},{"n":12,"no":52,"options":["choose","expect","fail","manage"],"answer":"D","answerText":"manage","explanation":"有的父母住着豪宅，能「设法」满足孩子的一切要求。manage to do 设法做成；choose 选择；expect 期望；fail 未能（与「满足」矛盾）。故选D。","tag":"词义辨析"},{"n":13,"no":53,"options":["exhausted","thrilled","motivated","spoiled"],"answer":"D","answerText":"spoiled","explanation":"结果是孩子被「宠坏」。spoiled 被宠坏的；exhausted 疲惫的；thrilled 兴奋的；motivated 有动力的。故选D。","tag":"词义辨析"},{"n":14,"no":54,"options":["waste","spend","seize","ignore"],"answer":"B","answerText":"spend","explanation":"作者的结论：父母应当用心「花」时间陪伴孩子。spend time with sb 与某人共度时光；waste 浪费；seize 抓住；ignore 忽视。故选B。","tag":"词义辨析"},{"n":15,"no":55,"options":["valuable","admirable","unforgettable","reasonable"],"answer":"A","answerText":"valuable","explanation":"陪伴不花一分钱，却是世上最「宝贵」的东西。valuable 宝贵的；admirable 令人钦佩的；unforgettable 难忘的；reasonable 合理的。故选A。","tag":"词义辨析"}],"_source":"raw/inbox\\2022-湖北省部分重点中学2023届高三-47890.txt"},{"id":"grammar-2022-湖北部分重点中学联考-01","type":"grammar-fill","no":56,"score":15,"scorePerBlank":1.5,"instruction":"阅读下面短文，在空白处填入1个适当的单词或括号内单词的正确形式。","passage":"Digital screen time before bed can have a negative impact on the quality of your sleep. {{1}} European study found being exposed to blue light for as little as 8 minutes keeps you mentally stimulated for over one hour, {{2}} tends to throw off the body’s biological clock.\nMuch {{3}} （expose） to blue light suppresses （抑制） the production of melatonin, a hormone that induces sleepiness. Melatonin release in the evening helps you relax before bedtime. Suppression of melatonin can cause you {{4}} （stay） up later and sleep less than you normally would.\nSeeing something right before bed that either makes you upset {{5}} happy can trigger a response that extends falling sleep, which {{6}} （consequent） delays REM （rapid eye movement） sleep. These emotions can leave you {{7}} （stare） at the ceiling for hours feeling wide awake.\nStudies have also found that exciting or violent video games will increase heart rate make it even {{8}} （hard） to fall asleep, and impair sleep quality.\nA writer, named Daphne K. Lee, in 2020 {{9}} （write） about “revenge bedtime procrastination” on Twitter—a phenomenon where people who don’t have much control {{10}} their daytime life refuse to sleep early to regain some sense of freedom during late-night hours.","questions":[{"n":1,"no":56,"answer":"A","answerText":"A","explanation":"考查冠词。European 虽以元音字母开头，但读音以辅音音素 /j/ 起头，故用 a；意为「一项欧洲研究发现」。","tag":"冠词"},{"n":2,"no":57,"answer":"which","answerText":"which","explanation":"which 引导非限制性定语从句，指代前面「接触蓝光 8 分钟就兴奋一小时」这一整件事，在从句中作主语。","tag":"定语从句"},{"n":3,"no":58,"answer":"exposure","answerText":"exposure","explanation":"介词 Much 后需接名词，expose 的名词形式是 exposure（接触、暴露），且不可数。","tag":"介词"},{"n":4,"no":59,"answer":"to stay","answerText":"to stay","explanation":"cause sb to do sth（使某人做某事）为固定搭配，故用不定式 to stay。","tag":"非谓语动词/固定搭配"},{"n":5,"no":60,"answer":"or","answerText":"or","explanation":"either…or… 为固定搭配，表示「使人难过或高兴」，前后并列形容词。","tag":"固定搭配"},{"n":6,"no":61,"answer":"consequently","answerText":"consequently","explanation":"修饰谓语动词 delays，需用副词 consequently（因此、结果）。","tag":"副词辨析"},{"n":7,"no":62,"answer":"staring","answerText":"staring","explanation":"leave sb doing sth 表示「使某人处于某种状态」，stare 与 you 是主动关系，用现在分词 staring。","tag":"非谓语动词"},{"n":8,"no":63,"answer":"harder","answerText":"harder","explanation":"even 修饰形容词比较级，表示「更加困难」，故 hard → harder。","tag":"比较等级"},{"n":9,"no":64,"answer":"wrote","answerText":"wrote","explanation":"句中出现明确的过去时间 in 2020，用一般过去时 wrote。","tag":"时态"},{"n":10,"no":65,"answer":"over","answerText":"over","explanation":"考查介词。have control over 为固定搭配，意为「对……有控制权」。","tag":"介词"}],"_source":"raw/inbox\\2022-湖北省部分重点中学2023届高三-47890.txt"}]},{"id":"2022-湖北鄂东南联盟","year":2022,"paperName":"湖北鄂东南联盟","kind":"mock","items":[{"id":"cloze-2022-湖北鄂东南联盟-01","t 夫人温和善良。kind-hearted a.仁慈的，好心肠的 42. C","tag":"词义辨析"},{"n":2,"no":42,"options":["contribution","sponsor","gifts","commercial"],"answer":"C","answerText":"gifts","explanation":"姐姐和我忙着做圣诞礼物。 43. B","tag":"词义辨析"},{"n":3,"no":43,"options":["focused","dawned","concentrated","impress"],"answer":"B","answerText":"dawned","explanation":"我们突然意识到她会在圣诞节前几天出院，那到时候她到家就只能看到没有任何节日装饰的空房子了。dawn on/upon sb. 某人突然明白，意识到 44. A","tag":"词义辨析"},{"n":4,"no":44,"options":["tree","box","room","flower"],"answer":"A","answerText":"tree","explanation":"于是我们萌生了装饰一棵树小小圣诞树的想法。 45. D","tag":"词义辨析"},{"n":5,"no":45,"options":["respective","innocent","independent","brilliant"],"answer":"D","answerText":"brilliant","explanation":"我们用美术课上做的纸链和装饰物装饰了一棵小圣诞树，它非常漂亮。brilliant a.光辉灿烂的， 色彩艳丽的。 46. B","tag":"词义辨析"},{"n":6,"no":46,"options":["decoration","name","wish","birthday"],"answer":"B","answerText":"name","explanation":"我们每人在纸条上写下名字，塞进老师改装后带有小孔的鞋盒里。 47. C","tag":"词义辨析"},{"n":7,"no":47,"options":["force","remove","draw","dismiss"],"answer":"C","answerText":"draw","explanation":"到了圣诞节放假前的最后一天，她会从盒子里抽一张纸条，那个学生可以把树带回家。draw v. 抽出 48. B","tag":"词义辨析"},{"n":8,"no":48,"options":["announced","whispered","acknowledged","predicted"],"answer":"B","answerText":"whispered","explanation":"当我把折好的纸条放进盒子时，我低声对老师谁，我真的很希望赢得这棵树，因为我想把它送给我的邻居。whisper v.低声耳语 49. A","tag":"词义辨析"},{"n":9,"no":49,"options":["present","donate","sacrifice","release"],"answer":"A","answerText":"present","explanation":"present v.赠送 50. C","tag":"词义辨析"},{"n":10,"no":50,"options":["previously","initially","nervously","violently"],"answer":"C","answerText":"nervously","explanation":"开始抽签了，我紧张地屏住了呼吸，老师打开了鞋盖，一只手在盒子里转圈打乱折好的纸条， 抽出了一张。nervously adv.紧张地 51. A","tag":"词义辨析"},{"n":11,"no":51,"options":["unfolded","observed","arrested","grabbed"],"answer":"A","answerText":"unfolded","explanation":"她打开纸条，然后宣布…… unfold v.打开 52. D","tag":"词义辨析"},{"n":12,"no":52,"options":["expectation","relief","embarrassment","astonishment"],"answer":"D","answerText":"astonishment","explanation":"她看到了那棵树，起先她一脸惊讶，然后露出了甜美的笑容，接着便热泪盈眶。astonishment n. 惊讶 53. B","tag":"词义辨析"},{"n":13,"no":53,"options":["occurred to","came to","submitted to","stuck to"],"answer":"B","answerText":"came to","explanation":"许多年后，我开始意识到，我们的计划所得到的帮助可能比我们想象中的多。come to one’s mind 突然想到 54. B","tag":"词义辨析"},{"n":14,"no":54,"options":["standard","assistance","harmony","preference"],"answer":"B","answerText":"assistance","explanation":"assistance n.帮助 55. D","tag":"词义辨析"},{"n":15,"no":55,"options":["suspected","experienced","described","written"],"answer":"D","answerText":"written","explanation":"虽然老师宣布了我赢得了小树，但她从未给任何人看过那张纸条上的名字。 第二节 语法填空： 56. causing 57. completely 58. injuries 59. what 60. worn 61. as 62. to feel 63. that 64. has received 65. a 第四部分 写作（共两节, 满分 40 分） 第一节（满分 15 分） My dear fel","tag":"词义辨析"}],"_source":"raw/inbox\\2022-湖北省鄂东南省级示范高中教改联盟-47891.txt"},{"id":"grammar-2022-湖北鄂东南联盟-01","type":"grammar-fill","no":56,"score":15,"scorePerBlank":1.5,"instruction":"阅读下面短文，在空白处填入1个适当的单词或括号内单词的正确形式。","passage":"This summer, Chongqing, a city in Southwest China, faced a severe test, with a heat wave and drought {{1}} （cause） a series of wildfires since Aug 17.\nThanks to the joint efforts of rescue workers, as well as volunteers and residents, more than 10 forest fires in the city were {{2}} （complete） put out in less than 10 days, with no {{3}} （injure） or deaths reported. The world witnessed {{4}} was highly praised as “Chongqing speed” in people’s united action.\nA spectacular aerial video circulating on social media captured the heart of netizens: a stream of headlights {{5}} （wear） by rescue teams lit up the dark mountain paths, being a comparison with the red flames swallowing the mountain, which was described by netizens {{6}} a “Great Human Wall”. Zeng, 20, a college student, was one of the bricks of the “Great Human Wall” helping transport supplies to the fire scene. “‘Too busy {{7}} （feel） tired; I have to be faster’ was the only sound {{8}} was echoing in my mind,” he recalled.\nThe video {{9}} （receive） more than 100, 000 likes and shares on the platform WeChat in the past few months. The photographer said, “It’s really {{10}} hard-won success! What I want to show through the video is the ‘red rock soul’ of Chongqing people, and howChina’s young people are shaping the country’s future.”","questions":[{"n":1,"no":56,"answer":"causing","answerText":"causing","explanation":"with 复合结构：宾语 a heat wave and drought 与 cause 是主动关系，用现在分词 causing 表伴随结果。","tag":"with复合结构"},{"n":2,"no":57,"answer":"completely","answerText":"completely","explanation":"修饰动词短语 put out 需用副词，complete → completely（彻底地）。","tag":"副词辨析"},{"n":3,"no":58,"answer":"injuries","answerText":"injuries","explanation":"no 后接名词，injure 的名词形式 injuries 与后面的 deaths 并列，且用复数。","tag":"连词"},{"n":4,"no":59,"answer":"what","answerText":"what","explanation":"witnessed 后是宾语从句，从句缺主语，用 what 引导（意为「被人们称为重庆速度的那种行动」）。","tag":"名词性从句"},{"n":5,"no":60,"answer":"worn","answerText":"worn","explanation":"a stream of headlights 与 wear 是被动关系，用过去分词 worn 作后置定语（「救援队员戴着的头灯」）。","tag":"非谓语动词/语态"},{"n":6,"no":61,"answer":"as","answerText":"as","explanation":"be described as 固定搭配，「被描述为一道人墙」。","tag":"固定搭配"},{"n":7,"no":62,"answer":"to feel","answerText":"to feel","explanation":"too…to… 结构表示「太……而不能」，故用不定式 to feel（「忙得感觉不到累」）。","tag":"非谓语动词"},{"n":8,"no":63,"answer":"that","answerText":"that","explanation":"先行词 the only sound 被 only 修饰时，定语从句只能用 that 引导。","tag":"定语从句"},{"n":9,"no":64,"answer":"has received","answerText":"has received","explanation":"in the past few months 表示「在过去几个月中」，与现在完成时连用，故用 has received。","tag":"时态"},{"n":10,"no":65,"answer":"A","answerText":"A","explanation":"success 在此指「一件成功的事」，抽象名词具体化，需加不定冠词 a。","tag":"冠词"}],"_source":"raw/inbox\\2022-湖北省鄂东南省级示范高中教改联盟-47891.txt"}]}],"totalPapers":32,"totalItems":61,"totalBlanks":770,"tagged":770,"untagged":0,"builtAt":"2026-10-25T14:02:42.068Z"};</script>
<script>
'use strict';

/* ================= 状态 ================= */
const S = {
  bank: null,
  module: null,      // 'cloze' | 'grammar-fill'，所在模块
  paper: null,       // 当前试卷
  item: null,        // 当前 item
  answers: {},       // { n: raw }
  graded: false,
  sheetN: null,
  fontLarge: localStorage.getItem('gk.fontLarge') === '1',
  timer: null,       // 计时器 { startedAt, pausedMs, pausedAt, pauses }
  history: null,     // 做题记录（惰性载入）
  resultMeta: null,  // 本次成绩附加信息 { secs, pauses, level, at, from }
};

/* ================= 判分（与 engine.py 保持一致） ================= */
function norm(s) {
  if (s == null) return '';
  let t = String(s).normalize('NFKC').trim().replace(/\s+/g, ' ');
  t = t.replace(/[。.;；,，]+$/, '');
  return t.toLowerCase();
}

/** 「which/that」「of/on」这种并列答案 → ['which', 'that'] */
function splitAlt(v) {
  if (v == null) return [];
  return String(v)
    .split(/[\/／]|\s+(?:or|或)\s+/i)
    .map(s => s.trim())
    .filter(Boolean);
}

/** 一道题所有可接受的答案（去重，保留原写法） */
function correctList(q) {
  const out = [];
  for (const src of [q.answer, ...(q.accept || [])]) {
    for (const v of splitAlt(src)) {
      if (!out.some(x => norm(x) === norm(v))) out.push(v);
    }
  }
  return out;
}

/** 展示用的正确答案：并列写「which 或 that」；完形再补上选项单词 */
function answerLabel(q, withText = true) {
  const list = correctList(q);
  let text = list.join(' 或 ');
  const at = String(q.answerText || '').trim();
  const atAlts = splitAlt(at);
  const covered = atAlts.length > 0 && atAlts.every(v => list.some(x => norm(x) === norm(v)));
  if (withText && at && !covered) text += `　${at}`;
  return text;
}

function judge(q, given) {
  const g = norm(given);
  if (!g) return false;
  const allowed = new Set();
  for (const a of correctList(q)) allowed.add(norm(a));
  if (q.answerText) allowed.add(norm(q.answerText));
  if (q.options) {
    const letters = 'abcd';
    if (g.length === 1 && letters.includes(g)) {
      const idx = letters.indexOf(g);
      if (idx < q.options.length) allowed.add(norm(q.options[idx]));
    }
  }
  return allowed.has(g);
}

/* ================= 小工具 ================= */
const $ = (sel) => document.querySelector(sel);
const el = (tag, cls, text) => {
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (text != null) n.textContent = text;
  return n;
};
function toast(msg, action) {
  const t = $('#toast');
  t.textContent = '';
  t.appendChild(document.createTextNode(msg));
  if (action) {
    const b = el('button', 'toast-act', action.label);
    b.onclick = () => {
      t.classList.remove('show');
      clearTimeout(toast._t);
      action.onClick();
    };
    t.appendChild(b);
  }
  t.classList.add('show');
  clearTimeout(toast._t);
  toast._t = setTimeout(() => t.classList.remove('show'), action ? 5200 : 1600);
}
function answeredCount() {
  return S.item.questions.filter(q => norm(S.answers[q.n]) !== '').length;
}
function typeLabel(t) {
  return t === 'cloze' ? '完形填空' : '语法填空';
}

/** 来源标签：2025 全国一卷（新课标Ⅰ） -> （来源：2025 全国一卷 · 新课标Ⅰ） */
function sourceLabel(paper) {
  const name = String(paper.paperName).replace(/（(.+?)）/g, ' · $1');
  return `（来源：${paper.year} ${name}）`;
}

/* ================= 模块定义 ================= */
const MODULES = [
  { type: 'cloze', title: '完形填空', note: '15 空 · 每题 1 分 · 共 15 分', chip: '15×1' },
  { type: 'grammar-fill', title: '语法填空', note: '10 空 · 每题 1.5 分 · 共 15 分', chip: '10×1.5' },
];

/** 取出某模块下某一类（真题 / 模拟）的 [paper, item] */
function itemsOf(type, kind) {
  const rows = [];
  for (const paper of S.bank.papers) {
    if ((paper.kind || 'mock') !== kind) continue;
    for (const it of paper.items) if (it.type === type) rows.push([paper, it]);
  }
  return rows;
}

function countsOf(type) {
  return { real: itemsOf(type, 'real').length, mock: itemsOf(type, 'mock').length };
}

/** 返回上一层：答题 → 模块页，模块页 → 首页 */
function goUp() {
  if (S.module) renderModule();
  else renderHome();
}

/* ================= 首页：选模块 ================= */
async function renderHome() {
  const app = $('#app');
  app.innerHTML = '';
  S.module = null;
  if (!S.bank) {
    app.appendChild(el('div', 'page', '正在加载题库…'));
    return;
  }
  const page = el('div', 'page');
  const hero = el('div', 'hero');
  hero.appendChild(el('h2', null, '语言运用'));
  hero.appendChild(el('p', null,
    `${S.bank.totalPapers} 套卷 · ${S.bank.totalItems} 篇 · ${S.bank.totalBlanks} 空　新高考格式`));
  page.appendChild(hero);

  const sec = el('section', 'section');
  const head = el('div', 'section-head');
  head.appendChild(el('h3', null, '选择题型'));
  head.appendChild(el('span', 'section-note', '第三部分 · 共 30 分'));
  sec.appendChild(head);

  const list = el('div', 'list');
  for (const m of MODULES) {
    const c = countsOf(m.type);
    if (!c.real && !c.mock) continue;
    const card = el('button', 'card module-card');
    const main = el('div', 'paper-main');
    main.appendChild(el('b', null, m.title));
    main.appendChild(el('span', 'module-note', m.note));
    main.appendChild(el('span', 'module-count', `高考真题 ${c.real} 篇 · 各省市模拟 ${c.mock} 篇`));
    const meta = el('div', 'paper-meta');
    meta.appendChild(el('span', 'chip', m.chip));
    card.appendChild(main);
    card.appendChild(meta);
    card.appendChild(el('span', 'module-arrow', '›'));
    card.onclick = () => openModule(m.type);
    list.appendChild(card);
  }
  sec.appendChild(list);
  page.appendChild(sec);

  const recSec = el('section', 'section');
  recSec.appendChild(sectionHead('我的记录', '考点热力图 · 用时 · 等级'));
  recSec.appendChild(recordEntry());
  page.appendChild(recSec);

  page.appendChild(installTip());
  app.appendChild(page);
}

/** 装到桌面 + 离线提示（已是独立窗口模式就不再提示） */
function installTip() {
  const tip = el('p', 'install-tip');
  if (window.matchMedia('(display-mode: standalone)').matches || navigator.standalone === true) {
    return tip;
  }
  tip.appendChild(el('b', null, '想离线也能刷题？'));
  tip.appendChild(document.createTextNode(
    '点右上角「···」→「在浏览器打开」，再从浏览器菜单里选「添加到主屏幕」。之后从桌面图标进入，断网也能做题。'));
  return tip;
}

/* ================= 模块页：真题 / 模拟 ================= */
function openModule(type) {
  S.module = type;
  renderModule();
}

function renderModule() {
  const app = $('#app');
  app.innerHTML = '';
  const mod = MODULES.find(m => m.type === S.module) || MODULES[0];
  const c = countsOf(mod.type);

  const bar = el('div', 'topbar');
  const back = el('button', 'icon-btn', '‹');
  back.style.fontSize = '26px';
  back.setAttribute('aria-label', '返回');
  back.onclick = renderHome;
  const sub = el('div', 'sub');
  sub.appendChild(el('b', null, mod.title));
  sub.appendChild(el('span', 'progress', `真题 ${c.real} 篇 · 模拟 ${c.mock} 篇`));
  bar.append(back, sub);
  app.appendChild(bar);

  const page = el('div', 'page');
  const groups = [
    { kind: 'real', title: '高考真题', note: '全国卷 · 新课标卷 · 浙江首考' },
    { kind: 'mock', title: '各省市模拟题', note: '一模 · 零模 · 地区统考' },
  ];
  for (const g of groups) {
    const rows = itemsOf(mod.type, g.kind);
    if (!rows.length) continue;

    const sec = el('section', 'section');
    const head = el('div', 'section-head');
    head.appendChild(el('h3', null, g.title));
    head.appendChild(el('span', 'section-note', `${rows.length} 篇 · ${g.note}`));
    sec.appendChild(head);

    const list = el('div', 'list');
    for (const [paper, it] of rows) {
      const card = el('button', 'card paper-card');
      const main = el('div', 'paper-main');
      main.appendChild(el('b', null, `${paper.year} ${paper.paperName}`));
      main.appendChild(el('span', null, `${it.questions.length} 空 · ${it.score} 分`));
      const meta = el('div', 'paper-meta');
      meta.appendChild(el('span', 'chip', mod.chip));
      card.appendChild(main);
      card.appendChild(meta);
      card.onclick = () => openItem(paper, it);
      list.appendChild(card);
    }
    sec.appendChild(list);
    page.appendChild(sec);
  }
  app.appendChild(page);
  window.scrollTo({ top: 0 });
}

/* ================= 进入一篇 ================= */
function openItem(paper, item) {
  S.item = item;
  S.paper = paper;
  S.answers = {};
  S.graded = false;
  S.resultMeta = null;
  startTimer();
  renderPractice();
}

/* ================= 答题页 ================= */
function renderPractice() {
  const app = $('#app');
  app.innerHTML = '';
  const { paper, item } = S;

  /* 顶栏 */
  const bar = el('div', 'topbar');
  const back = el('button', 'icon-btn', '‹');
  back.style.fontSize = '26px';
  back.setAttribute('aria-label', '返回');
  back.onclick = goUp;
  const sub = el('div', 'sub');
  sub.appendChild(el('b', null, `${paper.year} ${paper.paperName}`));
  const prog = el('span', 'progress');
  sub.appendChild(prog);
  const fs = el('button', 'fs-btn', S.fontLarge ? '大号字' : '标准字');
  fs.onclick = () => {
    S.fontLarge = !S.fontLarge;
    localStorage.setItem('gk.fontLarge', S.fontLarge ? '1' : '0');
    document.documentElement.style.setProperty('--fs-passage', S.fontLarge ? '19px' : '17px');
    toast(S.fontLarge ? '已切换到大号字' : '已切回标准字');
  };
  bar.append(back, sub, fs);
  app.appendChild(bar);

  const page = el('div', 'page');
  const instr = el('p', 'instruction', item.instruction || '');
  page.appendChild(instr);
  page.appendChild(el('span', 'source', sourceLabel(paper)));

  if (S.graded) page.appendChild(buildResult());

  const card = el('div', 'card passage-card');
  for (const line of item.passage.split('\n')) {
    if (!line.trim()) continue;
    const p = el('p');
    renderLine(p, line, item);
    card.appendChild(p);
  }
  page.appendChild(card);
  app.appendChild(page);

  /* 底栏 */
  const actions = el('div', 'actionbar');
  if (S.graded) {
    const again = el('button', 'btn btn-ghost', '重做');
    again.onclick = () => {
      S.answers = {};
      S.graded = false;
      S.resultMeta = null;
      startTimer();                 // 重做算新的一次，重新计时
      renderPractice();
    };
    const next = el('button', 'btn btn-primary', '再练一篇');
    next.onclick = () => {
      // 只在同一模块、同一类（真题/模拟）里换下一篇
      const rows = itemsOf(item.type, paper.kind || 'mock');
      const idx = rows.findIndex(([, it]) => it === S.item);
      const [np, ni] = rows[(idx + 1) % rows.length];
      openItem(np, ni);
    };
    actions.append(again, next);
  } else {
    const submit = el('button', 'btn btn-primary', '提交答案');
    submit.onclick = () => {
      const total = item.questions.length;
      const done = answeredCount();
      if (done < total) {
        // 不用 window.confirm：微信/QQ 内置浏览器会压制原生弹窗
        showDialog({
          title: '还没答完',
          text: `还有 ${total - done} 空没作答，确定现在交卷吗？`,
          okText: '交卷',
          onOk: grade,
        });
        return;
      }
      grade();
    };
    actions.append(submit);
  }
  app.appendChild(actions);

  updateProgress();
}

function updateProgress() {
  const p = $('.progress');
  if (!p || !S.item) return;
  const total = S.item.questions.length;
  const done = answeredCount();
  p.textContent = S.graded ? '已判分' : `已答 ${done}/${total}`;
  const submit = $('.btn-primary');
  if (submit && submit.textContent === '提交答案') {
    submit.disabled = done === 0;
  }
}

/** 一行正文 → 文本 + 空位 */
function renderLine(container, line, item) {
  const parts = line.split(/\{\{(\d+)\}\}/);
  parts.forEach((chunk, i) => {
    if (i % 2 === 0) {
      if (chunk) container.appendChild(document.createTextNode(chunk));
      return;
    }
    const n = Number(chunk);
    const q = item.questions.find(x => x.n === n);
    container.appendChild(q.options ? clozeBlank(q) : grammarBlank(q));
  });
}

function clozeBlank(q) {
  const b = el('button', 'blank');
  b.dataset.n = String(q.n);
  paintBlank(b, q);
  b.onclick = () => {
    if (S.graded) { showExplain(q.n); return; }
    toggleInlineOptions(q, b);
  };
  return b;
}

function grammarBlank(q) {
  const b = el('span', 'blank');
  const input = el('input');
  input.value = S.answers[q.n] || '';
  input.placeholder = '填空';
  input.autocapitalize = 'off';
  input.autocomplete = 'off';
  input.spellcheck = false;
  input.disabled = S.graded;
  input.addEventListener('input', () => {
    S.answers[q.n] = input.value;
    updateProgress();
  });
  b.appendChild(input);
  if (S.graded) {
    b.classList.add(judge(q, S.answers[q.n]) ? 'ok' : 'bad');
    b.onclick = () => showExplain(q.n);
  }
  return b;
}

function paintBlank(b, q) {
  const v = S.answers[q.n];
  if (S.graded) {
    b.textContent = v ? String(v).toUpperCase() : '—';
    b.classList.add(judge(q, v) ? 'ok' : 'bad');
    b.onclick = () => showExplain(q.n);
    return;
  }
  if (norm(v)) {
    b.textContent = String(v).toUpperCase();
    b.classList.add('filled');
  } else {
    b.textContent = String(q.n);
  }
}

/* ================= 行内选项（不遮原文） ================= */
let inlineRow = null;

function closeInlineOptions() {
  if (inlineRow && inlineRow.isConnected) inlineRow.remove();
  inlineRow = null;
}

/**
 * 点某个空 → 就在那一行下面展开 4 个选项，正文其它部分完全不动、不被遮挡。
 * 选中后自动收起，并滚到下一个没答的空。
 */
function toggleInlineOptions(q, btn) {
  if (inlineRow && inlineRow.dataset.n === String(q.n)) { closeInlineOptions(); return; }
  closeInlineOptions();

  const row = el('span', 'opt-row');
  row.dataset.n = String(q.n);

  q.options.forEach((text, i) => {
    const letter = 'ABCD'[i];
    const on = String(S.answers[q.n] || '').toUpperCase() === letter;
    const chip = el('button', `opt-chip${on ? ' on' : ''}`);
    const k = el('span', 'k', letter);
    chip.appendChild(k);
    chip.appendChild(el('span', 'v', text));
    chip.onclick = (ev) => {
      ev.stopPropagation();
      S.answers[q.n] = letter;
      closeInlineOptions();
      refreshBlanks();
      updateProgress();
      const next = S.item.questions.find(x => x.options && !norm(S.answers[x.n]));
      if (next) {
        const target = document.querySelector(`.blank[data-n="${next.n}"]`);
        if (target) target.scrollIntoView({ block: 'center', behavior: 'smooth' });
      }
    };
    row.appendChild(chip);
  });

  btn.after(row);
  inlineRow = row;
  row.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
}

/* ================= 选项面板（判分后看解析用） ================= */
function openSheet(n) {
  S.sheetN = n;
  const q = S.item.questions.find(x => x.n === n);
  const sheet = $('#sheet');
  sheet.innerHTML = '';

  const head = el('div', 'sheet-head');
  head.appendChild(el('b', null, `第 ${n} 空`));

  sheet.appendChild(head);

  const body = el('div', 'sheet-body');

    const letter = 'ABCD'[i];
    const row = el('button', 'opt');
    row.appendChild(el('span', 'letter', letter));
    row.appendChild(el('span', null, text));
    const chosen = norm(S.answers[n]) === letter.toLowerCase() || norm(S.answers[n]) === norm(text);

/* ================= 判分 ================= */
function grade() {
  const item = S.item, paper = S.paper;
  const per = item.scorePerBlank || 1;
  let correct = 0;
  for (const q of item.questions) if (judge(q, S.answers[q.n])) correct++;
  const total = item.questions.length;

  const secs = elapsedSecs();
  const pauses = S.timer ? S.timer.pauses : 0;
  const lv = levelOf(correct, total);

  addRecord({
    id: `${Date.now()}-${Math.random().toString(36).slice(2, 7)}`,
    at: Date.now(),
    year: paper.year, paperName: paper.paperName, kind: paper.kind || 'mock',
    itemId: item.id, type: item.type,
    score: Math.round(correct * per * 10) / 10,
    full: item.score,
    correct, total, secs, pauses, level: lv.lv,
    answers: Object.assign({}, S.answers),
  });

  S.timer = null;
  S.resultMeta = { secs, pauses, level: lv.lv, at: Date.now(), from: 'now' };
  S.graded = true;
  renderReview();          // 交卷后直接进独立的解析页
}

/** 独立的「整体解析」页：分数 + 逐题答案与解析 */
function renderReview() {
  const app = $('#app');
  app.innerHTML = '';
  const { paper, item } = S;
  const isHistory = !!(S.resultMeta && S.resultMeta.from === 'history');

  /* 顶栏 */
  const bar = el('div', 'topbar');
  const back = el('button', 'icon-btn', '‹');
  back.style.fontSize = '26px';
  back.setAttribute('aria-label', isHistory ? '返回记录' : '返回答题');
  back.onclick = isHistory ? renderRecords : renderPractice;
  const sub = el('div', 'sub');
  sub.appendChild(el('b', null, isHistory ? '历史记录 · 解析' : '整体解析'));
  sub.appendChild(el('span', 'progress', `${paper.year} ${paper.paperName}`));
  const seg = el('div', 'seg');
  const tabA = el('button', 'on', '解析');
  const tabB = el('button', null, '原文');
  seg.append(tabA, tabB);
  bar.append(back, sub, seg);
  app.appendChild(bar);

  const page = el('div', 'page');
  page.appendChild(buildResult());

  /* ---------- 面板 A：逐题解析 ---------- */
  const panelA = el('div');

  panelA.appendChild(head);

  for (const q of item.questions) {
    const given = S.answers[q.n];
    const ok = judge(q, given);
    const mine = String(given == null ? '' : given).trim();
    const mineText = mine
      ? (q.options ? `${mine.toUpperCase()}. ${q.options['ABCD'.indexOf(mine.toUpperCase())] || ''}` : mine)
      : '未作答';

    const box = el('div', `rv-item ${mine ? (ok ? 'rv-ok' : 'rv-bad') : 'rv-skip'}`);

    const h = el('div', 'rv-head');
    h.appendChild(el('b', null, `第 ${q.n} 空`));
    h.appendChild(el('span', `rv-badge ${ok ? 'rv-badge-ok' : 'rv-badge-bad'}`,
      mine ? (ok ? '正确' : '错误') : '未作答'));
    box.appendChild(h);

    const row = el('div', 'rv-row');
    row.appendChild(el('span', 'rv-k', '你的答案'));
    row.appendChild(el('span', `rv-v${!mine ? ' rv-v-skip' : (ok ? ' ok' : ' bad')}`, mineText));
    box.appendChild(row);

    const row2 = el('div', 'rv-row');
    row2.appendChild(el('span', 'rv-k', '正确答案'));
    row2.appendChild(el('span', 'rv-v ok', answerLabel(q)));
    box.appendChild(row2);

    // 完形：四个选项都列出来，正确项高亮，选错的标红
    if (q.options) {
      const opts = el('div', 'rv-opts');
      q.options.forEach((text, i) => {
        const letter = 'ABCD'[i];
        const isRight = letter === String(q.answer).toUpperCase();
        const isMine = letter === mine.toUpperCase();
        const o = el('div', `rv-opt${isRight ? ' right' : (isMine ? ' wrong' : '')}`);
        o.appendChild(el('b', null, `${letter}.`));
        o.appendChild(el('span', null, text));
        opts.appendChild(o);
      });
      box.appendChild(opts);
    }

    const ex = el('div', 'rv-ex');
    ex.appendChild(el('b', null, '解析'));
    ex.appendChild(el('p', null, q.explanation || '（本题暂无解析）'));
    box.appendChild(ex);

    panelA.appendChild(box);
  }

  panelA.appendChild(el('p', 'source', sourceLabel(paper)));

  /* ---------- 面板 B：原文（答案已填入） ---------- */
  const panelB = el('div', 'hidden');
  const hint = el('p', 'section-note');
  hint.style.margin = '0 2px 10px';
  hint.textContent = '下方是原文，空位已用绿色填上正确答案；点右上角「解析」可切回逐题解析。';
  panelB.appendChild(hint);

  const card = el('div', 'card passage-card');
  for (const line of item.passage.split('\n')) {
    if (!line.trim()) continue;
    const p = el('p');
    const parts = line.split(/\{\{(\d+)\}\}/);
    parts.forEach((chunk, i) => {
      if (i % 2 === 0) { if (chunk) p.appendChild(document.createTextNode(chunk)); return; }
      const q = item.questions.find(x => x.n === Number(chunk));
      if (!q) return;
      const span = el('span', 'ans-inline');
      span.textContent = q.options
        ? `${q.answer}. ${q.answerText || ''}`.trim()
        : (correctList(q)[0] || q.answer);   // 并列答案填第一种，读起来才顺
      p.appendChild(span);
    });
    card.appendChild(p);
  }
  panelB.appendChild(card);

  page.append(panelA, panelB);
  app.appendChild(page);

  const showTab = (which) => {
    const isA = which === 'a';
    panelA.classList.toggle('hidden', !isA);
    panelB.classList.toggle('hidden', isA);
    tabA.classList.toggle('on', isA);
    tabB.classList.toggle('on', !isA);
    window.scrollTo({ top: 0 });
  };
  tabA.onclick = () => showTab('a');
  tabB.onclick = () => showTab('b');

  const actions = el('div', 'actionbar');
  if (isHistory) {
    /* 回看历史：给「返回记录」和「再做这篇」，不覆盖这次的历史数据 */
    const backRec = el('button', 'btn btn-ghost', '返回记录');
    backRec.onclick = renderRecords;
    const redo = el('button', 'btn btn-primary', '再做这篇');
    redo.onclick = () => openItem(paper, item);
    actions.append(backRec, redo);
  } else {
    const again = el('button', 'btn btn-ghost', '重做这篇');
    again.onclick = () => {
      S.answers = {};
      S.graded = false;
      S.resultMeta = null;
      startTimer();
      renderPractice();
    };
    const next = el('button', 'btn btn-primary', '再练一篇');
    next.onclick = () => {
      // 只在同一模块、同一类（真题/模拟）里换下一篇
      const rows = itemsOf(item.type, paper.kind || 'mock');
      const idx = rows.findIndex(([, it]) => it === item);
      const [np, ni] = rows[(idx + 1) % rows.length];
      openItem(np, ni);
    };
    actions.append(again, next);
  }
  app.appendChild(actions);
  window.scrollTo({ top: 0 });
}

function buildResult() {
  const item = S.item;
  const per = item.scorePerBlank || 1;
  let correct = 0;
  for (const q of item.questions) if (judge(q, S.answers[q.n])) correct++;
  const total = item.questions.length;
  const score = Math.round(correct * per * 10) / 10;

  const box = el('div', 'result');
  box.appendChild(el('span', 'score', String(score)));
  box.appendChild(el('span', 'max', `/ ${item.score}`));
  const d = el('div', 'detail');
  d.appendChild(el('div', null, `正确 ${correct} / ${total}`));
  d.appendChild(el('div', null, `正确率 ${Math.round(correct / total * 100)}%`));
  box.appendChild(d);

  const wrap = el('div');
  wrap.appendChild(box);
  wrap.appendChild(scoreMetaLine());
  return wrap;
}

/** 交卷后的「用时 / 等级」行；回看历史时显示那一次的用时 */
function scoreMetaLine() {
  const meta = S.resultMeta;
  if (!meta) return el('div');
  const line = el('div', 'meta-line');
  line.appendChild(lvBadge(meta.level));
  line.appendChild(el('span', null, `用时 ${fmtDur(meta.secs)}`));
  if (meta.pauses) line.appendChild(el('span', null, `· 切后台暂停 ${meta.pauses} 次`));
  const t = LEVEL_TABLE.find(x => x.lv === meta.level);
  if (t) line.appendChild(el('span', null, `· ${t.tip}`));
  if (meta.from === 'history' && meta.at) line.appendChild(el('span', null, `· ${fmtDate(meta.at)} 做的`));
  return line;
}

/* ================= 做题记录 · 考点热力图 ================= */
const REC_KEY = 'gk.records.v1';
const REC_MAX = 200;               // 自动瘦身：只保留最近 200 次

/** 五档等级：S/A/B/C/D，按正确率定档 */
const LEVEL_TABLE = [
  { lv: 'S', min: 0.90, tip: '稳了，接下来练速度和细节' },
  { lv: 'A', min: 0.80, tip: '良好，个别空失手' },
  { lv: 'B', min: 0.65, tip: '中等，有明确的知识漏洞' },
  { lv: 'C', min: 0.50, tip: '偏弱，建议按考点专项补' },
  { lv: 'D', min: 0.00, tip: '基础不牢，先把语法框架过一遍' },
];

function levelOf(correct, total) {
  const r = total ? correct / total : 0;
  return LEVEL_TABLE.find(x => r >= x.min) || LEVEL_TABLE[LEVEL_TABLE.length - 1];
}
function lvBadge(lv) {
  return el('span', `lv-badge lv-${lv}`, lv);
}
function fmtDur(sec) {
  sec = Math.max(0, Math.round(sec || 0));
  const h = Math.floor(sec / 3600), m = Math.floor((sec % 3600) / 60), s = sec % 60;
  const p = n => String(n).padStart(2, '0');
  return h ? `${h}:${p(m)}:${p(s)}` : `${m}:${p(s)}`;
}
function fmtDate(ms) {
  const d = new Date(ms), p = n => String(n).padStart(2, '0');
  return `${p(d.getMonth() + 1)}/${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
}

/* ---------- 计时：进答题页开始，切后台自动暂停 ---------- */
function startTimer() {
  S.timer = { startedAt: Date.now(), pausedMs: 0, pausedAt: null, pauses: 0 };
}
function pauseTimer() {
  if (S.timer && !S.timer.pausedAt) {
    S.timer.pausedAt = Date.now();
    S.timer.pauses++;
  }
}
function resumeTimer() {
  if (S.timer && S.timer.pausedAt) {
    S.timer.pausedMs += Date.now() - S.timer.pausedAt;
    S.timer.pausedAt = null;
  }
}
function elapsedSecs() {
  if (!S.timer) return 0;
  const end = S.timer.pausedAt || Date.now();
  return Math.max(0, Math.round((end - S.timer.startedAt - S.timer.pausedMs) / 1000));
}

/* ---------- 记录读写（纯本地，不上传） ---------- */
function loadRecords() {
  if (Array.isArray(S.history)) return S.history;
  try {
    const raw = localStorage.getItem(REC_KEY);
    S.history = raw ? JSON.parse(raw) : [];
  } catch (e) {
    S.history = [];
  }
  if (!Array.isArray(S.history)) S.history = [];
  return S.history;
}
function saveRecords() {
  try {
    localStorage.setItem(REC_KEY, JSON.stringify(S.history));
    return true;
  } catch (e) {
    toast('记录存不下了：浏览器本地空间不足');
    return false;
  }
}
function addRecord(rec) {
  const list = loadRecords();
  list.unshift(rec);
  if (list.length > REC_MAX) list.splice(REC_MAX);   // 超出上限自动丢最旧的
  saveRecords();
}
function delRecord(id) {
  const list = loadRecords();
  const i = list.findIndex(r => r.id === id);
  if (i < 0) return null;
  return list.splice(i, 1)[0];
}
function findItemById(id) {
  for (const p of (S.bank ? S.bank.papers : [])) {
    for (const it of p.items) if (it.id === id) return [p, it];
  }
  return null;
}

/** 汇总所有记录：考点错误分布、分模块战绩、等级分布 */
function aggregate(list) {
  const agg = {
    attempts: 0, correct: 0, total: 0, secs: 0, missing: 0,
    tags: new Map(), mods: new Map(), levels: { S: 0, A: 0, B: 0, C: 0, D: 0 },
  };
  for (const r of list) {
    agg.attempts++;
    agg.correct += r.correct || 0;
    agg.total += r.total || 0;
    agg.secs += r.secs || 0;
    if (agg.levels[r.level] != null) agg.levels[r.level]++;
    const m = agg.mods.get(r.type) || { attempts: 0, correct: 0, total: 0 };
    m.attempts++; m.correct += r.correct || 0; m.total += r.total || 0;
    agg.mods.set(r.type, m);

    const found = findItemById(r.itemId);
    if (!found) { agg.missing++; continue; }
    for (const q of found[1].questions) {
      const tag = q.tag || '其他';
      const cell = agg.tags.get(tag) || { n: 0, wrong: 0 };
      cell.n++;
      if (!judge(q, r.answers ? r.answers[q.n] : null)) cell.wrong++;
      agg.tags.set(tag, cell);
    }
  }
  return agg;
}

/** 热力档位：0 全对 / 1–4 按错误率递增 */
function heatBand(wrong, n) {
  if (!wrong) return 0;
  const r = wrong / n;
  return r <= 0.2 ? 1 : r <= 0.4 ? 2 : r <= 0.6 ? 3 : 4;
}

function sectionHead(title, note) {
  const h = el('div', 'section-head');
  h.appendChild(el('h3', null, title));
  if (note) h.appendChild(el('span', 'section-note', note));
  return h;
}

function emptyBox(text) {
  return el('div', 'empty-box', text);
}

/** 首页入口卡片：一眼看到练了多少、薄弱在哪 */
function recordEntry() {
  const list = loadRecords();
  const card = el('button', 'record-card');
  const main = el('div', 'paper-main');
  main.appendChild(el('b', null, '我的记录 · 考点热力图'));
  if (!list.length) {
    main.appendChild(el('span', 'module-note', '做完一篇交卷后，这里会记下得分、用时与等级'));
  } else {
    const agg = aggregate(list);
    const rate = agg.total ? Math.round(agg.correct / agg.total * 100) : 0;
    main.appendChild(el('span', 'module-note',
      `${list.length} 次练习 · 得分率 ${rate}% · 平均用时 ${fmtDur(Math.round(agg.secs / list.length))}`));
    const weak = [...agg.tags.entries()]
      .filter(([, c]) => c.wrong > 0 && c.n >= 2)
      .sort((a, b) => (b[1].wrong / b[1].n) - (a[1].wrong / a[1].n))
      .slice(0, 2);
    if (weak.length) {
      main.appendChild(el('span', 'module-count',
        '薄弱：' + weak.map(([t, c]) => `${t}（错 ${c.wrong}/${c.n}）`).join('、')));
    } else {
      main.appendChild(el('span', 'module-count', '暂无薄弱考点'));
    }
  }
  card.appendChild(main);
  const last = list[0];
  if (last) {
    const right = el('div', 'rec-right');
    right.appendChild(lvBadge(last.level));
    card.appendChild(right);
  }
  card.appendChild(el('span', 'module-arrow', '›'));
  card.onclick = renderRecords;
  return card;
}

/* ---------- 记录页 ---------- */
function renderRecords() {
  const app = $('#app');
  app.innerHTML = '';
  S.module = null;
  const list = loadRecords();

  const bar = el('div', 'topbar');
  const back = el('button', 'icon-btn', '‹');
  back.style.fontSize = '26px';
  back.setAttribute('aria-label', '返回首页');
  back.onclick = renderHome;
  const sub = el('div', 'sub');
  sub.appendChild(el('b', null, '我的记录'));
  sub.appendChild(el('span', 'progress',
    list.length ? `共 ${list.length} 次练习` : '还没有记录'));
  const seg = el('div', 'seg');
  const tabA = el('button', 'on', '热力图');
  const tabB = el('button', null, '记录');
  seg.append(tabA, tabB);
  bar.append(back, sub, seg);
  app.appendChild(bar);

  const page = el('div', 'page');
  const panelA = el('div');
  const panelB = el('div', 'hidden');
  buildHeatPanel(panelA, list);
  buildRecordList(panelB, list);
  page.append(panelA, panelB);
  app.appendChild(page);

  const showTab = (a) => {
    panelA.classList.toggle('hidden', !a);
    panelB.classList.toggle('hidden', a);
    tabA.classList.toggle('on', a);
    tabB.classList.toggle('on', !a);
    window.scrollTo({ top: 0 });
  };
  tabA.onclick = () => showTab(true);
  tabB.onclick = () => showTab(false);
  window.scrollTo({ top: 0 });
}

function buildHeatPanel(container, list) {
  if (!list.length) {
    container.appendChild(emptyBox(
      '还没有记录。做完一篇交卷后，这里会自动记下得分、用时与等级，并把错题归到考点上，形成你的专属热力图。'));
    return;
  }
  const agg = aggregate(list);
  const rate = agg.total ? Math.round(agg.correct / agg.total * 100) : 0;

  /* 三个数字 */
  const row = el('div', 'stat-row');
  const box = (val, label) => {
    const b = el('div', 'stat-box');
    b.appendChild(el('b', null, val));
    b.appendChild(el('span', null, label));
    return b;
  };
  row.append(
    box(String(agg.attempts), '累计练习（篇）'),
    box(rate + '%', '总得分率'),
    box(fmtDur(Math.round(agg.secs / Math.max(1, agg.attempts))), '平均用时'),
  );
  container.appendChild(row);

  /* 等级分布 */
  const dist = el('div', 'lv-dist');
  for (const t of LEVEL_TABLE) {
    if (!agg.levels[t.lv]) continue;
    const cell = el('div', 'lv-cell');
    cell.appendChild(lvBadge(t.lv));
    cell.appendChild(el('em', null, String(agg.levels[t.lv])));
    dist.appendChild(cell);
  }
  container.appendChild(dist);

  /* 分模块战绩 */
  const modSec = el('section', 'section');
  modSec.appendChild(sectionHead('分模块战绩', '完形 / 语法各 15 分'));
  const modList = el('div', 'stat-row');
  for (const type of ['cloze', 'grammar-fill']) {
    const m = agg.mods.get(type);
    const b = el('div', 'stat-box');
    b.appendChild(el('span', null, typeLabel(type)));
    if (!m || !m.total) {
      b.appendChild(el('b', null, '—'));
      b.appendChild(el('span', null, '还没练过'));
    } else {
      const avg = Math.round(m.correct / m.total * 15 * 10) / 10;
      const lv = levelOf(m.correct, m.total);
      b.appendChild(el('b', null, `${avg} / 15`));
      b.appendChild(el('span', null, `${m.attempts} 次 · 等级 ${lv.lv}`));
    }
    modList.appendChild(b);
  }
  modSec.appendChild(modList);
  container.appendChild(modSec);

  /* 考点热力图 */
  const tags = [...agg.tags.entries()].sort((a, b) => {
    const ra = a[1].wrong / a[1].n, rb = b[1].wrong / b[1].n;
    return rb - ra || b[1].wrong - a[1].wrong;
  });
  const heatSec = el('section', 'section');
  heatSec.appendChild(sectionHead('考点热力图', `覆盖 ${agg.total} 空 · 越红越弱`));
  const grid = el('div', 'heat-grid');
  for (const [tag, c] of tags) {
    const band = heatBand(c.wrong, c.n);
    const tile = el('div', `heat-tile bh${band}`);
    tile.appendChild(el('span', 'ht-name', tag));
    tile.appendChild(el('span', 'ht-rate', c.wrong ? Math.round(c.wrong / c.n * 100) + '%' : '全对'));
    tile.appendChild(el('span', 'ht-sub', `错 ${c.wrong} / ${c.n} 空`));
    grid.appendChild(tile);
  }
  heatSec.appendChild(grid);
  const legend = el('div', 'heat-legend');
  legend.appendChild(document.createTextNode('图例'));
  for (let i = 0; i < 5; i++) legend.appendChild(el('i', `bh${i}`));
  legend.appendChild(document.createTextNode('全对 → 错得多'));
  heatSec.appendChild(legend);
  container.appendChild(heatSec);

  /* 自动点评 */
  const adv = el('div', 'advice');
  adv.appendChild(el('b', null, '教练点评：'));
  adv.appendChild(document.createTextNode(adviceFor(agg)));
  container.appendChild(adv);
  container.appendChild(el('p', 'source',
    '热力图按你做过的每一空统计；考点由该题解析自动归类。记录只存在本机，不上传。'));
}

function adviceFor(agg) {
  const rateOf = (m) => (m && m.total ? m.correct / m.total : null);
  const cloze = agg.mods.get('cloze'), gram = agg.mods.get('grammar-fill');
  const rc = rateOf(cloze), rg = rateOf(gram);
  const parts = [];
  if (rc != null && rg != null) {
    const dc = levelOf(cloze.correct, cloze.total).lv;
    const dg = levelOf(gram.correct, gram.total).lv;
    if (Math.abs(rc - rg) >= 0.1) {
      const weak = rc < rg ? '完形填空' : '语法填空';
      parts.push(`完形 ${dc} 级、语法填空 ${dg} 级，短板在${weak}`);
    } else {
      parts.push(`完形与语法填空都在 ${dc} 级附近，比较均衡`);
    }
  } else if (rc != null) {
    parts.push(`目前只练了完形（${levelOf(cloze.correct, cloze.total).lv} 级），建议把语法填空也刷起来`);
  } else if (rg != null) {
    parts.push(`目前只练了语法填空（${levelOf(gram.correct, gram.total).lv} 级），建议补完形`);
  }
  const weak = [...agg.tags.entries()]
    .filter(([, c]) => c.wrong > 0 && c.n >= 2)
    .sort((a, b) => (b[1].wrong / b[1].n) - (a[1].wrong / a[1].n) || b[1].wrong - a[1].wrong)
    .slice(0, 3);
  if (weak.length) {
    parts.push('错得最多的是 ' + weak.map(([t, c]) => `${t}（错 ${c.wrong}/${c.n}）`).join('、'));
  } else if (agg.total) {
    parts.push('目前没有明显薄弱考点，继续保持');
  }
  const rate = agg.total ? Math.round(agg.correct / agg.total * 100) : 0;
  const lv = levelOf(agg.correct, agg.total);
  parts.push(`总得分率 ${rate}%，对应 ${lv.lv} 级——${lv.tip}`);
  return parts.join('；') + '。';
}

/* ---------- 记录列表 ---------- */
function buildRecordList(container, list) {
  if (!list.length) {
    container.appendChild(emptyBox('还没有做题记录。交卷后这里会记下每次的得分、用时和等级。'));
    return;
  }
  container.appendChild(sectionHead('最近练习', `${list.length} 条 · 左滑可删除`));
  for (const r of list) container.appendChild(recordRow(r));

  const foot = el('div', 'rec-foot');
  const clear = el('button', 'btn btn-ghost', '清空全部记录');
  clear.onclick = () => showDialog({
    title: '清空全部记录',
    text: `将删除全部 ${list.length} 条练习记录，无法恢复（不影响题库）。`,
    okText: '清空',
    onOk: () => {
      S.history = [];
      saveRecords();
      renderRecords();
      toast('已清空全部记录');
    },
  });
  foot.appendChild(clear);
  container.appendChild(foot);
  container.appendChild(el('p', 'source', `超过 ${REC_MAX} 次会自动丢弃最旧的记录。`));
}

function recordRow(r) {
  const wrap = el('div', 'rec-wrap');
  const del = el('button', 'rec-del', '删除');
  const row = el('button', 'rec-row');

  const main = el('div', 'rec-main');
  main.appendChild(el('b', null, `${r.year} ${r.paperName}`));
  main.appendChild(el('span', null,
    `${typeLabel(r.type)} · ${fmtDate(r.at)} · 用时 ${fmtDur(r.secs)}` +
    (r.pauses ? ` · 暂停${r.pauses}次` : '')));
  const right = el('div', 'rec-right');
  right.appendChild(el('b', null, `${r.score}/${r.full}`));
  const badgeWrap = el('div');
  badgeWrap.appendChild(lvBadge(r.level));
  right.appendChild(badgeWrap);
  row.append(main, right);

  /* 左滑露出删除；滑动过就不触发进入详情 */
  let x0 = null, dx = 0, moved = false, swallow = false;
  row.addEventListener('touchstart', (e) => {
    x0 = e.touches[0].clientX; dx = 0; moved = false;
  }, { passive: true });
  row.addEventListener('touchmove', (e) => {
    if (x0 == null) return;
    dx = e.touches[0].clientX - x0;
    if (Math.abs(dx) > 8) moved = true;
    if (dx < 0) row.style.transform = `translateX(${Math.max(dx, -86)}px)`;
  }, { passive: true });
  row.addEventListener('touchend', () => {
    if (x0 == null) return;
    const open = dx < -40;
    row.style.transform = '';
    row.classList.toggle('swiped', open);
    if (moved) {
      swallow = true;
      setTimeout(() => { swallow = false; }, 320);
    }
    x0 = null;
  }, { passive: true });
  row.onclick = () => {
    if (swallow) return;
    if (row.classList.contains('swiped')) { row.classList.remove('swiped'); return; }
    openRecord(r.id);
  };

  del.onclick = (e) => {
    e.stopPropagation();
    showDialog({
      title: '删除这条记录',
      text: `${r.year} ${r.paperName} · ${typeLabel(r.type)} · ${fmtDate(r.at)} · ${r.score}/${r.full}`,
      okText: '删除',
      onOk: () => {
        const gone = delRecord(r.id);
        saveRecords();
        renderRecords();
        if (gone) {
          toast('已删除 1 条', {
            label: '撤销',
            onClick: () => {
              loadRecords().unshift(gone);
              saveRecords();
              renderRecords();
              toast('已恢复');
            },
          });
        }
      },
    });
  };

  /* 删除按钮必须先入 DOM：同为定位元素时后来者在上，行才能盖住它 */
  wrap.append(del, row);
  return wrap;
}

/** 回看某一次记录（用当时的作答，配当前题库的解析） */
function openRecord(id) {
  const rec = loadRecords().find(r => r.id === id);
  if (!rec) return;
  const found = findItemById(rec.itemId);
  if (!found) {
    toast('这篇已从题库移除，无法回看');
    return;
  }
  S.paper = found[0];
  S.item = found[1];
  S.answers = Object.assign({}, rec.answers || {});
  S.graded = true;
  S.timer = null;
  S.resultMeta = { secs: rec.secs, pauses: rec.pauses, level: rec.level, at: rec.at, from: 'history' };
  renderReview();
}

/* ================= 启动 ================= */
function initFont() {
  document.documentElement.style.setProperty('--fs-passage', S.fontLarge ? '19px' : '17px');
}

/** 注册离线缓存：装到桌面后断网也能做题 */
function registerSW() {
  if (!('serviceWorker' in navigator)) return;
  if (!location.protocol.startsWith('http')) return;   // file:// 不支持
  navigator.serviceWorker.register('sw.js').catch(() => { /* 离线能力缺失不影响做题 */ });
}

async function boot() {
  initFont();
  registerSW();
  // 切到后台自动暂停计时：回消息、锁屏不该算成做题时间
  document.addEventListener('visibilitychange', () => {
    if (S.graded) return;
    if (document.hidden) pauseTimer();
    else resumeTimer();
  });
  try {
    // 单文件构建版把题库直接内联成 window.__BANK__，静态托管时不需要任何后端
    S.bank = window.__BANK__
      || await (await fetch('/api/bank', { cache: 'no-store' })).json();
  } catch (e) {
    $('#app').innerHTML = '<div class="page">题库加载失败，请确认服务已启动。</div>';
    return;
  }
  renderHome();
}
boot();
</script>

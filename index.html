<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#11141a" media="(prefers-color-scheme: dark)">
<title>高考英语 · 语言运用</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="英语刷题">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>
  :root {
    color-scheme: light dark;
    --bg: #f4f5f7;
    --card: #ffffff;
    --text: #15181d;
    --text-2: #5b6470;
    --line: #e3e6ea;
    --accent: #3b5bdb;
    --accent-weak: #edf0fe;
    --ok: #15803d;
    --ok-weak: #e7f6ec;
    --bad: #c62828;
    --bad-weak: #fdecec;
    --shadow: 0 1px 2px rgba(16, 24, 40, .06), 0 8px 24px rgba(16, 24, 40, .06);
    --fs-passage: 17px;
    --fs-ui: 15px;
    --radius: 14px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #11141a;
      --card: #191d25;
      --text: #e9ecf1;
      --text-2: #9aa4b2;
      --line: #262c36;
      --accent: #7d97ff;
      --accent-weak: #1c2438;
      --ok: #4ade80;
      --ok-weak: #14261a;
      --bad: #ff8080;
      --bad-weak: #2a1618;
      --shadow: 0 1px 2px rgba(0, 0, 0, .4);
    }
  }
  html {
    -webkit-text-size-adjust: 100%;
    overscroll-behavior: none;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  /* 控件类元素：长按不选中、不留长按菜单；正文保持可选中 */
  button, .blank, .opt, .chip, .icon-btn, .fs-btn {
    user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;
  }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: "Segoe UI", -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial,
      "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    font-size: var(--fs-ui);
    line-height: 1.6;
    overscroll-behavior-y: none;
  }
  button { font: inherit; color: inherit; border: 0; background: none; touch-action: manipulation; }

  /* ---------- 顶栏 ---------- */
  .topbar {
    position: sticky; top: 0; z-index: 20;
    display: flex; align-items: center; gap: 10px;
    padding: calc(env(safe-area-inset-top) + 10px) 16px 10px;
    background: color-mix(in srgb, var(--bg) 88%, transparent);
    backdrop-filter: saturate(180%) blur(12px);
    border-bottom: 1px solid var(--line);
  }
  .topbar h1 { flex: 1; margin: 0; font-size: 16px; font-weight: 600; letter-spacing: -.01em; }
  .topbar .sub { flex: 1; min-width: 0; }
  .topbar .sub b { display: block; font-size: 16px; font-weight: 600; }
  .topbar .sub span { display: block; font-size: 12px; color: var(--text-2); }
  .icon-btn {
    width: 40px; height: 40px; border-radius: 12px;
    display: grid; place-items: center; color: var(--text-2);
  }
  .icon-btn:active { background: var(--accent-weak); }
  .fs-btn {
    height: 34px; padding: 0 12px; border-radius: 999px;
    border: 1px solid var(--line); color: var(--text-2); font-size: 13px;
  }

  /* ---------- 通用 ---------- */
  .page { padding: 16px 16px calc(96px + env(safe-area-inset-bottom)); max-width: 720px; margin: 0 auto; }
  .card {
    background: var(--card); border-radius: var(--radius);
    border: 1px solid var(--line); box-shadow: var(--shadow);
  }
  .muted { color: var(--text-2); }
  .chip {
    display: inline-block; padding: 2px 8px; border-radius: 999px;
    background: var(--accent-weak); color: var(--accent);
    font-size: 12px; font-weight: 600;
  }

  /* ---------- 首页 ---------- */
  .hero { margin-bottom: 18px; }
  .hero h2 { margin: 0 0 6px; font-size: 22px; letter-spacing: -.02em; }
  .hero p { margin: 0; color: var(--text-2); font-size: 13px; }
  .list { display: grid; gap: 10px; }
  .paper-card { display: flex; align-items: center; gap: 12px; padding: 14px; width: 100%; text-align: left; }
  .paper-card:active { transform: scale(.99); }
  .paper-main { flex: 1; min-width: 0; }
  .paper-main b { display: block; font-size: 15.5px; font-weight: 600; margin-bottom: 3px; }
  .paper-main span { font-size: 12.5px; color: var(--text-2); }
  .paper-meta { text-align: right; font-size: 12px; color: var(--text-2); display: grid; gap: 4px; justify-items: end; }

  /* ---------- 模块入口（首页） ---------- */
  .module-card { display: flex; align-items: center; gap: 14px; padding: 16px; width: 100%; text-align: left; }
  .module-card:active { transform: scale(.99); }
  .module-card .paper-main b { font-size: 17px; margin-bottom: 5px; }
  .module-note { display: block; font-size: 12.5px; color: var(--text-2); }
  .module-count { display: block; margin-top: 7px; font-size: 12.5px; font-weight: 600; color: var(--accent); }
  .module-arrow { font-size: 20px; color: var(--text-2); line-height: 1; }

  .install-tip {
    margin: 16px 0 0; padding: 14px;
    border-radius: 12px; border: 1px dashed var(--line); background: var(--card);
    font-size: 12.5px; line-height: 1.7; color: var(--text-2);
  }
  .install-tip b { display: block; color: var(--text); font-size: 13px; margin-bottom: 3px; }

  /* ---------- 答题 ---------- */
  .progress { font-size: 12.5px; color: var(--text-2); font-variant-numeric: tabular-nums; }
  .instruction {
    margin: 0 0 12px; padding: 12px 14px;
    background: var(--accent-weak); color: var(--accent);
    border-radius: 12px; font-size: 13px; line-height: 1.55;
  }
  .passage-card { padding: 18px 16px; }
  .passage-card p {
    margin: 0 0 14px; font-size: var(--fs-passage); line-height: 1.78;
    letter-spacing: .002em; text-align: left; word-break: break-word;
  }
  .passage-card p:last-child { margin-bottom: 0; }

  /* 来源标注 */
  .source {
    display: block; margin: 0 0 10px;
    font-size: 12.5px; color: var(--text-2); letter-spacing: .01em;
  }
  .source b { font-weight: 500; }

  .blank {
    display: inline-flex; align-items: center; justify-content: center;
    min-width: 2.5em; height: 1.7em; margin: 0 .1em; padding: 0 .35em;
    vertical-align: -.18em;
    border-bottom: 2px solid var(--accent);
    border-radius: 6px 6px 2px 2px;
    background: var(--accent-weak); color: var(--accent);
    font-size: .9em; font-weight: 700; font-variant-numeric: tabular-nums;
    transition: background .12s ease;
  }
  .blank.filled { background: var(--accent); color: #fff; }
  .blank.ok { background: var(--ok-weak); color: var(--ok); border-bottom-color: var(--ok); }
  .blank.bad { background: var(--bad-weak); color: var(--bad); border-bottom-color: var(--bad); }
  .blank input {
    /* 16px 是 iOS 不触发页面缩放的下限，不能更小 */
    width: 4.2em; border: 0; background: transparent; color: var(--text);
    font: inherit; font-size: 16px; font-weight: 600; text-align: center; outline: none; padding: 0;
  }
  .blank input::placeholder { color: var(--text-2); font-weight: 400; }

  /* ---------- 底栏 ---------- */
  .actionbar {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 20;
    display: flex; gap: 10px; align-items: center;
    padding: 12px 16px calc(12px + env(safe-area-inset-bottom));
    background: color-mix(in srgb, var(--bg) 92%, transparent);
    backdrop-filter: blur(12px);
    border-top: 1px solid var(--line);
  }
  .btn {
    flex: 1; height: 50px; border-radius: 14px;
    display: grid; place-items: center;
    font-size: 16px; font-weight: 600; letter-spacing: .01em;
  }
  .btn-primary { background: var(--accent); color: #fff; }
  .btn-primary:disabled { opacity: .45; }
  .btn-ghost { flex: 0 0 auto; padding: 0 16px; color: var(--text-2); border: 1px solid var(--line); }
  .btn:active:not(:disabled) { transform: scale(.985); }

  /* ---------- 选项面板 ---------- */
  .scrim {
    position: fixed; inset: 0; z-index: 40; background: rgba(10, 12, 16, .42);
    opacity: 0; pointer-events: none; transition: opacity .18s ease;
  }
  .scrim.show { opacity: 1; pointer-events: auto; }
  .sheet {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 50;
    transform: translateY(102%); transition: transform .22s cubic-bezier(.32, .72, 0, 1);
    background: var(--card);
    border-radius: 20px 20px 0 0;
    box-shadow: 0 -8px 40px rgba(10, 12, 16, .18);
    padding-bottom: calc(10px + env(safe-area-inset-bottom));
    max-height: 76vh; max-height: 76dvh; display: flex; flex-direction: column;
  }
  .sheet.show { transform: translateY(0); }
  .sheet-head {
    display: flex; align-items: center; gap: 8px;
    padding: 16px 18px 10px;
  }
  .sheet-head b { font-size: 16px; }
  .sheet-head .muted { font-size: 12.5px; margin-left: auto; }
  .sheet-body { overflow-y: auto; padding: 0 14px 6px; -webkit-overflow-scrolling: touch; }
  .opt {
    display: flex; align-items: center; gap: 12px; width: 100%;
    min-height: 56px; padding: 12px 14px; margin-bottom: 8px;
    border: 1px solid var(--line); border-radius: 12px;
    font-size: 17px; text-align: left; line-height: 1.45;
  }
  .opt .letter {
    flex: 0 0 28px; width: 28px; height: 28px; border-radius: 50%;
    display: grid; place-items: center;
    background: var(--accent-weak); color: var(--accent); font-size: 14px; font-weight: 700;
  }
  .opt[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-weak); }
  .opt:active { background: var(--accent-weak); transform: scale(.995); }
  .opt.ok { border-color: var(--ok); background: var(--ok-weak); }
  .opt.bad { border-color: var(--bad); background: var(--bad-weak); }

  /* ---------- 行内选项：贴着当前行展开，不遮正文 ---------- */
  .opt-row {
    display: grid; grid-template-columns: 1fr 1fr; gap: 8px;
    margin: 8px 0 12px; padding: 10px;
    background: var(--accent-weak); border-radius: 12px;
  }
  .opt-chip {
    display: flex; align-items: center; gap: 8px;
    padding: 11px 12px; border-radius: 10px; text-align: left;
    background: var(--card); border: 1px solid var(--line);
    font-size: 15px; line-height: 1.35; color: var(--text);
    -webkit-tap-highlight-color: transparent;
  }
  .opt-chip:active { transform: scale(.985); }
  .opt-chip .k {
    flex: none; width: 22px; height: 22px; border-radius: 50%;
    background: var(--accent-weak); color: var(--accent);
    font-size: 12.5px; font-weight: 700;
    display: flex; align-items: center; justify-content: center;
  }
  .opt-chip .v { word-break: break-word; }
  .opt-chip.on { border-color: var(--accent); background: var(--accent-weak); }
  .opt-chip.on .k { background: var(--accent); color: #fff; }

  /* ---------- 原文 / 解析 切换 ---------- */
  .seg {
    display: flex; gap: 4px; padding: 3px; border-radius: 10px;
    background: var(--accent-weak);
  }
  .seg button {
    border: 0; background: transparent; color: var(--accent);
    font-size: 13.5px; font-weight: 600; padding: 7px 12px; border-radius: 8px;
    -webkit-tap-highlight-color: transparent;
  }
  .seg button.on { background: var(--card); color: var(--text); box-shadow: var(--shadow); }
  .ans-inline {
    display: inline-block; padding: 0 5px; margin: 0 2px;
    border-bottom: 2px solid var(--ok); border-radius: 3px;
    background: var(--ok-weak); color: var(--ok); font-weight: 600;
  }
  .hidden { display: none !important; }
  .sheet-foot { padding: 8px 14px calc(6px + env(safe-area-inset-bottom)); display: flex; gap: 10px; }

  /* ---------- 结果 ---------- */
  .result {
    display: flex; align-items: baseline; gap: 10px;
    padding: 16px 18px; margin-bottom: 12px;
    border-radius: var(--radius); border: 1px solid var(--line); background: var(--card);
  }
  .result .score { font-size: 32px; font-weight: 700; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
  .result .max { color: var(--text-2); font-size: 15px; }
  .result .detail { margin-left: auto; text-align: right; font-size: 12.5px; color: var(--text-2); }
  .explain-card { padding: 14px 16px; margin-bottom: 12px; font-size: 14.5px; line-height: 1.7; }
  .explain-card h4 { margin: 0 0 6px; font-size: 14px; color: var(--text-2); font-weight: 600; }

  /* ---------- 首页分区 ---------- */
  .section { margin-top: 20px; }
  .section-head {
    display: flex; align-items: baseline; justify-content: space-between;
    gap: 8px; margin: 0 2px 10px;
  }
  .section-head h3 { margin: 0; font-size: 16px; font-weight: 700; }
  .section-note { font-size: 12px; color: var(--text-2); }

  /* ---------- 整体解析页 ---------- */
  .rv-item {
    background: var(--card); border-radius: var(--radius);
    padding: 14px 15px; margin-bottom: 10px; box-shadow: var(--shadow);
    border-left: 3px solid var(--line);
  }
  .rv-ok { border-left-color: var(--ok); }
  .rv-bad { border-left-color: var(--bad); }
  .rv-head {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 8px;
  }
  .rv-head b { font-size: 15.5px; }
  .rv-badge { font-size: 12px; padding: 2px 9px; border-radius: 999px; font-weight: 600; }
  .rv-badge-ok { color: var(--ok); background: var(--ok-weak); }
  .rv-badge-bad { color: var(--bad); background: var(--bad-weak); }
  .rv-row { display: flex; gap: 10px; font-size: 15px; line-height: 1.6; }
  .rv-k { color: var(--text-2); flex: none; width: 62px; font-size: 13px; padding-top: 3px; }
  .rv-v { word-break: break-word; }
  .rv-v.ok { color: var(--ok); font-weight: 600; }
  .rv-v.bad { color: var(--bad); text-decoration: line-through; }
  .rv-v-skip { color: var(--text-2); }
  .rv-opts {
    margin-top: 9px; padding-top: 9px; border-top: 1px solid var(--line);
    display: grid; gap: 5px;
  }
  .rv-opt { display: flex; gap: 6px; font-size: 14.5px; line-height: 1.55; color: var(--text-2); }
  .rv-opt b { font-weight: 700; }
  .rv-opt.right { color: var(--ok); font-weight: 600; }
  .rv-opt.wrong { color: var(--bad); }
  .rv-ex { margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--line); }
  .rv-ex b { font-size: 12.5px; color: var(--accent); letter-spacing: .3px; }
  .rv-ex p { margin: 5px 0 0; font-size: 15px; line-height: 1.72; }
  .toast {
    position: fixed; left: 50%; bottom: calc(88px + env(safe-area-inset-bottom));
    transform: translate(-50%, 8px); z-index: 60;
    background: #1f2430; color: #fff; padding: 9px 16px; border-radius: 999px;
    font-size: 13px; opacity: 0; pointer-events: none; transition: .18s ease;
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }

  /* ---------- 做题记录 / 考点热力图 ---------- */
  :root {
    --lv-S: #7c3aed; --lv-A: #15803d; --lv-B: #0369a1; --lv-C: #b45309; --lv-D: #b91c1c;
    --h0-bg: rgba(21, 128, 61, .10); --h0-fg: #15803d;
    --h1-bg: rgba(132, 204, 22, .16); --h1-fg: #4d7c0f;
    --h2-bg: rgba(234, 179, 8, .18); --h2-fg: #a16207;
    --h3-bg: rgba(249, 115, 22, .16); --h3-fg: #c2410c;
    --h4-bg: rgba(198, 40, 40, .14); --h4-fg: #c62828;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --lv-S: #a78bfa; --lv-A: #4ade80; --lv-B: #7dd3fc; --lv-C: #fbbf24; --lv-D: #ff8080;
      --h0-bg: rgba(74, 222, 128, .14); --h0-fg: #4ade80;
      --h1-bg: rgba(163, 230, 53, .13); --h1-fg: #bef264;
      --h2-bg: rgba(250, 204, 21, .15); --h2-fg: #fde047;
      --h3-bg: rgba(251, 146, 60, .14); --h3-fg: #fdba74;
      --h4-bg: rgba(255, 128, 128, .13); --h4-fg: #ff8080;
    }
  }
  .record-card {
    display: flex; align-items: center; gap: 12px; width: 100%; text-align: left;
    background: var(--card); border-radius: var(--radius); box-shadow: var(--shadow);
    padding: 13px 14px; margin-bottom: 10px;
  }
  .lv-badge {
    display: inline-flex; align-items: center; justify-content: center;
    min-width: 27px; height: 27px; padding: 0 7px; border-radius: 8px;
    font-size: 14px; font-weight: 800; letter-spacing: .02em;
    border: 1.5px solid currentColor;
  }
  .lv-S { color: var(--lv-S); }
  .lv-A { color: var(--lv-A); }
  .lv-B { color: var(--lv-B); }
  .lv-C { color: var(--lv-C); }
  .lv-D { color: var(--lv-D); }
  .stat-row { display: flex; gap: 8px; margin-bottom: 12px; }
  .stat-box {
    flex: 1 1 0; min-width: 0; background: var(--card);
    border-radius: 12px; box-shadow: var(--shadow); padding: 10px 11px;
  }
  .stat-box b { display: block; font-size: 18px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .stat-box span { font-size: 11.5px; color: var(--text-2); }
  .lv-dist { display: flex; gap: 10px; flex-wrap: wrap; margin: 2px 0 14px; }
  .lv-dist .lv-cell { display: flex; align-items: center; gap: 5px; font-size: 12.5px; color: var(--text-2); }
  .lv-dist .lv-cell em { font-style: normal; font-weight: 700; color: var(--text); }
  .heat-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
  .heat-tile { border-radius: 12px; padding: 9px 11px; }
  .heat-tile .ht-name { display: block; font-size: 12.5px; font-weight: 600; }
  .heat-tile .ht-rate { display: block; font-size: 19px; font-weight: 800; line-height: 1.3; font-variant-numeric: tabular-nums; }
  .heat-tile .ht-sub { display: block; font-size: 11px; opacity: .82; }
  .bh0 { background: var(--h0-bg); color: var(--h0-fg); }
  .bh1 { background: var(--h1-bg); color: var(--h1-fg); }
  .bh2 { background: var(--h2-bg); color: var(--h2-fg); }
  .bh3 { background: var(--h3-bg); color: var(--h3-fg); }
  .bh4 { background: var(--h4-bg); color: var(--h4-fg); }
  .heat-legend {
    display: flex; align-items: center; gap: 7px; flex-wrap: wrap;
    font-size: 11.5px; color: var(--text-2); margin: 10px 2px 0;
  }
  .heat-legend i { width: 12px; height: 12px; border-radius: 3px; display: inline-block; }
  .advice {
    background: var(--accent-weak); border-radius: var(--radius);
    padding: 11px 13px; font-size: 14px; line-height: 1.72; margin-top: 12px;
  }
  .advice b { color: var(--accent); }
  .rec-wrap {
    position: relative; border-radius: var(--radius); overflow: hidden;
    margin-bottom: 9px; box-shadow: var(--shadow);
  }
  .rec-del {
    position: absolute; top: 0; right: 0; bottom: 0; width: 86px;
    background: var(--bad); color: #fff; font-size: 14px; font-weight: 600;
  }
  .rec-row {
    position: relative; display: flex; align-items: center; gap: 10px;
    width: 100%; text-align: left; background: var(--card); padding: 12px 14px;
    transition: transform .18s ease;
    /* 横向滑动自己处理，纵向滚动仍归浏览器 */
    touch-action: pan-y;
  }
  .rec-row:active { background: var(--accent-weak); }
  .rec-row.swiped { transform: translateX(-86px); }
  .rec-del:active { filter: brightness(.9); }
  .record-card:active { transform: scale(.99); }
  .rec-main { flex: 1; min-width: 0; }
  .rec-main b {
    display: block; font-size: 14.5px; font-weight: 600;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .rec-main span { font-size: 12px; color: var(--text-2); }
  .rec-right { flex: none; text-align: right; }
  .rec-right b { display: block; font-size: 15px; font-variant-numeric: tabular-nums; }
  .rec-right span { font-size: 11.5px; color: var(--text-2); }
  .empty-box {
    background: var(--card); border-radius: var(--radius); box-shadow: var(--shadow);
    padding: 18px 16px; text-align: center; color: var(--text-2); font-size: 13.5px; line-height: 1.75;
  }
  .meta-line {
    display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
    margin-top: 10px; font-size: 13px; color: var(--text-2);
  }
  .rec-foot { display: flex; gap: 10px; margin: 16px 0 6px; }
  .rec-foot .btn { flex: 1; }
  .toast-act {
    margin-left: 10px; padding: 2px 4px; border-radius: 6px;
    color: #9db8ff; font-size: 13px; font-weight: 700;
  }
</style>
</head>
<body>
<div id="app"></div>
<div class="scrim" id="scrim"></div>

<div class="toast" id="toast"></div>

<script>window.__BANK__ = {"papers":[{"id":"2026-安徽省合肥市高三第一次教学质量检测","year":2026,"paperName":"安徽省合肥市高三第一次教学质量检测","kind":"mock","items":[{"id":"cloze-2026-安徽省合肥市高三第一次教学质量检测-01","type":"cloze","no":41,"score":15,"scorePerBlank":1,"instruction":"阅读下面短文，从每题所给的A、B、C、D四个选项中选出最佳选项。","passage":"As an enthusiastic rock climber, Sam was used to occasional minor injuries. But the fall he took last year was {{1}}. Halfway up a difficult route, he slipped and badly broke his {{2}}. While the operation was successful, it took time to {{3}}. For an athlete like Sam, months off the rock were {{4}}.\n试题卷 第 7 页 / 共 8 页 (www.jxenglish.com) The first weeks were hardest. Sam, stuck at home, wondered whether he’d have {{5}} to climb again, as his friends climbed without him. The recovery process seemed surprisingly {{6}}, which made him feel defeated and question his future.\nBut he pressed on. His foot pain gradually {{7}} as he exercised daily as instructed, and his range of {{8}} and strength returned. Eight months after the accident, Sam was {{9}} by his doctor to climb easy routes. {{10}}, he topped a small cliff (悬崖). Though the muscles were sore, the {{11}} of being back on real rock made him forget everything else!\nHis ultimate {{12}} came six months later, facing the same route where he fell. Fear threatened to {{13}}, but Sam took a deep breath and began. Each move recalled that terrible day, yet this time he managed to stay {{14}}. Reaching the top, he cried in joy. He defeated his self-doubt and reclaimed his {{15}}. The road back was long, but the rewards of never giving up were sweet.","questions":[{"n":1,"no":41,"options":["different","awkward","mild","avoidable"],"answer":"A","answerText":"different","explanation":"考查形容词辨析。句意：萨姆习惯偶尔的小伤，但去年那次摔倒不一样。A. different 不同的；B. awkward 尴尬的；C. mild 轻微的；D. avoidable 可避免的。But 与 minor injuries 形成对比，故选A。","tag":"形容词辨析"},{"n":2,"no":42,"options":["wrist","ankle","neck","back"],"answer":"B","answerText":"ankle","explanation":"考查名词辨析。句意：在一条难度较大的路线半途中，他滑落并严重摔断了脚踝。A. wrist 手腕；B. ankle 脚踝；C. neck 脖子；D. back 背部。下文 his foot pain 提示伤处是脚部，故选B。","tag":"名词辨析"},{"n":3,"no":43,"options":["shine","adjust","balance","recover"],"answer":"D","answerText":"recover","explanation":"考查动词辨析。句意：手术虽然成功，但康复需要时间。A. shine 发亮；B. adjust 调整；C. balance 平衡；D. recover 康复。手术后需要时间恢复健康，故选D。","tag":"动词辨析"},{"n":4,"no":44,"options":["healing","carefree","heartbreaking","rewarding"],"answer":"C","answerText":"heartbreaking","explanation":"考查形容词辨析。句意：对萨姆这样的运动员来说，几个月不能攀岩令人心碎。A. healing 治愈的；B. carefree 无忧无虑的；C. heartbreaking 令人心碎的；D. rewarding 有回报的。months off the rock 显消极，故选C。","tag":"形容词辨析"},{"n":5,"no":45,"options":["time","chance","patience","duty"],"answer":"B","answerText":"chance","explanation":"考查名词辨析。句意：他怀疑自己是否还有机会再攀岩，因为朋友们都在他缺席时攀爬。A. time 时间；B. chance 机会；C. patience 耐心；D. duty 责任。whether 从句表达对能否再攀岩的怀疑，故选B。","tag":"名词辨析"},{"n":6,"no":46,"options":["predictable","consistent","smooth","slow"],"answer":"D","answerText":"slow","explanation":"考查形容词辨析。句意：康复过程慢得出奇，这让他感到挫败。A. predictable 可预测的；B. consistent 一贯的；C. smooth 顺利的；D. slow 缓慢的。让人 feel defeated 的是进程缓慢，故选D。","tag":"形容词辨析"},{"n":7,"no":47,"options":["developed","worsened","shifted","eased"],"answer":"D","answerText":"eased","explanation":"考查动词辨析。句意：随着他按医嘱每天锻炼，脚上的疼痛逐渐减轻。A. developed 发展；B. worsened 恶化；C. shifted 转移；D. eased 减轻。后文说明活动幅度和力量恢复，故选D。","tag":"动词辨析"},{"n":8,"no":48,"options":["control","motion","attention","stability"],"answer":"B","answerText":"motion","explanation":"考查名词辨析。句意：他的活动幅度和力量都恢复了。A. control 控制；B. motion 活动、运动；C. attention 注意力；D. stability 稳定。range of motion 是固定搭配，指关节活动范围，故选B。","tag":"名词辨析"},{"n":9,"no":49,"options":["warned","reminded","cleared","forced"],"answer":"C","answerText":"cleared","explanation":"考查动词辨析。句意：事故八个月后，医生准许萨姆攀爬简单路线。A. warned 警告；B. reminded 提醒；C. cleared 准许、批准；D. forced 强迫。be cleared to do 表示获准做某事，故选C。","tag":"动词辨析"},{"n":10,"no":50,"options":["Carefully","Secretly","Naturally","Suddenly"],"answer":"A","answerText":"Carefully","explanation":"考查副词辨析。句意：他小心地登上一处小悬崖。A. Carefully 小心地；B. Secretly 秘密地；C. Naturally 自然地；D. Suddenly 突然。伤后首次攀爬，动作必然谨慎，故选A。","tag":"副词辨析"},{"n":11,"no":51,"options":["fear","joy","guilt","right"],"answer":"B","answerText":"joy","explanation":"考查名词辨析。句意：尽管肌肉酸痛，重回真实岩壁的喜悦让他忘记了一切。A. fear 恐惧；B. joy 喜悦；C. guilt 内疚；D. right 权利。made him forget everything else 是积极感受，故选B。","tag":"名词辨析"},{"n":12,"no":52,"options":["test","order","victory","solution"],"answer":"A","answerText":"test","explanation":"考查名词辨析。句意：最终的考验在六个月后到来——面对当初摔落的那条路线。A. test 考验；B. order 命令；C. victory 胜利；D. solution 解决办法。重攀旧地是终极挑战，故选A。","tag":"名词辨析"},{"n":13,"no":53,"options":["slip away","turn off","take over","cool down"],"answer":"C","answerText":"take over","explanation":"考查动词短语辨析。句意：恐惧几乎要占据上风，但萨姆深吸一口气开始了。A. slip away 溜走；B. turn off 关掉；C. take over 接管、占上风；D. cool down 冷却。与 Fear 搭配表示被恐惧支配，故选C。","tag":"动词短语"},{"n":14,"no":54,"options":["grateful","curious","focused","humble"],"answer":"C","answerText":"focused","explanation":"考查形容词辨析。句意：每个动作都让他想起那可怕的一天，但这次他设法保持专注。A. grateful 感激的；B. curious 好奇的；C. focused 专注的；D. humble 谦逊的。靠专注克服恐惧，与 yet 构成转折，故选C。","tag":"形容词辨析"},{"n":15,"no":55,"options":["passion","integrity","reputation","sympathy"],"answer":"A","answerText":"passion","explanation":"考查名词辨析。句意：他战胜了自我怀疑，重新找回了自己的热爱。A. passion 热爱；B. integrity 正直；C. reputation 名声；D. sympathy 同情。全文讲他对攀岩的热情，故选A。","tag":"名词辨析"}],"_source":"raw\\jx\\375.pdf"},{"id":"grammar-2026-合肥市 2026 届第一次教学质量检测-01","type":"grammar-fill","no":56,"score":15,"scorePerBlank":1.5,"instruction":"阅读下面短文，在空白处填入1个适当的单词或括号内单词的正确形式。","passage":"On hot summer days, when high temperatures often reduce people’s appetite, cold desserts tend to sound far more refreshing than a bowl of hot noodles. In ancient China, nobles enjoyed a special cold food known as Sushan, {{1}} many scholars regard as the earliest form of ice cream.\nThe name Sushan, meaning crispy mountain, originally {{2}} (come) from its shape as well as its breakable structure. It looked like a small mountain of shaved ice {{3}} (combine) with milk, butter and sugar, and {{4}} (make) it more popular on special occasions, it was sometimes decorated with flowers and leaves.\nDuring the Tang Dynasty, the emperor’s court {{5}} (far) developed this dessert. Milk was sweetened, sometimes thickened with flour, and then iced through advanced {{6}} (cool) methods.\nMetal containers holding the mixture were often placed in ice with saltpeter (硝石), {{7}} substance that lowers the freezing point of water. This technique made it possible for the upper class to enjoy cold dishes {{8}} the fact that the weather itself was not that cold.\nAlthough Sushan was not exactly the same as modern ice cream, it shared several essential characteristics, and {{9}} (present) in a partly frozen state occasionally. It reflected not only the {{10}} (innovate) of ancient Chinese people, but also the special status that frozen desserts held in court life.","questions":[{"n":1,"no":56,"answer":"which","answerText":"which","explanation":"考查定语从句。先行词 Sushan 指物，从句中 regard 后缺宾语，构成 regard sth as 结构，非限制性定语从句只能用 which。","tag":"定语从句"},{"n":2,"no":57,"answer":"came","answerText":"came","explanation":"考查时态。时间标志 originally 表示过去，主语 The name Sushan 为单数，故填过去式 came。","tag":"时态"},{"n":3,"no":58,"answer":"combined","answerText":"combined","explanation":"考查非谓语动词。shaved ice 与 combine 是被动关系，用过去分词 combined 作后置定语，意为「与牛奶、黄油和糖混合的」。","tag":"非谓语动词"},{"n":4,"no":59,"answer":"to make","answerText":"to make","explanation":"考查非谓语动词。此处表示目的，作目的状语要用动词不定式，故填 to make，意为「为了让它更受欢迎」。","tag":"非谓语动词"},{"n":5,"no":60,"answer":"further","answerText":"further","explanation":"考查副词比较级。修饰动词 developed 需用副词，far 的比较级 further 表示「进一步」，故填 further。","tag":"比较等级"},{"n":6,"no":61,"answer":"cooling","answerText":"cooling","explanation":"考查词性转换。空前是形容词 advanced，空后是名词 methods，需用动名词 cooling 作定语，故填 cooling。","tag":"词性转换"},{"n":7,"no":62,"answer":"a","answerText":"a","explanation":"考查冠词。substance 是可数名词单数，此处泛指「一种物质」，且其后有 that 引导的定语从句，故填不定冠词 a。","tag":"冠词"},{"n":8,"no":63,"answer":"despite","answerText":"despite","explanation":"考查介词。空后是名词短语 the fact that...，表示让步「尽管」，故填介词 despite。","tag":"介词"},{"n":9,"no":64,"answer":"was presented","answerText":"was presented","explanation":"考查时态与语态。主语 it 指 Sushan，与 present 是被动关系，且与并列谓语 shared 时态一致，故填 was presented。","tag":"语态/时态"},{"n":10,"no":65,"answer":"innovation","answerText":"innovation","explanation":"考查词性转换。空前有定冠词 the，空后是 of 短语，需要名词，故填 innovate 的名词形式 innovation。","tag":"词性转换"}],"_source":"raw\\jx\\375.pdf"}]},{"id":"2026-福建省龙岩市高三下学期三月教学质量检测","year":2026,"paperName":"福建省龙岩市高三下学期三月教学质量检测","kind":"mock","items":[{"id":"cloze-2026-福建省龙岩市高三下学期三月教学质量检测-01","type":"cloze","no":41,"score":15,"scorePerBlank":1,"instruction":"阅读下面短文，从每题所给的A、B、C、D四个选项中选出最佳选项。","passage":"When my three-year-old daughter Heidi was playing in the backyard, she sat onto the lid (盖 子) of a large glass container, which accidentally broke immediately. She suffered a deep {{1}}, and we rushed to the emergency room.\nAfter a wait, Dr. Johnson, a calm and friendly doctor, {{2}} her. To ease her fear, he told jokes as he treated her wound. After {{3}} it, he did something unexpected. He {{4}} a surgical glove (手套) into a balloon, drew a chicken face on it, and gave it to Heidi as a toy. For days, this “chicken” was her favorite {{5}}.\nThirty years later, during a family dinner, we {{6}} the accident. I described the panic and blood. But Heidi, now a mature adult, was {{7}}. Her memory was entirely different. She {{8}} the quick response of the family and, most of all, the kind doctor and the funny glove. She looked back on that day {{9}}.\nI was {{10}} by her ability to leave out the frightening parts and only remember the good.\nHer memory wasn’t of a bloody accident but a pleasant {{11}} to a kind “grandpa” doctor. This made me {{12}} that focusing on the positive is a healthy skill I had lost. As a child, I also used to {{13}} the sweet memories.\nHeidi taught me a valuable lesson: there is always something good to focus on. Now, I try to live in the moment, {{14}} the good, and move past the bad quickly. We should all be {{15}} for the “Dr. Johnsons” in our lives, whose small acts of kindness leave lasting impressions.","questions":[{"n":1,"no":41,"options":["failure","cut","loss","shock"],"answer":"B","answerText":"cut","explanation":"考查名词辨析。A 失败；B 伤口；C 损失；D 震惊。由玻璃容器摔碎可知孩子被割伤，a deep cut 指很深的伤口，故选B。","tag":"名词辨析"},{"n":2,"no":42,"options":["examined","observed","tested","cured"],"answer":"A","answerText":"examined","explanation":"考查动词辨析。A 检查；B 观察；C 检测；D 治愈。医生 examined 她的伤口，指检查病人或伤处，故选A。","tag":"动词辨析"},{"n":3,"no":43,"options":["closing","covering","cleaning","dressing"],"answer":"D","answerText":"dressing","explanation":"考查动词辨析。A 关闭；B 覆盖；C 清洗；D 包扎。dressing a wound 是固定搭配，指包扎伤口，故选D。","tag":"动词辨析"},{"n":4,"no":44,"options":["folded","broke","blew","divided"],"answer":"C","answerText":"blew","explanation":"考查动词辨析。A 折叠；B 打破；C 吹；D 分割。blew a glove into a balloon 指把手套吹成气球，故选C。","tag":"动词辨析"},{"n":5,"no":45,"options":["assistant","game","souvenir","companion"],"answer":"D","answerText":"companion","explanation":"考查名词辨析。A 助手；B 游戏；C 纪念品；D 陪伴物。此后数天这只小鸡一直陪着她，是她的 companion 玩伴，故选D。","tag":"名词辨析"},{"n":6,"no":46,"options":["reported","mentioned","investigated","settled"],"answer":"B","answerText":"mentioned","explanation":"考查动词辨析。A 报告；B 提到；C 调查；D 解决。家宴上谈起那次意外，mentioned 指提及，故选B。","tag":"动词辨析"},{"n":7,"no":47,"options":["annoyed","frightened","embarrassed","surprised"],"answer":"D","answerText":"surprised","explanation":"考查形容词辨析。A 恼火的；B 害怕的；C 尴尬的；D 惊讶的。由下句 her memory was entirely different 可知她对母亲的描述 surprised，故选D。","tag":"形容词辨析"},{"n":8,"no":48,"options":["reflected","praised","recalled","pictured"],"answer":"C","answerText":"recalled","explanation":"考查动词辨析。A 反映；B 表扬；C 回忆起；D 想象。recalled 与 her memory 呼应，她记得的是家人反应快和善良的医生，故选C。","tag":"动词辨析"},{"n":9,"no":49,"options":["fondly","calmly","briefly","clearly"],"answer":"A","answerText":"fondly","explanation":"考查副词辨析。A 深情地；B 冷静地；C 短暂地；D 清楚地。她只记得美好部分，因此是 fondly 深情地回想那一天，故选A。","tag":"副词辨析"},{"n":10,"no":50,"options":["amused","confused","struck","judged"],"answer":"C","answerText":"struck","explanation":"考查动词辨析。A 逗乐；B 使困惑；C 触动；D 评判。be struck by 指被深深触动，母亲被女儿只记美好的能力打动，故选C。","tag":"动词辨析"},{"n":11,"no":51,"options":["reply","visit","greeting","gift"],"answer":"B","answerText":"visit","explanation":"考查名词辨析。A 回复；B 就诊；C 问候；D 礼物。她记忆里不是流血的事故，而是去和善医生处的一次愉快 visit，故选B。","tag":"名词辨析"},{"n":12,"no":52,"options":["realize","declare","decide","emphasize"],"answer":"A","answerText":"realize","explanation":"考查动词辨析。A 意识到；B 宣布；C 决定；D 强调。make sb. realize 指使某人意识到，母亲由此明白专注积极面是健康能力，故选A。","tag":"动词辨析"},{"n":13,"no":53,"options":["set down","look for","concentrate on","work with"],"answer":"C","answerText":"concentrate on","explanation":"考查动词短语辨析。A 写下；B 寻找；C 专注于（concentrate on）；D 共事。与上文 focusing on the positive 呼应，指专注甜蜜回忆，故选C。","tag":"动词短语"},{"n":14,"no":54,"options":["enjoy","expect","get","encounter"],"answer":"A","answerText":"enjoy","explanation":"考查动词辨析。A 享受；B 期待；C 得到；D 遇到。与 the good、the bad 的对比及 live in the moment 呼应，指 enjoy 享受美好，故选A。","tag":"动词辨析"},{"n":15,"no":55,"options":["fit","ready","responsible","grateful"],"answer":"D","answerText":"grateful","explanation":"考查形容词辨析。A 适合的；B 准备好的；C 负责的；D 感激的。be grateful for 指对……心怀感激，医生的小小善举留下长久印象，故选D。","tag":"形容词辨析"}],"_source":"raw\\jx\\384.pdf"},{"id":"grammar-2026-龙岩市 2026 年高中毕业班三月教学质量检测-01","type":"grammar-fill","no":56,"score":15,"scorePerBlank":1.5,"instruction":"阅读下面短文，在空白处填入1个适当的单词或括号内单词的正确形式。","passage":"For Garima, who has considered Chengdu in Sichuan as her “second hometown” for over a year, China’s safety is a real part of daily life—one that has changed {{1}} she understands public security. She {{2}} (impress) deeply by China’s dependable public safety since she came to China.\nGarima, {{3}} self-described “night owl (猫头鹰)”, comfortably walks in the streets, plays table tennis, cycles on shared bikes, {{4}} relaxes on park benches late at night—all without any anxiety. “The streets are safe even at midnight, with late -night shops allowing me to explore food freely,” she told the Global Times.\nChina ranks {{5}} the world’s safest nations. Official data shows a 2024 murder rate of 0.44 per 100,000 people, one of the lowest {{6}} (global). Professor Shen Yi from Fudan University explained that this safety comes from {{7}} (system) governance. He mentioned a popular foreign bloggers’ experiment in China: leaving {{8}} (valuable) in public to see if they would be taken. And the result is always the same: the items remain {{9}} (untouch).\nProfessor Shen emphasized that China prioritizes people’s safety, continuously {{10}} (strengthen) its ability to ensure safety in accordance with relevant laws. This reflects China’s strong determination and the ongoing efforts to address risks, ensuring a secure environment for all.","questions":[{"n":1,"no":56,"answer":"how","answerText":"how","explanation":"考查连接副词。changed 后是宾语从句，指改变了她理解公共安全的方式，用 how 引导。","tag":"副词辨析"},{"n":2,"no":57,"answer":"has been impressed","answerText":"has been impressed","explanation":"考查时态语态。since she came to China 是现在完成时标志，she 与 impress 是被动关系，故填 has been impressed。","tag":"语态/时态"},{"n":3,"no":58,"answer":"a","answerText":"a","explanation":"考查冠词。night owl 是可数名词单数，这里指一个自称夜猫子的人，用不定冠词 a。","tag":"冠词"},{"n":4,"no":59,"answer":"or","answerText":"or","explanation":"考查连词。walks、plays、cycles 与 relaxes 是并列谓语，最后一项前用 or 表示或者。","tag":"连词"},{"n":5,"no":60,"answer":"among","answerText":"among","explanation":"考查介词。among 表示在三者以上之中，rank among 指位列……之中。","tag":"介词"},{"n":6,"no":61,"answer":"globally","answerText":"globally","explanation":"考查副词。此处修饰 one of the lowest，需用副词 globally，意为在全球范围内。","tag":"副词辨析"},{"n":7,"no":62,"answer":"systematic","answerText":"systematic","explanation":"考查词性转换。修饰名词 governance 需用形容词 systematic，意为系统性的。","tag":"词性转换"},{"n":8,"no":63,"answer":"valuables","answerText":"valuables","explanation":"考查词性转换。leave 后接宾语，valuable 的复数名词形式 valuables 意为贵重物品。","tag":"词性转换"},{"n":9,"no":64,"answer":"untouched","answerText":"untouched","explanation":"考查形容词。remain 是系动词，后接形容词作表语，untouched 意为未被碰过的、原封不动的。","tag":"形容词辨析"},{"n":10,"no":65,"answer":"strengthening","answerText":"strengthening","explanation":"考查非谓语动词。句子谓语是 prioritizes，China 与 strengthen 是主动关系，用现在分词 strengthening 作伴随状语。","tag":"非谓语动词"}],"_source":"raw\\jx\\384.pdf"}]},{"id":"2026-广东省大湾区高三下学期第一次模拟测试","year":2026,"paperName":"广东省大湾区高三下学期第一次模拟测试","kind":"mock","items":[{"id":"cloze-2026-广东省大湾区高三下学期第一次模拟测试-01","type":"cloze","no":41,"score":15,"scorePerBlank":1,"instruction":"阅读下面短文，从每题所给的A、B、C、D四个选项中选出最佳选项。","passage":"The sun sank behind the trees as the wildlife photographer held his camera tight, hoping to capture an image of a relatively rare bird, a particular kind of heron. He ’d {{1}} several disappointing hours with no luck at all. He needed a {{2}} soon, otherwise it would be too {{3}} and he would have to come back the next day and start all over again. Suddenly, to his delight, a heron {{4}} on a branch right in front of him. He {{5}} raised his camera, focused in and took the {{6}} just a second before the bird spread its wings and flew away.\nFeeling particularly pleased with himself, the photographer looked at the image, only to make an astonishing {{7}}. There, in the background, easy to {{8}} at first sight, was another bird mid-flight: a strikingly rare woodpecker (啄木鸟), one so seldom seen that many birdwatchers spend years for just a {{9}} of it.\nThe photographer hadn ’t noticed the woodpecker at all; without even {{10}}, he had photographed a bird much rarer than the one he ’d aimed for. This unexpected {{11}} illustrates the concept of serendipity — the experience of {{12}} something extraordinary while searching for something entirely {{13}}.\nHistory is often filled with such moments, from scientific breakthroughs like penicillin ’s accidental finding to everyday {{14}}. Sometimes, the most remarkable discoveries happen not through constant {{15}}, but through being in the right place at the right time.","questions":[{"n":1,"no":41,"options":["driven","extended","waited","arranged"],"answer":"C","answerText":"waited","explanation":"考查动词辨析。句意：他已经等了几个令人失望的小时，一点运气也没有。A. driven 开车；B. extended 延长；C. waited 等待；D. arranged 安排。与 several hours 搭配且 no luck 说明一无所获，故选C。","tag":"动词辨析"},{"n":2,"no":42,"options":["break","picture","signal","response"],"answer":"B","answerText":"picture","explanation":"考查名词辨析。句意：他很快需要一张照片。A. break 休息；B. picture 照片；C. signal 信号；D. response 回应。下文他要举起相机拍摄，故选B。","tag":"名词辨析"},{"n":3,"no":43,"options":["dark","delicate","long","urgent"],"answer":"A","answerText":"dark","explanation":"考查形容词辨析。句意：否则天就要黑了，他只能第二天再来重来一遍。A. dark 黑暗的；B. delicate 精致的；C. long 长的；D. urgent 紧急的。由 come back the next day 可知天色将晚，故选A。","tag":"形容词辨析"},{"n":4,"no":44,"options":["sang","settled","crashed","hid"],"answer":"B","answerText":"settled","explanation":"考查动词辨析。句意：突然，一只鹭停在他正前方的树枝上。A. sang 唱歌；B. settled 停留、栖息；C. crashed 撞毁；D. hid 隐藏。settle on a branch 表示落在枝头停稳，故选B。","tag":"动词辨析"},{"n":5,"no":45,"options":["continuously","awkwardly","patiently","immediately"],"answer":"D","answerText":"immediately","explanation":"考查副词辨析。句意：他立刻举起相机对焦，在鸟展翅飞走前一秒按下了快门。A. continuously 持续地；B. awkwardly 笨拙地；C. patiently 耐心地；D. immediately 立刻。机会稍纵即逝，故选D。","tag":"副词辨析"},{"n":6,"no":46,"options":["action","measure","blame","shot"],"answer":"D","answerText":"shot","explanation":"考查名词辨析。句意：在鸟展翅飞走前一秒按下了快门。A. action 行动；B. measure 措施；C. blame 责备；D. shot 拍摄、快门。take the shot 是拍照的固定说法，故选D。","tag":"名词辨析"},{"n":7,"no":47,"options":["claim","mistake","discovery","presentation"],"answer":"C","answerText":"discovery","explanation":"考查名词辨析。句意：他看了看照片，却有了一个惊人的发现。A. claim 主张；B. mistake 错误；C. discovery 发现；D. presentation 展示。后面写他在背景里看到另一只鸟，故选C。","tag":"名词辨析"},{"n":8,"no":48,"options":["miss","memorize","handle","interpret"],"answer":"A","answerText":"miss","explanation":"考查动词辨析。句意：背景里还有一只飞行中的鸟，乍看很容易错过。A. miss 错过、没注意到；B. memorize 记住；C. handle 处理；D. interpret 解释。与 hadn't noticed 呼应，故选A。","tag":"动词辨析"},{"n":9,"no":49,"options":["taste","sight","smell","touch"],"answer":"B","answerText":"sight","explanation":"考查名词辨析。句意：许多观鸟者只为看它一眼就要花上好几年。A. taste 味道；B. sight 看、一见；C. smell 气味；D. touch 触摸。a sight of 指看一眼这种稀有鸟，故选B。","tag":"名词辨析"},{"n":10,"no":50,"options":["moving","trying","leaving","warning"],"answer":"B","answerText":"trying","explanation":"考查动词辨析。句意：他根本没有刻意尝试，就拍到了一种比目标稀有得多的鸟。A. moving 移动；B. trying 尝试；C. leaving 离开；D. warning 警告。without even trying 表示并非有意为之，故选B。","tag":"动词辨析"},{"n":11,"no":51,"options":["design","setback","challenge","turn"],"answer":"D","answerText":"turn","explanation":"考查名词辨析。句意：这个意外的转折诠释了「意外之喜」这一概念。A. design 设计；B. setback 挫折；C. challenge 挑战；D. turn 转折。指结果出乎意料的转向，故选D。","tag":"名词辨析"},{"n":12,"no":52,"options":["taking up","making out","coming across","looking over"],"answer":"C","answerText":"coming across","explanation":"考查动词短语辨析。句意：在寻找完全不同的东西时偶然遇到非凡之物。A. taking up 占据；B. making out 辨认出；C. coming across 偶然遇到；D. looking over 浏览。与 while searching for 形成对照，故选C。","tag":"动词短语"},{"n":13,"no":53,"options":["unaware","mysterious","unlikely","different"],"answer":"D","answerText":"different","explanation":"考查形容词辨析。句意：在寻找完全不同的东西时，意外遇到非凡之物。A. unaware 未意识到的；B. mysterious 神秘的；C. unlikely 不太可能的；D. different 不同的。与前面的 unexpected 呼应，故选D。","tag":"形容词辨析"},{"n":14,"no":54,"options":["surprises","attempts","anticipations","routines"],"answer":"A","answerText":"surprises","explanation":"考查名词辨析。句意：从青霉素的意外发现到日常生活中的惊喜。A. surprises 惊喜；B. attempts 尝试；C. anticipations 预期；D. routines 常规。与 scientific breakthroughs 并列，指日常的意外发现，故选A。","tag":"名词辨析"},{"n":15,"no":55,"options":["pursuit","observation","struggle","reflection"],"answer":"A","answerText":"pursuit","explanation":"考查名词辨析。句意：最非凡的发现往往不是来自不断的追求，而是恰好在合适的时间身处合适的地方。A. pursuit 追求；B. observation 观察；C. struggle 奋斗；D. reflection 反思。与 being in the right place 形成对比，故选A。","tag":"名词辨析"}],"_source":"raw\\jx\\401.pdf"},{"id":"grammar-2026-大湾区 2026 届下学期模拟测试（一）-01","type":"grammar-fill","no":56,"score":15,"scorePerBlank":1.5,"instruction":"阅读下面短文，在空白处填入1个适当的单词或括号内单词的正确形式。","passage":"There is a saying about the southwestern Chinese province of Guizhou: “Not three feet of flat land, not three days without rain, not a family with three silver coins.” But, Tao Huabi, also known as China ’s “ {{1}} (hot) woman ”, has well and truly broken the rule {{2}} the help of an appetizing sauce.\nTao Huabi, born in 1947, is {{3}} woman behind Lao Gan Ma, literally “Old Mother”, a hot and crunchy (脆的) sauce crafted from fried red chili peppers. Open a bottle, {{4}} you will spot a few peanuts, some crunchy salty beans and shiny oil mixed in.\nIn China, the sauce is so popular, {{5}} (give) birth to Lao Gan Ma phone cases, clothing, pencil cases and the joke, according to a state-owned {{6}} (finance) news organization in China, that when a man gets {{7}} (marry), it is to two women: his wife and Tao Huabi. Besides, it is also increasingly well-received overseas, especially in the US, where several different versions {{8}} (appear) in recent years, including Fly By Jing and Momofuku chilli crunch, both of which avoid artificial flavor enhancers in favor of natural flavors.\nIn 2016, Lao Gan Ma {{9}} (credit) with helping the historically poor Guizhou achieve 10.5% economic {{10}} (grow). As for the mother herself, an article described her as the queen of a “red kingdom” of chilli fields.","questions":[{"n":1,"no":56,"answer":"hottest","answerText":"hottest","explanation":"考查形容词最高级。句意：被称为中国「最辣的女人」的陶华碧。定冠词 the 后表示最高级，hot 的最高级是 hottest。","tag":"比较等级"},{"n":2,"no":57,"answer":"with","answerText":"with","explanation":"考查介词。with the help of 是固定搭配，意为「在……的帮助下」，故填 with。","tag":"介词"},{"n":3,"no":58,"answer":"the","answerText":"the","explanation":"考查冠词。此处特指老干妈背后的那位女性，表示特指要用定冠词 the。","tag":"冠词"},{"n":4,"no":59,"answer":"and","answerText":"and","explanation":"考查并列连词。祈使句 Open a bottle 后接 and 引出结果，表示「打开一瓶，你就会看到……」，故填 and。","tag":"连词"},{"n":5,"no":60,"answer":"giving","answerText":"giving","explanation":"考查非谓语动词。前后是自然的结果关系，用现在分词 giving 作结果状语。","tag":"非谓语动词"},{"n":6,"no":61,"answer":"financial","answerText":"financial","explanation":"考查词性转换。修饰名词短语 news organization 需要形容词，finance 的形容词形式是 financial。","tag":"词性转换"},{"n":7,"no":62,"answer":"married","answerText":"married","explanation":"考查非谓语动词。get married 是固定搭配，表示「结婚」，此处用过去分词作表语。","tag":"非谓语动词"},{"n":8,"no":63,"answer":"have appeared","answerText":"have appeared","explanation":"考查时态与主谓一致。时间状语 in recent years 常与现在完成时连用，主语 versions 为复数，故填 have appeared。","tag":"时态/主谓一致"},{"n":9,"no":64,"answer":"was credited","answerText":"was credited","explanation":"考查被动语态。老干妈是「被归功于」帮助贵州实现增长的，与 credit 是被动关系，且时间为 2016 年，故填 was credited。","tag":"语态"},{"n":10,"no":65,"answer":"growth","answerText":"growth","explanation":"考查词性转换。economic 后接名词，表示「经济增长」，grow 的名词形式是 growth。","tag":"词性转换"}],"_source":"raw\\jx\\401.pdf"}]},{"id":"2026-广东省江门市高三下学期一模测试","year":2026,"paperName":"广东省江门市高三下学期一模测试","kind":"mock","items":[{"id":"cloze-2026-广东省江门市高三下学期一模测试-01","type":"cloze","no":41,"score":15,"scorePerBlank":1,"instruction":"阅读下面短文，从每题所给的A、B、C、D四个选项中选出最佳选项。","passage":"When I was fifteen, I considered myself too cool for my father ’s workshop where he repaired furniture while I was lost in digital worlds. One Saturday, he asked for my assistance with a special {{1}} fixing my grandmother’s cherished antique wooden clock.\nI agreed with a reluctant sigh, perceiving it as totally {{2}}.But as I watched father’s hands work, something shifted. As he explained the {{3}} of each gear (齿轮) and the clock’s history, his eyes {{4}} with a passion I had never noticed before.\nWe worked together for weeks. Slowly, the clock {{5}} its former elegance and charm, while I learned to wipe the delicate hands and gently {{6}} the glass. My impatience {{7}} fascination: I wasn’t just cleaning; I was {{8}} a piece of family history.\nThe day we hung the clock was a day of pride. Its steady tick felt like a heartbeat. That experience taught me a {{9}} lesson. It wasn’t about the clock, but the time spent with my father.\nI came to {{10}} the value of his wisdom and skills I had once {{11}}.\nNow every time I visit home, I check the clock and {{12}} it. It works not only as a beautiful artifact (手工艺品) but also as a {{13}} of the day I truly saw my father. His workshop was a shelter where patience and love could {{14}} anything broken. He would say, “Some things, like this clock and our bond, just need a little {{15}} to run forever.”","questions":[{"n":1,"no":41,"options":["task","situation","trouble","case"],"answer":"A","answerText":"task","explanation":"考查名词辨析。句意：他请我帮忙完成一项特别的任务——修好奶奶珍爱的古董木钟。A. task 任务；B. situation 情形；C. trouble 麻烦；D. case 事例。空格后的 fixing... 正是对这项 task 的具体说明，指父亲交给我的一件活计，故选A。","tag":"名词辨析"},{"n":2,"no":42,"options":["quick","tough","vital","dull"],"answer":"D","answerText":"dull","explanation":"考查形容词辨析。句意：我不情愿地叹了口气答应了，觉得这事实在枯燥。A. quick 快的；B. tough 艰难的；C. vital 至关重要的；D. dull 枯燥乏味的。由 reluctant sigh 以及后文态度的转变可知，作者起初觉得修钟无聊，故选D。","tag":"形容词辨析"},{"n":3,"no":43,"options":["precision","stability","function","material"],"answer":"C","answerText":"function","explanation":"考查名词辨析。句意：当他讲解每个齿轮的功能和这座钟的来历时。A. precision 精确；B. stability 稳定性；C. function 功能；D. material 材料。此处指齿轮各起什么作用，与 history 并列，故选C。","tag":"名词辨析"},{"n":4,"no":44,"options":["winked","shone","faded","clouded"],"answer":"B","answerText":"shone","explanation":"考查动词辨析。句意：他的眼睛闪着一种我从未察觉的热情。A. winked 眨眼；B. shone 闪耀、发光；C. faded 褪去；D. clouded 变阴沉。eyes shone with passion 为常见搭配，指眼中闪着热情的光，故选B。","tag":"动词辨析"},{"n":5,"no":45,"options":["sought","regained","sustained","reserved"],"answer":"B","answerText":"regained","explanation":"考查动词辨析。句意：渐渐地，这座钟重新获得了昔日的优雅与魅力。A. sought 寻找；B. regained 重新获得；C. sustained 维持；D. reserved 预订。钟经修复由残旧变完好，是重新获得原有风采，故选B。","tag":"动词辨析"},{"n":6,"no":46,"options":["polish","dust","sweep","mop"],"answer":"A","answerText":"polish","explanation":"考查动词辨析。句意：我学会了擦拭纤细的指针，轻轻把玻璃擦亮。A. polish 擦亮；B. dust 掸灰；C. sweep 打扫；D. mop 拖洗。与 wipe 并列，宾语是表盘玻璃，指用布把它抹得光亮，故选A。","tag":"动词辨析"},{"n":7,"no":47,"options":["differed from","resulted in","turned into","brought about"],"answer":"C","answerText":"turned into","explanation":"考查动词短语辨析。句意：我的不耐烦变成了着迷。A. differed from 与……不同；B. resulted in 导致；C. turned into 变成；D. brought about 引起。主语 impatience 与 fascination 是同一心态由前者变为后者的转变，故选C。","tag":"动词短语"},{"n":8,"no":48,"options":["recalling","preserving","demanding","selling"],"answer":"B","answerText":"preserving","explanation":"考查动词辨析。句意：我不只是在擦灰，而是在保存一段家族历史。A. recalling 回忆；B. preserving 保存；C. demanding 要求；D. selling 出售。与 cleaning 形成递进，说明擦拭这座老钟其实是在留住家族记忆，故选B。","tag":"动词辨析"},{"n":9,"no":49,"options":["complex","pricey","formal","valuable"],"answer":"D","answerText":"valuable","explanation":"考查形容词辨析。句意：那次经历给我上了宝贵的一课。A. complex 复杂的；B. pricey 昂贵的；C. formal 正式的；D. valuable 宝贵的。下句说与钟无关，重要的是与父亲共度的时光，可见这一课很珍贵，故选D。","tag":"形容词辨析"},{"n":10,"no":50,"options":["ignore","question","create","recognize"],"answer":"D","answerText":"recognize","explanation":"考查动词辨析。句意：我逐渐认识到他智慧和技能的价值。A. ignore 忽视；B. question 质疑；C. create 创造；D. recognize 认识到。came to recognize the value 表示逐渐懂得其价值，与下文 overlooked 呼应，故选D。","tag":"动词辨析"},{"n":11,"no":51,"options":["disagreed","overlooked","undertook","misplaced"],"answer":"B","answerText":"overlooked","explanation":"考查动词辨析。句意：这些技能是我曾一度忽视的。A. disagreed 不同意；B. overlooked 忽视；C. undertook 承担；D. misplaced 放错。该从句修饰 skills，呼应作者十五岁时自认 too cool 的心态，故选B。","tag":"动词辨析"},{"n":12,"no":52,"options":["touch","watch","wind","strike"],"answer":"C","answerText":"wind","explanation":"考查动词辨析。句意：每次回家我都看看这座钟并给它上发条。A. touch 触摸；B. watch 观看；C. wind 给钟表上发条；D. strike 敲响。老式机械钟须上发条才会走，与下句 to run forever 呼应，故选C。","tag":"动词辨析"},{"n":13,"no":53,"options":["moment","thought","highlight","reminder"],"answer":"D","answerText":"reminder","explanation":"考查名词辨析。句意：它也是我真正看懂父亲那一天的念想。A. moment 时刻；B. thought 想法；C. highlight 亮点；D. reminder 使人想起某事的提醒物。a reminder of... 指能唤起回忆的东西，故选D。","tag":"名词辨析"},{"n":14,"no":54,"options":["restore","purchase","discover","change"],"answer":"A","answerText":"restore","explanation":"考查动词辨析。句意：他的作坊是耐心与爱能修复一切坏损之物的庇护所。A. restore 修复；B. purchase 购买；C. discover 发现；D. change 改变。上文写父亲修好了旧钟，anything broken 与之呼应，故选A。","tag":"动词辨析"},{"n":15,"no":55,"options":["inspiration","imagination","attention","description"],"answer":"C","answerText":"attention","explanation":"考查名词辨析。句意：有些东西只需一点用心就能一直走下去。A. inspiration 灵感；B. imagination 想象力；C. attention 关注、照料；D. description 描述。与上句 patience and love 一致，指要人用心照看呵护，故选C。","tag":"名词辨析"}],"_source":"raw\\jx\\398.pdf"},{"id":"grammar-2026-第二部分 阅读理解（共两节，满分 50 分）-01","type":"grammar-fill","no":56,"score":15,"scorePerBlank":1.5,"instruction":"阅读下面短文，在空白处填入1个适当的单词或括号内单词的正确形式。","passage":"Jiuzhaigou Valley, a UNESCO World Heritage Site, is a place of breathtaking beauty that seems to belong to another world. Located in the mountains of Sichuan Province, this valley, with its world -famous reputation, {{1}} (witness) millions of visitors each year to a journey of a fairyland on earth.\nThe valley is named after the nine Tibetan villages {{2}} (dot) throughout its area with its most iconic features — the multicolored lakes, {{3}} crystal-clear water reflects the surrounding forests and sky in astonishing colors of emerald (翡翠).\nWalking along the wooden plank (板条) paths, people feel as if they are stepping into {{4}} living painting, where the air is fresh, and the silence is broken only by the sound of water {{5}} (flow) or birds singing in the ancient trees. It is this {{6}} (harmony) combination of elements that makes Jiuzhaigou so unique.\nHowever, a major earthquake causing significant damages happened in 2017, leading to a series of geological changes and the temporary {{7}} (close) of the park. Since then, greater efforts {{8}} (make) to restore its natural beauty and stricter tourist management policies have been carried out, like limiting the number of daily visitors to minimize human impact effectively.\nToday, Jiuzhaigou stands {{9}} a powerful model of nature ’s resilience and conservation, reminding us that we are not the owners of such wonders, {{10}} their guardians. Preserving its splendor for future generations is a responsibility we all share.","questions":[{"n":1,"no":56,"answer":"witnesses","answerText":"witnesses","explanation":"考查时态与主谓一致。主语是 this valley，each year 表明用一般现在时，谓语用第三人称单数形式，故填 witnesses。","tag":"时态/主谓一致"},{"n":2,"no":57,"answer":"dotting","answerText":"dotting","explanation":"考查非谓语动词。villages 与 dot 是主动关系，且表示散布的状态，用现在分词作后置定语，故填 dotting。","tag":"非谓语动词"},{"n":3,"no":58,"answer":"whose","answerText":"whose","explanation":"考查定语从句。先行词是 the multicolored lakes，从句中 water 与它是所属关系，用关系代词 whose 作定语，故填 whose。","tag":"定语从句"},{"n":4,"no":59,"answer":"a","answerText":"a","explanation":"考查冠词。painting 是可数名词单数，此处泛指一幅生动的画，living 以辅音音素开头，用 a，故填 a。","tag":"冠词"},{"n":5,"no":60,"answer":"flowing","answerText":"flowing","explanation":"考查非谓语动词。water 与 flow 是主动关系，且与 birds singing 并列作 the sound of 的宾语，用现在分词，故填 flowing。","tag":"非谓语动词"},{"n":6,"no":61,"answer":"harmonious","answerText":"harmonious","explanation":"考查词性转换。此处修饰名词 combination，需要形容词，harmony 的形容词形式是 harmonious，故填 harmonious。","tag":"词性转换"},{"n":7,"no":62,"answer":"closing","answerText":"closing","explanation":"考查词性转换。形容词 temporary 后接名词，close 的名词形式 closing 表示关闭，故填 closing。","tag":"词性转换"},{"n":8,"no":63,"answer":"have been made","answerText":"have been made","explanation":"考查时态与语态。Since then 是现在完成时标志，efforts 与 make 是被动关系且主语为复数，故填 have been made。","tag":"语态/时态"},{"n":9,"no":64,"answer":"as","answerText":"as","explanation":"考查介词。stand as 意为作为……而存在，此处指九寨沟成为自然韧性保护的典范，故填 as。","tag":"介词"},{"n":10,"no":65,"answer":"but","answerText":"but","explanation":"考查连词。not...but... 表示不是……而是……，此处说明我们不是这些奇迹的主人而是守护者，故填 but。","tag":"连词"}],"_source":"raw\\jx\\398.pdf"}]},{"id":"2026-广州零模","year":2026,"paperName":"广州零模","kind":"mock","items":[{"id":"cloze-2026-广州零模-01","type":"cloze","no":41,"score":15,"scorePerBlank":1,"instruction":"阅读下面短文，从每题所给的A、B、C、D四个选项中选出最佳选项。","passage":"The world is facing an energy crisis. I have a personal {{1}}, too.\nMy {{2}} is that we have different types of personal energy. For instance, I {{3}} to find the right switch in my mind to start cutting the fallen branches in my yard. Yet, at deer camp, I can cut and saw firewood with no problem, especially with a warm stew（炖肉）cooking. It’s a {{4}} story with shopping. The thought of the mall {{5}} me, but I jump like a kid if my brother calls with the {{6}} of baseball caps on sale. My wife laughs and says,\"That’s not an energy problem — it’s pure {{7}}.\"She was proven {{8}} last Saturday when my daughter Stephanie insisted we go hiking. We drove to the mountain outside town and started up. The track rose {{9}}, the sun burned, and my pack felt heavier each step. Soon, I was {{10}}. I thought about dropping it right there. I {{11}} future hikers find it and whisper,\"Poor soul.. he just {{12}} energy.\"\nThen Stephanie glanced back, saw my face, and said,\"Dad, there’s an ice cream stand at the top.\"That was exactly what I’d been {{13}}. We set high aims, but it’s the small {{14}} that keep us moving.\nNow it’s June, the perfect time for outdoor activities and small treats. May your summer bring you wonderful adventures and nice ice-cream {{15}}.","questions":[{"n":1,"options":["idea","plan","version","habit"],"answer":"C","answerText":"version","explanation":"名词词义辨析。句意：我也有自己的个人版本的危机。A. idea想法；B. plan计划；C. version版本；D. habit习惯。前文“The world is facing an energy crisis.”提到全球能源危机，后文讲个人精力问题，用 version体现“和全球危机对应，但属于个人层面的同类情况”，故选C","tag":"名词辨析"},{"n":2,"options":["problem","theory","worry","secret"],"answer":"B","answerText":"theory","explanation":"名词词义辨析。句意：我的看法是，我们每个人都有不同的个人能量类型。A. problem问题；B. theory理论，看法；C. worry担心；D. secret秘密。后文“we have different types of personal energy”提到我们每个人都有不同的个人能量类型，这是作者的看法或理论。故选B","tag":"名词辨析"},{"n":3,"options":["struggle","desire","choose","pretend"],"answer":"A","answerText":"struggle","explanation":"动词词义辨析。句意：例如，我在脑海中努力寻找合适的办法来开始处理院子里掉落的树枝。A. struggle努力，费劲；B. desire渴望；C. choose选择；D. pretend假装。后文“Yet, at deer camp, I can cut and saw firewood with no problem, especially with a warm stew cooking.（然而，在鹿群营地，我能够轻松地砍柴、锯木头，而且还能一边享用热气腾腾的炖菜一边进行这","tag":"动词辨析"},{"n":4,"options":["true","familiar","typical","similar"],"answer":"D","answerText":"similar","explanation":"形容词词义辨析。句意：购物也是类似的情况。A. true真的；B. familiar熟悉的；C. typical典型的；D. similar相似的。前文讲“修剪枯枝费劲，砍柴轻松”的反差，后文讲“逛商场厌烦，买棒球帽积极”的反差，属于同类逻辑，用similar衔接最自然。故选D","tag":"形容词辨析"},{"n":5,"options":["tires","confuses","shocks","disappoints"],"answer":"A","answerText":"tires","explanation":"动词词义辨析。句意：一想到购物中心那拥挤的场景就让我感到厌烦，但要是我哥哥打电话告诉我有棒球帽在打折，我就会像孩子一样兴奋起来。A. tires使疲惫，厌烦；B. confuses使困惑；C. shocks使震惊；D. disappoints使失望。but表转折，后文“I jump like a kid”是“兴奋”，前文必然是负面情绪，级拥挤的场景让作者厌烦。故选A","tag":"动词辨析"},{"n":6,"options":["excuse","order","thought","news"],"answer":"D","answerText":"news","explanation":"名词词义辨析。句意：一想到购物中心那拥挤的场景就让我感到厌烦，但要是我哥哥打电话告诉我有棒球帽在打折，我就会像孩子一样兴奋起来。A. excuse借口；B. order订单；C. thought想法；D. news新闻，消息。根据上文“I jump like a kid if my brother calls with the”可知，指哥哥打电话传递消息，故选D","tag":"名词辨析"},{"n":7,"options":["luck","laziness","imagination","motivation"],"answer":"D","answerText":"motivation","explanation":"名词词义辨析。句意：我的妻子笑着说道：“这根本不是精力问题——纯粹是动机问题（没动力）。” A. luck运气；B. laziness懒惰；C. imagination想象力；D. motivation动机。根据上文“to find the right switch in my mind to start cutting the fallen branches in my yard”以及购物的例子可知，妻子调侃作者：不想做的事就说没精力，想做的事就很积极，本质是“动机问题”，故","tag":"名词辨析"},{"n":8,"options":["clever","right","reliable","helpful"],"answer":"B","answerText":"right","explanation":"形容词词义辨析。句意：上周六，事实证明她是对的，当时我的女儿斯蒂芬妮坚持要我们去远足。A. clever聪明的；B. right正确的；C. reliable可靠的；D. helpful有帮助的。后文“the sun burned, and my pack felt heavier each step”徒步的经历印证了妻子的调侃，故选B","tag":"形容词辨析"},{"n":9,"options":["sharply","slowly","regularly","smoothly"],"answer":"A","answerText":"sharply","explanation":"副词词义辨析。句意：道路陡然上升，烈日炎炎，每走一步，我的背包都显得愈发沉重。A. sharply急剧地；B. slowly缓慢地；C. regularly定期地；D. smoothly顺利地。后文“my pack felt heavier each step”说背包变沉，可知山路难走，sharply修饰rise表“陡峭爬升”，故选A","tag":"副词辨析"},{"n":10,"options":["lost","drowned",

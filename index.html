/* ================= 答题页 ================= */
function renderPractice() {
  const app = $('#app');
  app.innerHTML = '';
  const { paper, item } = S;

  /* 顶栏 */
  const bar = el('div', 'topbar');
  const back = el('button', 'icon-btn', '‹');
  back.style.fontSize = '26px';
  back.setAttribute('aria-label', '返回');
  back.onclick = goUp;
  const sub = el('div', 'sub');
  sub.appendChild(el('b', null, `${paper.year} ${paperLabel(paper)}`));
  const prog = el('span', 'progress');
  sub.appendChild(prog);
  const fs = el('button', 'fs-btn', S.fontLarge ? '大号字' : '标准字');
  fs.onclick = () => {
    S.fontLarge = !S.fontLarge;
    localStorage.setItem('gk.fontLarge', S.fontLarge ? '1' : '0');
    document.documentElement.style.setProperty('--fs-passage', S.fontLarge ? '19px' : '17px');
    toast(S.fontLarge ? '已切换到大号字' : '已切回标准字');
  };
  bar.append(back, sub, fs);
  app.appendChild(bar);

  const page = el('div', 'page');
  const instr = el('p', 'instruction', item.instruction || '');
  page.appendChild(instr);
  page.appendChild(el('span', 'source', sourceLabel(paper)));

  if (S.graded) page.appendChild(buildResult());

  const card = el('div', 'card passage-card');
  for (const line of item.passage.split('\n')) {
    if (!line.trim()) continue;
    const p = el('p');
    renderLine(p, line, item);
    card.appendChild(p);
  }
  page.appendChild(card);

  /* 阅读理解：题目在文章后面，一题一张卡，四个选项都是大按钮 */
  if (item.type === 'reading') page.appendChild(buildQuestionList(item));
  else if (item.type === 'seven' && item.choices) page.appendChild(buildChoiceList(item));

  app.appendChild(page);

  /* 底栏 */
  const actions = el('div', 'actionbar');
  if (S.graded) {
    const again = el('button', 'btn btn-ghost', '重做');
    again.onclick = () => {
      S.answers = {};
      S.graded = false;
      S.resultMeta = null;
      startTimer();                 // 重做算新的一次，重新计时
      renderPractice();
    };
    const next = el('button', 'btn btn-primary', '再练一篇');
    next.onclick = () => {
      // 只在同一模块、同一类（真题/模拟）里换下一篇
      const rows = itemsOf(item.type, paper.kind || 'mock');
      const idx = rows.findIndex(([, it]) => it === S.item);
      const [np, ni] = rows[(idx + 1) % rows.length];
      openItem(np, ni);
    };
    actions.append(again, next);
  } else {
    const submit = el('button', 'btn btn-primary', '提交答案');
    submit.onclick = () => {
      const total = item.questions.length;
      const done = answeredCount();
      if (done < total) {
        // 不用 window.confirm：微信/QQ 内置浏览器会压制原生弹窗
        showDialog({
          title: '还没答完',
          text: `还有 ${total - done} ${typeInfo(item.type).unit}没作答，确定现在交卷吗？`,
          okText: '交卷',
          onOk: grade,
        });
        return;
      }
      grade();
    };
    actions.append(submit);
  }
  app.appendChild(actions);

  updateProgress();
}

function updateProgress() {
  const p = $('.progress');
  if (!p || !S.item) return;
  const total = qCount(S.item);
  const done = answeredCount();
  p.textContent = S.graded ? '已判分' : (total ? `已答 ${done}/${total}` : '写作');
  const submit = $('.btn-primary');
  if (submit && submit.textContent === '提交答案') {
    submit.disabled = done === 0;
  }
}

/** 一行正文 → 文本 + 空位 */
function renderLine(container, line, item) {
  const parts = line.split(/\{\{(\d+)\}\}/);
  parts.forEach((chunk, i) => {
    if (i % 2 === 0) {
      if (chunk) container.appendChild(document.createTextNode(chunk));
      return;
    }
    const n = Number(chunk);
    const q = item.questions.find(x => x.n === n);
    if (!q) return;
    container.appendChild(blankFor(q, item));
  });
}

/** 这个空用哪种交互：七选五 / 完形填字母，语法填空手写 */
function blankFor(q, item) {
  if (item && item.type === 'seven') return sevenBlank(q, item);
  return q.options ? clozeBlank(q) : grammarBlank(q);
}

/** 选项文字（七选五的 7 个选项挂在 item.choices 上） */
function choiceTextOf(item, letter) {
  if (!item || !item.choices) return '';
  const i = 'ABCDEFG'.indexOf(String(letter || '').toUpperCase());
  if (i < 0 || i >= item.choices.length) return '';
  return String(item.choices[i]).replace(/^\s*[A-G][\.\、\)]\s*/, '');
}

function sevenBlank(q, item) {
  const b = el('button', 'blank');
  b.dataset.n = String(q.n);
  paintBlank(b, q);
  b.setAttribute('aria-label', `第 ${q.n} 空`);
  b.onclick = () => {
    if (S.graded) { showExplain(q.n); return; }
    toggleChoiceOptions(q, item, b);
  };
  return b;
}

/* ================= 阅读理解：题卡列表 ================= */
function buildQuestionList(item) {
  const box = el('div', 'q-list');
  const head = el('div', 'section-head');
  head.appendChild(el('h3', null, '题目'));
  head.appendChild(el('span', 'section-note',
    `${item.questions.length} 题 · ${S.graded ? '正确答案已标注' : '选一个选项'}`));
  box.appendChild(head);

  for (const q of item.questions) {
    const card = el('div', 'card q-card');
    const h = el('div', 'q-head');
    h.appendChild(el('b', 'q-no', q.no || String(q.n)));
    h.appendChild(el('span', 'q-stem', q.stem || '（缺题干）'));
    card.appendChild(h);

    const chosen = String(S.answers[q.n] || '').toUpperCase();
    const right = String(q.answer || '').toUpperCase();
    (q.options || []).forEach((text, i) => {
      const letter = 'ABCD'[i];
      const on = chosen === letter;
      let cls = 'q-opt';
      if (S.graded) {
        if (letter === right) cls += ' ok';
        else if (on) cls += ' bad';
      } else if (on) cls += ' on';
      const row = el(S.graded ? 'div' : 'button', cls);
      row.appendChild(el('span', 'k', letter));
      row.appendChild(el('span', 'v', text));
      if (!S.graded) {
        row.onclick = () => {
          S.answers[q.n] = letter;
          refreshQuestionList();
          updateProgress();
        };
      }
      card.appendChild(row);
    });

    if (S.graded) {
      const ex = el('div', 'q-explain');
      const tag = el('div', 'q-explain-head');
      tag.appendChild(el('span', 'rv-badge ' + (judge(q, S.answers[q.n]) ? 'rv-badge-ok' : 'rv-badge-bad'),
        norm(S.answers[q.n]) ? (judge(q, S.answers[q.n]) ? '正确' : '错误') : '未作答'));
      tag.appendChild(el('span', 'rv-v ok', answerLabel(q)));
      ex.appendChild(tag);
      ex.appendChild(el('p', null, q.explanation || '（本题暂无解析）'));
      card.appendChild(ex);
    }
    box.appendChild(card);
  }
  return box;
}

/** 只重画题卡列表（保持滚动位置，不整页重绘） */
function refreshQuestionList() {
  const old = document.querySelector('.q-list');
  if (!old) return;
  const fresh = buildQuestionList(S.item);
  fresh.classList.add('q-list-fresh');
  old.replaceWith(fresh);
}

/** 七选五：文章后面列出 7 个选项，点一下就能填到当前选中的空 */
function buildChoiceList(item) {
  const box = el('div', 'card choice-card');
  box.appendChild(el('b', 'choice-title',
    `选项 ${item.choices.length} 个${item.questions.length < item.choices.length
      ? `，有 ${item.choices.length - item.questions.length} 个是多余的` : ''} · 先点上面的空位，再选`));
  (item.choices || []).forEach((raw, i) => {
    const letter = 'ABCDEFG'[i];
    const text = String(raw).replace(/^\s*[A-G][\.\、\)]\s*/, '');
    const usedBy = item.questions.find(x => String(S.answers[x.n] || '').toUpperCase() === letter);
    const row = el('div', `choice-row${usedBy ? ' used' : ''}`);
    row.appendChild(el('span', 'k', letter));
    row.appendChild(el('span', 'v', text));
    if (usedBy && !S.graded) row.appendChild(el('span', 'choice-used', `已填 ${usedBy.n}`));
    if (S.graded) {
      const right = item.questions.find(x => String(x.answer || '').toUpperCase() === letter);
      if (right) row.classList.add('right');
      else row.classList.add('unused');
    }
    box.appendChild(row);
  });
  return box;
}

function clozeBlank(q) {
  const b = el('button', 'blank');
  b.dataset.n = String(q.n);
  paintBlank(b, q);
  b.onclick = () => {
    if (S.graded) { showExplain(q.n); return; }
    toggleInlineOptions(q, b);
  };
  return b;
}

function grammarBlank(q) {
  const b = el('span', 'blank');
  const input = el('input');
  input.value = S.answers[q.n] || '';
  input.placeholder = '填空';
  input.autocapitalize = 'off';
  input.autocomplete = 'off';
  input.spellcheck = false;
  input.disabled = S.graded;
  input.addEventListener('input', () => {
    S.answers[q.n] = input.value;
    updateProgress();
  });
  b.appendChild(input);
  if (S.graded) {
    b.classList.add(judge(q, S.answers[q.n]) ? 'ok' : 'bad');
    b.onclick = () => showExplain(q.n);
  }
  return b;
}

function paintBlank(b, q) {
  const v = S.answers[q.n];
  if (S.graded) {
    b.textContent = v ? String(v).toUpperCase() : '—';
    b.classList.add(judge(q, v) ? 'ok' : 'bad');
    b.onclick = () => showExplain(q.n);
    return;
  }
  if (norm(v)) {
    b.textContent = String(v).toUpperCase();
    b.classList.add('filled');
  } else {
    b.textContent = String(q.n);
  }
}

/* ================= 行内选项（不遮原文） ================= */
let inlineRow = null;

function closeInlineOptions() {
  if (inlineRow && inlineRow.isConnected) inlineRow.remove();
  inlineRow = null;
}

/**
 * 点某个空 → 就在那一行下面展开 4 个选项，正文其它部分完全不动、不被遮挡。
 * 选中后自动收起，并滚到下一个没答的空。
 */
function toggleInlineOptions(q, btn) {
  if (inlineRow && inlineRow.dataset.n === String(q.n)) { closeInlineOptions(); return; }
  closeInlineOptions();

  const row = el('span', 'opt-row');
  row.dataset.n = String(q.n);

  q.options.forEach((text, i) => {
    const letter = 'ABCD'[i];
    const on = String(S.answers[q.n] || '').toUpperCase() === letter;
    const chip = el('button', `opt-chip${on ? ' on' : ''}`);
    const k = el('span', 'k', letter);
    chip.appendChild(k);
    chip.appendChild(el('span', 'v', text));
    chip.onclick = (ev) => {
      ev.stopPropagation();
      S.answers[q.n] = letter;
      closeInlineOptions();
      refreshBlanks();
      updateProgress();
      const next = S.item.questions.find(x => x.options && !norm(S.answers[x.n]));
      if (next) {
        const target = document.querySelector(`.blank[data-n="${next.n}"]`);
        if (target) target.scrollIntoView({ block: 'center', behavior: 'smooth' });
      }
    };
    row.appendChild(chip);
  });

  btn.after(row);
  inlineRow = row;
  row.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
}

/**
 * 七选五：点空位就在那一行下面展开 7 个选项（A–G）。
 * 已经用在别的空上的选项会淡一点、标「已用」，但仍然可选（允许学生先试后改）。
 */
function toggleChoiceOptions(q, item, btn) {
  if (inlineRow && inlineRow.dataset.n === String(q.n)) { closeInlineOptions(); return; }
  closeInlineOptions();

  const row = el('span', 'opt-row opt-row-7');
  row.dataset.n = String(q.n);
  const used = new Set(item.questions
    .filter(x => x.n !== q.n)
    .map(x => String(S.answers[x.n] || '').toUpperCase())
    .filter(Boolean));

  (item.choices || []).forEach((raw, i) => {
    const letter = 'ABCDEFG'[i];
    const text = String(raw).replace(/^\s*[A-G][\.\、\)]\s*/, '');
    const on = String(S.answers[q.n] || '').toUpperCase() === letter;
    const chip = el('button', `opt-chip${on ? ' on' : ''}${used.has(letter) ? ' used' : ''}`);
    chip.appendChild(el('span', 'k', letter));
    chip.appendChild(el('span', 'v', text));
    chip.onclick = (ev) => {
      ev.stopPropagation();
      S.answers[q.n] = letter;
      closeInlineOptions();
      refreshBlanks();
      updateProgress();
      const next = S.item.questions.find(x => !norm(S.answers[x.n]));
      if (next) {
        const target = document.querySelector(`.blank[data-n="${next.n}"]`);
        if (target) target.scrollIntoView({ block: 'center', behavior: 'smooth' });
      }
    };
    row.appendChild(chip);
  });

  btn.after(row);
  inlineRow = row;
  row.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
}

/* ================= 选项面板（判分后看解析用） ================= */
function openSheet(n) {
  S.sheetN = n;
  const q = S.item.questions.find(x => x.n === n);
  const sheet = $('#sheet');
  sheet.innerHTML = '';

  const head = el('div', 'sheet-head');
  head.appendChild(el('b', null, `第 ${n} 空`));
  head.appendChild(el('span', 'muted', S.graded ? '正确答案已标注' : '选一个选项'));
  sheet.appendChild(head);

  const body = el('div', 'sheet-body');
  /* 七选五的选项挂在 item.choices 上，完形/阅读挂在 q.options 上 */
  const opts = q.options || (S.item.choices || []);
  const letters = 'ABCDEFG';
  opts.forEach((raw, i) => {
    const letter = letters[i];
    const text = q.options ? raw : String(raw).replace(/^\s*[A-G][\.\、\)]\s*/, '');
    const row = el('button', 'opt');
    row.appendChild(el('span', 'letter', letter));
    row.appendChild(el('span', null, text));
    const chosen = norm(S.answers[n]) === letter.toLowerCase() || norm(S.answers[n]) === norm(text);
    if (S.graded) {
      const isAnswer = letter === String(q.answer || '').toUpperCase();
      if (isAnswer) row.classList.add('ok');
      else if (chosen) row.classList.add('bad');
    } else {
      row.setAttribute('aria-pressed', String(chosen));
      row.onclick = () => {
        S.answers[n] = letter;
        closeSheet();
        refreshBlanks();
        updateProgress();
        const nextEmpty = S.item.questions.find(x => (x.options || S.item.choices) && !norm(S.answers[x.n]));
        if (nextEmpty) setTimeout(() => openSheet(nextEmpty.n), 180);
      };
    }
    body.appendChild(row);
  });
  sheet.appendChild(body);

  const foot = el('div', 'sheet-foot');
  if (!S.graded) {
    const clear = el('button', 'btn btn-ghost', '清除本题');
    clear.style.flex = '1';
    clear.onclick = () => {
      delete S.answers[n];
      closeSheet();
      refreshBlanks();
      updateProgress();

    foot.appendChild(clear);

  const close = el('button', 'btn btn-primary', '关闭');
  close.onclick = closeSheet;
  foot.appendChild(close);
  sheet.appendChild(foot);

  sheet.classList.add('show');
  $('#scrim').classList.add('show');
}

/* ================= 判分 ================= */
function grade() {
  const item = S.item, paper = S.paper;
  const per = item.scorePerBlank || 1;
  let correct = 0;
  for (const q of item.questions) if (judge(q, S.answers[q.n])) correct++;
  const total = item.questions.length;

  const secs = elapsedSecs();
  const pauses = S.timer ? S.timer.pauses : 0;
  const lv = levelOf(correct, total);

  addRecord({
    id: `${Date.now()}-${Math.random().toString(36).slice(2, 7)}`,
    at: Date.now(),
    year: paper.year, paperName: paper.paperName, kind: paper.kind || 'mock',
    itemId: item.id, type: item.type,
    score: Math.round(correct * per * 10) / 10,
    full: item.score,
    correct, total, secs, pauses, level: lv.lv,
    answers: Object.assign({}, S.answers),
  });

  S.timer = null;
  S.resultMeta = { secs, pauses, level: lv.lv, at: Date.now(), from: 'now' };
  S.graded = true;
  renderReview();          // 交卷后直接进独立的解析页
}

/** 独立的「整体解析」页：分数 + 逐题答案与解析 */
function renderReview() {
  const app = $('#app');
  app.innerHTML = '';
  const { paper, item } = S;
  const isHistory = !!(S.resultMeta && S.resultMeta.from === 'history');

  /* 顶栏 */
  const bar = el('div', 'topbar');
  const back = el('button', 'icon-btn', '‹');
  back.style.fontSize = '26px';
  back.setAttribute('aria-label', isHistory ? '返回记录' : '返回答题');
  back.onclick = isHistory ? (S.recordBack || renderRecords) : renderPractice;
  const sub = el('div', 'sub');
  sub.appendChild(el('b', null, isHistory ? '历史记录 · 解析' : '整体解析'));
  sub.appendChild(el('span', 'progress', `${paper.year} ${paperLabel(paper)}`));
  const seg = el('div', 'seg');
  const tabA = el('button', 'on', '解析');
  const tabB = el('button', null, '原文');
  seg.append(tabA, tabB);
  bar.append(back, sub, seg);
  app.appendChild(bar);

  const page = el('div', 'page');
  page.appendChild(buildResult());

  /* ---------- 面板 A：逐题解析 ---------- */
  const panelA = el('div');

  const head = el('div', 'section-head');
  head.appendChild(el('h3', null, '逐题解析'));
  head.appendChild(el('span', 'section-note', `${item.questions.length} 题 · 每题都有解析`));
  panelA.appendChild(head);

  for (const q of item.questions) {
    panelA.appendChild(questionBlock(item, q, S.answers[q.n]));
  }

  panelA.appendChild(el('p', 'source', sourceLabel(paper)));

  /* ---------- 面板 B：原文（答案已填入） ---------- */
  const panelB = el('div', 'hidden');
  const hint = el('p', 'section-note');
  hint.style.margin = '0 2px 10px';
  /* 有的空有并列答案，原文里只能填一种，提示学生以解析页为准 */
  const hasAlt = item.questions.some(q => q.accept && q.accept.length);
  hint.textContent = '下方是原文，空位已用绿色填上正确答案'
    + (hasAlt ? '（个别空有并列答案，写另一种也算对，详见「解析」）' : '')
    + '；点右上角「解析」可切回逐题解析。';
  panelB.appendChild(hint);

  const card = el('div', 'card passage-card');
  for (const line of item.passage.split('\n')) {
    if (!line.trim()) continue;
    const p = el('p');
    const parts = line.split(/\{\{(\d+)\}\}/);
    parts.forEach((chunk, i) => {
      if (i % 2 === 0) { if (chunk) p.appendChild(document.createTextNode(chunk)); return; }
      const q = item.questions.find(x => x.n === Number(chunk));
      if (!q) return;
      const span = el('span', 'ans-inline');
      span.textContent = q.options
        ? `${q.answer}. ${q.answerText || ''}`.trim()
        : (correctList(q)[0] || q.answer);   // 并列答案填第一种，读起来才顺
      p.appendChild(span);
    });
    card.appendChild(p);
  }
  panelB.appendChild(card);

  page.append(panelA, panelB);
  app.appendChild(page);

  const showTab = (which) => {
    const isA = which === 'a';
    panelA.classList.toggle('hidden', !isA);
    panelB.classList.toggle('hidden', isA);
    tabA.classList.toggle('on', isA);
    tabB.classList.toggle('on', !isA);
    window.scrollTo({ top: 0 });
  };
  tabA.onclick = () => showTab('a');
  tabB.onclick = () => showTab('b');

  const actions = el('div', 'actionbar');
  if (isHistory) {
    /* 回看历史：给「返回记录」和「再做这篇」，不覆盖这次的历史数据 */
    const backRec = el('button', 'btn btn-ghost', '返回记录');
    backRec.onclick = renderRecords;
    const redo = el('button', 'btn btn-primary', '再做这篇');
    redo.onclick = () => openItem(paper, item);
    actions.append(backRec, redo);
  } else {
    const again = el('button', 'btn btn-ghost', '重做这篇');
    again.onclick = () => {
      S.answers = {};
      S.graded = false;
      S.resultMeta = null;
      startTimer();
      renderPractice();
    };
    const next = el('button', 'btn btn-primary', '再练一篇');
    next.onclick = () => {
      // 只在同一模块、同一类（真题/模拟）里换下一篇
      const rows = itemsOf(item.type, paper.kind || 'mock');
      const idx = rows.findIndex(([, it]) => it === item);
      const [np, ni] = rows[(idx + 1) % rows.length];
      openItem(np, ni);
    };
    actions.append(again, next);
  }
  app.appendChild(actions);
  window.scrollTo({ top: 0 });
}

function buildResult() {
  const item = S.item;
  const per = item.scorePerBlank || 1;
  let correct = 0;
  for (const q of item.questions) if (judge(q, S.answers[q.n])) correct++;
  const total = item.questions.length;
  const score = Math.round(correct * per * 10) / 10;

  const box = el('div', 'result');
  box.appendChild(el('span', 'score', String(score)));
  box.appendChild(el('span', 'max', `/ ${item.score}`));
  const d = el('div', 'detail');
  d.appendChild(el('div', null, `正确 ${correct} / ${total}`));
  d.appendChild(el('div', null, `正确率 ${Math.round(correct / total * 100)}%`));
  box.appendChild(d);

  const wrap = el('div');
  wrap.appendChild(box);
  wrap.appendChild(scoreMetaLine());
  return wrap;
}

/** 交卷后的「用时 / 等级」行；回看历史时显示那一次的用时 */
function scoreMetaLine() {
  const meta = S.resultMeta;
  if (!meta) return el('div');
  const line = el('div', 'meta-line');
  line.appendChild(lvBadge(meta.level));
  line.appendChild(el('span', null, `用时 ${fmtDur(meta.secs)}`));
  if (meta.pauses) line.appendChild(el('span', null, `· 切后台暂停 ${meta.pauses} 次`));
  const t = LEVEL_TABLE.find(x => x.lv === meta.level);
  if (t) line.appendChild(el('span', null, `· ${t.tip}`));
  if (meta.from === 'history' && meta.at) line.appendChild(el('span', null, `· ${fmtDate(meta.at)} 做的`));
  return line;
}

/* ================= 做题记录 · 考点热力图 ================= */
const REC_KEY = 'gk.records.v1';
const REC_BAK = 'gk.records.bak';   // 冗余副本：主键被系统清掉时还能救回来
const REC_MAX = 200;               // 自动瘦身：只保留最近 200 次

/** 五档等级：S/A/B/C/D，按正确率定档 */
const LEVEL_TABLE = [
  { lv: 'S', min: 0.90, tip: '稳了，接下来练速度和细节' },
  { lv: 'A', min: 0.80, tip: '良好，个别空失手' },
  { lv: 'B', min: 0.65, tip: '中等，有明确的知识漏洞' },
  { lv: 'C', min: 0.50, tip: '偏弱，建议按考点专项补' },
  { lv: 'D', min: 0.00, tip: '基础不牢，先把语法框架过一遍' },
];

function levelOf(correct, total) {
  const r = total ? correct / total : 0;
  return LEVEL_TABLE.find(x => r >= x.min) || LEVEL_TABLE[LEVEL_TABLE.length - 1];
}
function lvBadge(lv) {
  const known = LEVEL_TABLE.some(x => x.lv === lv);
  return el('span', `lv-badge ${known ? 'lv-' + lv : 'lv-na'}`, known ? lv : '—');
}
function fmtDur(sec) {
  sec = Math.max(0, Math.round(sec || 0));
  const h = Math.floor(sec / 3600), m = Math.floor((sec % 3600) / 60), s = sec % 60;
  const p = n => String(n).padStart(2, '0');
  return h ? `${h}:${p(m)}:${p(s)}` : `${m}:${p(s)}`;
}
function fmtDate(ms) {
  const d = new Date(ms), p = n => String(n).padStart(2, '0');
  return `${p(d.getMonth() + 1)}/${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
}

/* ---------- 计时：进答题页开始，切后台自动暂停 ---------- */
function startTimer() {
  S.timer = { startedAt: Date.now(), pausedMs: 0, pausedAt: null, pauses: 0 };
}
function pauseTimer() {
  if (S.timer && !S.timer.pausedAt) {
    S.timer.pausedAt = Date.now();
    S.timer.pauses++;
  }
}
function resumeTimer() {
  if (S.timer && S.timer.pausedAt) {
    S.timer.pausedMs += Date.now() - S.timer.pausedAt;
    S.timer.pausedAt = null;
  }
}
function elapsedSecs() {
  if (!S.timer) return 0;
  const end = S.timer.pausedAt || Date.now();
  return Math.max(0, Math.round((end - S.timer.startedAt - S.timer.pausedMs) / 1000));
}

/* ---------- 记录读写（纯本地，不上传） ---------- */
function readKey(key) {
  try {
    const v = JSON.parse(localStorage.getItem(key) || 'null');
    return Array.isArray(v) ? v : null;
  } catch (e) {
    return null;
  }
}
function loadRecords() {
  if (Array.isArray(S.history)) return S.history;
  const main = readKey(REC_KEY);
  const bak = readKey(REC_BAK);
  /* 主键有数据就用主键；主键空了但副本还在（缓存被系统清过、换过浏览器）就用副本 */
  if (main && main.length) S.history = main;
  else if (bak && bak.length) {
    S.history = bak;
    saveRecords();
  } else S.history = main || bak || [];
  return S.history;
}
function saveRecords(list) {
  try {
    if (Array.isArray(list)) S.history = list;   // 允许显式传入，避免误以为参数生效
    if (Array.isArray(S.history) && S.history.length > REC_MAX) S.history.splice(REC_MAX);
    const json = JSON.stringify(S.history || []);
    localStorage.setItem(REC_KEY, json);
    localStorage.setItem(REC_BAK, json);      // 双份写入，降低被清空的风险
    if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
    return true;
  } catch (e) {
    toast('记录存不下了：浏览器本地空间不足');
    return false;
  }
}
function addRecord(rec) {
  const list = loadRecords();
  list.unshift(rec);
  if (list.length > REC_MAX) list.splice(REC_MAX);   // 超出上限自动丢最旧的
  saveRecords();
}
function delRecord(id) {
  const list = loadRecords();
  const i = list.findIndex(r => r.id === id);
  if (i < 0) return null;
  return list.splice(i, 1)[0];
}
function findItemById(id) {
  for (const p of (S.bank ? S.bank.papers : [])) {
    for (const it of p.items) if (it.id === id) return [p, it];
  }
  return null;
}

/**
 * 记录里的篇目：先按 itemId 找；找不到就用记录自带的年份 / 卷名 / 题型兜底。
 * 这样即使某篇的 id 后来被规范化过，学生的历史记录也不会变成「篇目已移除」。
 */
function resolveRecord(r) {
  const hit = findItemById(r.itemId);
  if (hit) return hit;
  const papers = (S.bank ? S.bank.papers : []).filter(p =>
    p.year === r.year && p.paperName === r.paperName);
  for (const p of papers) {
    const same = p.items.filter(it => it.type === r.type);
    if (same.length === 1) return [p, same[0]];
  }
  return null;
}

/** 汇总所有记录：考点错误分布、分模块战绩、等级分布 */
function aggregate(list) {
  const agg = {
    attempts: 0, correct: 0, total: 0, secs: 0, missing: 0,
    tags: new Map(), mods: new Map(), levels: { S: 0, A: 0, B: 0, C: 0, D: 0 },
  };
  for (const r of list) {
    agg.attempts++;
    agg.correct += r.correct || 0;
    agg.total += r.total || 0;
    agg.secs += r.secs || 0;
    if (agg.levels[r.level] != null) agg.levels[r.level]++;
    const m = agg.mods.get(r.type) || { attempts: 0, correct: 0, total: 0 };
    m.attempts++; m.correct += r.correct || 0; m.total += r.total || 0;
    agg.mods.set(r.type, m);

    const found = resolveRecord(r);
    if (!found) { agg.missing++; continue; }
    const qs = found[1].questions;
    if (qs && qs.length) {
      for (const q of qs) {
        const tag = q.tag || '其他';
        const cell = agg.tags.get(tag) || { n: 0, wrong: 0 };
        cell.n++;
        if (!judge(q, r.answers ? r.answers[q.n] : null)) cell.wrong++;
        agg.tags.set(tag, cell);
      }
    } else if (r.dims) {
      /* 写作：热力图按「内容/语言/结构/连贯/规范」统计达标率 */
      for (const k of Object.keys(r.dims)) {
        const label = (WRITING_DIMS.find(d => d.key === k) || { label: k }).label;
        const cell = agg.tags.get(label) || { n: 0, wrong: 0 };
        cell.n++;
        if (r.dims[k] !== 'ok') cell.wrong++;
        agg.tags.set(label, cell);
      }
    }
  }
  return agg;
}

/** 热力档位：0 全对 / 1–4 按错误率递增 */
function heatBand(wrong, n) {
  if (!wrong) return 0;
  const r = wrong / n;
  return r <= 0.2 ? 1 : r <= 0.4 ? 2 : r <= 0.6 ? 3 : 4;
}

function sectionHead(title, note) {
  const h = el('div', 'section-head');
  h.appendChild(el('h3', null, title));
  if (note) h.appendChild(el('span', 'section-note', note));
  return h;
}

function emptyBox(text) {
  return el('div', 'empty-box', text);
}

/* ================= 六维能力六边形（首页收起，点开才展开） ================= */
const HEX_AXES = [
  { key: 'cloze', label: '完形' },
  { key: 'grammar-fill', label: '语法' },
  { key: 'reading', label: '阅读' },
  { key: 'seven', label: '七选五' },
  { key: 'writing', label: '写作' },
  { key: 'steady', label: '稳定' },
];

function svgEl(tag, attrs) {
  const n = document.createElementNS('http://www.w3.org/2000/svg', tag);
  for (const k in attrs) n.setAttribute(k, attrs[k]);
  return n;
}

/**
 * 速度指标：按「每题用时 vs 目标用时」算 0–1。
 * 它不再占六边形的一轴（那一轴换成了写作），只在面板里作为一行小指标显示。
 */
function hexPace() {
  let sum = 0, n = 0;
  for (const r of loadRecords()) {
    const qn = r.answers ? Object.keys(r.answers).length : 0;
    const target = PACE_TARGET[r.type];
    if (qn && r.secs != null && target) {
      sum += Math.max(0, Math.min(1, target / (r.secs / qn)));
      n++;
    }
  }
  return { sum, n };
}

/** 六个维度各自的 0–1 分（没练过返回 null） */
function hexValues() {
  const list = loadRecords();
  const acc = {};
  for (const r of list) {
    const a = acc[r.type] || (acc[r.type] = { correct: 0, total: 0 });
    a.correct += r.correct || 0;
    a.total += r.total || 0;          // 题数用 total，别和满分 full 混了
  }
  const rate = (t) => (acc[t] && acc[t].total ? acc[t].correct / acc[t].total : null);
  /* 写作：应用文与续写合起来看 */
  const writingRate = (() => {
    const a = acc['applied'], c = acc['continuation'];
    const total = ((a && a.total) || 0) + ((c && c.total) || 0);
    if (!total) return null;
    return (((a && a.correct) || 0) + ((c && c.correct) || 0)) / total;
  })();
  /* 稳定度：最近 8 次的得分率越集中越稳 */
  const recent = list.slice(0, 8)
    .filter(r => r.total)
    .map(r => (r.correct || 0) / r.total);
  let steady = null;
  if (recent.length >= 2) {
    const m = recent.reduce((s, x) => s + x, 0) / recent.length;
    const sd = Math.sqrt(recent.reduce((s, x) => s + (x - m) * (x - m), 0) / recent.length);
    steady = Math.max(0, Math.min(1, 1 - sd / 0.25));
  }
  return HEX_AXES.map(ax => ({
    label: ax.label,
    value: ax.key === 'writing' ? writingRate
      : ax.key === 'steady' ? steady : rate(ax.key),
  }));
}

/** 画六边形：外圈=满分，往里越浅 */
function hexChart(values) {
  const W = 320, H = 250, cx = W / 2, cy = 118, R = 88;
  const svg = svgEl('svg', { viewBox: `0 0 ${W} ${H}`, class: 'hex-chart', role: 'img' });
  svg.appendChild(svgEl('title', {})).textContent = '六维能力图';
  const pt = (i, r) => {
    const a = (-90 + i * 60) * Math.PI / 180;
    return [cx + r * Math.cos(a), cy + r * Math.sin(a)];
  };
  const poly = (r) => values.map((_, i) => pt(i, r).map(v => v.toFixed(1)).join(',')).join(' ');

  for (const frac of [1, 0.66, 0.33]) {
    const g = svgEl('polygon', {
      points: poly(R * frac),
      fill: frac === 1 ? 'var(--card)' : 'none',
      stroke: 'var(--line)',
      'stroke-width': 1,
    });
    svg.appendChild(g);
  }
  for (let i = 0; i < 6; i++) {
    const [x, y] = pt(i, R);
    svg.appendChild(svgEl('line', {
      x1: cx, y1: cy, x2: x.toFixed(1), y2: y.toFixed(1),
      stroke: 'var(--line)', 'stroke-width': 1,
    }));
  }
  const filled = values.map((v, i) => pt(i, R * Math.max(0.04, v.value || 0)).map(x => x.toFixed(1)).join(',')).join(' ');
  svg.appendChild(svgEl('polygon', {
    points: filled, fill: 'var(--accent)', 'fill-opacity': 0.18,
    stroke: 'var(--accent)', 'stroke-width': 2, 'stroke-linejoin': 'round',
  }));
  values.forEach((v, i) => {
    if (v.value == null) return;
    const [x, y] = pt(i, R * Math.max(0.04, v.value));
    svg.appendChild(svgEl('circle', { cx: x.toFixed(1), cy: y.toFixed(1), r: 3, fill: 'var(--accent)' }));
  });
  values.forEach((v, i) => {
    const [x, y] = pt(i, R + 20);
    const t = svgEl('text', {
      x: x.toFixed(1), y: (y + 4).toFixed(1), class: 'hex-ax',
      'text-anchor': Math.abs(x - cx) < 6 ? 'middle' : (x > cx ? 'start' : 'end'),
    });
    t.textContent = v.label;
    svg.appendChild(t);
  });
  return svg;
}

/** 首页的六边形入口：收起时只有一行标题和小图标 */
function hexEntry() {
  const wrap = el('div', 'hex-wrap');
  const values = hexValues();
  const list = loadRecords();

  const card = el('button', 'record-card hex-card');
  const main = el('div', 'paper-main');
  main.appendChild(el('b', null, '能力六边形'));
  if (list.length) {
    const done = values.filter(v => v.value != null).length;
    main.appendChild(el('span', 'module-note',
      done ? `${done} 个维度有数据 · 点开看` : '点开看'));
  } else {
    main.appendChild(el('span', 'module-note', '做完一篇就有图了'));
  }
  card.appendChild(main);
  const glyph = el('div', 'hex-glyph');
  glyph.appendChild(miniHex(values));
  card.appendChild(glyph);
  card.appendChild(el('span', 'module-arrow', S.hexOpen ? '⌄' : '›'));
  card.onclick = () => {
    S.hexOpen = !S.hexOpen;
    renderHome();
  };
  wrap.appendChild(card);

  if (S.hexOpen) {
    const box = el('div', 'hex-open');
    if (!list.length) {
      box.appendChild(emptyBox('还没有练习记录。做完一篇交卷后，这六个维度就会开始长出形状。'));
    } else {
      box.appendChild(hexChart(values));
      const overall = levelOf(
        list.reduce((s, r) => s + (r.correct || 0), 0),
        list.reduce((s, r) => s + (r.total || 0), 0));
      const line = el('div', 'hex-overall');
      line.appendChild(el('b', null, '总体'));
      line.appendChild(lvBadge(overall.lv));
      line.appendChild(el('span', null, overall.tip));
      box.appendChild(line);
      const unp = values.filter(v => v.value == null);
      if (unp.length) {
        box.appendChild(el('p', 'hex-note',

      }
      const pace = hexPace();
      if (pace.n) {
        box.appendChild(el('p', 'hex-note',
          `平均速度 ${Math.round(pace.sum / pace.n * 100)}%（不再占轴上位置，单独看）`));
      }
    }
    wrap.appendChild(box);
  }
  return wrap;
}

/** 卡片右侧的小六边形：一眼看出形状 */
function miniHex(values) {
  const S0 = 34, c = 18, r = 13;
  const svg = svgEl('svg', { viewBox: `0 0 ${S0} ${S0}`, class: 'hex-mini' });
  const pt = (i, rr) => {
    const a = (-90 + i * 60) * Math.PI / 180;
    return [c + rr * Math.cos(a), c + rr * Math.sin(a)];
  };
  svg.appendChild(svgEl('polygon', {
    points: values.map((_, i) => pt(i, r).map(v => v.toFixed(1)).join(',')).join(' '),
    fill: 'none', stroke: 'var(--line)', 'stroke-width': 1.2,
  }));
  if (values.some(v => v.value != null)) {
    svg.appendChild(svgEl('polygon', {
      points: values.map((v, i) => pt(i, r * Math.max(0.06, v.value || 0)).map(x => x.toFixed(1)).join(',')).join(' '),
      fill: 'var(--accent)', 'fill-opacity': 0.28, stroke: 'var(--accent)', 'stroke-width': 1.4,
    }));
  }
  return svg;
}

/** 记录页只统计某个部分的数据：进来前先设 S.recPart */
function recordsOfPart(part) {
  const types = typesOfPart(part);
  return loadRecords().filter(r => types.includes(r.type));
}

/* ---------- 记录页（按部分独立） ---------- */
function renderRecords() {
  const app = $('#app');
  app.innerHTML = '';
  const part = S.recPart || 3;
  const p = partDef(part) || PARTS[2];
  S.part = part;
  S.module = null;
  const all = loadRecords();
  const list = recordsOfPart(part);

  app.appendChild(backBar(`${p.code} 记录`, list.length ? `共 ${list.length} 次练习` : '还没有记录',
    () => { S.part = part; renderPart(); }));

  const page = el('div', 'page');
  const head = el('div', 'rec-hero');
  head.appendChild(el('h3', null, `${p.title} · 考点热力图`));
  head.appendChild(el('p', null, list.length === all.length
    ? '这里只统计这个部分的练习'
    : `这个部分 ${list.length} 次 · 全部部分 ${all.length} 次`));
  page.appendChild(head);

  const seg = el('div', 'seg seg-wide');
  const tabA = el('button', S.recTab === 'heat' ? 'on' : null, '热力图');
  const tabB = el('button', S.recTab === 'list' ? 'on' : null, '记录');
  seg.append(tabA, tabB);

  const panelB = el('div', 'hidden');

  tabB.onclick = () => showTab(false);

}

function buildHeatPanel(container, list) {
  if (!list.length) {
    container.appendChild(emptyBox(
      '还没有记录。做完一篇交卷后，这里会自动记下得分、用时与等级，并把错题归到考点上，形成你的专属热力图。'));
    return;
  }
  const agg = aggregate(list);
  /* 记录指向的篇目已从题库移除时，别硬凑出「0% / D 级」这种误导结论 */
  if (!agg.tags.size) {
    container.appendChild(emptyBox(
      '这些练习对应的篇目已从题库移除，没法统计考点分布。记录本身还留在「记录」页里，可以逐条删除。'));
    return;
  }
  const rate = agg.total ? Math.round(agg.correct / agg.total * 100) : 0;

  /* 概览：一行三个数字 + 一行分模块，等级徽章各就各位（不再单列「等级分布」大行） */
  const box = (val, label) => {
    const b = el('div', 'stat-box');
    b.appendChild(el('b', null, val));
    b.appendChild(el('span', null, label));
    return b;
  };
  const row = el('div', 'stat-row');
  row.append(
    box(String(agg.attempts), '练习篇数'),
    box(rate + '%', '得分率'),
    box(fmtDur(Math.round(agg.secs / Math.max(1, agg.attempts))), '平均用时'),
  );
  container.appendChild(row);

  const modRow = el('div', 'stat-row');
  const r1 = (x) => String(Math.round(x * 10) / 10);
  /* 行里的题型跟着当前部分走：第三部分是完形/语法，第二部分是阅读/七选五 */
  for (const type of typesOfPart(S.recPart || 3)) {
    const m = agg.mods.get(type);
    const b = el('div', 'stat-box');
    b.appendChild(el('span', 'stat-k', typeLabel(type)));
    if (!m || !m.total) {
      b.appendChild(el('b', null, '—'));
      b.appendChild(el('span', null, '还没练过'));
    } else {
      /* 平均得分按这个题型自己的满分显示（阅读 10 分、七选五 12.5 分，不是一律 15） */
      const picked = list.filter(r => r.type === type);
      const avgFull = picked.reduce((s, r) => s + (r.full || 0), 0) / Math.max(1, picked.length);
      const avgScore = picked.reduce((s, r) => s + (r.score || 0), 0) / Math.max(1, picked.length);
      b.appendChild(el('b', null, `${r1(avgScore)} / ${r1(avgFull)}`));
      const line = el('span', 'stat-lv');
      line.appendChild(lvBadge(levelOf(m.correct, m.total).lv));
      line.appendChild(document.createTextNode(`${m.attempts} 次`));
      b.appendChild(line);
    }
    modRow.appendChild(b);
  }
  const lvBox = el('div', 'stat-box');
  lvBox.appendChild(el('span', 'stat-k', '综合等级'));
  const lvLine = el('div', 'stat-lv');
  const overall = levelOf(agg.correct, agg.total);
  lvLine.appendChild(lvBadge(overall.lv));
  lvBox.appendChild(lvLine);
  lvBox.appendChild(el('span', 'stat-tip', overall.tip));
  modRow.appendChild(lvBox);
  container.appendChild(modRow);

  /* 考点热力图：只列最该补的 8 个，格子两行（考点名 + 错 x/y），颜色即强弱，不再另设图例 */
  const tags = [...agg.tags.entries()].sort((a, b) => {
    return b[1].wrong - a[1].wrong || (b[1].wrong / b[1].n) - (a[1].wrong / a[1].n);
  });
  const HEAT_MAX = 8;
  const shown = tags.slice(0, HEAT_MAX);
  const heatSec = el('section', 'section');
  heatSec.appendChild(sectionHead('考点热力图', '错得多的排前面 · 越红越弱'));
  const grid = el('div', 'heat-grid');
  for (const [tag, c] of shown) {
    const band = heatBand(c.wrong, c.n);
    const tile = el('div', `heat-tile bh${band}`);
    tile.appendChild(el('span', 'ht-name', tag));
    tile.appendChild(el('span', 'ht-val', c.wrong ? `错 ${c.wrong}/${c.n}` : '全对'));
    grid.appendChild(tile);
  }
  heatSec.appendChild(grid);
  if (tags.length > HEAT_MAX) {
    const rest = tags.slice(HEAT_MAX);
    const perfect = rest.filter(([, c]) => !c.wrong).length;
    heatSec.appendChild(el('p', 'heat-rest', perfect === rest.length
      ? `其余 ${rest.length} 个考点全对`
      : `其余 ${rest.length} 个考点错得较少`));
  }
  container.appendChild(heatSec);

  /* 下一步：只说该做什么，不复述上面的数字 */
  const adv = el('div', 'advice');
  adv.appendChild(el('b', null, '下一步：'));
  adv.appendChild(document.createTextNode(nextStep(agg)));
  container.appendChild(adv);
  container.appendChild(el('p', 'source', '记录只存在本机。'));
}

/** 一句到两句，可执行 */
function nextStep(agg) {
  const out = [];
  /* 拿当前部分自己的两个题型互相比较，不再写死完形/语法 */
  const stats = typesOfPart(S.recPart || 3).map((t) => {
    const m = agg.mods.get(t);
    return { label: typeLabel(t), r: m && m.total ? m.correct / m.total : null };
  });
  const done = stats.filter(s => s.r != null);
  if (done.length >= 2) {
    const [a, b] = done;
    out.push(Math.abs(a.r - b.r) >= 0.1
      ? `短板在${a.r < b.r ? a.label : b.label}`
      : `${a.label}与${b.label}比较均衡`);
  } else if (done.length === 1) {
    const other = stats.find(s => s.r == null);
    if (other) out.push(`${other.label}还没练过，建议也刷起来`);
  }
  const weak = [...agg.tags.entries()]
    .filter(([, c]) => c.wrong > 0 && c.n >= 2)
    .sort((a, b) => b[1].wrong - a[1].wrong || (b[1].wrong / b[1].n) - (a[1].wrong / a[1].n))
    .slice(0, 3);
  if (weak.length) out.push('优先补' + weak.map(([t]) => t).join('、'));
  else if (agg.total) out.push('暂时没有明显薄弱考点，保持节奏');
  return out.join('；') + '。';
}

/* ---------- 记录列表 ---------- */
function buildRecordList(container, list) {

      `${list.length} 条 · ${finePointer ? '点右侧「删除」' : '左滑可删除'}`));

    container.appendChild(emptyBox('还没有做题记录。交卷后这里会记下每次的得分、用时和等级。'));

  container.appendChild(recordBackupBar(list));
  container.appendChild(el('p', 'source',
    `记录存在本机；换手机、重装浏览器前先「导出记录」，到新设备再「导入记录」即可接着用。` +
    `超过 ${REC_MAX} 次会自动丢弃最旧的。`));
}

/** 记录备份条：导出 / 导入 / 清空 */
function recordBackupBar(list) {
  const foot = el('div', 'rec-foot');
  const exp = el('button', 'btn btn-ghost', '导出记录');
  exp.disabled = !list.length;
  exp.onclick = exportRecords;
  const imp = el('button', 'btn btn-ghost', '导入记录');

      title: '清空全部记录',

      okText: '清空',
      onOk: () => {
        S.history = [];
        saveRecords();
        renderRecords();
        toast('已清空全部记录');
      },
    });

  }
  return foot;
}

/** 导出成一个 json 文件，方便换设备带走 */
function exportRecords() {
  const list = loadRecords();
  if (!list.length) { toast('还没有记录可导出'); return; }
  const stamp = new Date().toISOString().slice(0, 10);
  const payload = {
    app: 'gk-english',
    kind: 'records',
    exportedAt: new Date().toISOString(),
    count: list.length,
    records: list,
  };
  const blob = new Blob([JSON.stringify(payload)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `gk-记录-${stamp}.json`;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 4000);
  toast('已导出，去「下载 / 文件」里找');
}

/** 从备份文件导入，与现有记录合并去重 */
function importRecords() {
  const inp = document.createElement('input');
  inp.type = 'file';
  inp.accept = '.json,application/json';
  inp.onchange = () => {
    const f = inp.files && inp.files[0];
    if (!f) return;
    const fr = new FileReader();
    fr.onload = () => {
      let data = null;
      try { data = JSON.parse(String(fr.result)); } catch (e) { data = null; }
      const recs = data && Array.isArray(data.records) ? data.records
        : (Array.isArray(data) ? data : null);
      if (!recs) { toast('这个文件不是记录备份'); return; }
      const clean = recs.filter(r => r && typeof r === 'object' && r.id && r.itemId);
      if (!clean.length) { toast('文件里没有可用的记录'); return; }
      showDialog({
        title: '导入记录',
        text: `文件里有 ${clean.length} 条记录。导入后与现有记录合并去重，不会删掉现有内容。`,
        okText: '导入',
        onOk: () => {
          const cur = loadRecords();
          const seen = new Set(cur.map(r => r.id));
          const merged = cur.slice();
          let added = 0;
          for (const r of clean) {
            if (seen.has(r.id)) continue;
            seen.add(r.id);
            merged.push(r);
            added++;
          }
          merged.sort((a, b) => (b.at || 0) - (a.at || 0));
          S.history = merged.slice(0, REC_MAX);
          saveRecords();
          renderRecords();
          toast(added ? `已导入 ${added} 条` : '这些记录已经有了');
        },
      });
    };
    fr.readAsText(f, 'utf-8');
  };
  inp.click();
}

function recordRow(r) {
  const wrap = el('div', 'rec-wrap');
  const del = el('button', 'rec-del', '删除');
  const row = el('button', 'rec-row');

  const main = el('div', 'rec-main');
  main.appendChild(el('b', null, `${r.year || ''} ${r.paperName || '（无名试卷）'}`.trim()));
  main.appendChild(el('span', null,
    `${typeLabel(r.type)} · ${fmtDate(r.at)} · 用时 ${r.secs != null ? fmtDur(r.secs) : '—'}` +
    (r.pauses ? ` · 暂停${r.pauses}次` : '')));
  const right = el('div', 'rec-right');
  right.appendChild(el('b', null,
    `${r.score != null ? r.score : '—'}/${r.full != null ? r.full : '—'}`));
  const badgeWrap = el('div');
  badgeWrap.appendChild(lvBadge(r.level));
  right.appendChild(badgeWrap);
  row.append(main, right);

  /* 左滑露出删除；滑动过就不触发进入详情 */
  let x0 = null, dx = 0, moved = false, swallow = false;
  row.addEventListener('touchstart', (e) => {
    x0 = e.touches[0].clientX; dx = 0; moved = false;
  }, { passive: true });
  row.addEventListener('touchmove', (e) => {
    if (x0 == null) return;
    dx = e.touches[0].clientX - x0;
    if (Math.abs(dx) > 8) moved = true;
    if (dx < 0) row.style.transform = `translateX(${Math.max(dx, -86)}px)`;
  }, { passive: true });
  row.addEventListener('touchend', () => {
    if (x0 == null) return;
    const open = dx < -40;
    row.style.transform = '';
    row.classList.toggle('swiped', open);
    if (moved) {
      swallow = true;
      setTimeout(() => { swallow = false; }, 320);
    }
    x0 = null;
  }, { passive: true });
  row.onclick = () => {
    if (swallow) return;
    if (row.classList.contains('swiped')) { row.classList.remove('swiped'); return; }
    openRecord(r.id);
  };

  del.onclick = (e) => {
    e.stopPropagation();
    showDialog({
      title: '删除这条记录',
      text: `${r.year} ${r.paperName} · ${typeLabel(r.type)} · ${fmtDate(r.at)} · ${r.score}/${r.full}`,
      okText: '删除',
      onOk: () => {
        const gone = delRecord(r.id);
        saveRecords();
        renderRecords();
        if (gone) {
          toast('已删除 1 条', {
            label: '撤销',
            onClick: () => {
              loadRecords().unshift(gone);
              saveRecords();
              renderRecords();
              toast('已恢复');
            },
          });
        }
      },
    });
  };

  /* 删除按钮必须先入 DOM：同为定位元素时后来者在上，行才能盖住它 */
  wrap.append(del, row);
  return wrap;
}

/** 回看某一次记录（用当时的作答，配当前题库的解析） */
async function openRecord(id, back) {
  S.recordBack = back || renderRecords;
  const rec = loadRecords().find(r => r.id === id);
  if (!rec) return;
  const found = resolveRecord(rec);
  if (!found) {
    toast('这篇已从题库移除，无法回看');
    return;
  }
  /* 索引里只有骨架，回看解析前需要先把这套卷的原文下载下来 */
  if ((found[0].items || []).some(it => it.stub)) {
    toast('正在载入原文…');
    try { await ensurePaperItems(found[0]); } catch (e) { toast('原文没加载成功，联网后再试'); return; }
    return openRecord(id, back);      // 递归时要带上返回页，否则「返回」会跑到记录页
  }
  S.paper = found[0];
  S.item = found[1];
  S.answers = Object.assign({}, rec.answers || {});
  S.graded = true;
  S.timer = null;
  S.resultMeta = { secs: rec.secs, pauses: rec.pauses, level: rec.level, at: rec.at, from: 'history' };
  renderReview();
}

/* ================= 启动 ================= */
function initFont() {
  document.documentElement.style.setProperty('--fs-passage', S.fontLarge ? '19px' : '17px');
}

/** 注册离线缓存：装到桌面后断网也能做题；同时负责「永远是最新版本」 */
function registerSW() {
  if (!('serviceWorker' in navigator)) return;
  if (!location.protocol.startsWith('http')) return;   // file:// 不支持

  /* 新版本接管后，不强制刷新（可能正在做题），给一个小按钮让学生自己点 */
  navigator.serviceWorker.addEventListener('controllerchange', () => {
    S.updateReady = true;
    showUpdateChip();
  });

  /* 地址里的 ?v=2 是故意的：
     老版本页面注册的是 'sw.js'（缓存优先），而浏览器对同一个 SW 地址有约 24 小时的
     更新节流，学生照旧打开链接会一直卡在旧缓存里出不来。换一个脚本地址等于换一次
     注册，会立刻装上新的（网络优先）SW，从此每次打开都是最新版本。
     以后再改缓存策略，把 v 往上加一位即可。 */
  navigator.serviceWorker.register('sw.js?v=3').then((reg) => {
    const checkNow = () => reg.update().catch(() => {});
    checkNow();
    /* 回到前台时顺手查一次新版本（手机上标签页常驻，这一步很关键） */
    document.addEventListener('visibilitychange', () => { if (!document.hidden) checkNow(); });
    reg.addEventListener('updatefound', () => {
      const w = reg.installing;
      if (!w) return;
      w.addEventListener('statechange', () => {
        if (w.state === 'installed' && navigator.serviceWorker.controller) {
          S.updateReady = true;
          showUpdateChip();
        }
      });
    });
  }).catch(() => { /* 离线能力缺失不影响做题 */ });
}

/** 有新版就摆一个小胶囊；正在做题就先不打扰，等回到列表再提示 */
function showUpdateChip(tries) {
  if (document.querySelector('.update-chip')) return;
  if (!S.updateReady) return;
  if (S.item) {                       // 答题中不弹，每 3 秒看一眼是否已离开
    if ((tries || 0) < 40) setTimeout(() => showUpdateChip((tries || 0) + 1), 3000);
    return;
  }
  const chip = el('button', 'update-chip', '有新版本 · 点这里刷新');
  chip.onclick = () => location.reload();
  document.body.appendChild(chip);
  document.body.classList.add('has-chip');   // 给底部留出空间，别压住正文
}

async function boot() {
  initFont();
  registerSW();
  // 切到后台自动暂停计时：回消息、锁屏不该算成做题时间
  document.addEventListener('visibilitychange', () => {
    if (S.graded) return;
    if (document.hidden) pauseTimer();
    else resumeTimer();
  });
  try {
    // 优先用「索引」（bank-index.js，几十 KB，进站秒开）；
    // 旧构建 / 开发服务器可能只提供完整题库（window.__BANK__），也照样能用
    S.bank = window.__BANK_INDEX__ || window.__BANK__
      || await (await fetch('/api/bank', { cache: 'no-store' })).json();
  } catch (e) {
    $('#app').innerHTML = '<div class="page">题库加载失败，请确认服务已启动。</div>';
    return;
  }
  renderHome();
}
/* 题库由 <script defer src="bank.js"> 加载：defer 脚本一定在 DOMContentLoaded 之前执行完，
   所以在这里等 DOMContentLoaded —— 既保证 window.__BANK__ 已就绪，又让骨架先显示出来。 */
if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
else boot();
</script>

<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#11141a" media="(prefers-color-scheme: dark)">
<title>高考英语刷题</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="英语刷题">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>
  :root {
    color-scheme: light dark;
    --bg: #f4f5f7;
    --card: #ffffff;
    --text: #15181d;
    --text-2: #5b6470;
    --line: #e3e6ea;
    --accent: #3b5bdb;
    --accent-weak: #edf0fe;
    --ok: #15803d;
    --ok-weak: #e7f6ec;
    --bad: #c62828;
    --bad-weak: #fdecec;
    --shadow: 0 1px 2px rgba(16, 24, 40, .06), 0 8px 24px rgba(16, 24, 40, .06);
    --fs-passage: 17px;
    --fs-ui: 15px;
    --radius: 14px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #11141a;
      --card: #191d25;
      --text: #e9ecf1;
      --text-2: #9aa4b2;
      --line: #262c36;
      --accent: #7d97ff;
      --accent-weak: #1c2438;
      --ok: #4ade80;
      --ok-weak: #14261a;
      --bad: #ff8080;
      --bad-weak: #2a1618;
      --shadow: 0 1px 2px rgba(0, 0, 0, .4);
    }
  }
  html {
    -webkit-text-size-adjust: 100%;
    overscroll-behavior: none;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  /* 控件类元素：长按不选中、不留长按菜单；正文保持可选中 */
  button, .blank, .opt, .chip, .icon-btn, .fs-btn {
    user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;
  }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: "Segoe UI", -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial,
      "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    font-size: var(--fs-ui);
    line-height: 1.6;
    overscroll-behavior-y: none;
  }
  button { font: inherit; color: inherit; border: 0; background: none; touch-action: manipulation; }

  /* ---------- 顶栏 ---------- */
  .topbar {
    position: sticky; top: 0; z-index: 20;
    display: flex; align-items: center; gap: 10px;
    padding: calc(env(safe-area-inset-top) + 10px) 16px 10px;
    background: color-mix(in srgb, var(--bg) 88%, transparent);
    backdrop-filter: saturate(180%) blur(12px);
    border-bottom: 1px solid var(--line);
  }
  .topbar h1 { flex: 1; margin: 0; font-size: 16px; font-weight: 600; letter-spacing: -.01em; }
  .topbar .sub { flex: 1; min-width: 0; }
  .topbar .sub b { display: block; font-size: 16px; font-weight: 600; }
  .topbar .sub span { display: block; font-size: 12px; color: var(--text-2); }
  .icon-btn {
    width: 40px; height: 40px; border-radius: 12px;
    display: grid; place-items: center; color: var(--text-2);
  }
  .icon-btn:active { background: var(--accent-weak); }
  .fs-btn {
    height: 34px; padding: 0 12px; border-radius: 999px;
    border: 1px solid var(--line); color: var(--text-2); font-size: 13px;
  }

  /* ---------- 通用 ---------- */
  .page { padding: 16px 16px calc(96px + env(safe-area-inset-bottom)); max-width: 720px; margin: 0 auto; }
  .card {
    background: var(--card); border-radius: var(--radius);
    border: 1px solid var(--line); box-shadow: var(--shadow);
  }
  .muted { color: var(--text-2); }
  .chip {
    display: inline-block; padding: 2px 8px; border-radius: 999px;
    background: var(--accent-weak); color: var(--accent);
    font-size: 12px; font-weight: 600;
  }

  /* 省份标签：中性灰，不跟题型标签抢注意力 */
  .chip-prov { background: var(--bg-2); color: var(--text-2); }

  /* ---------- 首页 ---------- */
  .hero { margin-bottom: 18px; }
  .hero h2 { margin: 0 0 6px; font-size: 22px; letter-spacing: -.02em; }
  .hero p { margin: 0; color: var(--text-2); font-size: 13px; }
  .list { display: grid; gap: 10px; }
  .paper-card { display: flex; align-items: center; gap: 12px; padding: 14px; width: 100%; text-align: left; }
  .paper-card:active { transform: scale(.99); }
  .paper-main { flex: 1; min-width: 0; }
  .paper-main b { display: block; font-size: 15.5px; font-weight: 600; margin-bottom: 3px; }
  .paper-main span { font-size: 12.5px; color: var(--text-2); }
  .paper-meta { text-align: right; font-size: 12px; color: var(--text-2); display: grid; gap: 4px; justify-items: end; }

  /* ---------- 模块入口（首页） ---------- */
  .module-card { display: flex; align-items: center; gap: 14px; padding: 16px; width: 100%; text-align: left; }
  .module-card:active { transform: scale(.99); }
  .module-card .paper-main b { font-size: 17px; margin-bottom: 5px; }
  .module-note { display: block; font-size: 12.5px; color: var(--text-2); }
  .module-count { display: block; margin-top: 7px; font-size: 12.5px; font-weight: 600; color: var(--accent); }
  .module-arrow { font-size: 20px; color: var(--text-2); line-height: 1; }

  .install-tip {
    margin: 16px 0 0; padding: 14px;
    border-radius: 12px; border: 1px dashed var(--line); background: var(--card);
    font-size: 12.5px; line-height: 1.7; color: var(--text-2);
  }
  .install-tip b { display: block; color: var(--text); font-size: 13px; margin-bottom: 3px; }

  /* ---------- 答题 ---------- */
  .progress { font-size: 12.5px; color: var(--text-2); font-variant-numeric: tabular-nums; }
  .instruction {
    margin: 0 0 12px; padding: 12px 14px;
    background: var(--accent-weak); color: var(--accent);
    border-radius: 12px; font-size: 13px; line-height: 1.55;
  }
  .passage-card { padding: 18px 16px; }
  .passage-card p {
    margin: 0 0 14px; font-size: var(--fs-passage); line-height: 1.78;
    letter-spacing: .002em; text-align: left; word-break: break-word;
  }
  .passage-card p:last-child { margin-bottom: 0; }

  /* 来源标注 */
  .source {
    display: block; margin: 0 0 10px;
    font-size: 12.5px; color: var(--text-2); letter-spacing: .01em;
  }
  .source b { font-weight: 500; }

  .blank {
    display: inline-flex; align-items: center; justify-content: center;
    min-width: 2.5em; height: 1.7em; margin: 0 .1em; padding: 0 .35em;
    vertical-align: -.18em;
    border-bottom: 2px solid var(--accent);
    border-radius: 6px 6px 2px 2px;
    background: var(--accent-weak); color: var(--accent);
    font-size: .9em; font-weight: 700; font-variant-numeric: tabular-nums;
    transition: background .12s ease;
  }
  .blank.filled { background: var(--accent); color: #fff; }
  .blank.ok { background: var(--ok-weak); color: var(--ok); border-bottom-color: var(--ok); }
  .blank.bad { background: var(--bad-weak); color: var(--bad); border-bottom-color: var(--bad); }
  .blank input {
    /* 16px 是 iOS 不触发页面缩放的下限，不能更小 */
    width: 4.2em; border: 0; background: transparent; color: var(--text);
    font: inherit; font-size: 16px; font-weight: 600; text-align: center; outline: none; padding: 0;
  }
  .blank input::placeholder { color: var(--text-2); font-weight: 400; }
  /* 交卷后输入框被禁用，禁用控件的点击不会冒泡 —— 让点击穿透到外层 span，才能点开解析 */
  .blank input:disabled { pointer-events: none; }

  /* ---------- 底栏 ---------- */
  .actionbar {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 20;
    display: flex; gap: 10px; align-items: center;
    padding: 12px 16px calc(12px + env(safe-area-inset-bottom));
    background: color-mix(in srgb, var(--bg) 92%, transparent);
    backdrop-filter: blur(12px);
    border-top: 1px solid var(--line);
  }
  .btn {
    flex: 1; height: 50px; border-radius: 14px;
    display: grid; place-items: center;
    font-size: 16px; font-weight: 600; letter-spacing: .01em;
  }
  .btn-primary { background: var(--accent); color: #fff; }
  .btn-primary:disabled { opacity: .45; }
  .btn-ghost { flex: 0 0 auto; padding: 0 16px; color: var(--text-2); border: 1px solid var(--line); }
  .btn:active:not(:disabled) { transform: scale(.985); }

  /* ---------- 选项面板 ---------- */
  .scrim {
    position: fixed; inset: 0; z-index: 40; background: rgba(10, 12, 16, .42);
    opacity: 0; pointer-events: none; transition: opacity .18s ease;
  }
  .scrim.show { opacity: 1; pointer-events: auto; }
  .sheet {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 50;
    transform: translateY(102%); transition: transform .22s cubic-bezier(.32, .72, 0, 1);
    background: var(--card);
    border-radius: 20px 20px 0 0;
    box-shadow: 0 -8px 40px rgba(10, 12, 16, .18);
    padding-bottom: calc(10px + env(safe-area-inset-bottom));
    max-height: 76vh; max-height: 76dvh; display: flex; flex-direction: column;
  }
  .sheet.show { transform: translateY(0); }
  .sheet-head {
    display: flex; align-items: center; gap: 8px;
    padding: 16px 18px 10px;
  }
  .sheet-head b { font-size: 16px; }
  .sheet-head .muted { font-size: 12.5px; margin-left: auto; }
  .sheet-body { overflow-y: auto; padding: 0 14px 6px; -webkit-overflow-scrolling: touch; }
  .opt {
    display: flex; align-items: center; gap: 12px; width: 100%;
    min-height: 56px; padding: 12px 14px; margin-bottom: 8px;
    border: 1px solid var(--line); border-radius: 12px;
    font-size: 17px; text-align: left; line-height: 1.45;
  }
  .opt .letter {
    flex: 0 0 28px; width: 28px; height: 28px; border-radius: 50%;
    display: grid; place-items: center;
    background: var(--accent-weak); color: var(--accent); font-size: 14px; font-weight: 700;
  }
  .opt[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-weak); }
  .opt:active { background: var(--accent-weak); transform: scale(.995); }
  .opt.ok { border-color: var(--ok); background: var(--ok-weak); }
  .opt.bad { border-color: var(--bad); background: var(--bad-weak); }

  /* ---------- 行内选项：贴着当前行展开，不遮正文 ---------- */
  .opt-row {
    display: grid; grid-template-columns: 1fr 1fr; gap: 8px;
    margin: 8px 0 12px; padding: 10px;
    background: var(--accent-weak); border-radius: 12px;
  }
  .opt-chip {
    display: flex; align-items: center; gap: 8px;
    padding: 11px 12px; border-radius: 10px; text-align: left;
    background: var(--card); border: 1px solid var(--line);
    font-size: 15px; line-height: 1.35; color: var(--text);
    -webkit-tap-highlight-color: transparent;
  }
  .opt-chip:active { transform: scale(.985); }
  .opt-chip .k {
    flex: none; width: 22px; height: 22px; border-radius: 50%;
    background: var(--accent-weak); color: var(--accent);
    font-size: 12.5px; font-weight: 700;
    display: flex; align-items: center; justify-content: center;
  }
  .opt-chip .v { word-break: break-word; }
  .opt-chip.on { border-color: var(--accent); background: var(--accent-weak); }
  /* 七选五的 7 个选项句子长，必须单列铺开，挤两列会串行 */
  .opt-row-7 { grid-template-columns: 1fr; }
  .opt-row-7 .opt-chip { align-items: flex-start; }
  .opt-row-7 .opt-chip .k { margin-top: 1px; }
  .opt-chip.used { opacity: .62; }
  .opt-chip.used .k { background: var(--line); color: var(--text-2); }

  /* ---------- 阅读理解：题卡 ---------- */
  .q-list { margin-top: 4px; }
  .q-card { padding: 14px; margin-bottom: 10px; }
  .q-head { display: flex; gap: 8px; align-items: baseline; margin-bottom: 10px; }
  .q-no {
    flex: none; color: var(--accent); font-size: 15.5px;
    font-variant-numeric: tabular-nums;
  }
  .q-stem { font-size: 16.5px; font-weight: 600; line-height: 1.55; }
  .q-opt {
    display: flex; align-items: flex-start; gap: 9px; width: 100%; text-align: left;
    padding: 11px 12px; margin-bottom: 8px; border-radius: 12px;
    background: var(--card); border: 1.5px solid var(--line);
    font-size: 15.5px; line-height: 1.5; color: var(--text);
    -webkit-tap-highlight-color: transparent;
  }
  .q-opt:last-child { margin-bottom: 0; }
  .q-opt .k {
    flex: none; width: 23px; height: 23px; border-radius: 50%;
    background: var(--accent-weak); color: var(--accent);
    font-size: 12.5px; font-weight: 700;
    display: flex; align-items: center; justify-content: center;
  }
  .q-opt .v { flex: 1; word-break: break-word; }
  button.q-opt:active { transform: scale(.99); }
  .q-opt.on { border-color: var(--accent); background: var(--accent-weak); }
  .q-opt.on .k { background: var(--accent); color: #fff; }
  .q-opt.ok { border-color: var(--ok); background: var(--ok-weak); }
  .q-opt.ok .k { background: var(--ok); color: #fff; }
  .q-opt.bad { border-color: var(--bad); background: var(--bad-weak); }
  .q-opt.bad .k { background: var(--bad); color: #fff; }
  .q-explain { margin-top: 11px; padding-top: 11px; border-top: 1px dashed var(--line); }
  .q-explain-head { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 6px; }
  .q-explain p { font-size: 14.5px; line-height: 1.72; color: var(--text-2); }
  .rv-stem { font-size: 15.5px; font-weight: 600; line-height: 1.6; margin: 2px 0 8px; }

  /* ---------- 七选五：选项清单 ---------- */
  .choice-card { padding: 12px 14px; margin-top: 4px; }
  .choice-title { display: block; font-size: 14px; color: var(--text-2); margin-bottom: 8px; }
  .choice-row {
    display: flex; align-items: flex-start; gap: 9px;
    padding: 9px 0; border-top: 1px solid var(--line);
    font-size: 14.5px; line-height: 1.55;
  }
  .choice-row:first-of-type { border-top: none; }
  .choice-row .k {
    flex: none; width: 21px; height: 21px; border-radius: 50%;
    background: var(--accent-weak); color: var(--accent);
    font-size: 12px; font-weight: 700;
    display: flex; align-items: center; justify-content: center;
  }
  .choice-row .v { flex: 1; word-break: break-word; }
  .choice-row.used .k { background: var(--accent); color: #fff; }
  .choice-row.right { background: var(--ok-weak); border-radius: 8px; padding: 9px 8px; }
  .choice-row.right .k { background: var(--ok); color: #fff; }
  .choice-row.unused { opacity: .55; }
  .choice-used {
    flex: none; font-size: 11.5px; color: var(--accent);
    background: var(--accent-weak); border-radius: 999px; padding: 2px 7px;
  }
  .opt-chip.on .k { background: var(--accent); color: #fff; }

  /* ---------- 原文 / 解析 切换 ---------- */
  .seg {
    display: flex; gap: 4px; padding: 3px; border-radius: 10px;
    background: var(--accent-weak);
  }
  .seg button {
    border: 0; background: transparent; color: var(--accent);
    font-size: 13.5px; font-weight: 600; padding: 7px 12px; border-radius: 8px;
    -webkit-tap-highlight-color: transparent;
  }
  .seg button.on { background: var(--card); color: var(--text); box-shadow: var(--shadow); }
  .ans-inline {
    display: inline-block; padding: 0 5px; margin: 0 2px;
    border-bottom: 2px solid var(--ok); border-radius: 3px;
    background: var(--ok-weak); color: var(--ok); font-weight: 600;
  }
  .hidden { display: none !important; }
  .sheet-foot { padding: 8px 14px calc(6px + env(safe-area-inset-bottom)); display: flex; gap: 10px; }

  /* ---------- 结果 ---------- */
  .result {
    display: flex; align-items: baseline; gap: 10px;
    padding: 16px 18px; margin-bottom: 12px;
    border-radius: var(--radius); border: 1px solid var(--line); background: var(--card);
  }
  .result .score { font-size: 32px; font-weight: 700; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
  .result .max { color: var(--text-2); font-size: 15px; }
  .result .detail { margin-left: auto; text-align: right; font-size: 12.5px; color: var(--text-2); }
  .explain-card { padding: 14px 16px; margin-bottom: 12px; font-size: 14.5px; line-height: 1.7; }
  .explain-card h4 { margin: 0 0 6px; font-size: 14px; color: var(--text-2); font-weight: 600; }

  /* ---------- 首页分区 ---------- */
  .section { margin-top: 20px; }
  .section-head {
    display: flex; align-items: baseline; justify-content: space-between;
    gap: 8px; margin: 0 2px 10px;
  }
  .section-head h3 { margin: 0; font-size: 16px; font-weight: 700; }
  .section-note { font-size: 12px; color: var(--text-2); }

  /* ---------- 整体解析页 ---------- */
  .rv-item {
    background: var(--card); border-radius: var(--radius);
    padding: 14px 15px; margin-bottom: 10px; box-shadow: var(--shadow);
    border-left: 3px solid var(--line);
  }
  .rv-ok { border-left-color: var(--ok); }
  .rv-bad { border-left-color: var(--bad); }
  .rv-head {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 8px;
  }
  .rv-head b { font-size: 15.5px; }
  .rv-badge { font-size: 12px; padding: 2px 9px; border-radius: 999px; font-weight: 600; }
  .rv-badge-ok { color: var(--ok); background: var(--ok-weak); }
  .rv-badge-bad { color: var(--bad); background: var(--bad-weak); }
  .rv-row { display: flex; gap: 10px; font-size: 15px; line-height: 1.6; }
  .rv-k { color: var(--text-2); flex: none; width: 62px; font-size: 13px; padding-top: 3px; }
  .rv-v { word-break: break-word; }
  .rv-v.ok { color: var(--ok); font-weight: 600; }
  .rv-v.bad { color: var(--bad); text-decoration: line-through; }
  .rv-v-skip { color: var(--text-2); }
  .rv-opts {
    margin-top: 9px; padding-top: 9px; border-top: 1px solid var(--line);
    display: grid; gap: 5px;
  }
  .rv-opt { display: flex; gap: 6px; font-size: 14.5px; line-height: 1.55; color: var(--text-2); }
  .rv-opt b { font-weight: 700; }
  .rv-opt.right { color: var(--ok); font-weight: 600; }
  .rv-opt.wrong { color: var(--bad); }
  .rv-ex { margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--line); }
  .rv-ex b { font-size: 12.5px; color: var(--accent); letter-spacing: .3px; }
  .rv-ex p { margin: 5px 0 0; font-size: 15px; line-height: 1.72; }
  .toast {
    position: fixed; left: 50%; bottom: calc(88px + env(safe-area-inset-bottom));
    transform: translate(-50%, 8px); z-index: 60;
    background: #1f2430; color: #fff; padding: 9px 16px; border-radius: 999px;
    font-size: 13px; opacity: 0; pointer-events: none; transition: .18s ease;
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }

  /* 有新版本时的小胶囊：不强制刷新，学生自己挑时间点 */
  .update-chip {
    position: fixed; left: 50%; bottom: calc(88px + env(safe-area-inset-bottom));
    transform: translateX(-50%); z-index: 61; border: none;
    background: var(--accent); color: #fff; padding: 9px 16px; border-radius: 999px;
    font-size: 13px; font-weight: 600; box-shadow: 0 6px 18px rgba(16, 24, 40, .22);
  }
  body.has-chip { padding-bottom: 92px; }

  /* ---------- 做题记录 / 考点热力图 ---------- */
  :root {
    --lv-S: #7c3aed; --lv-A: #15803d; --lv-B: #0369a1; --lv-C: #b45309; --lv-D: #b91c1c;
    --h0-bg: rgba(21, 128, 61, .10); --h0-fg: #15803d;
    --h1-bg: rgba(132, 204, 22, .16); --h1-fg: #4d7c0f;
    --h2-bg: rgba(234, 179, 8, .18); --h2-fg: #a16207;
    --h3-bg: rgba(249, 115, 22, .16); --h3-fg: #c2410c;
    --h4-bg: rgba(198, 40, 40, .14); --h4-fg: #c62828;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --lv-S: #a78bfa; --lv-A: #4ade80; --lv-B: #7dd3fc; --lv-C: #fbbf24; --lv-D: #ff8080;
      --h0-bg: rgba(74, 222, 128, .14); --h0-fg: #4ade80;
      --h1-bg: rgba(163, 230, 53, .13); --h1-fg: #bef264;
      --h2-bg: rgba(250, 204, 21, .15); --h2-fg: #fde047;
      --h3-bg: rgba(251, 146, 60, .14); --h3-fg: #fdba74;
      --h4-bg: rgba(255, 128, 128, .13); --h4-fg: #ff8080;
    }
  }
  .record-card {
    display: flex; align-items: center; gap: 12px; width: 100%; text-align: left;
    background: var(--card); border-radius: var(--radius); box-shadow: var(--shadow);
    padding: 13px 14px; margin-bottom: 10px;
  }
  .lv-badge {
    display: inline-flex; align-items: center; justify-content: center;
    min-width: 27px; height: 27px; padding: 0 7px; border-radius: 8px;
    font-size: 14px; font-weight: 800; letter-spacing: .02em;

<div id="app">
  <!-- 静态骨架：题库（bank.js）还在下载时先显示这个，不用等整包下完才看到界面 -->

</div>
<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-label="选项面板"></div>
<div class="toast" id="toast"></div>

<script defer src="bank-index.js?v=1793082498812"></script>
<script>
'use strict';

/* ================= 状态 ================= */
const S = {
  bank: null,
  part: null,        // 当前所在部分（1–4）
  module: null,      // 当前题型 'reading'|'seven'|'cloze'|'grammar-fill'
  paper: null,       // 当前试卷
  item: null,        // 当前 item
  answers: {},       // { n: raw }
  graded: false,
  sheetN: null,
  fontLarge: localStorage.getItem('gk.fontLarge') === '1',
  timer: null,       // 计时器 { startedAt, pausedMs, pausedAt, pauses }
  history: null,     // 做题记录（惰性载入）
  resultMeta: null,  // 本次成绩附加信息 { secs, pauses, level, at, from }
  recPart: null,     // 记录页当前看的是哪个部分
  recTab: 'heat',    // 记录页页签：heat | list
  hexOpen: false,    // 首页六边形是否展开
  updateReady: false,// 有新版本待刷新
};

/* ================= 判分（与 engine.py 保持一致） ================= */
function norm(s) {
  if (s == null) return '';
  let t = String(s).normalize('NFKC').trim().replace(/\s+/g, ' ');
  t = t.replace(/[。.;；,，]+$/, '');
  return t.toLowerCase();
}

/** 「which/that」「of/on」这种并列答案 → ['which', 'that'] */
function splitAlt(v) {
  if (v == null) return [];
  return String(v)
    .split(/[\/／]|\s+(?:or|或)\s+/i)
    .map(s => s.trim())
    .filter(Boolean);
}

/** 一道题所有可接受的答案（去重，保留原写法） */
function correctList(q) {
  const out = [];
  for (const src of [q.answer, ...(q.accept || [])]) {
    for (const v of splitAlt(src)) {
      if (!out.some(x => norm(x) === norm(v))) out.push(v);
    }
  }
  return out;
}

/** 展示用的正确答案：并列写「which 或 that」；完形再补上选项单词 */
function answerLabel(q, withText = true) {
  const list = correctList(q);
  let text = list.join(' 或 ');
  const at = String(q.answerText || '').trim();
  const atAlts = splitAlt(at);
  const covered = atAlts.length > 0 && atAlts.every(v => list.some(x => norm(x) === norm(v)));
  if (withText && at && !covered) text += `. ${at}`;
  return text;
}

function judge(q, given) {
  const g = norm(given);
  if (!g) return false;
  const allowed = new Set();
  for (const a of correctList(q)) allowed.add(norm(a));
  if (q.answerText) allowed.add(norm(q.answerText));
  if (q.options) {
    const letters = 'abcd';
    if (g.length === 1 && letters.includes(g)) {
      const idx = letters.indexOf(g);
      if (idx < q.options.length) allowed.add(norm(q.options[idx]));
    }
  }
  return allowed.has(g);
}

/* ================= 小工具 ================= */
const $ = (sel) => document.querySelector(sel);
const el = (tag, cls, text) => {
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (text != null) n.textContent = text;
  return n;
};
function toast(msg, action) {
  const t = $('#toast');
  t.textContent = '';
  t.appendChild(document.createTextNode(msg));
  if (action) {
    const b = el('button', 'toast-act', action.label);
    b.onclick = () => {
      t.classList.remove('show');
      clearTimeout(toast._t);
      action.onClick();
    };
    t.appendChild(b);
  }
  t.classList.add('show');
  clearTimeout(toast._t);
  toast._t = setTimeout(() => t.classList.remove('show'), action ? 5200 : 1600);
}
function answeredCount() {
  const qs = (S.item && S.item.questions) || [];
  return qs.filter(q => norm(S.answers[q.n]) !== '').length;
}

/**
 * 卷名统一显示：去掉卷名里自带、且与前缀重复的年份与省份。
 * 例：「2026届广州市天河区…」→「广州市天河区…」（年份已在前面显示）
 *     「山东省临沂市…」+ 省份标签「山东」→「临沂市…」
 * 只在与 paper.year / paper.province 完全对得上时裁剪，且裁完不能太短。
 */
function paperLabel(paper) {
  const raw = String(paper.paperName || '').trim();
  let name = raw;
  const y = String(paper.year || '');
  if (y) {
    name = name.replace(new RegExp('^' + y + '\\s*(?:届|年|学年)?\\s*'), '');
    // 名字中间重复的年份（「金丽衢十二校2026届高三…」）；避开学年区间「2025-2026学年」
    name = name.replace(new RegExp('(?<![\\d\\-–—])' + y + '\\s*届\\s*', 'g'), '');
    name = name.replace(new RegExp('(?<![\\d\\-–—])' + y + '年(?!\\d)', 'g'), '');
  }
  const pv = String(paper.province || '').trim();
  if (pv && pv !== '全国') name = name.replace(new RegExp('^' + pv + '(?:省|市)?\\s*'), '');
  name = name.replace(/^[·、,，\-\s]+/, '').trim();
  return name.length >= 4 ? name : raw;
}

/** 来源标签：2025 全国一卷（新课标Ⅰ） -> （来源：2025 全国一卷 · 新课标Ⅰ） */
function sourceLabel(paper) {
  const name = String(paperLabel(paper)).replace(/（(.+?)）/g, ' · $1');
  return `（来源：${paper.year} ${name}）`;
}

/* ================= 部分 / 题型定义（四级导航：部分 → 题型 → 真题/模拟 → 卷子） ================= */
const PARTS = [
  { part: 1, code: '第一部分', title: '听力', note: '20 题 · 共 30 分', ready: false, types: [] },
  { part: 2, code: '第二部分', title: '阅读', note: '阅读理解 + 七选五 · 共 50 分', ready: true, types: ['reading', 'seven'] },
  { part: 3, code: '第三部分', title: '语言运用', note: '完形填空 + 语法填空 · 共 30 分', ready: true, types: ['cloze', 'grammar-fill'] },
  { part: 4, code: '第四部分', title: '写作', note: '应用文 + 读后续写 · 共 40 分', ready: true, types: ['applied', 'continuation'] },
];

const TYPES = {
  'reading': { label: '阅读理解', short: '阅读', note: '每篇 2–5 题 · 每题 2.5 分', chip: '2.5/题', part: 2, unit: '题' },
  'seven': { label: '七选五', short: '七选五', note: '5 空 · 每题 2.5 分 · 共 12.5 分', chip: '5×2.5', part: 2, unit: '空' },
  'cloze': { label: '完形填空', short: '完形', note: '15 空 · 每题 1 分 · 共 15 分', chip: '15×1', part: 3, unit: '空' },
  'grammar-fill': { label: '语法填空', short: '语法', note: '10 空 · 每题 1.5 分 · 共 15 分', chip: '10×1.5', part: 3, unit: '空' },
  'applied': { label: '应用文写作', short: '应用文', note: '约 80 词 · 共 15 分', chip: '80 词', part: 4, unit: '篇' },
  'continuation': { label: '读后续写', short: '续写', note: '约 150 词 · 共 25 分', chip: '150 词', part: 4, unit: '篇' },
};
/** 每题的参考用时（秒/题、秒/空），用来算六边形的「速度」轴 */
const PACE_TARGET = { 'cloze': 45, 'grammar-fill': 40, 'reading': 75, 'seven': 60 };

const TYPE_ORDER = ['reading', 'seven', 'cloze', 'grammar-fill', 'applied', 'continuation'];
function typeInfo(t) { return TYPES[t] || { label: t, short: t, note: '', chip: '', part: 0, unit: '空' }; }
/** 写作题没有 questions，凡是取题量的地方都走这里，避免白屏 */
function qCount(it) { return (it && it.questions ? it.questions.length : 0); }
function typeLabel(t) { return typeInfo(t).label; }
function partOf(type) { return typeInfo(type).part; }
function partDef(part) { return PARTS.find(p => p.part === part) || null; }
function typesOfPart(part) { const d = partDef(part); return d ? d.types : []; }
/** 题库里实际有数据的题型（没数据的题型不显示，避免空壳入口） */
function liveTypes(part) {
  return typesOfPart(part).filter(t => S.bank && S.bank.papers.some(p => p.items.some(i => i.type === t)));
}

/** 取出某题型下某一类（真题 / 模拟）的 [paper, item] */
function itemsOf(type, kind) {
  const rows = [];
  for (const paper of S.bank.papers) {
    if ((paper.kind || 'mock') !== kind) continue;
    for (const it of paper.items) if (it.type === type) rows.push([paper, it]);
  }
  return rows;
}

/** 某一题型下的卷子清单：一套卷只出现一次（一份 4 篇阅读的卷子不能变成 4 张卡） */
function papersOf(type, kind) {
  const out = [];
  const seen = new Set();
  for (const paper of S.bank.papers) {
    if ((paper.kind || 'mock') !== kind) continue;
    if (!itemsOfPaper(paper, type).length) continue;
    if (seen.has(paper.id)) continue;
    seen.add(paper.id);
    out.push(paper);
  }
  return out;
}

/** 按「套」统计，不是按「篇」——一份卷有 4 篇阅读，仍然只是一套卷 */
function countsOf(type) {
  return { real: papersOf(type, 'real').length, mock: papersOf(type, 'mock').length };
}

/** 某个部分下的篇数（真题 / 模拟） */
/** 某个部分下的卷子数：同一套卷在多个题型里只算一次（写作部分有应用文+续写两题型） */
function countsOfPart(part) {
  const real = new Set(), mock = new Set();
  for (const t of typesOfPart(part)) {
    for (const p of papersOf(t, 'real')) real.add(p.id);
    for (const p of papersOf(t, 'mock')) mock.add(p.id);
  }
  return { real: real.size, mock: mock.size };
}

/** 一套卷里该题型的篇目（L4 卷子页用） */
function itemsOfPaper(paper, type) {
  return ((paper && paper.items) || []).filter(it => it.type === type);
}

/** 返回上一层：答题 → 卷子页 → 题型页 → 部分页 → 首页 */
function goUp() {
  if (S.item) { leaveItem(); renderPaper(); return; }
  if (S.paper) { S.paper = null; renderModule(); return; }
  if (S.module) { S.module = null; renderPart(); return; }
  if (S.part) { S.part = null; renderHome(); return; }
  renderHome();
}

/** 离开答题页时把作答状态收干净 */
function leaveItem() {
  S.item = null;
  S.answers = {};
  S.graded = false;
  S.resultMeta = null;
  S.timer = null;
  if (S.updateReady) showUpdateChip();   // 离开答题页再把「有新版本」提示放出来
}

/** 答题页里不显示浮动提示：它会压住选项和提交按钮 */
function hideUpdateChip() {
  const chip = document.querySelector('.update-chip');
  if (chip) chip.remove();
  document.body.classList.remove('has-chip');
}

/** 顶栏返回按钮统一用这个，避免每个页面各写一套 */
function backBar(title, subText, onBack) {
  const bar = el('div', 'topbar');
  const back = el('button', 'icon-btn', '‹');
  back.style.fontSize = '26px';
  back.setAttribute('aria-label', '返回');
  back.onclick = onBack;
  const sub = el('div', 'sub');
  sub.appendChild(el('b', null, title));
  if (subText) sub.appendChild(el('span', 'progress', subText));
  bar.append(back, sub);
  return bar;
}

/* ================= 第一级：首页 · 选部分 ================= */
async function renderHome() {
  const app = $('#app');
  app.innerHTML = '';
  S.part = null;
  S.module = null;
  if (!S.bank) {
    app.appendChild(el('div', 'page', '正在加载题库…'));
    return;
  }
  const page = el('div', 'page');
  const hero = el('div', 'hero');
  hero.appendChild(el('h2', null, '高考英语'));
  hero.appendChild(el('p', null,
    `${S.bank.totalPapers} 套卷 · ${S.bank.totalItems} 篇 · ${S.bank.totalBlanks} 空　新高考格式` +
    (loadRecords().length ? ` · 已做 ${new Set(loadRecords().map(r => r.itemId).filter(Boolean)).size} 篇` : '')));
  page.appendChild(hero);

  const sec = el('section', 'section');
  sec.appendChild(sectionHead('选部分', '点进去再选题型'));
  const list = el('div', 'list');
  for (const p of PARTS) {
    const c = countsOfPart(p.part);
    const card = el('button', `card module-card${p.ready ? '' : ' part-soon'}`);
    const main = el('div', 'paper-main');
    main.appendChild(el('b', null, `${p.code}　${p.title}`));
    main.appendChild(el('span', 'module-note', p.note));
    if (p.ready) {
      const live = liveTypes(p.part);
      main.appendChild(el('span', 'module-count',
        live.length
          ? `高考真题 ${c.real} 套 · 各省市模拟 ${c.mock} 套`
          : '题库正在补，先看看别的部分'));
    } else {
      main.appendChild(el('span', 'module-count', '暂未开放'));
    }
    if (p.ready) {
      card.appendChild(main);
      const meta = el('div', 'paper-meta');
      for (const t of typesOfPart(p.part)) meta.appendChild(el('span', 'chip', typeInfo(t).short));
      card.appendChild(meta);
      card.appendChild(el('span', 'module-arrow', '›'));
      card.onclick = () => openPart(p.part);
    } else {
      card.appendChild(main);
      card.disabled = true;
    }
    list.appendChild(card);
  }
  sec.appendChild(list);
  page.appendChild(sec);

  const hexSec = el('section', 'section');
  hexSec.appendChild(hexEntry());
  page.appendChild(hexSec);

  page.appendChild(installTip());
  app.appendChild(page);
  window.scrollTo({ top: 0 });
}

/* ================= 第二级：部分页 · 选题型 ================= */
function openPart(part) {
  S.part = part;
  S.module = null;
  S.paper = null;
  renderPart();
}

function renderPart() {
  const app = $('#app');
  app.innerHTML = '';
  const p = partDef(S.part) || PARTS[1];
  const c = countsOfPart(p.part);
  app.appendChild(backBar(`${p.code} ${p.title}`,
    `真题 ${c.real} 套 · 模拟 ${c.mock} 套`, renderHome));

  const page = el('div', 'page');
  const sec = el('section', 'section');
  sec.appendChild(sectionHead('选题型', p.note));
  const list = el('div', 'list');
  const live = liveTypes(p.part);
  for (const t of typesOfPart(p.part)) {
    const info = typeInfo(t);
    const n = countsOf(t);
    const has = live.includes(t);
    const card = el('button', `card module-card${has ? '' : ' part-soon'}`);
    const main = el('div', 'paper-main');
    main.appendChild(el('b', null, info.label));
    main.appendChild(el('span', 'module-note', info.note));
    main.appendChild(el('span', 'module-count', has
      ? `高考真题 ${n.real} 套 · 各省市模拟 ${n.mock} 套`
      : '题库正在补，先做别的题型'));
    card.appendChild(main);
    if (has) {
      const meta = el('div', 'paper-meta');
      meta.appendChild(el('span', 'chip', info.chip));
      card.appendChild(meta);
      card.appendChild(el('span', 'module-arrow', '›'));
      card.onclick = () => openModule(t);
    } else {
      card.disabled = true;
    }
    list.appendChild(card);
  }
  sec.appendChild(list);
  page.appendChild(sec);

  /* 本部分自己的记录与热力图：点进去才看得到 */
  const recSec = el('section', 'section');
  recSec.appendChild(partRecordEntry(p.part));
  recSec.appendChild(partMistakeEntry(p.part));
  page.appendChild(recSec);

  app.appendChild(page);
  window.scrollTo({ top: 0 });
}

/* ================= 错题集 =================
 * 数据来源就是做题记录里的 answers，对错判定复用判分用的 judge()，
 * 所以不会出现「判分说错、错题集说对」这种不一致；列表也不需要下载任何卷子原文。
 * 四个部分各自独立：只统计属于这个部分的题型。
 * 同一道题错多次只留一条，标「错 N 次」；后来做对的标「已订正」，记录仍然留着不删。
 */
function mistakesOfPart(part) {
  const types = new Set(typesOfPart(part));
  const byKey = new Map();
  for (const rec of loadRecords()) {
    if (!rec.itemId || !types.has(rec.type)) continue;
    const found = resolveRecord(rec);
    if (!found) continue;
    const item = found[1];
    for (const q of (item.questions || [])) {
      const mine = (rec.answers || {})[q.n];
      if (mine === undefined || mine === null || String(mine).trim() === '') continue;
      const right = judge(q, mine);
      const key = `${item.id}#${q.n}`;
      let e = byKey.get(key);
      if (!e) {
        e = { key, item, paper: found[0], q, type: item.type, mine, right,
              at: rec.at || 0, recId: rec.id, wrongs: 0, tries: 0, lastRight: right };
        byKey.set(key, e);
      }
      e.tries++;
      if (!right) {
        e.wrongs++;
        if ((rec.at || 0) >= (e.wrongAt || 0)) { e.wrongAt = rec.at || 0; e.wrongAns = mine; }
      }
      if ((rec.at || 0) >= e.at) {
        e.at = rec.at || 0; e.mine = mine; e.recId = rec.id; e.lastRight = right;
      }
    }
  }
  const list = [...byKey.values()].filter((e) => e.wrongs > 0);
  list.sort((a, b) => b.at - a.at);
  return list;
}

/** 题干编号显示：第 43 题 */
function qTitle(e) {
  const nums = (e.item.questions || []).map((x) => String(x.no == null ? '' : x.no)).filter((s) => /^\d+$/.test(s));
  const i = nums.indexOf(String(e.q.no));
  if (i >= 0) return `第 ${nums[i]} 题`;
  return e.q.no ? `第 ${e.q.no} 题` : '';
}

/** 正确答案的可读写法 */
function rightText(q) {
  if (q.answerText) return String(q.answerText);
  if (q.answer !== undefined && q.answer !== null) return String(q.answer);
  const c = correctList(q);
  return c.length ? String(c[0]) : '';
}

/** 单题解析块：解析页与错题集共用同一份渲染，排版完全一致 */
function questionBlock(item, q, given) {
  const ok = judge(q, given);
  const mine = String(given == null ? '' : given).trim();
  const isLetter = !!q.options || !!item.choices;
  const mineText = mine
    ? (isLetter
      ? `${mine.toUpperCase()}. ${q.options ? (q.options['ABCD'.indexOf(mine.toUpperCase())] || '') : choiceTextOf(item, mine)}`
      : mine)
    : '未作答';
  const unitWord = item.type === 'reading' ? '题' : '空';
  const numLabel = item.type === 'reading' ? (q.no || q.n) : q.n;

  const box = el('div', `rv-item ${mine ? (ok ? 'rv-ok' : 'rv-bad') : 'rv-skip'}`);

  const h = el('div', 'rv-head');
  h.appendChild(el('b', null, `第 ${numLabel} ${unitWord}`));
  h.appendChild(el('span', `rv-badge ${ok ? 'rv-badge-ok' : 'rv-badge-bad'}`,
    mine ? (ok ? '正确' : '错误') : '未作答'));
  box.appendChild(h);

  /* 阅读题要先看到题干，不然不知道在问什么 */
  if (q.stem) {
    const stem = el('div', 'rv-stem');
    stem.appendChild(el('span', null, q.stem));
    box.appendChild(stem);
  }

  const row = el('div', 'rv-row');
  row.appendChild(el('span', 'rv-k', '你的答案'));
  row.appendChild(el('span', `rv-v${!mine ? ' rv-v-skip' : (ok ? ' ok' : ' bad')}`, mineText));
  box.appendChild(row);

  const row2 = el('div', 'rv-row');
  row2.appendChild(el('span', 'rv-k', '正确答案'));
  /* 七选五：answerLabel(q) 已把选项文字带上（answerText 就是那句选项），
     只有老数据缺 answerText 时才用 choiceTextOf 兜一次，否则会重复打印两遍 */
  let ansText = answerLabel(q);
  if (item.choices && !q.options && !String(q.answerText || '').trim()) {
    const ct = choiceTextOf(item, q.answer);
    if (ct) ansText += `. ${ct}`;
  }
  row2.appendChild(el('span', 'rv-v ok', ansText));
  box.appendChild(row2);

  // 完形：四个选项都列出来，正确项高亮，选错的标红
  if (q.options) {
    const opts = el('div', 'rv-opts');
    q.options.forEach((text, i) => {
      const letter = 'ABCD'[i];
      const isRight = letter === String(q.answer).toUpperCase();
      const isMine = letter === mine.toUpperCase();
      const o = el('div', `rv-opt${isRight ? ' right' : (isMine ? ' wrong' : '')}`);
      o.appendChild(el('b', null, `${letter}.`));
      o.appendChild(el('span', null, text));
      opts.appendChild(o);
    });
    box.appendChild(opts);
  }

  const ex = el('div', 'rv-ex');
  ex.appendChild(el('b', null, '解析'));
  ex.appendChild(el('p', null, q.explanation || '（本题暂无解析）'));
  box.appendChild(ex);
  return box;
}

/** 这一题对应的完整题目（索引里只有骨架，懒加载完成后按 id 取回完整版） */
function fullQuestionOf(e) {
  const item = e.full || e.item;
  return (item.questions || []).find((x) => x.n === e.q.n) || e.q;
}

/** 原题：只保留这一题 —— 其它空位只是编号，被问的这一空直接填上正确答案 */
function mistakePassageCard(item, target) {
  const card = el('div', 'card passage-card');
  for (const line of String(item.passage || '').split('\n')) {
    if (!line.trim()) continue;
    const p = el('p');
    const parts = line.split(/\{\{(\d+)\}\}/);
    parts.forEach((chunk, i) => {
      if (i % 2 === 0) { if (chunk) p.appendChild(document.createTextNode(chunk)); return; }
      const qn = Number(chunk);
      if (qn === Number(target.n)) {
        const span = el('span', 'ans-inline');
        span.textContent = target.options
          ? `${target.answer}. ${target.answerText || ''}`.trim()
          : (correctList(target)[0] || target.answer);
        p.appendChild(span);
      } else {
        const b = el('span', 'blank');
        b.textContent = qn;
        p.appendChild(b);
      }
    });
    card.appendChild(p);
  }
  return card;
}

/** 点错题列表里的一条：载入这篇的原文（会自动懒加载），然后只展示这一题 */
async function openMistake(e) {
  S.mistake = e;
  S.mistakePart = partOf(e.type) || S.mistakePart;
  if ((e.paper.items || []).some((it) => it.stub)) {
    renderMistakeDetail();                                   // 先出占位
    try { await ensurePaperItems(e.paper); } catch (err) { toast('原文没加载成功，联网后再试'); return; }
  }
  e.full = (e.paper.items || []).find((it) => it.id === e.item.id) || null;
  renderMistakeDetail();
}

/** 错题详情：只有这一题的原题 + 这一题的解析 */
function renderMistakeDetail() {
  const app = $('#app');
  app.innerHTML = '';
  const e = S.mistake;
  if (!e) { renderMistakes(); return; }

  const bar = el('div', 'topbar');
  const back = el('button', 'icon-btn', '‹');
  back.style.fontSize = '26px';
  back.setAttribute('aria-label', '返回错题集');
  back.onclick = renderMistakes;
  const sub = el('div', 'sub');
  sub.appendChild(el('b', null, `${typeLabel(e.type)} · ${qTitle(e)}`));
  sub.appendChild(el('span', 'progress', `${e.paper.year} ${paperLabel(e.paper)}`));
  bar.append(back, sub);
  app.appendChild(bar);

  const page = el('div', 'page');
  if (!e.full) {
    page.appendChild(loadingBox('正在载入这一题的原文…'));
    app.appendChild(page);
    return;
  }

  const q = fullQuestionOf(e);
  const wrongAns = e.wrongAns != null ? e.wrongAns : e.mine;

  /* 原题 */
  const sec1 = el('section', 'section');
  sec1.appendChild(sectionHead('原题', '只有这一题，别的空不显示答案'));
  if (e.full.passage) sec1.appendChild(mistakePassageCard(e.full, q));
  else sec1.appendChild(el('p', 'section-note', '（这一题没有原文）'));
  page.appendChild(sec1);

  /* 这一题：做错的那一次 + 解析 */
  const sec2 = el('section', 'section');
  sec2.appendChild(sectionHead('这一题', '按你做错的那一次显示'));
  if (q.tag) {
    const meta = el('div', 'paper-meta');
    meta.appendChild(el('span', 'chip', q.tag));
    sec2.appendChild(meta);
  }
  sec2.appendChild(questionBlock(e.full, q, wrongAns));
  if (e.lastRight) {
    sec2.appendChild(el('p', 'section-note', '这道题后来做对过，记录仍然留在这里。'));
  }
  sec2.appendChild(el('p', 'source', sourceLabel(e.paper)));
  page.appendChild(sec2);

  app.appendChild(page);
  window.scrollTo({ top: 0 });
}

function renderMistakes() {
  const app = $('#app');
  app.innerHTML = '';
  const part = S.mistakePart || 2;
  const def = partDef(part) || {};
  const label = [def.code || `第${part}部分`, def.title || ''].filter(Boolean).join('　');
  const all = mistakesOfPart(part);
  const open = all.filter((e) => !e.lastRight);
  const papers = new Set(all.map((e) => e.paper.id)).size;

  app.appendChild(backBar(`${label} 错题集`, '只有点进来才看得到', renderPart));

  const page = el('div', 'page');

  /* 整体统计 */
  const stat = el('section', 'section');
  stat.appendChild(sectionHead('错题统计', all.length ? `共 ${all.length} 道` : '还没有错题'));
  const box = el('div', 'card');
  const bmain = el('div', 'paper-main');
  if (!all.length) {
    bmain.appendChild(el('b', null, '这里还是空的'));
    bmain.appendChild(el('span', null, '做完这个部分的题，做错的会自动收进来。'));
  } else {
    bmain.appendChild(el('b', null, `共 ${all.length} 道错题 · 涉及 ${papers} 套卷`));
    bmain.appendChild(el('span', null, open.length === all.length
      ? '按最近做错的时间排，最上面的最近'
      : `其中 ${all.length - open.length} 道后来做对了（标了「已订正」）`));
    const meta = el('div', 'paper-meta');
    const byType = new Map();
    for (const e of all) byType.set(e.type, (byType.get(e.type) || 0) + 1);
    for (const [t, n] of byType) meta.appendChild(el('span', 'chip', `${typeLabel(t)} ${n}`));
    if (open.length) meta.appendChild(el('span', 'chip', `待订正 ${open.length}`));
    box.appendChild(bmain);
    box.appendChild(meta);
  }
  if (!all.length) box.appendChild(bmain);
  stat.appendChild(box);
  page.appendChild(stat);

  /* 错题列表 */
  if (all.length) {
    const sec = el('section', 'section');
    sec.appendChild(sectionHead('错题列表', '点一条看它的解析'));
    const list = el('div', 'list');
    for (const e of all) {
      const card = el('button', 'card paper-card');
      const main = el('div', 'paper-main');
      main.appendChild(el('b', null, `${typeLabel(e.type)} · ${qTitle(e)}`));
      main.appendChild(el('span', null, e.lastRight
        ? `${e.paper.year} ${paperLabel(e.paper)} · 正确 ${rightText(e.q)} · 上次已经答对`
        : `${e.paper.year} ${paperLabel(e.paper)} · 你答 ${e.mine} · 正确 ${rightText(e.q)}`));
      const meta = el('div', 'paper-meta');
      if (e.q.tag) meta.appendChild(el('span', 'chip', e.q.tag));
      if (e.wrongs > 1) meta.appendChild(el('span', 'chip', `错 ${e.wrongs} 次`));
      if (e.lastRight) meta.appendChild(el('span', 'chip', '已订正'));
      card.appendChild(main);
      card.appendChild(meta);
      card.appendChild(el('span', 'module-arrow', '›'));
      card.onclick = () => openMistake(e);
      list.appendChild(card);
    }
    sec.appendChild(list);
    page.appendChild(sec);
  }

  app.appendChild(page);
  window.scrollTo({ top: 0 });
}

/** 装到桌面 + 离线提示（已是独立窗口模式就不再提示） */
function installTip() {
  const tip = el('p', 'install-tip');
  if (window.matchMedia('(display-mode: standalone)').matches || navigator.standalone === true) {
    return tip;
  }
  tip.appendChild(el('b', null, '想离线也能刷题？'));
  tip.appendChild(document.createTextNode(
    '点右上角「···」→「在浏览器打开」，再从浏览器菜单里选「添加到主屏幕」。之后从桌面图标进入，断网也能做题。'));
  return tip;
}

/* ================= 第三级：题型页 · 真题 / 模拟 ================= */
function openModule(type) {
  S.module = type;
  S.part = partOf(type) || S.part;
  renderModule();
}

/** 卷子页里每一篇的标题 */
function itemTitle(it, idx) {
  if (it.type === 'reading') {
    const letter = 'ABCDEFG'[idx || 0] || '';
    return it.label ? `阅读 ${it.label} 篇` : `阅读 ${letter} 篇`;
  }
  return typeInfo(it.type).label;
}

/**
 * 卷面题号统一显示成区间：老数据里 item.no 有的是起始单号（"41"），有的是区间（"41-55"），
 * 直接用会一会儿显示「题 41」一会儿显示「题 41-55」。这里按各题的 q.no 现算区间。
 */
function itemRange(it) {
  const nums = (it.questions || [])
    .map(q => String(q.no == null ? '' : q.no))
    .filter(s => /^\d+$/.test(s))
    .map(Number);
  if (nums.length && nums.length === (it.questions || []).length) {
    const lo = Math.min(...nums), hi = Math.max(...nums);
    return lo === hi ? String(lo) : `${lo}-${hi}`;
  }
  return String(it.no || '');
}

function renderModule() {
  const app = $('#app');
  app.innerHTML = '';
  S.paper = null;
  const info = typeInfo(S.module);
  const c = countsOf(S.module);
  const recs = loadRecords();
  const allPapers = papersOf(S.module, 'real').concat(papersOf(S.module, 'mock'));
  const donePapers = allPapers.filter(p =>
    itemsOfPaper(p, S.module).some(it => recs.some(r => r.itemId === it.id))).length;
  app.appendChild(backBar(info.label,
    `真题 ${c.real} 套 · 模拟 ${c.mock} 套 · 已做 ${donePapers} 套`, renderPart));

  const page = el('div', 'page');
  const groups = [
    { kind: 'real', title: '高考真题', note: '全国卷 · 新课标卷 · 浙江首考' },
    { kind: 'mock', title: '各省市模拟题', note: '一模 · 零模 · 地区统考' },
  ];
  for (const g of groups) {
    const rows = papersOf(S.module, g.kind);
    if (!rows.length) continue;

    const sec = el('section', 'section');
    sec.appendChild(sectionHead(g.title, `${rows.length} 套 · ${g.note}`));

    const list = el('div', 'list');
    for (const paper of rows) {
      const parts = itemsOfPaper(paper, S.module);
      const blanks = parts.reduce((n, it) => n + qCount(it), 0);
      const score = parts.reduce((n, it) => n + (it.score || 0), 0);
      const card = el('button', 'card paper-card');
      const main = el('div', 'paper-main');
      main.appendChild(el('b', null, `${paper.year} ${paperLabel(paper)}`));
      /* 一套卷在这个题型下可能有 4 篇（阅读 A/B/C/D），这里写「共几篇 · 几题 · 几分」 */
      main.appendChild(el('span', null, parts.length > 1
        ? `共 ${parts.length} 篇 · ${blanks} ${info.unit} · ${score} 分`
        : `${blanks || 1} ${info.unit} · ${score} 分`));
      const meta = el('div', 'paper-meta');
      meta.appendChild(el('span', 'chip', info.chip));
      const prov = String(paper.province || '').trim();
      if (prov && prov !== '全国' && paperLabel(paper).indexOf(prov) !== 0) {
        meta.appendChild(el('span', 'chip chip-prov', prov));
      }
      card.appendChild(main);
      card.appendChild(meta);
      card.appendChild(el('span', 'module-arrow', '›'));
      card.onclick = () => openPaper(paper, S.module);
      list.appendChild(card);
    }
    sec.appendChild(list);
    page.appendChild(sec);
  }
  app.appendChild(page);
  window.scrollTo({ top: 0 });
}

/* ================= 第四级：卷子页 · 这套卷里的篇目 ================= */
function openPaper(paper, type) {
  S.paper = paper;
  if (type) S.module = type;
  renderPaper();
}

/** 懒加载占位：原文还在下载时先显示这个 */
function loadingBox(text) {
  const box = el('div', 'empty');
  box.appendChild(el('p', null, text));
  return box;
}

/** 万一某套卷的原文包没传上去，就退回老的整体题库（bank.js）兜底，保证还能做题 */
function itemsFromFullBank(paper) {
  const full = window.__BANK__;
  if (!full) return null;
  const p = (full.papers || []).find(x => x.id === paper.id);
  return p && p.items && p.items.length ? p.items : null;
}
let FULL_BANK_PROMISE = null;
function loadFullBank() {
  if (window.__BANK__) return Promise.resolve(window.__BANK__);
  if (FULL_BANK_PROMISE) return FULL_BANK_PROMISE;
  FULL_BANK_PROMISE = new Promise((resolve, reject) => {
    const s = document.createElement('script');
    s.src = 'bank.js';
    s.onload = () => (window.__BANK__ ? resolve(window.__BANK__) : reject(new Error('empty')));
    s.onerror = () => reject(new Error('network'));
    document.head.appendChild(s);
  });
  return FULL_BANK_PROMISE;
}

/** 题库索引里只有「篇目骨架」，原文/选项/答案/解析按卷懒加载；
 *  载入后用完整篇目原地替换，之后所有原有逻辑（题干、判分、解析）都不变。 */
const PAPER_LOADS = new Map();
function ensurePaperItems(paper) {
  if (!paper || !(paper.items || []).some(it => it.stub)) return Promise.resolve(paper);
  if (PAPER_LOADS.has(paper.id)) return PAPER_LOADS.get(paper.id);
  const v = (S.bank && S.bank.version) || '';
  const p = new Promise((resolve, reject) => {
    const s = document.createElement('script');
    s.src = `papers/${encodeURIComponent(paper.id)}.js?v=${v}`;
    const take = (items) => {
      if (!items || !items.length) return false;
      paper.items = items;
      return true;
    };
    s.onload = () => {
      if (take((window.__PAPERS__ || {})[paper.id])) { resolve(paper); return; }
      if (take(itemsFromFullBank(paper))) { resolve(paper); return; }
      reject(new Error('empty'));
    };
    s.onerror = () => {
      loadFullBank().then(() => {
        if (take(itemsFromFullBank(paper))) resolve(paper);
        else reject(new Error('network'));
      }).catch(() => reject(new Error('network')));
    };
    document.head.appendChild(s);
  }).catch((e) => { PAPER_LOADS.delete(paper.id); throw e; });
  PAPER_LOADS.set(paper.id, p);
  return p;
}

function renderPaper() {
  const app = $('#app');
  app.innerHTML = '';
  const paper = S.paper;
  const info = typeInfo(S.module);
  app.appendChild(backBar(`${paper.year} ${paperLabel(paper)}`, info.label, renderModule));

  /* 原文还没下过？先显示占位，下完再重画这一页 */
  if ((paper.items || []).some(it => it.stub)) {
    const ph = el('div', 'page');
    ph.appendChild(loadingBox('正在载入这套卷的原文…'));
    app.appendChild(ph);
    ensurePaperItems(paper).then(renderPaper).catch(() => {
      ph.innerHTML = '';
      ph.appendChild(emptyBox('这套卷的原文没加载成功。检查一下网络，再进来一次就好。'));
    });
    return;
  }

  const page = el('div', 'page');
  const rows = itemsOfPaper(paper, S.module);
  const sec = el('section', 'section');
  sec.appendChild(sectionHead(info.label, `这套卷共 ${rows.length} 篇`));
  const list = el('div', 'list');
  const records = loadRecords();
  rows.forEach((it, idx) => {
    const card = el('button', 'card paper-card');
    const main = el('div', 'paper-main');
    main.appendChild(el('b', null, itemTitle(it, idx)));
    main.appendChild(el('span', null,
      `${qCount(it) || 1} ${info.unit} · ${it.score} 分` + (qCount(it) && itemRange(it) ? ` · 题 ${itemRange(it)}` : '')));
    const meta = el('div', 'paper-meta');
    meta.appendChild(el('span', 'chip', info.chip));
    const rec = records.find(r => r.itemId === it.id);
    if (rec) meta.appendChild(el('span', 'chip chip-done', `做过 ${rec.score}/${rec.full}`));
    card.appendChild(main);
    card.appendChild(meta);
    card.appendChild(el('span', 'module-arrow', '›'));
    card.onclick = () => openItem(paper, it);
    list.appendChild(card);
  });
  if (!rows.length) sec.appendChild(emptyBox('这套卷在这个题型下还没有收录篇目。'));
  sec.appendChild(list);
  page.appendChild(sec);
  app.appendChild(page);
  window.scrollTo({ top: 0 });
}

/* ================= 第四部分 写作：作答 + 自查评分 =================
 * 写作没有唯一客观答案，所以这里给的不是「高考分数」，而是两层：
 *   ① 机器自查：字数、句式、亮点表达、衔接、时态、与前文呼应、拼写规范
 *      —— 都是可复现、可解释的统计量，学生能看懂每一分怎么来的
 *   ② 对照评分细则勾选自评：内容要点、情节衔接这些机器判断不了的，交给学生自己勾
 * 两层合成 0–100 自查分，再换算成 S/A/B/C/D 与「第几档」。
 * 评分细则来自 data/_writing_rubric.json（构建时内嵌进题库的 rubric 字段）。
 */

const WRITING_TARGET = { applied: 80, continuation: 150 };
const WRITING_TIME = { applied: 15 * 60, continuation: 25 * 60 };

/** 细则文件缺失时的兜底自评清单（与 rubric 的 selfCheck 同构） */
const WRITING_CHECK_FALLBACK = [
  { id: 'c1', dimension: 'content', label: '内容要点齐全，题目要求写的点都写到了', machine: false },
  { id: 'c2', dimension: 'content', label: '续写：情节与前文及两段开头语衔接自然，不矛盾', machine: false, only: 'continuation' },
  { id: 'c3', dimension: 'content', label: '续写：有细节支撑（动作/心理/环境/对话）', machine: false, only: 'continuation' },
  { id: 'l1', dimension: 'language', label: '句式有变化，不是清一色的简单句', machine: true },
  { id: 'l2', dimension: 'language', label: '尝试使用了较复杂结构或较高级词汇', machine: true },
  { id: 'l3', dimension: 'language', label: '语法和用词基本准确，错误不影响理解', machine: false },
  { id: 's1', dimension: 'structure', label: '篇章结构完整清晰；续写两段长短相当', machine: false },
  { id: 's2', dimension: 'coherence', label: '使用了语句间的连接成分', machine: true },
  { id: 's3', dimension: 'coherence', label: '全文连贯、逻辑顺畅', machine: false },
  { id: 'n1', dimension: 'mechanics', label: '拼写与标点符号正确', machine: true },
  { id: 'n2', dimension: 'mechanics', label: '词数达标', machine: true },
  { id: 'n3', dimension: 'mechanics', label: '书写工整、卷面整洁，涂改不严重', machine: false },
];
const WRITING_DIMS = [
  { key: 'content', label: '内容' },
  { key: 'language', label: '语言' },
  { key: 'structure', label: '结构' },
  { key: 'coherence', label: '连贯' },
  { key: 'mechanics', label: '规范' },
];

/** 亮点表达 / 衔接词：优先用题库内嵌的词库，没有就用这份精简版 */
const GLOW_FALLBACK = [
  'with a sigh', 'burst into tears', 'heart pounding', 'to my surprise', 'to his surprise',
  'to her surprise', 'as if', 'make one\'s way', 'made his way', 'made her way', 'a wave of',
  'tears welling up', 'in the nick of time', 'out of the blue', 'no sooner', 'not until',
  'without hesitation', 'held my breath', 'let out a sigh of relief', 'a sense of relief',
  'couldn\'t help but', 'was about to', 'from then on', 'in the end', 'at the sight of',
  'with a smile', 'with a frown', 'rushed over', 'gathered his courage', 'gathered her courage',
  'in a low voice', 'the moment', 'as soon as', 'only to find', 'it dawned on me',
];
const LINK_FALLBACK = [
  'however', 'therefore', 'besides', 'moreover', 'in addition', 'as a result', 'meanwhile',
  'suddenly', 'finally', 'afterwards', 'unfortunately', 'luckily', 'instead', 'otherwise',
  'in fact', 'what\'s more', 'on the contrary', 'for one thing', 'in short', 'above all',
];

const W_CLAUSE = /\b(which|that|who|whom|whose|when|where|why|because|although|though|while|unless|until|since|as if|even if|even though|so that|in order that|the moment|by the time)\b/gi;
const W_PAST = /\b(\w+ed|was|were|had|did|came|went|took|made|found|felt|knew|saw|heard|said|told|thought|brought|began|ran|stood|sat|held|kept|left|met|put|read|rose|sent|set|shook|shone|shut|sang|spoke|spent|swam|threw|understood|woke|wore|won|wrote)\b/gi;
const W_PRES = /\b(is|are|am|has|have|do|does|can|will|must|seems|feels|knows|goes|comes|takes|makes|finds)\b/gi;

function isWriting(it) { return !!it && (it.type === 'applied' || it.type === 'continuation'); }
function writingTarget(it) {
  const m = String(it.words || '').match(/\d+/);
  return (m ? Number(m[0]) : 0) || WRITING_TARGET[it.type] || 80;
}
function wCountWords(t) {
  const m = String(t || '').match(/[A-Za-z][A-Za-z'’\-]*/g);
  return m ? m.length : 0;
}
function wDraftKey(it) { return 'gk.draft.' + it.id; }
function wLoadDraft(it) { try { return localStorage.getItem(wDraftKey(it)) || ''; } catch (e) { return ''; } }
function wSaveDraft(it, text) { try { localStorage.setItem(wDraftKey(it), text || ''); } catch (e) { /* 存储满就放弃草稿，不影响做题 */ } }

/**
 * 词库取值：题库里带了 data/_writing_phrases.json 就用它，否则用内置精简版。
 * 返回 [{en, zh}]，zh 用来在自查明细里显示中文，学生一眼知道命中了什么。
 */
function writingPhraseList(which, fallback) {
  const p = S.bank && S.bank.phrases;
  const arr = p && Array.isArray(p[which]) ? p[which] : [];
  const out = [];
  for (const x of arr) {
    if (typeof x === 'string') { if (x) out.push({ en: x, zh: '' }); }
    else if (x && x.en) out.push({ en: String(x.en), zh: String(x.zh || '') });
  }
  if (out.length) return out;
  return fallback.map(x => ({ en: x, zh: '' }));
}
function writingGlow() { return writingPhraseList('glow', GLOW_FALLBACK); }
function writingLinks() { return writingPhraseList('links', LINK_FALLBACK); }
function writingGlowList() { return writingGlow().map(x => x.en); }
function writingLinkList() { return writingLinks().map(x => x.en); }
/** 命中项的中文释义（词库里没有就返回空） */
function writingGloss(en) {
  const hit = writingGlow().concat(writingLinks()).find(x => x.en === en);
  return hit && hit.zh ? hit.zh : '';
}
function writingGlossed(list, n) {
  return list.slice(0, n).map(e => {
    const z = writingGloss(e);
    return z ? `${e}（${z}）` : e;
  }).join('、');
}
/** 自评清单：题库内嵌 rubric.selfCheck 优先 */
function writingChecks(it) {
  const r = S.bank && S.bank.rubric;
  const src = r && Array.isArray(r.selfCheck) && r.selfCheck.length ? r.selfCheck : WRITING_CHECK_FALLBACK;
  return src.filter(c => {
    if (c.only) return c.only === it.type;
    /* 细则里的「续写」类条目在应用文上不出现 */
    if (it.type !== 'continuation' && /续写/.test(String(c.label || ''))) return false;
    return true;
  }).map((c, i) => ({
    id: String(c.id || ('k' + i)),
    dimension: c.dimension || 'content',
    label: String(c.label || ''),
    machine: !!c.machine,
  }));
}
/** 评价档位：来自细则的 bands（过滤 0 分档），没细则就按百分比估 */
function writingBand(it, percent) {
  const r = S.bank && S.bank.rubric;
  const sec = r && r.sections ? r.sections[it.type === 'continuation' ? 'continuation' : 'applied'] : null;
  const full = (sec && sec.full) || it.score || (it.type === 'continuation' ? 25 : 15);
  let band = null;
  if (sec && Array.isArray(sec.bands)) {
    for (const b of sec.bands) {
      if (String(b.range || '') === '0') continue;
      const m = String(b.range || '').match(/(\d+)\s*[-–~]\s*(\d+)/);
      if (!m) continue;
      const lo = Number(m[1]), hi = Number(m[2]);
      if (percent >= lo / full - 1e-9) { band = { name: b.band || '', lo, hi, full }; break; }
    }
  }
  if (!band) {
    band = percent >= 0.87 ? { name: '第五档', lo: null, hi: null, full }
      : percent >= 0.67 ? { name: '第四档', lo: null, hi: null, full }
        : percent >= 0.47 ? { name: '第三档', lo: null, hi: null, full }
          : percent >= 0.27 ? { name: '第二档', lo: null, hi: null, full } : { name: '第一档', lo: null, hi: null, full };
  }
  const est = band.lo == null ? null : Math.max(band.lo, Math.min(band.hi, Math.round(percent * band.full)));
  return { name: band.name, range: band.lo == null ? '' : `${band.lo}-${band.hi}`, est, full: band.full };
}

/**
 * 命中列表：逐条按词边界找。
 * 归一化三件事（不做就会大面积漏判）：
 *   ① 弯引号 ’ 与直引号 ' 等价；
 *   ② 标点当作词间分隔 —— 「In that moment, I realized」才算命中 in that moment I realized；
 *   ③ one's / sb's 这类占位要能匹配 my/your/his/her/our/their 或任意「名词+'s」，
 *      否则 to one's surprise 匹配不到作文里的 To Karie's surprise。
 */
function wHits(text, list) {
  const t = ' ' + String(text || '')
    .replace(/[’‘]/g, "'")
    .replace(/[^A-Za-z0-9']+/g, ' ')
    .replace(/\s+/g, ' ')
    .trim()
    .toLowerCase() + ' ';
  const out = [];
  for (const raw of list) {
    const p = String(raw).replace(/[’‘]/g, "'").toLowerCase().trim();
    if (!p) continue;
    const esc = p.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    const pat = esc
      .replace(/one's/g, "(?:my|your|his|her|our|their|[a-z]+'s)")
      .replace(/sb's/g, "(?:my|your|his|her|our|their|[a-z]+'s)")
      .replace(/\bsth\b/g, '[a-z]+');
    if (new RegExp('(^|[^a-z])' + pat + '([^a-z]|$)', 'i').test(t) && out.indexOf(raw) < 0) out.push(raw);
  }
  return out;
}
function wParagraphs(text) {
  return String(text || '').split(/\n+/).map(s => s.trim()).filter(s => wCountWords(s) >= 3);
}
/** 机械规范检查：只看不涉及语义的硬伤 */
function wMechIssues(text) {
  const t = String(text || '');
  const out = [];
  if (!t.trim()) return out;
  if (/\b(\w+)\s+\1\b/i.test(t)) out.push('有重复的词');
  if (/ {2,}/.test(t)) out.push('有多余空格');
  if (/[a-z]\.[A-Z]/.test(t)) out.push('句号后缺空格');
  const sents = t.split(/[.!?。！？]+\s*/).map(s => s.trim()).filter(s => wCountWords(s) >= 2);
  if (sents.some(s => /^[a-z]/.test(s))) out.push('有句子开头没大写');
  if (!/[.!?"'’”)]\s*$/.test(t.trim())) out.push('结尾缺标点');
  return out;
}

function analyzeWriting(it, text) {
  const t = String(text || '');
  const target = writingTarget(it);
  const clauses = (t.match(W_CLAUSE) || []).length;
  const nonfinite = (t.match(/\b\w+ing\b/gi) || []).length + (t.match(/\bto\s+[a-z]+/gi) || []).length;
  const glow = wHits(t, writingGlowList());
  const links = wHits(t, writingLinkList());
  const past = (t.match(W_PAST) || []).length;
  const pres = (t.match(W_PRES) || []).length;
  const pastRatio = (past + pres) ? past / (past + pres) : 0;
  /* 续写：前文反复出现的人名/关键事物有没有被带进作文里 */
  const names = [];
  if (it.passage) {
    const seen = {};
    for (const n of (String(it.passage).match(/\b[A-Z][a-z]{2,}\b/g) || [])) seen[n] = (seen[n] || 0) + 1;
    for (const n of Object.keys(seen)) if (seen[n] >= 2) names.push(n);
  }
  const namesIn = names.filter(n => new RegExp('\\b' + n + '\\b').test(t));
  return {
    words: wCountWords(t), target, paras: wParagraphs(t).length,
    clauses, nonfinite, glow, links, pastRatio,
    names: names.slice(0, 12), namesIn, mech: wMechIssues(t),
  };
}

/** 核心评分：机器 90 分 + 自评 10 分 */
function scoreWriting(it, text, checked) {
  const m = analyzeWriting(it, text);
  const ratio = m.words / m.target;
  const sub = {};
  /* 字数 22：不达标按比例，写得过长也扣（考场写太多反而是问题） */
  let wordsGot = ratio >= 1 ? 22 : 22 * Math.pow(Math.max(0, ratio), 0.9);
  if (ratio > 1.6) wordsGot = Math.max(8, wordsGot - 6);
  sub.words = { label: '字数', got: wordsGot, full: 22, note: `${m.words} / ${m.target} 词` };
  /* 句式 15 */
  const syntaxGot = 15 * Math.min(1, (m.clauses + m.nonfinite * 0.6) / 6);
  sub.syntax = { label: '句式变化', got: syntaxGot, full: 15, note: `从句 ${m.clauses} 处 · 非谓语/短语 ${m.nonfinite} 处` };
  /* 亮点表达 15 */
  const glowGot = 15 * Math.min(1, m.glow.length / 4);
  sub.glow = { label: '亮点表达', got: glowGot, full: 15, note: m.glow.length ? `命中 ${m.glow.length} 个：${writingGlossed(m.glow, 3)}` : '没抓到地道表达' };
  /* 分段 8 */
  const want = it.type === 'continuation' ? 2 : 1;
  sub.para = { label: '分段', got: 8 * (m.paras >= want ? 1 : m.paras / want), full: 8, note: `${m.paras} 段${it.type === 'continuation' ? '（续写建议分两段）' : ''}` };
  /* 衔接 8 */
  const linkGot = 8 * Math.min(1, m.links.length / 4);
  sub.link = { label: '衔接词', got: linkGot, full: 8, note: m.links.length ? `用到 ${m.links.length} 个：${m.links.slice(0, 4).join('、')}` : '几乎没有衔接词' };
  /* 时态 7 */
  let tenseGot = 7, tenseNote = '';
  if (it.type === 'continuation') {
    const p = Math.round(m.pastRatio * 100);
    if (m.words < 30) { tenseGot = 0; tenseNote = '内容太少，看不出时态'; }
    else if (m.pastRatio >= 0.75) { tenseGot = 7; tenseNote = `过去时占 ${p}%，叙述一致`; }
    else if (m.pastRatio >= 0.5) { tenseGot = 4; tenseNote = `过去时占 ${p}%，注意别在叙述里混现在时`; }
    else { tenseGot = 1.5; tenseNote = `过去时只占 ${p}%，续写通常用过去时`; }
  } else {
    tenseGot = m.words >= 30 ? 5 : 0;
    tenseNote = '应用文按情境定时态，注意全篇一致';
  }
  sub.tense = { label: '时态一致', got: tenseGot, full: 7, note: tenseNote };
  /* 与前文呼应 7（应用文换成要点覆盖提示） */
  let prevGot = 0, prevNote = '';
  if (it.type === 'continuation' && m.names.length) {
    prevGot = 7 * Math.min(1, m.namesIn.length / 2);
    prevNote = m.namesIn.length ? `用到了前文的人名/事物：${m.namesIn.slice(0, 4).join('、')}` : '没看到前文的人名或关键事物，注意衔接';
  } else {
    prevGot = m.words >= 30 ? 4 : 0;
    prevNote = '应用文要把题目要求的要点都写到';
  }
  sub.prev = { label: it.type === 'continuation' ? '与前文呼应' : '要点覆盖', got: prevGot, full: 7, note: prevNote };
  /* 规范 8 */
  const mechGot = Math.max(0, 8 - m.mech.length * 2);
  sub.mech = { label: '拼写规范', got: mechGot, full: 8, note: m.mech.length ? m.mech.join('、') : '没发现明显问题' };
  /* 自评 10 */
  const items = writingChecks(it);
  const hitN = items.filter(c => checked && checked[c.id]).length;
  sub.self = { label: '细则自评', got: items.length ? 10 * hitN / items.length : 0, full: 10, note: `${hitN} / ${items.length} 项已勾选` };

  let raw = 0;
  for (const k of Object.keys(sub)) raw += sub[k].got;
  const total = Math.max(0, Math.min(100, Math.round(raw)));
  const lv = levelOf(total, 100);
  const band = writingBand(it, total / 100);
  let tip;
  if (!m.words) tip = '还没写内容，先动笔。';
  else if (ratio < 0.7) tip = '先把字数写够——字数不到会直接掉档。';
  else if (m.glow.length < 2) tip = '句式和地道表达偏少，背几组动作、心理描写再写一遍。';
  else if (m.links.length < 2) tip = '句子之间缺衔接，加 however、as a result 这类词。';
  else if (total >= 85) tip = '语言和结构都不错，下一步打磨细节描写与结尾升华。';
  else tip = '整体成型了，重点补地道表达和与前文的呼应。';
  return { m, sub, total, lv, band, tip, checkedN: hitN, checkN: items.length };
}

/* ---------- 作答页 ---------- */

function openWriting(paper, item) {
  if (S.writingTimer) { clearInterval(S.writingTimer); S.writingTimer = null; }
  S.item = item; S.paper = paper;
  S.answers = {}; S.graded = false; S.resultMeta = null;
  S.writing = { text: wLoadDraft(item), checked: {}, result: null, warned: false };

  renderWriting();
}

function writingTopbar(title, right) {

function renderWriting() {

  /* 题目卡 */

  th.appendChild(el('span', 'wp-target', `约 ${writingTarget(item)} 词`));
  task.appendChild(th);
  if (item.type === 'continuation') {

    for (const line of String(item.passage || '').split('\n')) {
      if (line.trim()) ps.appendChild(el('p', null, line.trim()));
    }
    task.appendChild(ps);
    (item.starters || []).forEach((st, i) => {

    });

  }

  page.appendChild(task);

  /* 写作区 */
  const edit = el('div', 'card');
  const row = el('div', 'wp-row');
  row.appendChild(el('b', null, '我的作文'));

  row.appendChild(timer);
  edit.appendChild(row);
  const ta = el('textarea', 'wp-input');
  ta.value = W.text || '';
  ta.setAttribute('placeholder', '在这里写你的作文。写在纸上也可以——直接点下面的自查，仅按细则自评。');
  edit.appendChild(ta);
  const foot = el('div', 'wp-row');
  const count = el('span', 'wp-count');
  foot.appendChild(count);
  const clear = el('button', 'btn btn-ghost', '清空');
  clear.onclick = () => {
    ta.value = ''; W.text = ''; wSaveDraft(item, ''); paint();
  };
  foot.appendChild(clear);
  edit.appendChild(foot);
  edit.appendChild(el('p', 'wp-note', '草稿会自动存在这台设备上，退出再进来还在。'));
  page.appendChild(edit);

  const actions = el('div', 'actions');
  const go = el('button', 'btn btn-primary', '写完了，开始自查');
  go.onclick = () => {
    W.text = ta.value;
    wSaveDraft(item, W.text);
    submitWriting();
  };
  actions.appendChild(go);
  page.appendChild(actions);
  app.appendChild(page);
  window.scrollTo({ top: 0 });

  function paint() {
    const w = wCountWords(W.text), t = writingTarget(item);
    count.textContent = `${w} / ${t} 词`;
    count.className = 'wp-count' + (w >= t ? ' ok' : '');
  }
  ta.addEventListener('input', () => { W.text = ta.value; wSaveDraft(item, W.text); paint(); });
  paint();

  /* 计时：显示剩余时间，到点提醒一次（不强制停止） */
  const target = WRITING_TIME[item.type] || 15 * 60;
  const tick = () => {
    if (!document.body.contains(timer)) { clearInterval(S.writingTimer); return; }
    const left = target - elapsedSecs();
    if (left <= 0 && !W.warned) { W.warned = true; toast('时间到！考场里这里要收尾了，可以继续写完'); }
    timer.textContent = left > 0 ? `剩余 ${fmtDur(left)}` : `已超时 ${fmtDur(-left)}`;
    timer.className = 'wp-timer' + (left <= 60 ? ' warn' : '');
  };
  tick();
  S.writingTimer = setInterval(tick, 1000);
}

function submitWriting() {
  const item = S.item, W = S.writing;
  const secs = elapsedSecs();
  const pauses = S.timer ? S.timer.pauses : 0;
  const res = scoreWriting(item, W.text, W.checked);
  W.result = res;
  /* 维度达标情况 → 这部分的热力图 */
  const dims = {};
  for (const d of WRITING_DIMS) {
    const items = writingChecks(item).filter(c => c.dimension === d.key);
    if (!items.length) continue;
    const hit = items.filter(c => W.checked[c.id]).length;
    let autoOk = true;
    if (d.key === 'language') autoOk = res.sub.syntax.got >= 9 && res.sub.glow.got >= 9;
    else if (d.key === 'structure' || d.key === 'coherence') autoOk = res.sub.para.got >= 6 && res.sub.link.got >= 5;
    else if (d.key === 'mechanics') autoOk = res.sub.mech.got >= 6 && res.sub.words.got >= 15;
    dims[d.key] = (hit >= Math.ceil(items.length / 2) && autoOk) ? 'ok' : 'bad';
  }
  addRecord({
    id: `${Date.now()}-${Math.random().toString(36).slice(2, 7)}`,
    at: Date.now(),
    year: S.paper.year, paperName: S.paper.paperName, kind: S.paper.kind || 'mock',
    itemId: item.id, type: item.type,
    score: res.total, full: 100, correct: res.total, total: 100,
    secs, pauses, level: res.lv.lv,
    dims, band: res.band.name, words: res.m.words, target: res.m.target,
    selfN: res.checkedN, selfTotal: res.checkN,
  });
  S.timer = null;
  S.resultMeta = { secs, pauses, level: res.lv.lv, at: Date.now(), from: 'now' };
  S.graded = true;
  renderWritingReview();
}

/* ---------- 自查 / 评价页 ---------- */

function renderWritingReview() {
  if (S.writingTimer) { clearInterval(S.writingTimer); S.writingTimer = null; }

    const s = R.sub[k];

    r.appendChild(el('b', null, s.label));
    const noteEl = el('span', null, s.note);
    r.appendChild(noteEl);
    const markEl = el('i');
    r.appendChild(markEl);

  }

  /* 自评细则 */

  for (const d of WRITING_DIMS) {
    const items = writingChecks(item).filter(c => c.dimension === d.key);
    if (!items.length) continue;
    self.appendChild(el('div', 'wr-dimtitle', d.label));
    for (const c of items) {
      const lab = el('label', 'wr-item');
      const cb = document.createElement('input');
      cb.type = 'checkbox';
      cb.checked = !!W.checked[c.id];
      lab.appendChild(cb);
      lab.appendChild(el('span', null, c.label + (c.machine ? '（机器）' : '')));
      cb.addEventListener('change', () => {
        W.checked[c.id] = cb.checked;
        recompute();
      });
      self.appendChild(lab);
    }
  }
  page.appendChild(self);

  /* 我的作文 */
  const mine = el('details', 'wr-box');
  mine.appendChild(el('summary', null, `我的作文（${wCountWords(W.text)} 词）`));
  mine.appendChild(el('div', 'wr-sample', W.text || '（空）'));
  page.appendChild(mine);

  /* 参考范文 */
  for (const s of (item.samples || [])) {
    const box = el('details', 'wr-box');
    box.appendChild(el('summary', null, `${s.level || '参考'}范文${s.source ? ' · 来自源卷' : ''}`));
    box.appendChild(el('div', 'wr-sample', String(s.text || '')));
    (s.notes || []).forEach(n => box.appendChild(el('p', 'wp-note', '· ' + n)));
    page.appendChild(box);
  }
  if (item.expressionNote) page.appendChild(el('p', 'wp-note', item.expressionNote));

  const actions = el('div', 'actions');
  const again = el('button', 'btn', '重写这篇');
  again.onclick = () => {
    S.writing.result = null;
    renderWriting();
  };
  const next = el('button', 'btn btn-primary', '下一篇');
  next.onclick = () => {
    const list = itemsOf(item.type, S.paper.kind || 'mock');
    if (!list.length) { goUp(); return; }
    const idx = list.findIndex(([, it]) => it === S.item);
    const [np, ni] = list[(idx + 1) % list.length];
    openItem(np, ni);
  };
  actions.append(again, next);
  page.appendChild(actions);
  app.appendChild(page);
  window.scrollTo({ top: 0 });

  function paint() {
    scoreEl.textContent = String(R.total);
    badgeBox.innerHTML = '';
    badgeBox.appendChild(lvBadge(R.lv.lv));
    bandEl.textContent = R.band.range
      ? `档位估计：${R.band.name}（${R.band.range} 分，约 ${R.band.est} 分）`
      : `档位估计：${R.band.name}`;
    tipEl.textContent = R.tip;
    const secs = S.resultMeta ? S.resultMeta.secs : 0;
    const timeTxt = secs > 0
      ? `用时 ${fmtDur(secs)}`
      : `建议用时 ${Math.round((WRITING_TIME[item.type] || 0) / 60)} 分钟`;
    metaEl.textContent = `${timeTxt} · ${R.m.words}/${R.m.target} 词 · 自评 ${R.checkedN}/${R.checkN} 项`;
    for (const k of Object.keys(rows)) {
      const s = R.sub[k];
      if (!s) continue;
      rows[k].noteEl.textContent = s.note;
      const i = rows[k].markEl;
      i.textContent = `${Math.round(s.got)}/${s.full}`;
      i.className = s.got >= s.full * 0.99 ? 'ok' : (s.got < s.full * 0.6 ? 'bad' : '');
    }
  }
  function recompute() {
    R = scoreWriting(item, W.text, W.checked);
    W.result = R;
    const rec = loadRecords()[0];
    /* 记录跟着自评更新：分数与维度达标情况一起改，避免记录里留旧的 */
    if (rec && rec.itemId === item.id) {
      rec.score = R.total; rec.correct = R.total; rec.level = R.lv.lv;
      rec.band = R.band.name; rec.selfN = R.checkedN;
      const dims = {};
      for (const d of WRITING_DIMS) {
        const items = writingChecks(item).filter(c => c.dimension === d.key);
        if (!items.length) continue;
        const hit = items.filter(c => W.checked[c.id]).length;
        let autoOk = true;
        if (d.key === 'language') autoOk = R.sub.syntax.got >= 9 && R.sub.glow.got >= 9;
        else if (d.key === 'structure' || d.key === 'coherence') autoOk = R.sub.para.got >= 6 && R.sub.link.got >= 5;
        else if (d.key === 'mechanics') autoOk = R.sub.mech.got >= 6 && R.sub.words.got >= 15;
        dims[d.key] = (hit >= Math.ceil(items.length / 2) && autoOk) ? 'ok' : 'bad';
      }
      rec.dims = dims;
      saveRecords(loadRecords());
    }
    paint();
  }
  paint();
}
/* ================= 进入一篇 ================= */
function openItem(paper, item) {
  if (isWriting(item)) { openWriting(paper, item); return; }
  if (S.writingTimer) { clearInterval(S.writingTimer); S.writingTimer = null; }
